experiment_id: phase5_multi_asset_ppo
fingerprint_manifest: finrl_pro/configs/fingerprints.yaml
risk_profile_file: finrl_pro/configs/risk_profiles.yaml
risk_profile_id: phase5_test
sandbox_enabled: true

training:
  real_training: true
  config_path: finrl_pro/configs/config.yaml
  dataset_hash: file://data/synthetic_multi_asset.csv
  seed: 42
  use_pro_env: true  # Must use Pro env for dynamic handling
  action_smoothing: 0.1
  
  module_versions:
    finrl_pro.training.trainer: "FinRL-Pro-Research-1"
    agent: PPO
    action.space: ALLOCATION_VECTOR_LONG_ONLY
    action.sum_to_one: true
    reward.position_norm_penalty: 0.01
    risk.sector_caps_soft: true

  metrics:
    sharpe_ratio: 1.0
    max_drawdown: 0.80
    volatility: 0.20
    capital_at_risk: 0.08
    leverage: 1.0
  
  artifact_uris: []
  baseline_reference: benchmarks:sp500_rolling_1y

features:
  enable_custom: false
  families:
    trend: true
    momentum: true
    vol: true
    volume: true
  
  advanced:
    fracdiff:
      enable: true
      d: 0.5
      cols: [close]
      window: 256

  cache:
    enabled: true
    dir: finrl_pro/data/processed
