experiment_id: phase6_tournament_ppo
fingerprint_manifest: finrl_pro/configs/fingerprints.yaml
risk_profile_file: finrl_pro/configs/risk_profiles.yaml
risk_profile_id: yolo
sandbox_enabled: true

training:
  config_path: finrl_pro/configs/config.yaml
  dataset_hash: file://data/sp500_full_2010_2025.parquet
  seed: 42
  real_training: true
  start_date: "2010-01-01"
  end_date: "2020-12-31"
  total_timesteps: 50000  # ~20 passes over 10 years
  
  module_versions:
    agent: PPOAgent
    action.space: ALLOCATION_VECTOR_LONG_ONLY
  
  agent:
    name: PPOAgent
    params:
      learning_rate: 3.0e-4
      n_steps: 2048
      batch_size: 64
      gamma: 0.99
      gae_lambda: 0.95
      clip_range: 0.2
      ent_coef: 0.01

  environment:
    initial_capital: 1000000.0
    buy_cost_pct: 0.001
    sell_cost_pct: 0.001
    gamma: 0.99
    turbulence_thresh: 150.0
    min_stock_rate: 0.0
    max_stock: 1.0e2 # Max shares per trade? Or max allocation? ProStockEnv interprets this differently depending on mode. 
                     # For Multi-Asset Allocation, the action is weights.

  # Wrappers
  action_smoothing: 0.1 # Phase 4.6 Cure
  turnover_penalty: 0.0 # Rely on smoothing

  metrics:
    sharpe_ratio: 1.0
    max_drawdown: 0.20
  
  artifact_uris: []
  baseline_reference: benchmarks:sp500_buy_hold

features:
  enable_custom: false
  use_turbulence: true
  families:
    trend: true
    momentum: true
    vol: true
    volume: true
  advanced:
    fracdiff:
      enable: true
      d: 0.4
    wavelet:
      enable: false

  cache:
    enabled: true
    dir: finrl_pro/data/processed
