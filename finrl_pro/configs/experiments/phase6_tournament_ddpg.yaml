experiment_id: phase6_tournament_ddpg
fingerprint_manifest: finrl_pro/configs/fingerprints.yaml
risk_profile_file: finrl_pro/configs/risk_profiles.yaml
risk_profile_id: yolo
sandbox_enabled: true

training:
  config_path: finrl_pro/configs/config.yaml
  dataset_hash: file://data/sp500_full_2010_2025.parquet
  seed: 42
  real_training: true
  start_date: "2010-01-01"
  end_date: "2020-12-31"
  total_timesteps: 50000
  
  module_versions:
    agent: DDPGAgent
    action.space: ALLOCATION_VECTOR_LONG_ONLY
  
  agent:
    name: DDPGAgent
    params:
      learning_rate: 1.0e-4
      buffer_size: 100000
      batch_size: 64
      gamma: 0.99
      tau: 0.005

  environment:
    initial_capital: 1000000.0
    buy_cost_pct: 0.001
    sell_cost_pct: 0.001
    gamma: 0.99
    turbulence_thresh: 150.0

  action_smoothing: 0.1
  
  metrics:
    sharpe_ratio: 1.0
    max_drawdown: 0.20
  
  baseline_reference: benchmarks:sp500_buy_hold

features:
  enable_custom: false
  use_turbulence: true
  families:
    trend: true
    momentum: true
    vol: true
    volume: true
  advanced:
    fracdiff:
      enable: true
      d: 0.4
    wavelet:
      enable: false
