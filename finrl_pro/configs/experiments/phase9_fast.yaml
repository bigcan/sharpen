experiment_id: phase9_sonnet_fast_test
features:
  advanced:
    fracdiff:
      d: 0.4
      enable: true
    wavelet:
      enable: false
  cache:
    dir: finrl_pro/data/processed
    enabled: true
  enable_custom: false
  families:
    momentum: true
    trend: true
    vol: true
    volume: true
  use_turbulence: true
fingerprint_manifest: finrl_pro/configs/fingerprints.yaml
risk_profile_file: finrl_pro/configs/risk_profiles.yaml
risk_profile_id: conservative
sandbox_enabled: true

data:
  dataset_hash: file://data/sp500_phase9_2005_2025.parquet
  start_date: '2020-01-01'
  end_date: '2023-06-01'
  tickers:
    - AAPL
    - MSFT
    - NVDA

hpo:
  rolling_window:
    train_years: 1
    val_years: 1
    test_years: 1
    step_years: 1
  trials: 2         # Minimal trials
  objective: modified_calmar
  ensemble_size: 2

training:
  action_smoothing: 0.1
  agent:
    name: PPOAgent
    params:
      batch_size: 128
      clip_range: 0.2
      ent_coef: 0.01
      gae_lambda: 0.95
      gamma: 0.99
      learning_rate: 0.00025
      n_steps: 128     # Tiny buffer
      n_epochs: 3      # Few epochs
  baseline_reference: benchmarks:sp500_buy_hold
  config_path: finrl_pro/configs/config.yaml
  
  environment:
    buy_cost_pct: 0.001
    sell_cost_pct: 0.001
    initial_capital: 1000000.0
    max_stock: 100
    min_stock_rate: 0.0
    turbulence_thresh: 150.0
    reward_scaling: 1e-4
    
  turnover_penalty: 0.01
  
  metrics:
    calmar_ratio: 0.5
    sharpe_ratio: 1.0
    
  real_training: true
  seed: 42
  total_timesteps: 1000 # Very short training