experiment_id: phase8_comprehensive
features:
  advanced:
    fracdiff:
      d: 0.4
      enable: true
    wavelet:
      enable: false
  cache:
    dir: finrl_pro/data/processed
    enabled: true
  enable_custom: false
  families:
    momentum: true
    trend: true
    vol: true
    volume: true
  use_turbulence: true
fingerprint_manifest: finrl_pro/configs/fingerprints.yaml
risk_profile_file: finrl_pro/configs/risk_profiles.yaml
risk_profile_id: conservative
sandbox_enabled: true
training:
  action_smoothing: 0.1
  agent:
    name: PPOAgent
    params:
      batch_size: 512
      clip_range: 0.2
      ent_coef: 0.022
      gae_lambda: 0.95
      gamma: 0.985
      learning_rate: 5.0e-05
      n_steps: 2048
  artifact_uris: []
  baseline_reference: benchmarks:sp500_buy_hold
  config_path: finrl_pro/configs/config.yaml
  dataset_hash: file://data/sp500_full_2010_2025.parquet
  end_date: '2023-12-31'
  environment:
    buy_cost_pct: 0.001
    gamma: 0.99
    initial_capital: 1000000.0
    max_stock: 1.0e2
    min_stock_rate: 0.0
    sell_cost_pct: 0.001
    turbulence_thresh: 150.0
  metrics:
    max_drawdown: 0.2
    sharpe_ratio: 1.0
  module_versions:
    action.space: ALLOCATION_VECTOR_LONG_ONLY
    agent: PPOAgent
  real_training: true
  seed: 42
  start_date: '2010-01-01'
  test_start_date: '2024-01-01'
  test_end_date: '2025-12-31'
  total_timesteps: 200000
  turnover_penalty: 0.0
