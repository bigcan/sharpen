name: Bug report
description: Something in the code crashes or behaves incorrectly.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a number you believe is wrong, use **Challenge a result** instead.
        For credentials or anything security-related, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command, config and, if relevant, data source.
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output or traceback
      render: text
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, GPU if any, and the commit you are on (`git rev-parse --short HEAD`).
      render: text
    validations:
      required: true
