name: CI

on:
  pull_request:
  push:
    branches: [Sept2026, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # windows-latest defaults `run:` to PowerShell. Pin bash (present on the runner via
    # Git for Windows) so quoting matches the shell these commands were tested in.
    shell: bash

jobs:
  test:
    # windows-latest, NOT ubuntu. This suite is Windows-specific by construction and a
    # Linux run is red for reasons that are not regressions: tests/test_memory_tools_*.py
    # assert on `C:\FinRL\...` paths (the OSS publish filter already drops those three
    # files as non-portable), and Linux resolves newer numpy/pandas that change array
    # writeability and the default datetime unit. Measured on ubuntu-latest 2026-09-03:
    # 56 failed / 3146 passed -- 24 "assignment destination is read-only", 4 M8[ns] vs
    # M8[us] merge-key mismatches, 2 PosixPath-vs-WindowsPath, 1 strict XPASS.
    # None of those are defects this gate should be reporting. Linux portability is a real
    # gap (the live stack runs in Docker) but it is separate work, not a CI setting.
    runs-on: windows-latest
    # The default pytest selection takes ~6 min locally. 45 is generous headroom for a
    # cold runner, and a cap matters here: the `slow` tests shell out via subprocess and
    # would hang the job rather than fail it (see "Tests" below).
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'      # pyproject requires >=3.11
          cache: pip
          cache-dependency-path: pyproject.toml

      # Install CPU torch FIRST, from PyTorch's CPU index: the runner has no GPU, and the
      # default wheel drags in CUDA payload it cannot use. Doing it first leaves
      # torch>=2.8.0 already satisfied for the editable install below.
      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.8.0'

      # `crypto` is required, not optional: sharpen/analytics/ imports matplotlib at MODULE
      # level and matplotlib is declared under that extra. `ctrader` is required too --
      # tests/cfd/test_ctrader_broker.py imports ctrader_open_api directly (3 failures on
      # the first Linux run). `ib` is NOT needed: no test imports ib_insync, and
      # sharpen/futures/ imports it lazily inside functions.
      - name: Install project
        run: pip install -e ".[dev,crypto,ctrader]"

      # sharpen/ and tests/ are clean today (measured 2026-09-01), so this is a real gate:
      # it fails the moment the package or the suite regresses. scripts/oss/ is the tracked
      # publication tooling and is also clean.
      - name: Ruff (package, tests, publication tooling)
        run: ruff check sharpen tests scripts/oss

      # The rest of the repo carries a 269-error backlog, concentrated in scripts/ (213),
      # contest/ (34) and sync_1h_export/ (17). Reported so the number stays visible, but
      # NOT blocking -- a blocking check here would be red on day one and get ignored.
      # Tighten this into the gate above as directories are cleaned up.
      - name: Ruff (rest of repo, advisory)
        continue-on-error: true
        run: ruff check .

      # Bare `pytest` on purpose. `addopts` in pyproject already deselects `integration`
      # (hits live exchange testnets) and `slow` (shells out to a full synthetic genetic
      # search, twice; several exceed 400 s alone).
      #
      # Do NOT add `-m` here: `-m X` REPLACES the addopts expression rather than
      # intersecting with it, so `-m integration` would silently re-enable the slow tests
      # and hang this job. If you need to compose, write the whole expression.
      - name: Pytest
        run: pytest
