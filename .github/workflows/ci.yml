name: CI

on:
  pull_request:
  push:
    branches: [Sept2026, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The default pytest selection takes ~6 min locally. 45 is generous headroom for a
    # cold runner, and a cap matters here: the `slow` tests shell out via subprocess and
    # would hang the job rather than fail it (see "Tests" below).
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'      # pyproject requires >=3.11
          cache: pip
          cache-dependency-path: pyproject.toml

      # Install CPU torch FIRST, from PyTorch's CPU index. Plain `pip install torch` on
      # Linux pulls the CUDA build (multi-GB) which this job has no GPU to use. Installing
      # it first means the `.[dev,crypto]` step below sees torch>=2.8.0 already satisfied.
      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.8.0'

      # `crypto` is required, not optional, for a green suite: sharpen/analytics/
      # (pyfolio_analyzer.py, wandb_evaluator.py) imports matplotlib at MODULE level, and
      # matplotlib is declared under the crypto extra. Every other optional dependency
      # (ccxt, ib_insync, ctrader) is imported lazily inside functions, so `ib` and
      # `ctrader` are deliberately not installed here.
      - name: Install project
        run: pip install -e '.[dev,crypto]'

      # sharpen/ and tests/ are clean today (measured 2026-09-01), so this is a real gate:
      # it fails the moment the package or the suite regresses. scripts/oss/ is the tracked
      # publication tooling and is also clean.
      - name: Ruff (package, tests, publication tooling)
        run: ruff check sharpen tests scripts/oss

      # The rest of the repo carries a 269-error backlog, concentrated in scripts/ (213),
      # contest/ (34) and sync_1h_export/ (17). Reported so the number stays visible, but
      # NOT blocking -- a blocking check here would be red on day one and get ignored.
      # Tighten this into the gate above as directories are cleaned up.
      - name: Ruff (rest of repo, advisory)
        continue-on-error: true
        run: ruff check .

      # Bare `pytest` on purpose. `addopts` in pyproject already deselects `integration`
      # (hits live exchange testnets) and `slow` (shells out to a full synthetic genetic
      # search, twice; several exceed 400 s alone).
      #
      # Do NOT add `-m` here: `-m X` REPLACES the addopts expression rather than
      # intersecting with it, so `-m integration` would silently re-enable the slow tests
      # and hang this job. If you need to compose, write the whole expression.
      - name: Pytest
        run: pytest
