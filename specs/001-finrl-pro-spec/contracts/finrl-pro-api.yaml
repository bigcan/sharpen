openapi: 3.1.0
info:
  title: FinRL Pro Control Plane API
  version: 0.1.0
  description: >-
    REST contract supporting reproducible experiments, risk governance,
    evaluation workflows, and compliance reporting for FinRL Pro extensions.
servers:
  - url: https://finrl-pro.example.com/api
    description: Production control plane
  - url: https://finrl-pro.dev/api
    description: Development sandbox
paths:
  /experiments:
    post:
      summary: Register a new experiment fingerprint and launch training
      operationId: createExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentRequest'
      responses:
        '202':
          description: Experiment accepted for execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFingerprint'
        '409':
          description: Duplicate fingerprint
  /experiments/{fingerprint_id}:
    get:
      summary: Retrieve experiment fingerprint metadata
      operationId: getExperiment
      parameters:
        - $ref: '#/components/parameters/FingerprintId'
      responses:
        '200':
          description: Fingerprint found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFingerprint'
        '404':
          description: Fingerprint not found
  /experiments/{fingerprint_id}/reproduce:
    post:
      summary: Trigger reproducibility validation run
      operationId: reproduceExperiment
      parameters:
        - $ref: '#/components/parameters/FingerprintId'
      responses:
        '202':
          description: Validation job started
        '423':
          description: Fingerprint locked pending risk review
  /risk-profiles:
    post:
      summary: Create or update a risk control profile
      operationId: upsertRiskProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskControlProfile'
      responses:
        '201':
          description: Risk profile created
        '200':
          description: Risk profile updated
  /risk-profiles/{profile_id}:
    get:
      summary: Fetch risk control profile by ID
      operationId: getRiskProfile
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskControlProfile'
        '404':
          description: Profile not found
  /evaluations:
    post:
      summary: Launch evaluation campaign against benchmark catalog entry
      operationId: createEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
      responses:
        '202':
          description: Evaluation scheduled
  /reports:
    post:
      summary: Publish a compliance-ready performance report
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportSubmission'
      responses:
        '201':
          description: Report stored and queued for approval
  /reports/{report_id}:
    get:
      summary: Retrieve report metadata and approval status
      operationId: getReport
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Report found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '404':
          description: Report not found

components:
  parameters:
    FingerprintId:
      name: fingerprint_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profile_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ExperimentRequest:
      type: object
      required:
        - moduleVersions
        - configPath
        - seed
        - datasetHash
        - riskProfileId
        - baselineReference
      properties:
        moduleVersions:
          type: object
          additionalProperties:
            type: string
          description: Mapping of module names to git commit hashes
        configPath:
          type: string
          description: Relative path to YAML configuration
        seed:
          type: integer
        datasetHash:
          type: string
        riskProfileId:
          type: string
          format: uuid
        baselineReference:
          type: string
        notes:
          type: string
    ExperimentFingerprint:
      type: object
      required:
        - fingerprintId
        - mlflowRunId
        - artifactUris
        - metricsSnapshot
        - baselineReference
        - status
      properties:
        fingerprintId:
          type: string
          format: uuid
        mlflowRunId:
          type: string
        artifactUris:
          type: array
          items:
            type: string
            format: uri
        metricsSnapshot:
          type: object
          additionalProperties:
            type: number
        baselineReference:
          type: string
        status:
          type: string
          enum:
            - Scheduled
            - Running
            - Completed
            - Archived
        reproducibilityVariance:
          type: number
          description: Percentage variance versus baseline
    RiskControlProfile:
      type: object
      required:
        - profileId
        - name
        - maxCapitalAtRisk
        - maxDrawdownPct
        - leverageCap
        - sandboxRequired
        - approvedBy
      properties:
        profileId:
          type: string
          format: uuid
        name:
          type: string
        maxCapitalAtRisk:
          type: number
          format: float
        maxDrawdownPct:
          type: number
          format: float
        leverageCap:
          type: number
          format: float
        sandboxRequired:
          type: boolean
        fallbackAgent:
          type: string
        approvedBy:
          type: string
        effectiveDate:
          type: string
          format: date
    EvaluationRequest:
      type: object
      required:
        - fingerprintId
        - benchmarkId
        - walkForwardSplits
      properties:
        fingerprintId:
          type: string
          format: uuid
        benchmarkId:
          type: string
          format: uuid
        walkForwardSplits:
          type: integer
          minimum: 1
        significanceThreshold:
          type: number
          format: float
          default: 0.05
    ReportSubmission:
      type: object
      required:
        - fingerprintId
        - summaryLocation
        - metrics
        - statisticalTests
      properties:
        fingerprintId:
          type: string
          format: uuid
        summaryLocation:
          type: string
          format: uri
        metrics:
          type: object
          additionalProperties:
            type: number
        statisticalTests:
          type: array
          items:
            type: object
            required:
              - name
              - pValue
              - alpha
            properties:
              name:
                type: string
              pValue:
                type: number
              alpha:
                type: number
        attachments:
          type: array
          items:
            type: string
            format: uri
    ReportSummary:
      type: object
      required:
        - reportId
        - fingerprintId
        - approvalStatus
        - metrics
      properties:
        reportId:
          type: string
          format: uuid
        fingerprintId:
          type: string
          format: uuid
        approvalStatus:
          type: string
          enum:
            - Draft
            - Pending
            - Approved
            - Rejected
        metrics:
          type: object
          additionalProperties:
            type: number
        links:
          type: array
          items:
            type: string
            format: uri
        comments:
          type: array
          items:
            type: string
