# GMGP1-XAUUSD WF fold-07 Q1 2026 OOS Backtest — regime drift quantification
# Cloned from configs/gmgp1_xauusd_oanda_wf_fold_07_backtest.yaml (retrain-gate cfg).
# Window extended Jan-1 → Apr-12 for uniform Q1 2026 OOS comparison across the 5
# paper strategies. Note: fold-7 train ended 2026-02-06, so the Jan-1 → Feb-6
# slice is IN-SAMPLE for this checkpoint and will be reported separately.
#
# Checkpoint: WF_seed42_fold_07_20260424_061803 (Stage 2.5 SOLO_BEST, live gmgp1-xauusd)
# Training split: train 2025-08-06 → 2026-02-06, val 2026-02-06 → 2026-03-06,
# fold-test 2026-03-06 → 2026-04-06. Strict-OOS sub-window: 2026-04-06 → 2026-04-12.

data:
  file_path: "data/oanda/xauusd_m15_m.parquet"
  ticker: "XAUUSD"
  handler_type: "multiscale"
  train_start_date: "2025-08-06"
  train_end_date: "2026-02-06"
  val_start_date: "2026-02-06"
  val_end_date: "2026-03-06"
  test_start_date: "2026-01-01"
  test_end_date: "2026-04-12"

features:
  scales: [15, 60, 240]
  window_size: 30
  features_per_scale: 8
  asset_class: "cfd_gold"

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.000235
  deadband_threshold: 0.35
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 500
  random_start: false
  max_drawdown_pct: 0.10
  scales: [15, 60, 240]
  gap_detection: true
  gap_atr_mult: 3.0
  reward:
    mode: "dsr"
    dsr_eta: 0.008072070485679669
    dsr_scale: 1.0
    hindsight_weight: 0.0

network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

agents:
  sac:
    lr_actor: 0.00048211947849186834
    lr_critic: 0.00023536913918894482
    lr_alpha: 0.0000023011482963674244
    gamma: 0.9734375919828845
    tau: 0.0056901039341825865
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.4568170758305432
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 2.738336834748153
    checkpoint_interval: 250000

training:
  total_timesteps: 0
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: false
  num_envs: 1

hpo:
  enabled: false

wandb:
  project: "FinRL-Pro-DS"
  tags: ["gmgp1-xauusd", "XAUUSD", "SAC", "15min", "CFD", "backtest",
         "wf-stage3", "fold-07", "solo-seed-42", "oanda-xau-spot",
         "q1-2026-oos", "regime-drift", "steady-state"]
