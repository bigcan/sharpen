# ============================================================================
# OPTIONS-VOL HARVEST — decision gates overlay (vrp-harvest-v1)
# ============================================================================
# Merged over the inline `gates:` of configs/options_vol_harvest.yaml at
# validation/eval time (validate_config._load_ensemble_gates_overlay). These are
# the DECISION gates from the architecture (.agent/artifacts/
# options_vol_harvest_architecture.md). All thresholds live HERE (never hardcoded
# in code/scripts — project invariant).
gates:
  # The decisive gate: the RL must beat the FROZEN linear short-vol core OOS by
  # >= min_uplift on the same WF windows, else we ship the linear rule. The free
  # DVOL-synthetic BTC straddle core is fully-costed net Sharpe ~1.06 (results/
  # options_vrp/verdict.json, per_asset BTC, after the Tier-2-audit perp-hedge fee
  # correction).
  # [!] DE-CONTAMINATION RE-AUDIT 2026-06-23 (docs/research/
  # options_vrp_decontamination_reaudit_2026-06-23.md): the prior "HONEST deploy band
  # ~0.6-0.9 / real-chain monthly anchor 0.61" is VOID. The 0.61 was USDC-linear data
  # contamination -- the free Tardis chain mixed USD-priced BTC_USDC rows into the
  # coin-priced ATM argmin in 5/63 months (all recent: 2025-12..2026-06). De-contaminated
  # (inverse-only) the real-chain is NO-GO (straddle -0.25, strangle +0.05; instrument
  # A/B 0/8). PATH A (DVOL-synthetic, SEPARATE data path) is UNAFFECTED and still
  # reproduces 1.06/0.77, BUT has lost its only real-price corroboration; the honest read
  # is now the multiplicity-deflated DSR ~0.3-0.5 (N=16-28, P(SR<0.5)=0.29), UNCONFIRMED
  # by real execution. Sleeve BLOCKED / paper-gate clearance RESCINDED -- stays flag-off;
  # revival needs a PAID daily-chain 21d-roll real-chain re-validation (net Sharpe >=~0.5
  # AND >0 OOS), else retire. The RL gate itself is unchanged (clear the core, OOS, by uplift).
  rl_beats_linear:
    metric: "oos_net_sharpe"
    min_uplift_vs_baseline: 0.10
    else: "ship_linear_core"

  # North-star: the sleeve must stay uncorrelated to the existing live book.
  # Real-chain measured corr-to-BTC was 0.17 — comfortably under.
  g_diversification:
    max_corr_to_existing_sleeves: 0.30

  # Frictionless-artifact guard (the AlphaSeek lesson). Option fees are STRUCTURALLY
  # large relative to premium, so the absolute Sharpe gap is inherently wide
  # (frictionless 1.86 vs fully-costed net 1.06 => ~0.80 for BTC) and is a CAUTION,
  # not a kill — the real guard is that NET Sharpe clears wf_net_sharpe_floor with
  # REAL fees. The bound here catches a pathological frictionless-only result (net
  # collapsing far below the validated band), NOT the structurally-large fee gap.
  g_cost_gap:
    max_frictionless_minus_net_sharpe: 0.90

  # Primary WF survival sanity (NOT the deploy bar — rl_beats_linear is). Linear
  # core fully-costed ~1.06 (honest band 0.6-0.9); a floor of 0.50 is a survival check.
  wf_net_sharpe_floor: 0.50

  # Short-vol tail gates (ADR-6) — the kill-switches a vol seller must pre-register.
  # max_net_vega_per_100k mirrors the env's max_net_vega_pct hard cap (0.50 of equity
  # => $50k vega notional / $100k); the env clips to it physically, this is the
  # report-time assertion. WIRED 2026-06-11 (V5-03): the Phase-1 falsification now
  # reads this block via load_gates() and evaluates cvar95_floor_pct, this vega cap,
  # and max_worst_window_dd_pct against the linear core as fail-loud kills (were
  # previously declared here but had no Python consumer).
  tail:
    max_worst_window_dd_pct: 25.0
    max_net_vega_per_100k: 50000.0
    cvar95_floor_pct: -8.0

  # Fixed-lot stress sub-report (X3; Protocol v2 Stage 3) sanity bounds.
  stress_dd_buffer_pp: 1.0
  stress_leverage_max: 3.0               # delta-hedge perp leverage ceiling

  # Phase-1 falsification kill criteria (already PASSED — GO; kept for any re-run).
  phase1_linear:
    min_net_sharpe: 0.50
    min_net_pf: 1.10
    require_multi_subperiod: true
    max_recent_oos_drawdown: 0.40
    min_recent_oos_sharpe: 0.0

  # Instrument A/B bake-off (.agent/artifacts/options_vrp_instrument_ab_spec.md). The
  # real-chain skew falsification runs each signed-leg structure through phase1_linear
  # + tail independently (no inheritance from the straddle), then picks the survivor by
  # a TAIL-ADJUSTED metric (Sortino, with the tail CVaR95 guard) — NOT raw Sharpe — so a
  # capped-tail iron fly with a lower Sharpe can legitimately win (it's the one you can
  # safely lever). Pre-registered here so the metric/threshold can't be chosen post-hoc.
  instrument_ab:
    instruments: [straddle, strangle, iron_fly, iron_condor]
    wing_delta: 0.10              # long-wing target |delta| for iron_fly / iron_condor (< 0.25 short delta)
    require_pass_phase1: true     # each instrument must independently clear phase1_linear + tail
    select_by: sortino            # rank PASSERS by Sortino (downside-adjusted), NOT raw Sharpe (ADR-4)
    min_sortino: 0.50             # a winner must also clear this Sortino floor
    # cvar95 guard reuses gates.tail.cvar95_floor_pct (-8.0); worst-window DD reuses tail.max_worst_window_dd_pct
    sample_basis: tardis_first_of_month   # free monthly snapshots; paid daily-chain re-run = deploy-grade (ADR-5)
