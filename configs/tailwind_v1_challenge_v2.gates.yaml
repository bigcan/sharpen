# TAILWIND-v1 CHALLENGE **v2** — RE-SIZED to 10% effective vol.
# Sibling of tailwind_v1_challenge.gates.yaml, which is left byte-stable as the record of
# what was wired (and what the render rejected). Evidence:
#   docs/research/tailwind_v1_forward_path_render_2026-07-31.md
# At 15% the wired config failed THREE gates (needless-termination 12.1%>5%, daily-breach
# 0.129>0.10, max gross 6.00>4.70). The measured frontier showed <=10% clears all three.
# vol_multiplier is 1.45 = 0.10/0.0692 against the book's MEASURED native vol, not the
# nominal 1.5x the original file assumed against an un-measured 10% base.
# ============================================================================
# TAILWIND-v1 CHALLENGE — decision + survival gates (configs/tailwind_v1_challenge.yaml)
# ============================================================================
# The CHALLENGE-mode gates. Structure mirrors configs/tailwind_v1.gates.yaml but the
# binding pre-attempt gate is DIFFERENT: for a prop challenge the objective is P(pass)
# (survival to the profit target), NOT the own-capital Deflated-Sharpe >= 0.95 bar.
#
# IMPORTANT DISTINCTION FROM OWN-CAPITAL:
#   * Own-capital tailwind_v1.gates.yaml BLOCKS on DSR >= 0.95 (honest DSR 0.896 < 0.95).
#     That is the OWN-CAPITAL bar — it certifies a standalone edge worth your own money.
#   * For the CHALLENGE, DSR is INFORMATIONAL, not blocking. A real ~0.73-Sharpe,
#     uncorrelated, PBO~=0 book that sits just under the own-capital DSR bar is still a
#     fit-for-purpose prop vehicle (small-operator reframe). The binding pre-attempt gate
#     is the simulator P(pass) + a Tier-2 audit + operator go-ahead.
#   * Unlike own-capital, the CHALLENGE risk kills are NOT uncalibrated placeholders: the
#     HARD CEILINGS are the ✅-verified firm limits (configs/prop_firm_rules.yaml). The
#     internal operational buffers below them are prudent defaults pending a forward-path
#     render (which sets how tight the internal kill can sit above the book's normal 15%-vol
#     drawdown without needless self-termination).
gates:
  # RL allocator must beat the FROZEN linear core OOS by >= min_uplift, else ship linear.
  # (Unchanged from own-capital; the shadow is the linear core either way.)
  rl_beats_linear:
    metric: "oos_net_sharpe"
    min_uplift_vs_baseline: 0.10
    else: "ship_linear_core"

  combiner_beats_static:
    metric: "oos_net_sharpe"
    baseline: "static_inverse_vol"
    min_uplift_vs_baseline: 0.10
    else: "ship_static_rp"

  # Guard against a frictionless artifact: net Sharpe must not collapse vs costless.
  g_cost_gap:
    max_frictionless_minus_net_sharpe: 0.15

# ============================================================================
# CHALLENGE PASS GATE — the binding pre-attempt gate (P(pass), NOT DSR)
# ============================================================================
# Sourced from the P(pass) Monte-Carlo simulator (results/tailwind_v1/challenge_sim.json,
# docs/research/tailwind_v1_challenge_simulator_2026-07-02.md) at this file's 1.5x sizing.
# A live attempt is authorised only if the min_p_pass floor is met AND a Tier-2 audit of
# THIS book clears AND the operator signs off. All thresholds live here, never in code.
# NOTE: named `challenge_pass_gate` (not `challenge`) to avoid colliding with the reserved
# live-path `challenge:` block (phase/advance_rule/enabled) that validate_config validates at
# the paper-DEPLOY stage — that sanctioned block is added at deploy, not at this paper-sim rung.
challenge_pass_gate:
  sizing:
    vol_multiplier: 1.45             # 10% effective vol / 6.92% native (measured, not nominal)
    effective_vol_ann: 0.10          # RE-SIZED per the 2026-07-31 forward-path render
    bank_and_derisk: false           # simulator: do NOT bank at low vol

  # Verified firm HARD limits (breach = instant challenge failure) — the ceilings the
  # internal kills must sit below. Mirror of configs/prop_firm_rules.yaml (✅ 2026-07-02).
  firm_hard_limits:
    max_total_loss_pct: 10.0         # FTMO + Velotrade 2-step "Maximum Loss" — STATIC from initial
    daily_loss_limit_pct: 5.0        # FTMO + Velotrade 2-step "Maximum Daily Loss"
    dd_mode: static
    profit_target_step1_pct: 10.0
    profit_target_step2_pct: 5.0
    min_trading_days: 5              # max(FTMO 4, Velotrade 5) — non-binding at E[days]~150-196
    time_limit: none                 # ✅ no deadline (the load-bearing assumption)

  # Simulator-derived P(pass) at THIS FILE'S 1.0x / 10% sizing (mom+BAB, no bank).
  # RE-DERIVED 2026-08-17 by re-running scripts/research/run_challenge_simulator.py — the
  # values here were previously carried over from the 1.5x file unchanged, which is what made
  # v2 a shallow copy: it edited the two sizing declarations and left the evidence behind.
  # Model outputs, not guarantees. min_p_pass is the go/no-go floor a real attempt must clear.
  # ⭐ 1.0x is the simulator's ARGMAX for every firm AND both steps — this sizing is not a
  # concession to the render, it is also the P(pass) maximiser. E[days] 196 step1 / 110 step2,
  # binding constraint = max_dd in all four cells.
  p_pass_expected:
    ftmo_step1: 0.746                # was 0.711 (1.5x); re-derived at 1.0x
    ftmo_step2: 0.870                # unchanged — step2's optimum was already 1.0x
    velotrade_step1: 0.746           # == FTMO after the static-DD correction
    velotrade_step2: 0.870
    two_phase_per_attempt: 0.65      # 0.746 x 0.870 = 0.649 (was 0.60 at 1.5x)
  min_p_pass_step1: 0.65             # go/no-go floor. NOTE: 0.746 now clears it by 0.096
                                     # where the 1.5x 0.711 cleared by 0.061.
  daily_breach_budget: 0.10          # frontier daily-breach at 1.0x is 0.03 (was 0.090 at
                                     # 1.5x); alarm if a render exceeds this budget
  # Provenance note: the simulator's velotrade_step2 cell peaks with bank=0.05 rather than
  # bank=None. NOT adopted — `sizing.bank_and_derisk: false` above stands, because banking
  # only helps when running hot and the uplift is within noise of the no-bank cell.

# ============================================================================
# FORWARD-PATH RENDER — thresholds for the render this file's capital_gate demands
# ============================================================================
# Consumed by scripts/research/tailwind_forward_path_render.py. Declared HERE rather than in
# the script because every numeric gate in this project lives in a gates file (CLAUDE.md
# anti-pattern: "Never hardcode gate thresholds in code or scripts").
#
# The render answers paper_soak.risk.derivation's open question: does the 8%/4% internal buffer
# trip on the book's NORMAL drawdown? It measures that as the "needless-termination share" — the
# fraction of challenges that the firm's own limits would have let PASS but an internal kill
# ended. The bootstrap P(pass) simulator cannot answer this: it destroys drawdown ORDERING, and
# ordering is the whole question.
forward_path_render:
  # ⚠️ THE 10% CELL PASSES THIS BY EXACTLY ZERO MARGIN (0.0500 vs 0.0500 = 1/20 disjoint
  # windows, Wilson CI95 [0.009, 0.236]). A knife-edge, not a clearance: one window entering
  # or leaving the denominator flips RENDER_CLEAR to RENDER_FLAGS, as `causal_vol_lev_cap`
  # above demonstrates.
  #
  # ⚠️ THIS METRIC CANNOT RANK CELLS INSIDE THE CLEARING BAND — do not re-size on it.
  # (An earlier revision of this comment recommended re-sizing to 6%. RETRACTED 2026-08-17;
  # it was read off the frontier of a FLAGS run where 10% failed and 6% cleared by
  # elimination. In the wired state the render's `recommended_cell` IS 10.0%.)
  #     vol   needless        CI95              n_disjoint   P(pass)
  #     6%    0.0   (0/12)    [0.000, 0.299]        12        0.750
  #     8%    0.0625          [0.011, 0.283]        20        0.800   <- FAILS, between two passes
  #    10%    0.05  (1/20)    [0.009, 0.236]        26        0.769
  # Three reasons this grid cannot support a sizing decision:
  #   1. NON-MONOTONE — 8% fails between two cells that pass. That is noise, not structure.
  #   2. 6%'s "0.0" is the WEAKEST measurement here, not the strongest: 0/12 with an upper
  #      bound of 0.299 vs 10%'s 1/20 bounded at 0.236.
  #   3. STRUCTURAL: n_disjoint RISES with vol (12 @ 6%, 26 @ 10%, 65 @ 20%) because lower
  #      vol resolves each challenge more slowly, so fewer disjoint windows fit the sample.
  #      Lower vol is safer per challenge and PERMANENTLY less measurable. You cannot buy
  #      margin on this gate by lowering vol; you buy it with more windows, i.e. more data.
  # The grid's honest read is a BAND: {6%, 10%} clear, 15% genuinely fails (needless 0.121,
  # daily-breach 0.129, gross 6.00 — three independent legs), and within the band it is mute.
  # 10% stays wired: most windows behind it, best P(pass) point estimate, already rendered.
  max_needless_share: 0.05           # >5% of otherwise-winning challenges thrown away ⇒ buffer too tight
  render_horizon_days: 756           # 3y cap per challenge window (no-deadline firms need a finite render)
  # Effective annualised vol grid for the remedy sweep the derivation names ("else widen, or
  # lower vol to 1.0x"). Scored on max_needless_share + daily_breach_budget + max_gross_exposure.
  vol_frontier_grid: [0.06, 0.08, 0.10, 0.12, 0.15, 0.20]
  # Trailing-vol targeting for the CAUSAL arm — what a live book can actually size off. Mirrors
  # risk_parity.{trailing_window,min_periods} in configs/tailwind_v1_challenge.yaml.
  causal_vol_window_days: 252
  causal_vol_min_periods: 63
  # ⚠️ NOT a mirror of env.lev_cap, despite what this comment said until 2026-08-17. They are
  # DIFFERENT OBJECTS: this caps the leverage the CAUSAL arm's trailing-vol targeting applies to
  # the COMBINED BOOK series; `env.lev_cap` caps a PER-ASSET weight inside MultiAssetAllocatorEnv.
  # Same category error as the two `max_gross_exposure` keys documented below.
  #
  # ⚠️⚠️ THIS VALUE IS LOAD-BEARING AND ITS JUSTIFICATION IS UNRESOLVED. Acting on the false
  # "mirror" I re-sized it 3.0 -> 2.0 alongside env.lev_cap, and the render verdict FLIPPED:
  #     3.0 -> disjoint n=26, needless 0.0500 -> RENDER_CLEAR   (0.050 gate, passes by ZERO)
  #     2.0 -> disjoint n=24, needless 0.0526 -> RENDER_FLAGS
  # That is 1/20 versus 1/19 — ONE window in the denominator, Wilson CI95 [0.009, 0.236].
  # Held at 3.0 because that is the value the 2026-07-31 evidence was produced with; changing
  # it to whichever number yields CLEAR would be choosing the verdict. See the resize doc's own
  # warning: "exactly AT the bar, not comfortably under."
  causal_vol_lev_cap: 3.0

# ============================================================================
# SURVIVAL RISK KILLS — internal halts BELOW the firm hard limits
# ============================================================================
# HARD CEILINGS are the verified firm limits above. The internal kills fire FIRST so the
# book de-risks before a firm breach ends the challenge. Buffers (2pp under max-loss, 1pp
# under daily) were prudent defaults; the 2026-07-31 forward-path render CONFIRMED them at
# this file's 10% sizing — max DD −16.7%, daily-breach 0.0018, needless-termination 5.0%
# (vs −24.4% / 0.129 / 12.1% at the rejected 15%). The "else lower vol to 1.0x" remedy the
# old wording anticipated is exactly what this file now IS; that sentence is no longer a
# pending question.
paper_soak:
  status: pre_registered
  consumed_by: [paper_executor, live_monitor]
  baseline_ref: results/tailwind_v1/challenge_sim.json

  min_soak_calendar_days: 90
  min_rebalances_observed: 3
  rebalance_cadence: monthly

  parity:
    max_daily_return_te_bps: 15
    max_weight_l1_drift: 0.05
    max_missed_rebalances: 0
    max_cost_drift_ratio: 1.50
    min_cost_drift_ratio: 0.50

  # ALWAYS-ON risk kills — GROUNDED in the verified firm hard limits (not placeholders).
  risk:
    max_drawdown_kill_pct: 8.0        # internal kill 2pp UNDER the 10% static firm max-loss
    daily_loss_halt_pct: 4.0          # internal halt 1pp UNDER the 5% firm daily limit
    # ⚠️ TWO DIFFERENT QUANTITIES SHARE THIS NAME — do not reconcile them by editing either.
    #   * THIS key is the ceiling the forward-path RENDER scores against, on the RESEARCH
    #     basis (`gross_exposure(vol_scalar)` = 0.5·k_mom·w_mom + 0.5·k_bab·w_bab, scaled).
    #     Render at 10%: max gross 4.00 <= 4.70 PASS. At the rejected 15% it was 6.00, FAIL.
    #   * `env.max_gross_exposure` (3.0 after the 2026-08-17 re-size) is the EXECUTOR lever,
    #     a per-sleeve and combined-book cap inside MultiAssetAllocatorEnv, and the only lever
    #     that binds on real data (executor vol ~= 0.0334 x it).
    # The old comment here ("env caps combined gross at 4.5; ~5% margin") conflated the two.
    max_gross_exposure: 4.7           # render-basis ceiling; measured 4.00 at 10% vol
    calibrated_for_sleeves: [momentum, defensive]
    derivation: >-
      Ceilings = ✅-verified FTMO/Velotrade 2-step hard limits (max-loss 10% static,
      daily 5%; configs/prop_firm_rules.yaml). Internal kills sit a prudent buffer below
      so the book de-risks before a firm breach fails the challenge. The buffer WIDTH
      (2pp / 1pp) should be confirmed against a real tailwind forward-path render at 15%
      vol so an internal kill does not trip on the book's normal drawdown.

  drift:
    max_corr_to_spy: 0.40
    corr_window_days: 252
    max_single_class_pnl_share: 0.60
    sleeve_attribution_required: true
    max_corr_between_sleeves: 0.30

# ============================================================================
# OVERFITTING / DSR — INFORMATIONAL in challenge mode (NOT blocking)
# ============================================================================
# Recorded for provenance. In CHALLENGE mode a sub-0.95 DSR does NOT block: the prop
# objective is P(pass), and the honest ~0.73-Sharpe / PBO~=0 book is a valid prop vehicle
# even though it does not clear the own-capital 0.95 DSR bar (R1 + breadth NO-GO both closed
# the cheap routes to raise it). See configs/tailwind_v1.gates.yaml for the BLOCKING
# own-capital version enforced by scripts/research/audit_tailwind_book.py.
overfitting_informational:
  honest_dsr_n24: 0.896              # < 0.95: blocks OWN-CAPITAL, not the challenge
  pbo_cscv: 0.0009                   # selection NOT overfit
  note: "DSR is the own-capital gate; the challenge gate is challenge_pass_gate.min_p_pass_step1."

provenance:
  drafted_on: '2026-07-02'
  drafted_by_session: S553-cont-98
  strategy: tailwind-v1-challenge (TSMOM engine + BAB crash-hedge, 1.5x)
  simulator_ref: docs/research/tailwind_v1_challenge_simulator_2026-07-02.md
  rules_ref: configs/prop_firm_rules.yaml
  rationale: >-
    Wires the challenge-mode gates for the 1.5x prop vehicle. The binding pre-attempt gate
    is the simulator P(pass) (not the own-capital DSR>=0.95). Risk kills are grounded in
    the verified FTMO/Velotrade hard limits. Sizing = the simulator's 1.5x cell (P(pass)
    ~0.71 step1, timeout tail ~0).
  capital_gate: >-
    BLOCKED. A live challenge attempt (fee + funded account = capital) requires a Tier-2
    deep-lifecycle audit of THIS book (the 2026-07-01 audit noted no tailwind Stage-4 OOS
    artifact, P8-10), a forward-path render confirming the 15% effective vol + these risk
    kills, and operator go-ahead. This file wires the gates; it does not authorise an attempt.
