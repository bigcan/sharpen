# Phase GMO1-v2: Gold CME IQN — OPT-C Epsilon-Greedy + torch_compile
# =================================================================
# GMO1 re-run with two changes:
#   1. Div-by-zero fix in switch_centric reward (S184)
#   2. OPT-C: NoisyLinear → nn.Linear + epsilon-greedy → torch_compile: true
# Expected SPS improvement: ~300 → ~780 (2.6x from compile + no NoisyLinear overhead)
#
# Base: phase_gmo1_iqn_gc_3min.yaml
# Kill: PF < 0.98 after 2M steps. Pass: PF > 1.05, switch rate 5-17%.

data:
  file_path: "data/processed/gc_2025_3min_front.parquet"
  ticker: "GC"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-10-31 23:59:59"
  val_start_date:   "2025-11-01 00:00:00"
  val_end_date:     "2025-11-30 23:59:59"
  test_start_date:  "2025-12-01 00:00:00"
  test_end_date:    "2025-12-31 23:59:59"
  norm_cutoff_date: "2025-11-01 00:00:00"

features:
  n_levels: 1
  asset_class: "cme_futures"
  vol_norm_window: 40            # 40 x 3-min = 120 min

env:
  symbol: "GC"
  initial_balance: 100000.0
  margin_requirement: 0.05
  taker_fee: 0.0002              # 2 bps (CME Gold taker)
  maker_fee: 0.000010            # Not used in swing MDP
  num_envs: 24
  window_size: 15                # 15 x 3-min = 45 min lookback
  max_drawdown_pct: 0.30
  mdp_version: "v6"             # Swing MDP (SwingScalperEnv)
  episode_length: 1000           # ~50 hours of 3-min bars
  random_start: true

  reward:
    mode: "switch_centric"       # GMO1: P0 core change
    stay_reward_weight: 0.1      # HPO: [0.05, 0.3]
    scaling: 1.0
    volatility_horizon: 20
    sharpe_weight: 0.0           # Pure PnL reward
    hindsight_weight: 0.0        # No future leak (BUG-03)
    crra_gamma: 0.0              # Disable CRRA (test reward mode in isolation)

  action:
    discrete_dims: 2             # {Long, Short}
    cooldown_bars: 3             # 3-bar (9 min) minimum hold after switch
    max_position: 5.0
    fixed_trade_qty: 0.2

network:
  micro_config:
    input_size: 18
    private_input_size: 4        # [direction, bars_since_switch, unrealized_pnl, atr]
    hidden_size: 256
    encoder_type: "flat"

  macro_config:
    input_size: 15
    hidden_sizes: [256, 128]

agents:
  iqn:
    type: iqn
    num_quantiles: 32
    embedding_dim: 64
    noisy_sigma0: 0.5            # Ignored when exploration_mode: "epsilon"
    exploration_mode: "epsilon"  # OPT-C: nn.Linear + epsilon-greedy (enables torch_compile)
    epsilon_start: 1.0
    epsilon_end: 0.01
    exploration_fraction: 0.5    # Reach epsilon_end at 50% of training
    quantile_huber_kappa: 1.0
    learning_rate: 0.0003
    gamma: 0.99
    tau: 0.005
    batch_size: 512               # 5090: 32GB VRAM, better TC tile efficiency
    buffer_size: 1000000           # 5090: 32GB VRAM, 2x replay diversity
    learning_starts: 5000
    use_per: false
    torch_compile: true           # OPT-C: Unlocked by removing NoisyLinear
    gradient_clip: 10.0
    auxiliary_weight: 0.1
    update_interval: 8
    checkpoint_interval: 200000
    n_step: 3                    # Base (HPO overrides when n_step_hpo: true)
    n_step_hpo: true             # GMO1: Enable n_step HPO {3,5,7,10}
    target_q_clip: 500.0
    buffer_size_hpo: true        # GMO1: Enable buffer_size HPO [500K, 2M]
    fee_threshold: 0.0           # P3: tune post-training

replay:
  stratified_sampling: false     # No Hold action to stratify against

training:
  total_timesteps: 5000000
  training_epochs: 1
  log_interval: 20480
  torch_compile: true            # OPT-C: Unlocked
  use_amp: true
  amp_dtype: "bfloat16"          # 5090 Blackwell: native BF16, no GradScaler overhead
  use_shm: false
  verbose_logging: true

hpo:
  enabled: true
  n_trials: 50
  steps_per_trial: 1000000       # 1M (swing needs more than 500K)

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["Gold", "GC", "IQN", "3min", "SwingMDP", "EpsilonGreedy",
         "BinaryAction", "SwitchCentricReward", "CME", "FrontMonth",
         "gmo1v2", "optc", "torchCompile"]
