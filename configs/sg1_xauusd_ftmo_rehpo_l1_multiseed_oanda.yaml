# SG-1 XAUUSD FTMO re-HPO — Stage 2 L1 multiseed (OANDA single-source redo, S488)
#
# Path A (S488): switch to OANDA XAUUSD M1 (spot, matches cTrader paper-deploy)
# to close the sim-to-live gap (S470). Prior GC-based L1 (N=10, PF 2.706 median,
# CV 7.73%) established the trial-56 HP point is stable; this redo tests the
# SAME HP point on the actual deploy-market data.
#
# Data: data/oanda/xauusd_m1_m.parquet
#   - OANDA v20 Practice, XAU_USD, M1 mid
#   - 453,743 bars, 2025-01-01 to 2026-04-15
#   - Passed clean_ohlcv, manifest built
#
# Gate (Protocol v2 §4 Stage 2, S488 escalation rule): SAME as GC run
#   - median test PF >= 1.2, all seeds profitable, CV(PF) outside [0.22, 0.38]
#   - CV inside [0.22, 0.38] = AMBIGUOUS -> auto-extend to N=20

data:
  file_path: "data/oanda/xauusd_m1_m.parquet"
  ticker: "XAUUSD"
  handler_type: "multiscale"
  train_start_date: "2025-01-06"
  train_end_date: "2025-06-30"
  val_start_date: "2025-07-01"
  val_end_date: "2025-08-31"
  test_start_date: "2025-09-01"
  test_end_date: "2025-10-31"

features:
  scales: [3, 15, 60]
  window_size: 30
  features_per_scale: 8
  asset_class: "cfd_gold"

signal_gate:
  enabled: true
  gate_mode: "composite"
  atr_threshold: 0.35
  parkinson_threshold: 0.0107
  volume_threshold: 0.75
  max_hold_bars: 20
  gate_always_on_first: true
  normalize_accumulated_reward: true

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.000235                # steady-state (S464); cTrader XAUUSD ~2-4bps RT
  deadband_threshold: 0.35           # trial 56
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 1500
  random_start: true
  max_drawdown_pct: 0.10
  scales: [3, 15, 60]
  gap_detection: true
  gap_atr_mult: 3.0                  # OANDA has 73h weekend gap, detector required
  reward:
    mode: "dsr"
    dsr_eta: 0.009270901804613313    # trial 56
    dsr_scale: 1.0
  prop_firm:
    enabled: true
    profit_target_pct: 0.10
    max_trailing_drawdown_pct: 0.08
    max_daily_loss_pct: 0.04
    eod_hour_utc: 21
    drawdown_penalty_start: 0.03
    drawdown_penalty_scale: 5.0
    success_bonus: 10.0
    augment_obs: false

network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

agents:
  sac:
    # Trial 56 HPs (Optuna study sg1_xauusd_ftmo_rehpo_20260419, best PF 2.85 on GC)
    lr_actor: 0.0004328235879674501
    lr_critic: 0.000255518632525778
    lr_alpha: 0.0000027165537430202373
    gamma: 0.9887304528260698
    tau: 0.00586388344589006
    initial_alpha: 0.4297169729200557
    gradient_clip: 3.0464559724708105
    batch_size: 512
    buffer_size: 500000
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    checkpoint_interval: 250000

training:
  total_timesteps: 500000            # match GC L1 budget (apples-to-apples)
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: true
  num_envs: 20
  # seed: set per-run via CLI (--seed N); launcher sweeps [42,123,456,789,1024,1337,2025,3141,5150,9999]

hpo:
  enabled: false

gates:                               # Protocol v2 §4 Stage 2 (S488 escalation)
  hpo_pf_floor: 1.2
  hpo_min_trials_completed: 30
  entropy_floor: 0.01
  q_div_max: 100.0
  action_sat_max: 0.9
  l1_seeds: 10                       # S488: prop-firm workstreams require N>=10
  l1_pf_cv_max: 0.30
  l1_pf_floor: 1.2
  l1_pf_cv_ambiguous: [0.22, 0.38]   # S488: pre-committed escalation range
  wf_windows: 4
  wf_pf_floor: 1.1
  ftmo_active_days_min: 4
  ftmo_max_single_day_share: 0.5
  ftmo_daily_dd_buffer_pp: 0.5
  ftmo_trailing_dd_buffer_pp: 0.5
  oos_pf_floor: 1.1

wandb:
  project: "FinRL-Pro-DS"
  tags: ["sg-1", "XAUUSD", "SAC", "3min", "signal-gated", "FTMO", "prop-firm",
         "rehpo-trial56", "l1-multiseed", "steady-state", "oanda-spot",
         "upstream:sg1_xauusd_ftmo_rehpo_20260419"]
