# SG-1 XAUUSD FTMO — HPO
# 50 trials x 500K steps. PropFirmWrapper enabled (10% DD, 5% daily loss).
# 3-min multi-scale + signal gate (same as SG-1 Gold).
# Fee: steady-state 2.35 bps since S468; legacy fee_schedule removed — never ramped
# within 500K HPO budget (trainer-step keyed + num_envs=20 → trials terminated at
# step 25K while ramp started at 300K). IC Markets Raw XAUUSD basis: commission
# $3.50/lot/side (≈1.75 bps at $2000/oz) + typical spread 0.6 bps/side ≈ 2.35 bps/side.
# Data: CME GC proxy (99%+ correlation with XAUUSD CFD at 3-min).

data:
  file_path: "data/cme/gc_2025_lob1_1min_stitched.parquet"
  ticker: "XAUUSD"
  handler_type: "multiscale"
  train_start_date: "2025-01-06"
  train_end_date: "2025-06-30"
  val_start_date: "2025-07-01"
  val_end_date: "2025-08-31"
  test_start_date: "2025-09-01"
  test_end_date: "2025-10-31"

features:
  scales: [3, 15, 60]
  window_size: 30
  features_per_scale: 8
  asset_class: "cfd_gold"

signal_gate:
  enabled: true
  gate_mode: "composite"
  # Calibrated S479 via feature-distribution analysis on CME GC 3-min 2025-01-06→06-30
  # train window (56K bars, vol>0). Target ~75% composite pass rate per GC oracle
  # "MARGINAL GO permissive" verdict. Prior values (atr:0.3, parkinson:0.02, vol:0.5)
  # were inherited from SG-1 Gold and effectively no-ops (parkinson:0.02 > p90=0.012
  # never triggered; vol:0.5 alone opened ~85% of bars).
  atr_threshold: 0.35          # atr_norm > 0.35 ~ top 37% (p63 interpolated 0.33)
  parkinson_threshold: 0.0107  # ~ p55 (median 0.0105, just above)
  volume_threshold: 0.75       # |volume_z| > 0.75 ~ top 25% (p70=0.82, p80=0.99)
  max_hold_bars: 20
  gate_always_on_first: true
  normalize_accumulated_reward: true

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.000235
  deadband_threshold: 0.25
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 1500
  random_start: true
  max_drawdown_pct: 0.10
  scales: [3, 15, 60]
  gap_detection: true
  gap_atr_mult: 3.0
  reward:
    mode: "dsr"
    dsr_eta: 0.001
    dsr_scale: 1.0
  prop_firm:
    enabled: true
    profit_target_pct: 0.10
    max_trailing_drawdown_pct: 0.08   # buffered from FTMO 10% hard rail (S478 Stage 0)
    max_daily_loss_pct: 0.04           # buffered from FTMO 5% hard rail (S478 Stage 0)
    eod_hour_utc: 21
    drawdown_penalty_start: 0.03       # shaping triggers before hard rail (S478 Stage 0)
    drawdown_penalty_scale: 5.0
    success_bonus: 10.0
    augment_obs: false

network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

agents:
  sac:
    lr_actor: 0.0003
    lr_critic: 0.0003
    lr_alpha: 0.0003
    gamma: 0.99
    tau: 0.005
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.2
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 10.0
    checkpoint_interval: 250000

training:
  total_timesteps: 3000000
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: true
  num_envs: 20

hpo:
  enabled: true
  objective: "profit_factor"           # BUG-01: HPO objective must be profit_factor
  trials: 50                           # Protocol v2 naming (was n_trials)
  steps_per_trial: 500000

gates:                                 # Protocol v2 §4 — per-workstream numeric gates
  # HPO stage
  hpo_pf_floor: 1.2
  hpo_min_trials_completed: 30
  entropy_floor: 0.01                  # training-health hard fails
  q_div_max: 100.0
  action_sat_max: 0.9
  # L1 multi-seed stage
  l1_seeds: 3                          # Protocol v2 minimum (SG-1 prior used 2, raised going forward)
  l1_pf_cv_max: 0.30
  l1_pf_floor: 1.2
  # Walk-forward stage
  wf_windows: 4
  wf_pf_floor: 1.1
  # FTMO compliance
  ftmo_active_days_min: 4
  ftmo_max_single_day_share: 0.5
  ftmo_daily_dd_buffer_pp: 0.5         # breach if intraday DD > (4% + 0.5pp) = 4.5%
  ftmo_trailing_dd_buffer_pp: 0.5
  # Recent-OOS stage
  oos_pf_floor: 1.1

wandb:
  project: "FinRL-Pro-DS"
  tags: ["sg-1", "XAUUSD", "SAC", "3min", "signal-gated", "FTMO", "prop-firm", "hpo", "steady-state", "re-hpo"]
