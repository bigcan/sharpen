# ============================================================================
# CROSS-ASSET MOMENTUM ALLOCATOR — xsec-mom-v1 (Protocol v2)
# ============================================================================
# Phase 3 of the cross-sectional pivot (S553-cont-33). Config for the RL allocator
# built on the validated linear TSMOM core (net Sharpe ~0.60 @2bps, 4/4 classes;
# results/xsec_momentum/). The RL must BEAT the frozen linear core OOS by the
# gates.rl_beats_linear uplift, or we ship the linear rule (RL = thin overlay).
#
# >> RESEARCH-TIER (cont-58 P6-04): strategy.tier=research / deploy_gating=false. The cont-53
#    campaign verdict was SHIP-LINEAR ("RL NOT justified"): the RL allocator did NOT clear the
#    rl_beats_linear gate, so the capital-bound strategy is the FROZEN LINEAR core
#    (configs/live_cross_asset_paper.yaml + the paper executor + the paper_soak gates), which
#    runs no SAC. This pipeline runs SINGLE-SEED HPO/train per window (no l1-multiseed, no
#    seed=), so its WF manifest is RESEARCH evidence, NOT a Protocol-v2 deploy gate — Principle-6
#    (multiseed median) does not bind it. The seeded multiseed is the X1 alternative NOT taken.
#    This resolves the cont-58 S1 (P6-04): no capital decision rests on a single-run RL verdict.
#
# Design: .agent/artifacts/multi_asset_allocator_architecture.md
#   - env.type: multi_asset_allocator -> MultiAssetAllocatorEnv (generalizes
#     CryptoPerpEnv). Action = signed conviction; the env vol-targets (ADR-2).
#   - hpo.objective: sharpe (ADR-4 — portfolio risk-adjusted, not BUG-01 PF).
#   - data: yfinance daily proxies for dev (ADR-5); curated futures for deploy.
#     The cross_asset_loader fetches + clean_ohlcv at runtime (no shipped parquet).
#
# PRE-FLIGHT:
#   --stage hpo -> FAILS multiplicity since the S553-cont-34 gate fix (500k steps /
#   1260 train_bars = 397x >> 50x REJECT cliff — this config IS the overfit that
#   slipped when the gate skipped non-crypto). Historical artifact; use
#   cross_asset_momentum_retry.yaml (50k, ~40x) or the v1.1 config for new runs.
#   --stage wf  -> PASS (wf does not re-check the per-trial HPO budget)
# ============================================================================

strategy:
  id: "xsec-mom-v1"
  name: "cross_asset_momentum"
  version: "0.1.0"
  instrument: "multi_asset_allocator"
  # P6-04 (cont-58): RESEARCH-TIER, NOT capital-bound. Per the cont-53 ship-linear verdict the
  # capital path is the FROZEN LINEAR core (configs/live_cross_asset_paper.yaml + paper executor
  # + paper_soak gates), which runs no SAC. This RL allocator's single-seed WF answers the
  # rl_beats_linear RESEARCH question only; it does NOT gate capital, so Protocol-v2 Principle-6
  # (multiseed median) does not bind it (the seeded multiseed = the un-taken X1 alternative).
  tier: research
  deploy_gating: false

# ---------- UNIVERSE (18 liquid ETF proxies × 4 classes; validated set) -------
universe:
  assets: ["SPY", "QQQ", "IWM", "EFA", "EEM",      # equity
           "TLT", "IEF", "LQD",                     # rates
           "GLD", "SLV", "DBC", "USO", "DBA",       # commodity
           "UUP", "FXE", "FXY", "FXB", "FXA"]       # fx
  asset_class:                                       # ticker -> class (XS-rank grouping)
    SPY: equity
    QQQ: equity
    IWM: equity
    EFA: equity
    EEM: equity
    TLT: rates
    IEF: rates
    LQD: rates
    GLD: commodity
    SLV: commodity
    DBC: commodity
    USO: commodity
    DBA: commodity
    UUP: fx
    FXE: fx
    FXY: fx
    FXB: fx
    FXA: fx
  n_assets: 18

# ---------- DATA (yfinance daily; runtime fetch + clean via cross_asset_loader)
data:
  source: "yfinance_etf"                 # dev proxies (ADR-5); curated futures for deploy
  frequency: "1d"
  start_date: "2006-01-01"
  end_date: null                         # rolling to latest
  fields: ["open", "high", "low", "close", "volume"]

# ---------- FEATURES (causal signals; cross_asset_signals.compute) ------------
features:
  lookbacks: [63, 126, 252]              # 3 / 6 / 12-month trend (validated)
  skip: 5                                # skip last week (microstructure)
  vol_window: 63                         # ~3-month realized-vol window
  include_baseline_weight: true          # ADR-3 (RL learns a residual over the core)
  carry:
    enabled: false                       # v1 TSMOM-only (ADR-6); carry data is v1.1

# ---------- ENV (MultiAssetAllocatorEnv) -------------------------------------
env:
  type: "multi_asset_allocator"
  initial_capital: 100000.0
  taker_fee: 0.0002                      # 2 bps (liquid futures/ETF); validator 1-leg cost
  slippage_base_bps: 1.0
  slippage_impact_bps: 5.0
  target_vol_asset: 0.10                 # per-asset annualized vol target
  lev_cap: 2.0                           # per-asset leverage cap after vol-scaling
  max_gross_exposure: 3.0                # vol-targeted book may lever > 1 (ADR-2; bounded [1,6])
  allow_short: true                      # long/short across all classes
  reward_type: "dsr"                     # Differential Sharpe Ratio (Moody-Saffell)
  dsr_eta: 0.01                          # DSR EMA adaptation rate
  turnover_penalty: 0.001                # daily cadence => lower than crypto hourly
  min_trade_pct: 0.005
  circuit_breaker_threshold: 0.1
  random_start: false

# ---------- AGENTS (SAC; RL is a thin overlay on the linear core) ------------
# AGENT = SB3 SAC (MlpPolicy). The allocator env returns a FLAT Box obs, exactly
# like its sibling CryptoPerpEnv (which also uses SB3 via crypto_hpo_runner — the
# runner this pipeline adapts). The custom finrl_pro_ds SACAgent/SACTrainer are
# V7-multiscale-DICT-obs only (they read obs["scale_*"]+obs["private"]) and are NOT
# compatible here. HPO (cross_asset_pipeline._sac_search_space) searches
# learning_rate/buffer_size/batch_size/gamma/tau/learning_starts; the values below
# are full-train defaults / fallbacks. SB3 auto-tunes entropy (ent_coef="auto").
agents:
  sac:
    learning_rate: 0.0003
    gamma: 0.99
    tau: 0.005
    batch_size: 512
    buffer_size: 500000
    learning_starts: 5000
    ent_coef: "auto"
    network_arch: [256, 256]             # MlpPolicy hidden dims (Tensor-Core ×8)

training:
  total_timesteps: 1000000
  num_envs: 8                            # SB3 DummyVecEnv copies (sample diversity)

# ---------- HPO (Stage 1; ADR-4 objective = Sharpe) --------------------------
hpo:
  enabled: true
  agents: ["sac"]
  objective: "sharpe"                    # ADR-4 (portfolio risk-adjusted, not BUG-01 PF)
  trials: 40
  steps_per_trial: 500000

# ---------- WALK-FORWARD (Stage 3; daily bars) -------------------------------
walk_forward:
  train_bars: 1260                       # ~5 years
  val_bars: 252                          # ~1 year
  test_bars: 252
  step_bars: 252
  embargo_bars: 21                       # ~1 month
  min_windows: 3

# ---------- GATES (stage schema; allocator decision gates in the overlay) -----
# PF floors are SECONDARY sanity here — the allocator's primary metric is net
# portfolio Sharpe + the rl_beats_linear gate (configs/cross_asset_momentum.gates.yaml).
# RESEARCH-TIER (P6-04): the l1-multiseed / training-health keys below (l1_seeds, l1_pf_cv_max,
# entropy_floor, q_div_max, action_sat_max) are the parameters of the un-taken X1 multiseed
# build — they are DECLARED here but NOT wired as a deploy gate (the pipeline runs single-seed,
# single-run WF; strategy.tier=research). They are retained to document the X1 alternative, not
# to claim a Principle-6-compliant deploy verdict. Wiring them (X1/X6) is gated on a future
# decision to take the RL allocator to capital — which the cont-53 ship-linear verdict did NOT.
gates:
  hpo_pf_floor: 1.05                     # secondary sanity only (Sharpe is primary)
  entropy_floor: 0.01                    # X1 training-health param (declared; not a wired gate)
  q_div_max: 100.0                       # X1 training-health param (declared; not a wired gate)
  action_sat_max: 0.9                    # X1 training-health param (declared; not a wired gate)
  l1_seeds: 5                            # X1 multiseed count (declared; l1-multiseed stage NOT run)
  l1_pf_cv_max: 0.30                     # X1 cross-seed CV gate (declared; NOT wired — research-tier)
  wf_windows: 4

ensemble:
  gates_file: configs/cross_asset_momentum.gates.yaml

wandb:
  project: "FinRL-Pro-DS"
  consolidate: true
  tags: ["xsec-momentum", "allocator", "SAC", "TSMOM", "daily", "s553"]
