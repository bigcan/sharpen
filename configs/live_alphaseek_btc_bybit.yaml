# AlphaSeek Live Trading — BTC Perpetual Futures on Bybit
# Usage: python scripts/run_alphaseek_live.py --config configs/live_alphaseek_btc_bybit.yaml
# Live:  python scripts/run_alphaseek_live.py --config configs/live_alphaseek_btc_bybit.yaml --mainnet

exchange:
  name: bybit
  testnet: true
  asset: BTC
  symbol: BTC/USDT:USDT
  order_type: limit
  limit_offset_pct: 0.0005    # 5bps spread crossing for taker fills
  market_fallback_timeout: 10  # faster fallback for HFT (10s vs 60s)

state_builder:
  type: live                   # "mock" for dry-run, "live" for real LOB feed
  lob_depth: 20
  feed_interval_s: 1.0        # LOB snapshot ingestion cadence
  features:
    norm_span: 120             # EMA span for EMA-Z-tanh normalization
    momentum_window: 5         # ticks for momentum feature
    vol_window: 30             # ticks for realized vol feature

alphaseek:
  agents:
    - type: D3QN
      net_dims: [256, 256]
      checkpoint_dir: models/alphaseek/D3QN_tuned
    - type: DoubleDQN
      net_dims: [256, 256]
      checkpoint_dir: models/alphaseek/DoubleDQN_tuned
    - type: TwinD3QN
      net_dims: [256, 256]
      checkpoint_dir: models/alphaseek/TwinD3QN_tuned
  ensemble_strategy: q_average    # best performing in contest eval
  confidence_threshold: 0.001
  # agent_weights: [0.4, 0.3, 0.3]  # optional for weighted strategy

tick_clock:
  interval_seconds: 2.0
  max_late_seconds: 1.0

trading:
  initial_balance: 10000.0
  position_notional: 10000.0    # $ per position unit
  max_position: 1               # contest constraint: {-1, 0, +1}
  max_holding: 1800             # 1 hour at 2s ticks
  stop_loss_thresh: 0.0001      # EvalTradeSimulator default

risk:
  enabled: true
  max_drawdown_pct: 0.05        # 5% total drawdown
  static_peak: true             # Match training: DD from initial balance, never ratchets (S468)
  max_daily_loss_pct: 0.02      # 2% daily hard stop
  circuit_breaker_cooldown_ticks: 300  # 10 minutes
  daily_turnover_limit: 500
  flash_crash_pct: 0.02         # 2% drop in 60s
  max_spread_multiplier: 5.0
  max_latency_ms: 500.0

wandb:
  enabled: true
  entity: bigcan-chiwin-technology
  project: FinRL-Pro-DS
  tags: [alphaseek, btc, live]

safety:
  kill_file: /tmp/finrl_alphaseek_kill
  emergency_flatten_on_error: true
  max_consecutive_errors: 5
  require_explicit_mainnet: true

# --- PRISM Regime Overlay (L2 position sizing) ---
prism:
  enabled: false                        # Set true to activate regime overlay
  base_url: "http://prism-api:8001"     # Docker DNS (inside finrl-net)
  api_key: ""                           # Empty = no auth (internal network)
  ticker: "BTC-USD"                     # PRISM ticker (yfinance format)
  timeframe: "daily"
  timeout: 5                            # API call timeout in seconds
  cache_ttl: 60                         # Seconds to cache regime result
  crisis_flatten: true                  # Flatten to 0 on BEARISH+HIGH_VOL
  multipliers:
    LOW_VOL: 1.3
    NORMAL_VOL: 1.0
    HIGH_VOL: 0.3
