# GMGP1-XAUUSD Walk-Forward — Window R3: Fixed-HP Retraining
# Train: Jan-Oct, Val: Nov, Test: Dec
# Longest training period (10 months) — tests data quantity effect
# HPs: T34 best trial from GMGP1-XAUUSD HPO (run 1fprvttn, PF=2.886)
# Fee: 1.5bps (CFD), DD: 10% (FTMO)

data:
  file_path: "data/cme/gc_2025_lob1_1min_stitched.parquet"  # CME proxy
  ticker: "XAUUSD"
  handler_type: "multiscale"
  train_start_date: "2025-01-06"
  train_end_date: "2025-10-31"
  val_start_date: "2025-11-01"
  val_end_date: "2025-11-30"
  test_start_date: "2025-12-01"
  test_end_date: "2025-12-31"

features:
  scales: [15, 60, 240]
  window_size: 30
  features_per_scale: 8
  asset_class: "cfd_gold"

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.0
  deadband_threshold: 0.25        # T34 best (unchanged from default)
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 500
  random_start: true
  max_drawdown_pct: 0.10          # FTMO 10% max DD
  scales: [15, 60, 240]
  reward:
    mode: "dsr"
    dsr_eta: 0.00092668           # T34 best
    dsr_scale: 1.0
  fee_schedule:
    - {step: 0, taker_fee: 0.0}
    - {step: 500000, taker_fee: 0.0, ramp_to: 0.00015, ramp_end_step: 1500000}
    - {step: 1500000, taker_fee: 0.00015}  # 1.5bps CFD

network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

# SAC HPs from T34 best trial (GMGP1-XAUUSD HPO, run 1fprvttn)
agents:
  sac:
    lr_actor: 0.00034069          # T34 best
    lr_critic: 0.000027372        # T34 best
    lr_alpha: 0.0000020265        # T34 best (near floor — low alpha LR optimal)
    gamma: 0.99826                # T34 best (most important HP, rho=+0.43)
    tau: 0.0019716                # T34 best
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.37652        # T34 best (high entropy essential)
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 1.2302         # T34 best (tight clipping helps)
    checkpoint_interval: 250000

training:
  total_timesteps: 3000000
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: true
  num_envs: 20

hpo:
  enabled: false

wandb:
  project: "FinRL-Pro-DS"
  tags: ["gmgp1-xauusd", "Gold", "SAC", "15min", "CFD", "FTMO", "walkforward", "wf-retrain", "wf-r3", "fixed-hp", "long-train"]
