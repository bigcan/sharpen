# GMGP1-v5 GOLD Q1 2026 OOS Backtest — regime drift quantification
# Checkpoint: gmgp1_v5_l1_seed456 (Gold CME, live gmgp1-gold paper)
# Base: configs/gmgp1_l1_multiseed.yaml
# Data: CME-stitched 15m parquet covers 2025-01-01 → 2026-04-13 (yfinance comment stale).
# Test window: 2026-01-01 → 2026-04-12 (~14 weeks, fully post-train OOS).

data:
  file_path: "data/cme/gold_2025_2026q1_15min_stitched.parquet"
  ticker: "GC"
  handler_type: "multiscale"
  train_start_date: "2025-01-06"
  train_end_date: "2025-10-31"
  val_start_date: "2025-11-01"
  val_end_date: "2025-11-30"
  test_start_date: "2026-01-01"
  test_end_date: "2026-04-12"

features:
  scales: [15, 60, 240]
  window_size: 30
  features_per_scale: 8
  asset_class: "cme_futures"

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.0002
  deadband_threshold: 0.35
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 500
  random_start: false
  max_drawdown_pct: 0.30
  scales: [15, 60, 240]
  reward:
    mode: "dsr"
    dsr_eta: 0.003159755401614352
    dsr_scale: 1.0
    hindsight_weight: 0.0

network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

agents:
  sac:
    lr_actor: 0.0005462612695421805
    lr_critic: 0.000866154995794675
    lr_alpha: 0.0009625164717779418
    gamma: 0.9535315530021778
    tau: 0.00212659146992685
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.15930606967484204
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 10.0
    checkpoint_interval: 250000

training:
  total_timesteps: 0
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: false
  num_envs: 1

hpo:
  enabled: false

wandb:
  project: "FinRL-Pro-DS"
  tags: ["gmgp1-gold", "Gold", "SAC", "15min", "backtest", "q1-2026-oos",
         "regime-drift", "l1-seed456", "yfinance-gc"]
