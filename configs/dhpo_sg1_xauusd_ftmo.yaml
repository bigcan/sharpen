# Distributed HPO overlay — SG-1 XAUUSD FTMO re-HPO (S480)
# Extends configs/distributed_hpo.yaml with workstream-specific data files.
# Launch:
#   set -a; source .env; set +a
#   python scripts/distributed_hpo_coordinator.py \
#     --config configs/sg1_xauusd_ftmo_hpo.yaml \
#     --platform gpuhub \
#     --n_workers 2 --n_trials 50 \
#     --db_url "$DISTRIBUTED_HPO_DB_URL" \
#     --study_name sg1_xauusd_ftmo_rehpo_20260419 \
#     --distributed_config configs/dhpo_sg1_xauusd_ftmo.yaml

distributed_hpo:
  platform: "gpuhub"
  n_workers: 2
  n_trials: 50

  storage:
    backend: "postgresql"
    url: "${DISTRIBUTED_HPO_DB_URL}"
    heartbeat_interval: 60
    grace_period: 600
    max_retry: 1

  # Safe slots per S480 monitor_fleet snapshot (gpuhub-1:1 has active DSAC wl7ir7ia).
  gpuhub:
    instances: ["gpuhub-1:0", "gpuhub-2:0"]

  worker:
    target_trials: null
    trial_timeout: 7200
    graceful_shutdown_timeout: 60
    pip_extras: ""

  data:
    upload_method: "sftp"
    data_files:
      - "cme/gc_2025_lob1_1min_stitched.parquet"
      - "cme/gc_2025_lob1_1min_stitched.manifest.json"
    cache_by_size: true

  wandb:
    entity: "bigcan-chiwin-technology"
    project: "FinRL-Pro-DS"
    group_prefix: "dhpo"
    tags: ["distributed_hpo", "sg-1", "XAUUSD", "FTMO", "re-hpo", "steady-state"]

  fault_tolerance:
    max_worker_retries: 2
    worker_replace_on_death: false   # 2-slot fleet — manual replace if a worker dies
    monitor_poll_interval: 300

  cost:
    # max_total_spend omitted — GPUHub slots are prepaid; no $ cap needed
    auto_teardown: false             # never auto-destroy GPUHub instances
