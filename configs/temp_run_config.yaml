agents:
  bdq:
    auxiliary_weight: 1.0
    batch_size: 128
    buffer_size: 50000
    checkpoint_interval: 10000
    epsilon_decay: 0.999
    epsilon_end: 0.05
    epsilon_start: 1.0
    gamma: 0.99
    learning_rate: 0.0001
    learning_starts: 1000
    target_update_freq: 1000
    update_interval: 2.0
data:
  file_path: data/btc_lob_jan2023.parquet
  test_end_date: '2023-01-09'
  test_start_date: '2023-01-08'
  ticker: BTCUSDT
  train_end_date: '2023-01-07'
  train_start_date: '2023-01-01'
  val_end_date: '2023-01-08'
  val_start_date: '2023-01-07'
env:
  action:
    direction_bins: 3
    max_position: 5.0
    price_bins: 5
    volume_bins: 5
  initial_balance: 100000.0
  num_envs: 1
  reward:
    hindsight_horizon: 180
    hindsight_weight: 0.1
    profit_weight: 1.0
    volatility_horizon: 100
  symbol: BTCUSDT
  transaction_fee: 5.0e-05
  window_size: 50
features:
  macro_features:
  - macro
  micro_features:
  - micro
  private_features:
  - position
  - balance
network:
  macro_config:
    hidden_sizes:
    - 256
    - 128
    input_size: 11
  micro_config:
    hidden_size: 128
    input_size: 20
    private_input_size: 2
    rnn_type: LSTM
training:
  log_interval: 500
  torch_compile: false
  total_timesteps: 100000
  use_amp: true
  use_shm: false
wandb:
  entity: bigcan-chiwin-technology
  mode: online
  project: FinRL-Pro-DS
  tags:
  - Pilot
  - SingleBDQ
  - VerifyingLogic
