# Phase R.2.1-v2: BDQ Gold 3-min — Switch-Centric + eval_epsilon
# ==============================================================
# R.2.1 (`gjmrzyvw`) FAILED: 10/10 trials 0 trades, 70h wasted.
# Root causes fixed:
#   - BUG-05: BDQ.predict() lacked `context` kwarg → eval crash (FIXED S188)
#   - Dense reward mode: FAILED in all 5+ runs. Switch-centric only mode with signal.
#   - BDQ eval exploration: deterministic=True + epsilon-greedy = 0 exploration.
#     eval_epsilon=0.02 prevents Q-lock-in during HPO eval.
#   - SW-01: direction_before refactored to use saved direction_for_reward
#   - SW-02: reward_clip configurable (200 for switch-centric large outcomes)
#
# Key changes from R.2.1:
#   - reward.mode: switch_centric (was dense)
#   - eval_epsilon: 0.02 (was 0.0 implicit)
#   - reward_clip: 200.0 (was 50.0 hardcoded)
#
# Hypothesis: H33-v2 — BDQ on swing MDP with switch-centric reward achieves PF > 1.05
# Gate: Test PF > 1.10 with >= 200 trades
# Kill: PF < 0.98 after 2M steps

data:
  file_path: "data/processed/gc_2025_3min_front.parquet"
  ticker: "GC"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-10-31 23:59:59"
  val_start_date:   "2025-11-01 00:00:00"
  val_end_date:     "2025-11-30 23:59:59"
  test_start_date:  "2025-12-01 00:00:00"
  test_end_date:    "2025-12-31 23:59:59"
  norm_cutoff_date: "2025-11-01 00:00:00"

features:
  n_levels: 1
  asset_class: "cme_futures"
  vol_norm_window: 40            # 40 x 3-min = 120 min

env:
  symbol: "GC"
  initial_balance: 100000.0
  margin_requirement: 0.05
  taker_fee: 0.0002              # 2 bps (CME Gold all-in, Session 118)
  maker_fee: 0.000010            # Not used in swing MDP
  num_envs: 24                    # RTX 5090 target (gpuhub-1)
  window_size: 15                # 15 x 3-min = 45 min lookback
  max_drawdown_pct: 0.30
  mdp_version: "v6"             # Swing MDP (SwingScalperEnv)
  episode_length: 1000           # ~50 hours of 3-min bars
  random_start: true

  reward:
    mode: "switch_centric"         # Dense mode FAILED 5+ runs; switch-centric only mode with signal
    stay_reward_weight: 0.1        # HPO range: [0.05, 0.3]
    reward_clip: 200.0             # Switch-centric produces larger rewards (100+ bps winners)
    crra_gamma: 0.0                # Disable CRRA (isolate reward mode effect)
    scaling: 1.0
    volatility_horizon: 20
    sharpe_weight: 0.0             # Pure PnL reward

  action:
    discrete_dims: 2             # {Long, Short} — swing MDP binary
    cooldown_bars: 3             # 3-bar (9 min) minimum hold after switch
    max_position: 5.0
    fixed_trade_qty: 0.2

network:
  micro_config:
    input_size: 18
    private_input_size: 4        # [direction, bars_since_switch, unrealized_pnl, atr]
    hidden_size: 256
    encoder_type: "flat"

  macro_config:
    input_size: 15
    hidden_sizes: [256, 128]

agents:
  bdq:
    learning_rate: 0.0002        # From G5b baseline
    gamma: 0.99                  # HPO will tune: [0.93, 0.999]
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay: 0.99999       # Verified: single-increment only (FIND-NEW-01 fixed)
    buffer_size: 500000
    batch_size: 512
    target_update_freq: 100
    tau: 0.005
    auxiliary_weight: 0.1
    use_per: true
    per_alpha: 0.6
    per_beta_start: 0.4
    per_beta_frames: 100000
    exploration_mode: "epsilon_greedy"
    update_interval: 8           # UTD=8 for GPU utilization
    checkpoint_interval: 200000
    learning_starts: 5000
    target_q_clip: 500.0         # Tighter Q-clip (K4.5)
    torch_compile: true          # TC-OPT: JIT-fused ops (no List[Tensor] issue on BDQ)
    eval_epsilon: 0.02           # 2% random in HPO eval (prevent Q-lock-in)

replay:
  stratified_sampling: false     # No Hold action to stratify against

training:
  total_timesteps: 5000000
  training_epochs: 1
  log_interval: 20480
  torch_compile: true              # TC-OPT: full-model JIT compile
  use_amp: true
  amp_dtype: "bfloat16"           # TC-OPT: more stable than fp16, native on Ada/Blackwell

hpo:
  enabled: true
  n_trials: 50
  steps_per_trial: 500000        # 500K per trial, NopPruner (no early kill)

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["Gold", "GC", "BDQ", "3min", "SwingMDP", "BinaryAction",
         "SwitchCentricReward", "CME", "FrontMonth", "r21v2", "rehabilitation",
         "PhaseR", "epsilonGreedy", "PER", "2bps", "evalEpsilon"]
