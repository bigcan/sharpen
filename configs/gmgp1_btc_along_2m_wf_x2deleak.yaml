# GMGP1-BTC Velotrade Stage-3 WF — X2 DE-LEAK re-run of the A_long×2M N=5 ensemble.
#
# === PURPOSE: blast-radius probe #1 (S553-cont-20 follow-up) ===
# sg1-btc's apparent edge was 100% leak-borne (X2 coarse-bar look-ahead;
# leaky best-solo WF PF 1.69 -> de-leaked 1.02). gmgp1-btc is the closest
# structural twin (same BTC instrument, same multiscale_handler.py, adjacent
# octave [15,60,240] vs sg1-btc's [3,15,60]) so it is the highest-prior, fastest
# test of whether the leak extends fleet-wide.
#
# This config is a DISJOINT clone of configs/gmgp1_btc_along_2m_wf.yaml — the
# config that produced the LEAKY results/gmgp1_btc_ensemble_wf/verdict.json
# (ens PF 2.81 / best-solo 2.61 / uplift 1.078, all 5 gates PASS,
# approve_ensemble_paper_deploy; Stage 2.5-R bootstrap P(PF)=0.9996).
#
# DELTA vs gmgp1_btc_along_2m_wf.yaml — APPLES-TO-APPLES, only X2 changes:
#   - ensemble.checkpoint_pattern: gmgp1-btc-x2deleak-* (disjoint from the leaky
#     gmgp1-btc-along-wf-* checkpoints so run_wf_ensemble cannot mix cohorts).
#   - wandb.tags: + "x2-deleak" / "s553" (KEEP "along-2m" — the dispatcher's
#     WandB completion-poller hard-filters on that tag).
#   - EVERYTHING else byte-identical: data, splitter, env (incl. taker_fee 0.0005
#     held constant to isolate X2 — NOT cost-corrected here), HPs, network, seeds,
#     seed_pfs, gates. The X2 causal fix (6c027e19) applies at CODE level on the
#     June2026 branch; no config key encodes it.
#
# LAUNCH (disjoint prefix REQUIRED so checkpoints don't collide with leaky run):
#   python scripts/launch_btc_along_wf_multiseed.py \
#       --config configs/gmgp1_btc_along_2m_wf_x2deleak.yaml \
#       --run_name_prefix gmgp1-btc-x2deleak \
#       --slots <5-tenant x 3 GPU pool>            # 20 runs (4 folds x 5 seeds), ~5-7h
#
# POST-TRAIN EVAL (no GPU) — --output_dir MANDATORY (gates workstream:gmgp1_btc
# otherwise defaults to the LEAKY results/gmgp1_btc_ensemble_wf/):
#   python scripts/sg1_btc_velotrade_ensemble_eval.py \
#       --wf_config configs/gmgp1_btc_along_2m_wf_x2deleak.yaml \
#       --gates_file configs/gmgp1_btc_velotrade_ensemble.gates.yaml \
#       --output_dir results/gmgp1_btc_ensemble_wf_x2deleak --device cpu
#   # ENGINE CORRECTION (deep audit 2026-06-03, P7-01/P7-02): use the velotrade
#   # engine (has X3 fixed-lot stress + chosen_rule grading), NOT the shared
#   # sg1_xauusd engine (no stress, grades static rule). See the costcorr config
#   # header for the full rationale. This frictionless run is an UPPER BOUND, not
#   # a deploy gate, so stress matters less here — but keep the engine consistent.
#
# COMPARE: leaky ens 2.81 / best-solo 2.61  vs  de-leaked verdict.
#   survives gates -> gmgp1-btc edge is real; leak not fatal at 15m -> reassuring
#                     for the fleet, redeploy.
#   collapses      -> BTC short-TF pattern confirmed (3rd strike); shelve like
#                     sg1-btc, sharpen prior that gold/xauusd/eurusd are at risk.

# ---------- DATA (Bybit, full envelope) — identical to leaky WF ----------
data:
  file_path: "data/btc_usdt_1min_bybit.parquet"
  ticker: "BTC"
  handler_type: "multiscale"
  start_date: "2024-01-01"
  end_date:   "2026-04-06"

splitter:
  train_months: 22                      # A_long
  val_months:   1
  test_months:  1
  step_months:  1                       # 1mo rolling -> 4 folds in 27mo envelope
  buffer_days:  0

features:
  scales: [15, 60, 240]
  window_size: 30
  features_per_scale: 8
  asset_class: "crypto"

# ---------- ENV (matches L1 training — research-tier max_dd, no risk wrapper) ----------
env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.0005                     # held identical to leaky WF (isolate X2; NOT cost-corrected)
  deadband_threshold: 0.35              # v5 6xluh826 T29
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 500
  random_start: true
  max_drawdown_pct: 0.30                # research-tier (matches L1 train)
  scales: [15, 60, 240]
  reward:
    mode: "dsr"
    dsr_eta: 0.003159755401614352       # v5 6xluh826 T29
    dsr_scale: 1.0

# ---------- NETWORK (matches L1) ----------
network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

# ---------- AGENTS (v5 HPO 6xluh826 T29 — frozen) ----------
agents:
  sac:
    lr_actor: 0.0005462612695421805
    lr_critic: 0.000866154995794675
    lr_alpha: 0.0009625164717779418
    gamma: 0.9535315530021778
    tau: 0.00212659146992685
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.15930606967484204
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 10.0
    checkpoint_interval: 250000

# ---------- TRAINING ----------
training:
  total_timesteps: 2000000              # A_long × 2M (the L1 cell)
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: true
  num_envs: 20

hpo:
  enabled: false

# ---------- GATES (Stage 3 WF + upstream-stage retention) — identical to leaky WF ----------
gates:
  hpo_pf_floor: 1.2
  hpo_min_trials_completed: 30
  entropy_floor: 0.01
  q_div_max: 100.0
  action_sat_max: 0.9
  l1_seeds: 5                           # data-window cell ran 5 seeds (not 10)
  l1_pf_cv_max: 0.30
  l1_pf_floor: 1.2
  l1_pf_cv_ambiguous: [0.22, 0.38]
  ensemble_uplift_min: 1.10
  ensemble_ambiguous_min: 1.05
  ensemble_rule_selection: val_argmax_pf
  wf_windows: 4                         # validator hard-fails if <4
  wf_pf_floor: 1.1
  velotrade_trailing_dd_buffer_pp: 0.5
  oos_pf_floor: 1.1

ensemble:
  gates_file: "configs/gmgp1_btc_velotrade_ensemble.gates.yaml"
  # DISJOINT prefix so the eval glob matches ONLY de-leaked checkpoints.
  checkpoint_pattern: "checkpoints/gmgp1-btc-x2deleak-fold{fold}-seed{seed}_*/checkpoint_final.pth"
  seeds: [123, 456, 789, 1024, 2026]
  seed_pfs:
    123:  2.4422
    456:  2.4225
    789:  2.4695
    1024: 2.3670
    2026: 2.5084

wandb:
  project: "FinRL-Pro-DS"
  consolidate: true                     # S488: one parent run, fold<i>/seed<j>/* namespaces
  tags:
    - "gmgp1-btc"
    - "BTC"
    - "SAC"
    - "15min"
    - "crypto"
    - "velotrade"
    - "prop-firm"
    - "walk_forward"
    - "wf-stage3"
    - "along-2m"                        # REQUIRED: dispatcher poller hard-filters on this tag
    - "v2-3-bootstrap"
    - "bybit-perp"
    - "x2-deleak"
    - "s553"
    - "upstream:gmgp1_data_window_study_unified_20260502"
    - "upstream-stage25:results/gmgp1_btc_ensemble/ensemble_v2.tar.gz"
