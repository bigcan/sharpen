env:
  symbol: "BTCUSDT"
  tick_size: 0.1
  lot_size: 0.001
  maker_fee: 0.0002
  taker_fee: 0.0005
  window_size: 50
  initial_balance: 10000.0
  max_position: 1.0  # STRICT LIMIT

data:
  file_path: "/data/btc_lob_jan2023.parquet"
  use_mock: false

reward:
  scaling: 1e-4
  risk_penalty: 0.1
  hindsight_weight: 0.0

network:
  micro_config:
    input_size: 20
    hidden_size: 128
  macro_config:
    input_size: 11
    hidden_sizes: [128]
  fusion_dim: 256

agents:
  dqn:
    learning_rate: 1e-4
    gamma: 0.99
  ppo:
    learning_rate: 3e-4
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    entropy_coef: 0.01
  a2c:
    learning_rate: 3e-4
    gamma: 0.99
    entropy_coef: 0.01

training:
  total_timesteps: 10000
  buffer_size: 10000
  batch_size: 64
  learning_starts: 1000
  target_update_freq: 1000
  checkpoint_interval: 100000
  eval_interval: 100000
