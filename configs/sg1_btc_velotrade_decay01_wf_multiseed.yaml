# SG-1 BTC Velotrade — Stage 3 Walk-Forward, DECAY-01 VARIANT (S542)
#
# === COST-CORRECTION RE-RUN (S552, 2026-05-29) ===
# Per the sim->live gap RCA (docs/research/sg1_btc_sim_live_gap.md), the
# original DECAY-01 stack was trained/selected under an unrealistically cheap
# cost model: taker_fee 5.0 bps (real Bybit retail = 5.5 bps) AND
# slippage_base_bps UNSET (=0) despite the live engine crossing 5 bps on a
# marketable limit (bybit_perp_broker.py:337-339). Gap A (execution+fee cost)
# was reconciled to the penny on the live decay01 segment; this re-run reveals
# the HONEST net-of-cost expectation. Two env params changed below:
#   taker_fee:          0.0005 -> 0.00055   (5.0 -> 5.5 bps, Bybit retail taker)
#   slippage_base_bps:  unset  -> 5.0       (one-way limit-cross, ~4.58 bps measured)
# Both consumed natively by continuous_swing_env.py:58 (slippage), :364-366 +
# :387 (applied to tc_bps AND equity delta). Expect sim PF 2.53 / +26.98%/14d
# to drop materially. NOTE: changing the cost model is a Protocol v2 §4.5
# Stage 2.5-R trigger (#1 env-change / #6 cost-drift) — the cost-free top-3
# seed selection [456,42,2025] is inherited here; a full cost-corrected
# re-selection requires re-training the L1 N=10 cohort under these same params.
#
# Drafted 2026-05-20 (S542) to confirm DECAY-01 Stage 2.5-R verdict
# (`results/sg1_btc_velotrade_decay01_ensemble/verdict.json` — top-3 [456, 42,
# 2025] LOCKED by val_argmax_pf over the N=10 cohort; chosen aggregation rule
# = the rule that wins Phase 2 on val) on temporal robustness across folds.
#
# Per Protocol v2.5 §4.5: WF re-confirmation MANDATORY after Stage 2.5-R PROMOTE
# — "temporal robustness on new data is not transitive."
#
# Inheritance / diff vs sister sg1_btc_velotrade_rehpo_wf_multiseed_extended.yaml:
#   - data envelope extended: 2024-01-01 → 2026-04-06 (extended) becomes
#     2024-01-01 → 2026-04-30 (DECAY-01 dataset includes April 2026 fetch).
#   - ensemble.seeds: [456, 42, 2025] (LOCKED 2026-05-20 from
#     results/sg1_btc_velotrade_decay01/seed_report.json; val_argmax_pf
#     selector over N=10).
#   - seed_pfs from L1 test PFs (verified against WandB summaries; see
#     feedback_seed_report_key_scramble_s540.md for the verification rule).
#   - workstream: sg1_btc_velotrade_decay01 (keeps result dir disjoint from
#     extended bake).
#   - HPs unchanged — re-HPO trial #44 from `sg1_btc_velotrade_rehpo_20260420`
#     is the canonical HP set for both L1 and WF on this 27mo+ data envelope
#     (decision_volume_axis_v2_2m_ceiling.md: HP topology unchanged by 2mo
#     window extension).
#
# Splitter (8 folds, train_months=18, val_months=1, test_months=1, step_months=1):
#   data.start_date 2024-01-01 → data.end_date 2026-04-30 (28mo envelope)
#     fold 0: train 2024-01-01–2025-07-01  val 2025-07–08  test 2025-08–09
#     fold 1: train 2024-02-01–2025-08-01  val 2025-08–09  test 2025-09–10
#     fold 2: train 2024-03-01–2025-09-01  val 2025-09–10  test 2025-10–11
#     fold 3: train 2024-04-01–2025-10-01  val 2025-10–11  test 2025-11–12
#     fold 4: train 2024-05-01–2025-11-01  val 2025-11–12  test 2025-12–01
#     fold 5: train 2024-06-01–2025-12-01  val 2025-12–01  test 2026-01–02
#     fold 6: train 2024-07-01–2026-01-01  val 2026-01–02  test 2026-02–03
#     fold 7: train 2024-08-01–2026-02-01  val 2026-02–03  test 2026-03–04
#
# Gate (pre-committed at configs/sg1_btc_velotrade_ensemble.gates.yaml):
#   G1 Solo baseline  : >=2/3 seeds PF>=1.1 per fold in >=7/8 folds
#   G2 No regression  : per-fold ens_PF >= 0.9 * best_solo_PF in >=7/8 folds
#   G3 Uplift         : median ens_PF / median best_solo_PF >= 1.10
#   G4 Velotrade      : ensemble trajectory per-fold trailing DD buffer >=0.5pp
#                       (Velotrade 2-Step: 10% trailing cap, no daily gate)
#   G5 DD stability   : CV(ens_PF) across folds <= 0.35
#   ALL PASS -> approve ensemble paper-deploy aggregation
#   ANY FAIL -> solo-best remains (by wf_median_pf)
#
# Checkpoint prefix (set by launch_sg1_btc_decay01_wf_multiseed.py via
# --run_name_prefix): `sg1-btc-decay01-wf-fold{N}-seed{seed}_*` — distinct from
# DECAY-01 L1 dirs and extended WF dirs.
#
# Launch (24 fresh SAC training runs ~24h on gpuhub-2 single 4090):
#   python scripts/launch_sg1_btc_decay01_wf_multiseed.py \
#       --config configs/sg1_btc_velotrade_decay01_wf_multiseed.yaml \
#       --instance gpuhub-2 --gpu 0 --concurrent 3
#
# Post-train evaluation (no GPU; CPU is fine):
#   python scripts/sg1_btc_velotrade_ensemble_eval.py \
#       --wf_config configs/sg1_btc_velotrade_decay01_wf_multiseed.yaml \
#       --gates_file configs/sg1_btc_velotrade_ensemble.gates.yaml \
#       --device cpu

workstream: sg1_btc_velotrade_decay01

data:
  file_path: "data/btc_usdt_1min_bybit.parquet"
  ticker: "BTCUSDT"
  handler_type: "multiscale"
  # Splitter envelope; per-fold windows materialized by dispatcher.
  start_date: "2024-01-01"
  end_date: "2026-04-30"

splitter:
  train_months: 18
  val_months: 1
  test_months: 1
  step_months: 1
  buffer_days: 0

features:
  scales: [3, 15, 60]
  window_size: 30
  features_per_scale: 8
  asset_class: "crypto"

signal_gate:
  enabled: true
  gate_mode: "composite"
  # Held from L1 — same vol distribution at 3-min crypto.
  atr_threshold: 0.15
  parkinson_threshold: 0.0009
  volume_threshold: 0.60
  max_hold_bars: 20
  gate_always_on_first: true
  normalize_accumulated_reward: true

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.00055                  # S552 cost-correction: real Bybit retail taker 5.5 bps (was 0.0005; RCA Gap A)
  slippage_base_bps: 5.0              # S552 cost-correction: live 5bps marketable limit-cross (was unset=0; continuous_swing_env.py:58)
  deadband_threshold: 0.25            # trial #44
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 3000
  random_start: true
  max_drawdown_pct: 0.10
  scales: [3, 15, 60]
  gap_detection: false                # BTC 24/7 — no session gaps
  reward:
    mode: "dsr"
    dsr_eta: 0.0008427308583293202    # trial #44
    dsr_scale: 1.0
  risk:
    enabled: true
    max_trailing_drawdown_pct: 0.08   # buffered (Velotrade cap=10%, matches L1)
    max_daily_loss_pct: 0.0           # Velotrade 2-Step has no daily loss gate
    eod_hour_utc: 0                   # crypto 24/7, UTC midnight roll
    drawdown_penalty_start: 0.04
    drawdown_penalty_scale: 5.0
    augment_obs: "off"                # private_dim=5 (live compat)
    static_peak: true

network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

# HPs frozen from sg1_btc_velotrade_rehpo_20260420 trial #44 (PF=2.3031, WandB q9pq44ug)
# — identical to L1 DECAY-01 so Stage 3 WF is apples-to-apples with Stage 2.
agents:
  sac:
    lr_actor: 0.00015739192475706186
    lr_critic: 0.00007322355805160213
    lr_alpha: 0.0000026314031405474944
    gamma: 0.9593670398875173
    tau: 0.0002134448307797731
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.4088157097959411
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 1.516294914428727
    checkpoint_interval: 250000

training:
  total_timesteps: 500000             # Protocol v2 Stage 3 budget (matches extended WF)
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: true
  num_envs: 20
  # seed: set per-run via launcher --seeds; SEEDS = [456, 42, 2025].

hpo:
  enabled: false

# Ensemble metadata — consumed by scripts/sg1_btc_velotrade_ensemble_eval.py via --wf_config.
ensemble:
  # Top-3 by val_argmax_pf rule (S495) over N=10 DECAY-01 L1 seeds (LOCKED S541).
  # Verified S542 against WandB summaries (val_pf == backtest_val/profit_factor).
  # Source: results/sg1_btc_velotrade_decay01/seed_report.json
  #   seed 456 : val PF 2.5346 / test PF 3.1718 (WandB 46dlr8l6)
  #   seed 42  : val PF 2.5053 / test PF 3.0989 (WandB r30s0di0)
  #   seed 2025: val PF 2.4847 / test PF 3.1430 (WandB fsupynfb)
  seeds: [456, 42, 2025]
  # Audit N3: grade the rule Stage-2.5 val_argmax_pf actually promoted, NOT the
  # static gates.aggregation_rule (ens_agreement). The DECAY-01 Stage-2.5 verdict
  # (results/sg1_btc_velotrade_decay01_ensemble/verdict.json) chose ens_mean;
  # the bootstrap decision was SOLO_BEST_FALLBACK, so this only affects which
  # ensemble candidate the WF G2/G3/G4/G5 gates grade.
  chosen_rule: ens_mean
  rules: ["solo_456", "solo_42", "solo_2025",
          "ens_mean", "ens_median", "ens_agreement", "ens_pf_weighted"]
  # Checkpoint path pattern — new prefix matches
  # launch_sg1_btc_decay01_wf_multiseed.py's --run_name_prefix.
  checkpoint_pattern: "checkpoints/sg1-btc-decay01-wf-fold{fold}-seed{seed}_*/checkpoint_final.pth"
  # L1 test PFs (weight ens_pf_weighted aggregation). DO NOT swap to val PFs —
  # the L1 test window (2026-04-16 → 2026-04-30) is the most-recent OOS evidence
  # for relative seed quality at deploy time.
  seed_pfs:
    456:  3.1718
    42:   3.0989
    2025: 3.1430
  # Pointer to pre-committed gate YAML:
  gates_file: "configs/sg1_btc_velotrade_ensemble.gates.yaml"

gates:                                # Protocol v2 §4 Stage 3 (training-level)
  # Upstream-stage gates retained so multi-stage validation walks this config
  # without complaining about missing keys (mirrors L1 + extended WF).
  hpo_pf_floor: 1.2
  hpo_min_trials_completed: 30
  entropy_floor: 0.01
  q_div_max: 100.0
  action_sat_max: 0.9
  l1_seeds: 10                        # S488: prop-firm requires N>=10
  l1_pf_cv_max: 0.30
  l1_pf_floor: 1.2
  l1_pf_cv_ambiguous: [0.22, 0.38]    # S488: pre-committed escalation range
  ensemble_uplift_min: 1.10           # legacy point-estimate (audit-only in v2.5)
  ensemble_ambiguous_min: 1.05
  ensemble_bootstrap_p_pf_ambiguous: 0.75
  ensemble_rule_selection: val_argmax_pf
  # Stage 3 gates
  wf_windows: 8                       # validator requires >=4; splitter emits 8
  wf_pf_floor: 1.1
  velotrade_trailing_dd_buffer_pp: 0.5
  oos_pf_floor: 1.1

wandb:
  project: "FinRL-Pro-DS"
  consolidate: true                   # S488: one parent run per seed; folds as win<i>/*
  tags: ["sg-1", "BTC", "SAC", "3min", "signal-gated", "velotrade", "velotrade-wrapped",
         "prop-firm", "propfirm", "walk_forward", "wf-stage3", "ensemble",
         "ensemble-confirm", "rehpo-trial44", "steady-state", "bybit-perp",
         "decay01", "s542",
         "upstream:sg1_btc_velotrade_l1_multiseed_decay01",
         "upstream-stage25:sg1_btc_velotrade_decay01"]
