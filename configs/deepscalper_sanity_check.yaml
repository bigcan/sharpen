# DeepScalper Sanity Check (Reproduce Run 85pt5kd3 Trial 48)
# Goal: Verify if Sharpe 3.17 is reproducible with these exact params.

data:
  file_path: "data/btc_lob_jan2023.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2023-01-10 00:00:00"
  train_end_date: "2023-01-18 23:59:59"
  val_start_date: "2023-01-19 00:00:00"
  val_end_date: "2023-01-19 23:59:59"
  test_start_date: "2023-01-20 00:00:00"
  test_end_date: "2023-01-20 23:59:59"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  transaction_fee: 0.001      # 10 bps (Matched to Run 85pt5kd3)
  num_envs: 20                # Matched to Run 85pt5kd3
  window_size: 50
  max_drawdown_pct: 0.20      # Matched to Run 85pt5kd3
  
  reward:
    profit_weight: 1.0
    hindsight_weight: 0.1
    hindsight_horizon: 180    # Trial 48 Param
    volatility_horizon: 100
    
  action:
    direction_bins: 3 
    price_bins: 5     
    volume_bins: 5    
    max_position: 5.0

network:
  micro_config:
    input_size: 20
    private_input_size: 2
    hidden_size: 256          # Matched to Run 85pt5kd3
    rnn_type: "LSTM"
  macro_config:
    input_size: 11
    hidden_sizes: [256, 128]  # Matched to Run 85pt5kd3

agents:
  bdq:
    learning_rate: 0.00016088 # Trial 48 Param (Exact)
    gamma: 0.995              # Run 85pt5kd3 Param
    auxiliary_weight: 1.0
    update_interval: 2 
    batch_size: 256           # Trial 48 Param
    buffer_size: 2000000      # Run 85pt5kd3 Param
    target_update_freq: 7500  # Run 85pt5kd3 Param
    checkpoint_interval: 10000 
    learning_starts: 5000     # Run 85pt5kd3 Param
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.999908   # Run 85pt5kd3 Param (Very Slow Decay)
    exploration_fraction: 0.2 # Run 85pt5kd3 Param

training:
  total_timesteps: 100000     # Short run for verification (2x HPO trial length)
  log_interval: 500
  
  torch_compile: true
  use_amp: true         
  use_shm: true               # Match Run 85pt5kd3

hpo:
  enabled: false              # Direct training only

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["SanityCheck", "Trial48", "Repro"]
