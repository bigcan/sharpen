# Market Making: SAC + LOB Microstructure + 3D Action — BTC/USDT 10s
# Stage 4 — Phase 3: Reward v2 (PV-return aligned), LOB-informed fills
# Data: secure_lob_collection.db → lob_etl.py → lob_aggregate.py → btcusdt_lob_10s.parquet

data:
  file_path: "data/processed/btcusdt_lob_10s.parquet"
  ticker: "BTCUSDT"
  handler_type: "lob"
  # Segment 1 (largest, 85K bars) for train, segments 5-9 for val, segment 12 for test
  # No date-based splits — use full file, segment boundaries handle gaps
  train_start_date: "2025-10-24"
  train_end_date: "2025-11-03"
  val_start_date: "2026-02-07"
  val_end_date: "2026-02-24"
  test_start_date: "2026-03-15"
  test_end_date: "2026-03-21"
  norm_cutoff_date: "2026-02-07"

features:
  scales: [1]                      # Single scale — 10s bars are the base
  window_size: 30
  features_per_scale: 8            # TC-OPT: 8 aligns Conv1d for Tensor Cores
  n_lob_features: 8                # LOB microstructure channels
  asset_class: "crypto"

env:
  mdp_version: "v8"
  bar_duration_seconds: 10            # Actual bar duration (scales=[1] means 1 scale, not 1 min)
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  n_lob_features: 8
  maker_fee: 0.0                   # Start zero (fee curriculum)
  base_spread_bps: 0.15            # EDA finding: BTC spread is 0.0014 bps median (~1 tick)
  spread_min_mult: 0.5
  spread_max_mult: 5.0             # Wider range — spread is already at min tick
  max_skew_bps: 2.0                # Tighter skew — spread is tiny
  max_order_size: 0.5
  max_inventory: 0.5
  inventory_hard_stop: 0.8
  min_rest_bars: 1
  deadband_threshold: 0.1
  episode_length: 3600             # 3600 × 10s = 10 hours
  random_start: true
  max_drawdown_pct: 0.10
  fill_model: "volume_based"       # Level 2: probabilistic, calibrated from LOB data
  adverse_slippage_bps: 0.5        # EDA-calibrated: 0.4-0.5 bps empirical adverse move
  adverse_velocity_threshold: 0.001
  queue_depth_multiplier: 15.0     # EDA-calibrated: $200K BBO depth, 45% fill@10s → ~15x
  scales: [1]
  reward:
    mode: "dsr_pv"                 # DSR on PV-return (reward v2 — aligned with equity change)
    dsr_eta: 0.001
    dsr_scale: 1.0
    phi: 0.1                       # Inventory aversion — only used by legacy "dsr" mode
    scaling: 10000.0               # For "pv_return" mode
    clip_min: -5.0                 # For "pv_return" mode
    clip_max: 5.0                  # For "pv_return" mode
  fee_schedule:
    - {step: 0, taker_fee: 0.0}
    - {step: 500000, taker_fee: 0.0, ramp_to: 0.0001, ramp_end_step: 1500000}
    - {step: 1500000, taker_fee: 0.0001}  # 1 bp Binance maker (trainer uses taker_fee key generically)

network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  lob_encoder:
    input_size: 8                  # 8 LOB features
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 12                  # MM private state: 12 dims
  fusion_dim: 256                  # 64 (OHLCV) + 64 (LOB) + 12 (private) → 256 fusion
  window_size: 30
  n_scales: 1                      # Single 10s scale
  n_lob_features: 8
  action_dim: 3                    # spread_offset, inventory_skew, quote_intensity

agents:
  sac:
    lr_actor: 0.0003
    lr_critic: 0.0003
    lr_alpha: 0.0003
    gamma: 0.99
    tau: 0.005
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.2
    learning_starts: 10000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 10.0
    checkpoint_interval: 250000

training:
  total_timesteps: 3000000
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: true
  num_envs: 20

hpo:
  enabled: true
  n_trials: 50
  steps_per_trial: 500000

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  tags: ["mm", "sac", "btc", "10s", "lob", "market-making", "stage4", "volume-based", "reward-v2"]
