# GMGP1-XAUUSD FTMO re-HPO — Stage 2 L1 multiseed (OANDA spot redo, S493-cont)
#
# Path B (S493-cont, user decision 2026-04-22): OANDA XAU_USD M1 spot redo of
# the GC-based L1 (N=10, median PF 1.912, CV 0.109 — PASS). Trial-10 HPs held
# constant so this isolates the sim-to-live data shift (S470). OANDA spot is
# the closer proxy to FTMO cTrader / IC Markets deploy (CME gold futures have
# different microstructure).
#
# Precedent: SG-1 XAUUSD GC->OANDA redo re-ranked top-3 seeds (in-sample
# [42, 789, 456] -> OANDA [42, 2025, 3141]). WF on CME-picked seeds risks the
# same miss, so re-rank on OANDA BEFORE Stage 3 WF.
#
# Data: data/oanda/xauusd_m1_m.parquet
#   - OANDA v20 Practice, XAU_USD, M1 mid
#   - 2025-01-01 -> 2026-04-15 (cleaned, manifest built)
#
# Date splits: SAME as GMGP1 CME L1 (8/2/2, not SG-1's 6/2/2) so the CME vs
# OANDA comparison sits on the same training budget + evaluation windows.
#
# Gate (Protocol v2 Stage 2, S488 escalation rule): SAME numbers as CME run
#   - median test PF >= 1.2, all seeds profitable, CV(PF) outside [0.22, 0.38]
#   - CV inside [0.22, 0.38] = AMBIGUOUS -> auto-extend to N=20

data:
  file_path: data/oanda/xauusd_m1_m.parquet
  ticker: XAUUSD
  handler_type: multiscale
  train_start_date: '2025-01-06'
  train_end_date: '2025-08-31'
  val_start_date: '2025-09-01'
  val_end_date: '2025-10-31'
  test_start_date: '2025-11-01'
  test_end_date: '2025-12-31'

features:
  scales: [15, 60, 240]
  window_size: 30
  features_per_scale: 8
  asset_class: cfd_gold

env:
  mdp_version: v7
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.000235                # steady-state (S464); IC Markets Raw ~2.35 bps/side
  deadband_threshold: 0.35           # trial #10
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 500
  random_start: true
  max_drawdown_pct: 0.10
  scales: [15, 60, 240]
  gap_detection: true
  gap_atr_mult: 3.0                  # OANDA 73h weekend gap detector required
  reward:
    mode: dsr
    dsr_eta: 0.008072070485679669    # trial #10
    dsr_scale: 1.0
  prop_firm:
    enabled: true
    profit_target_pct: 0.10
    max_trailing_drawdown_pct: 0.08
    max_daily_loss_pct: 0.04
    eod_hour_utc: 21
    drawdown_penalty_start: 0.04
    drawdown_penalty_scale: 5.0
    success_bonus: 10.0
    augment_obs: false               # keep private_dim=5 (live compat)

network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

agents:
  sac:
    # Trial #10 HPs (Optuna study gmgp1_xauusd_ftmo_rehpo_20260421)
    lr_actor: 0.00048211947849186834
    lr_critic: 0.00023536913918894482
    lr_alpha: 0.0000023011482963674244
    gamma: 0.9734375919828845
    tau: 0.0056901039341825865
    initial_alpha: 0.4568170758305432
    gradient_clip: 2.738336834748153
    batch_size: 512
    buffer_size: 500000
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    checkpoint_interval: 250000

training:
  total_timesteps: 500000            # match CME L1 budget (apples-to-apples)
  log_interval: 1000
  use_amp: true
  amp_dtype: bfloat16
  torch_compile: true
  num_envs: 20
  # seed: set per-run via CLI (--seed N); launcher sweeps
  # [42, 123, 456, 789, 1024, 1337, 2025, 3141, 5150, 9999]

hpo:
  enabled: false

gates:                               # Protocol v2 Stage 2 (S488 escalation)
  hpo_pf_floor: 1.2
  hpo_min_trials_completed: 30
  entropy_floor: 0.01
  q_div_max: 100.0
  action_sat_max: 0.9
  l1_seeds: 10                       # S488: prop-firm workstreams require N>=10
  l1_pf_cv_max: 0.30
  l1_pf_floor: 1.2
  l1_pf_cv_ambiguous: [0.22, 0.38]   # S488: pre-committed escalation range
  ensemble_uplift_min: 1.10          # S493 Stage 2.5: PROMOTE threshold (pre-committed)
  wf_windows: 4
  wf_pf_floor: 1.1
  ftmo_active_days_min: 4
  ftmo_max_single_day_share: 0.5
  ftmo_daily_dd_buffer_pp: 0.5
  ftmo_trailing_dd_buffer_pp: 0.5
  oos_pf_floor: 1.1

wandb:
  project: FinRL-Pro-DS
  tags:
    - gmgp1-xauusd
    - Gold
    - SAC
    - 15min
    - CFD
    - FTMO
    - ftmo-wrapped
    - prop-firm
    - propfirm
    - rehpo-trial10
    - l1-multiseed
    - steady-state
    - oanda-spot
    - upstream:gmgp1_xauusd_ftmo_rehpo_20260421
