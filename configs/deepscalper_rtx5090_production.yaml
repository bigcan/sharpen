# DeepScalper RTX 5090 Optimized Configuration
# Based on consolidated hyperparameter reference (Feb 1 2026) & Original Paper (Sun et al.)
# Focus: Single BDQ Agent with Hybrid Loss

data:
  file_path: "data/processed/btc_2025_jan_jun.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date: "2025-05-31 23:59:59"
  val_start_date: "2025-06-01 00:00:00"
  val_end_date: "2025-06-14 23:59:59"
  test_start_date: "2025-06-15 00:00:00"
  test_end_date: "2025-06-30 23:59:59"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  # FIX AUDIT-7: Symmetric Margin Logic (1.0 = Spot, 0.5 = 2x Lev)
  margin_requirement: 0.2  # 5x leverage (paper-aligned)
  # FIX: Reduced to VIP1 levels. VIP0 (10 bps/side) made minute-level
  # trading structurally unprofitable (round-trip fee 44x > per-step vol).
  maker_fee: 0.0002  # 2 bps (Binance VIP1 / maker rebate tier)
  taker_fee: 0.0004  # 4 bps (Binance VIP1)
  num_envs: 12            # BrokenPipeError was from env.close() (now fixed), not env count
  window_size: 50
  max_drawdown_pct: 1.0   # Disabled for training — was killing episodes during exploration
  private_state_augment_prob: 1.0  # Paper: always augment private state (Fix 5)
  
  reward:
    # Paper-aligned reward (Section 3.2 + 4.2)
    # r_t = (mid_{t+1} - mid_t) × pos_t - fees + w × pos_t × (mid_{t+h} - mid_t)
    scaling: 1.0              # Applied after bps normalization. HPO range: [0.1, 10.0]
    hindsight_weight: 0.1     # Paper optimal.      HPO range: [1e-3, 0.2]
    hindsight_horizon: 180    # Paper optimal (min). HPO range: [30..180]
    volatility_horizon: 100   # For Aux Target calculation (Section 4.4)
    # Risk-Aware Reward: Differential Sharpe Ratio (Moody & Saffell 2001)
    sharpe_weight: 0.3        # Blend: 0.7 × paper + 0.3 × DSR (was 0.0)
    sharpe_horizon: 100       # EMA lookback window for DSR statistics
    # Fee-avoidance shaping: small reward for holding flat (no unnecessary trades)
    hold_bonus_bps: 0.1       # 0.1 bps reward for holding when flat
    
  action:
    price_bins: 5
    # Paper-aligned: signed qty encodes direction implicitly
    # Negative = Sell, Zero = Hold, Positive = Buy
    signed_qty_proportions: [-0.5, -0.2, -0.1, -0.05, 0.0, 0.05, 0.1, 0.2, 0.5]
    max_position: 1.0 # Max BTC

network:
  # V9.5 Blackwell Architecture
  micro_config:
    input_size: 27
    private_input_size: 2
    hidden_size: 256
    rnn_type: "LSTM"
    
  macro_config:
    input_size: 11
    hidden_sizes: [256, 128] # Resised for 350MB Data (Avoids Overfitting) 

agents:
  bdq:
    # Reference: 1e-4 (fixed)
    learning_rate: 0.0001
    gamma: 0.99  # Reduced from 0.995: shorter horizon (100 steps) better for scalping
    
    # Hybrid Loss Weight (rho)
    # FIX PERF-5: Reduced from 1.0 to 0.1 to prevent aux volatility loss
    # from dominating Q-branch losses during high-volatility regimes
    auxiliary_weight: 0.1
    
    # Replay Ratio Math (FIX PERF-7):
    # Batch=1024, Envs=12. Target Ratio ~21.
    # Updates/Step = interval * 1 / 1 = 0.25 updates per step batch.
    # Replay Ratio = (0.25 * 1024) / 12 ≈ 21.3 (was 170 with update_interval=2.0)
    update_interval: 0.25
    
    # Reference: 128-256 (Bandwidth Optimized) -> 1024 (RTX 5090 Optimized)
    batch_size: 1024
    
    # Reference: 1-2M (GDDR7 VRAM)
    buffer_size: 2000000 
    
    # Reference: 5,000-10,000
    target_update_freq: 7500
    
    checkpoint_interval: 100000 
    
    # Reference: Learning Starts 2,000-5,000
    learning_starts: 5000
    
    # Reference: Exploration 0.15-0.2
    exploration_fraction: 0.2
    epsilon_start: 1.0
    epsilon_end: 0.01
    # FIX PERF-2: epsilon_decay now computed dynamically by trainer
    # from total_timesteps and num_envs. Config value is ignored.
    epsilon_decay: 0.999908  # Legacy — overridden at runtime

training:
  # Overall length
  total_timesteps: 1000000  # 1M steps (Phase 1 - will scale to 10M)
  training_epochs: 5        # Paper Section 4.3: replay dataset ~5 epochs
  log_interval: 100000
  
  # Optimization
  torch_compile: true   # Enabled
  use_amp: true         # Enabled (Reference: FP16)
  use_shm: false          # Reverted — causes [Errno 104] with AsyncVectorEnv spawn context
  verbose_logging: true   # DIAGNOSTIC: Enable full metrics

  
hpo:
  enabled: true
  n_trials: 50             # User requested
  steps_per_trial: 200000  # 20% of total. 50K was too few — agent couldn't overcome fee drag

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["Production", "RTX5090", "SingleBDQ", "PaperAligned"]
