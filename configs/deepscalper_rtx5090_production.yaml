# DeepScalper RTX 5090 Optimized Configuration
# Based on consolidated hyperparameter reference (Feb 1 2026) & Original Paper (Sun et al.)
# Focus: Single BDQ Agent with Hybrid Loss

data:
  file_path: "data/btc_lob_jan2023.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2023-01-10 00:00:00"
  train_end_date: "2023-01-18 23:59:59"
  val_start_date: "2023-01-19 00:00:00"
  val_end_date: "2023-01-19 23:59:59"
  test_start_date: "2023-01-20 00:00:00"
  test_end_date: "2023-01-20 23:59:59"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  # FIX AUDIT-7: Symmetric Margin Logic (1.0 = Spot, 0.5 = 2x Lev)
  margin_requirement: 1.0
  # FIX Bug#2: Explicit maker/taker split (Binance VIP0)
  maker_fee: 0.0   # DIAGNOSTIC: Zero Fees
  taker_fee: 0.0   # DIAGNOSTIC: Zero Fees
  num_envs: 12            # Reverted from 20 — SHM+spawn crashes persist at higher counts
  window_size: 50
  max_drawdown_pct: 0.30  # Relaxed to 30% for Production
  
  reward:
    # Paper-aligned reward (Section 3.2 + 4.2)
    # r_t = (mid_{t+1} - mid_t) × pos_t - fees + w × pos_t × (mid_{t+h} - mid_t)
    scaling: 1.0              # Paper: no scaling.  HPO range: [1e-2, 1.0]
    hindsight_weight: 0.1     # Paper optimal.      HPO range: [1e-3, 0.2]
    hindsight_horizon: 180    # Paper optimal (min). HPO range: [30..180]
    volatility_horizon: 100   # For Aux Target calculation (Section 4.4)
    # Risk-Aware Reward: Differential Sharpe Ratio (Moody & Saffell 2001)
    # Optional — disabled by default. Enable for future risk-aware research.
    sharpe_weight: 0.0        # 0.0 = paper-only. Range: [0.0, 1.0]
    sharpe_horizon: 100       # EMA lookback window for DSR statistics
    
  action:
    direction_bins: 3 
    price_bins: 5     
    volume_bins: 5    
    max_position: 5.0 # Max BTC

network:
  # V9.5 Blackwell Architecture
  micro_config:
    input_size: 27
    private_input_size: 2
    hidden_size: 256
    rnn_type: "LSTM"
    
  macro_config:
    input_size: 11
    hidden_sizes: [256, 128] # Resised for 350MB Data (Avoids Overfitting) 

agents:
  bdq:
    # Reference: 1e-4 (fixed)
    learning_rate: 0.0001
    gamma: 0.995 # Reference: 0.99-0.995
    
    # Hybrid Loss Weight (rho)
    auxiliary_weight: 1.0 # Paper: 1.0 robust
    
    # Replay Ratio Math:
    # Batch=1024, Envs=20. Target Ratio ~8.
    # Updates/Step = (Ratio * Envs) / Batch = 0.16 updates per step.
    # Inverse: Update every ~6 steps. Current: update_interval=2.
    update_interval: 2.0 
    
    # Reference: 128-256 (Bandwidth Optimized) -> 1024 (RTX 5090 Optimized)
    batch_size: 1024
    
    # Reference: 1-2M (GDDR7 VRAM)
    buffer_size: 2000000 
    
    # Reference: 5,000-10,000
    target_update_freq: 7500
    
    checkpoint_interval: 100000 
    
    # Reference: Learning Starts 2,000-5,000
    learning_starts: 5000
    
    # Reference: Exploration 0.15-0.2
    exploration_fraction: 0.2
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.999908 # FIX: Reaches epsilon_end=0.01 at 1M steps (50k decay calls @ num_envs=20)

training:
  # Overall length
  total_timesteps: 1000000  # 1M steps (Phase 1 - will scale to 10M)
  log_interval: 100000
  
  # Optimization
  torch_compile: true   # Enabled
  use_amp: true         # Enabled (Reference: FP16)
  use_shm: false          # Reverted — causes [Errno 104] with AsyncVectorEnv spawn context
  verbose_logging: true   # DIAGNOSTIC: Enable full metrics

  
hpo:
  enabled: true
  n_trials: 50             # User requested
  steps_per_trial: 50000   # Production recommendation: 5% of total steps for robust signal

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["Production", "RTX5090", "SingleBDQ", "PaperAligned"]
