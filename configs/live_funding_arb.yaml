# Live Trading Config — Funding Rate Arbitrage SAC on Top-10 Assets via Bybit
#
# Usage:
#   python scripts/run_live.py --config configs/live_funding_arb.yaml
#   python scripts/run_live.py --config configs/live_funding_arb.yaml --mainnet
#   python scripts/run_live.py --config configs/live_funding_arb.yaml --dry-run

# --- Exchange ---
exchange:
  name: "bybit"
  testnet: true
  asset: "MULTI"                    # Multi-asset funding arb
  leverage: 1
  order_type: "limit"
  limit_offset_pct: 0.0005
  market_fallback_timeout: 60.0
  data_exchange: "binance"

# --- Agent ---
agent:
  # UPDATE: point to best funding-arb checkpoint after WF validation
  checkpoint_path: "checkpoints/funding_arb_best/checkpoint_final.pth"
  device: "cpu"
  torch_compile: false              # Must be false for live inference

# --- SAC Hyperparameters (must match training checkpoint) ---
agents:
  sac:
    lr_actor: 3.0e-4
    lr_critic: 3.0e-4
    lr_alpha: 3.0e-4
    gamma: 0.99
    tau: 0.005
    batch_size: 256
    buffer_size: 100
    initial_alpha: 0.2

# --- Network (UPDATE: must match training checkpoint exactly) ---
network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

# --- Features (UPDATE: must match training config) ---
features:
  scales: [60]                      # 1h decision frequency
  window_size: 30
  features_per_scale: 15            # 15 funding-arb features per asset
  norm_span: 720
  bootstrap_bars: 30000

# --- Bar Clock ---
bar_clock:
  base_interval_minutes: 60         # 1h bars (matches training)
  execution_delay_seconds: 5.0
  max_late_seconds: 30.0

# --- Trading ---
trading:
  initial_balance: 100000.0
  deadband_threshold: 0.01          # Matches training (funding arb = tighter deadband)
  taker_fee: 0.0005                 # Bybit futures taker

# --- Risk Management ---
risk:
  enabled: true
  max_drawdown_pct: 0.10
  static_peak: true                 # Match training: DD from initial balance, never ratchets (S468)
  circuit_breaker_cooldown_bars: 12
  max_position_pct: 0.80            # Max 80% gross exposure (matches training)
  funding_rate_alert: 0.001
  min_margin_reserve_pct: 0.10

# --- WandB Monitoring ---
wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  tags: ["live", "funding-arb", "SAC", "1h", "bybit", "paper", "10-asset"]

# --- Safety ---
safety:
  require_explicit_mainnet: true
  max_daily_loss_pct: 0.05
  kill_file: "/tmp/finrl_live_funding_arb_kill"
  emergency_flatten_on_error: true

# --- Funding Rate EMA Gate (Option C) ---
# Flatten positions when funding EMA falls below borrow cost.
# Validated: flips OOS from -2.79% to +2.19% (6/7 wins) on w15-w21.
funding_rate_gate:
  enabled: true
  ema_span: 168                         # EMA span in hours (~1 week)
  borrow_cost_hourly: 8.33e-6           # Spot borrow rate (Binance margin ~7.3% ann)
  min_warmup: 24                        # Min EMA updates before gate activates
  flatten_on_close: true                # Flatten existing position when gate closes

# --- PRISM Regime Overlay (L2 position sizing) ---
prism:
  enabled: false                        # Set true to activate regime overlay
  base_url: "http://prism-api:8001"     # Docker DNS (inside finrl-net)
  api_key: ""                           # Empty = no auth (internal network)
  ticker: "BTC-USD"                     # PRISM ticker (yfinance format)
  timeframe: "daily"
  timeout: 5                            # API call timeout in seconds
  cache_ttl: 60                         # Seconds to cache regime result
  crisis_flatten: true                  # Flatten to 0 on BEARISH+HIGH_VOL
  multipliers:
    LOW_VOL: 1.3
    NORMAL_VOL: 1.0
    HIGH_VOL: 0.3
