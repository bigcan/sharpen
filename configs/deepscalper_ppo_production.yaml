# DeepScalper PPO Production Configuration
# Parallel to deepscalper_rtx5090_production.yaml (BDQ)
# Shared: data, features, env, network sections
# New: agents.ppo, wandb.project = "DeepScalper-PPO"

data:
  file_path: "data/processed/btc_2025_full_year.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date: "2025-10-31 23:59:59"
  val_start_date: "2025-11-01 00:00:00"
  val_end_date: "2025-11-30 23:59:59"
  test_start_date: "2025-12-01 00:00:00"
  test_end_date: "2025-12-31 23:59:59"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  margin_requirement: 1.0  # Spot (no leverage)
  maker_fee: 0.0002  # 2 bps
  taker_fee: 0.0004  # 4 bps
  num_envs: 12
  window_size: 50
  max_drawdown_pct: 1.0  # Disabled for training
  private_state_augment_prob: 1.0

  reward:
    scaling: 1.0
    hindsight_weight: 0.1
    hindsight_horizon: 180
    volatility_horizon: 100
    sharpe_weight: 0.0
    hold_bonus_bps: 0.0

  action:
    price_bins: 5
    signed_qty_proportions: [-0.5, -0.2, -0.1, -0.05, 0.0, 0.05, 0.1, 0.2, 0.5]
    max_position: 1.0

  augmentation:
    enabled: true
    volatility_scale_range: [0.7, 1.5]
    spread_scale_range: [0.9, 1.2]
    volume_noise_std: 0.1
    macro_noise_std: 0.05
    ofi_scale_range: [0.9, 1.1]

network:
  micro_config:
    input_size: 27
    private_input_size: 3
    hidden_size: 256
    rnn_type: "LSTM"

  macro_config:
    input_size: 11
    hidden_sizes: [256, 128]

agents:
  ppo:
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    clip_eps: 0.2
    vf_coef: 0.5
    ent_coef: 0.01
    max_grad_norm: 0.5
    n_epochs: 4
    rollout_steps: 2048
    batch_size: 256
    lr_schedule: "linear"
    checkpoint_interval: 100000

training:
  total_timesteps: 1000000
  training_epochs: 5
  log_interval: 10240  # Every 5 rollouts (2048 * 5)
  torch_compile: true
  use_amp: true
  use_shm: false
  verbose_logging: true

hpo:
  enabled: true
  n_trials: 50
  steps_per_trial: 200000

wandb:
  project: "DeepScalper-PPO"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["PPO", "RTX5090", "PaperAligned"]
