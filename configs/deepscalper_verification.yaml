env:
  symbol: "BTCUSDT"
  tick_size: 0.1
  lot_size: 0.001
  window_size: 50
  maker_fee: 0.0002
  taker_fee: 0.0005
  initial_balance: 10000.0

data:
  file_path: "c:/FinRL/FinRL-Pro_DS/data/dummy_lob.parquet"
  ticker: "BTCUSDT"
  time_col: "timestamp"
  timeframe: "1m"

reward:
  type: "pnl"
  scaling: 1e-4
  hindsight_weight: 0.1
  hindsight_horizon: 180
  risk_penalty: 0.05
  drawdown_penalty: 0.0

network:
  micro_config:
    input_size: 20
    hidden_size: 256
  macro_config:
    input_size: 11
    hidden_sizes: [256]
  fusion_dim: 256

agents:
  dqn:
    learning_rate: 0.0001
    gamma: 0.99
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.995
    batch_size: 64
    target_update_freq: 1000
    buffer_size: 50000 
  
  ppo:
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    entropy_coef: 0.01
    clip_range: 0.2
    n_epochs: 4
    batch_size: 64 
    
  a2c:
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    entropy_coef: 0.01
    
  gating:
    learning_rate: 0.001
    update_mode: "reinforce"

training:
  total_timesteps: 50000
  device: "cuda"
  update_interval: 64
