# configs/deepscalper_prod_rtx5090.yaml

# 1. Environment & Data
env:
  symbol: "BTCUSDT"
  tick_size: 0.1
  lot_size: 0.001
  window_size: 50
  
  # Fees (Binance VIP 0)
  maker_fee: 0.0002
  taker_fee: 0.0005 
  
  initial_balance: 100000.0
  max_position: 10.0 # Increased for production scale
  num_envs: 12 # Reduced from 24 to prevent OOM

data:
  file_path: "/data/btc_lob_jan2023.parquet" # Remote Path
  ticker: "BTCUSDT"
  timeframe: "1m"

# 1.1 Reward Configuration
reward:
  type: "pnl"          
  scaling: 1e-4        
  hindsight_weight: 0.1  
  hindsight_horizon: 180 
  risk_penalty: 0.05     

# 2. Network Architecture
network:
  micro_config:
    input_size: 20
    hidden_size: 128
  macro_config:
    input_size: 11
    hidden_sizes: [128]
  fusion_dim: 256

# 3. Agent-Specific Configurations
agents:
  dqn:
    learning_rate: 0.0001
    gamma: 0.99
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.999995 # Very slow decay for 10M steps
    batch_size: 2048 # Reduced from 4096 for stability
    target_update_freq: 5000
    buffer_size: 1000000 # 1M Replay Buffer (~90GB RAM utilization)
  
  ppo:
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    entropy_coef: 0.01
    clip_range: 0.2
    n_epochs: 10
    batch_size: 2048
    
  a2c:
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    entropy_coef: 0.01
    
  gating:
    learning_rate: 0.001
    update_mode: "reinforce"

# 4. Global Training Settings
training:
  total_timesteps: 10000000 # 10 Million Steps
  device: "cuda"
  torch_compile: false # Enable PyTorch 2.0 optimization
  update_interval: 1024 # Larger update interval
  log_interval: 100
  checkpoint_interval: 100000
  save_freq: 100000 # Ensure consistent with checkpoint_interval
  max_checkpoints: 5 # Rolling retention
  seed: 42

wandb:
  project: "FinRL-Pro-DS"
  tags: ["rtx5090", "optimized", "v1.3", "no_compile"]
  mode: "online"
