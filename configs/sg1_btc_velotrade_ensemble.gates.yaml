# SG-1 BTC Velotrade ensemble confirmation gates — PRE-COMMITTED.
#
# Modeled on sg1_xauusd_ensemble.gates.yaml (S488) and
# gmgp1_xauusd_ensemble.gates.yaml (S493). Same five-gate structure; G4 is
# re-cast from FTMO (4%/8% daily+trailing) to Velotrade (10% trailing, no
# daily). This file is the ONLY source of truth for gate numbers (per
# project rule "never hardcode gate thresholds in code or scripts").
#
# Decision rule: ALL five gates (G1..G5) must PASS -> approve ensemble for
# SG-1 BTC Velotrade paper-deploy aggregation. ANY fail -> ensemble rejected;
# solo seed with highest WF-median PF remains the paper candidate.
#
# Pre-commit date: 2026-04-23 S494 cont. Do not edit after first launch
# without a decision memo explaining why.

workstream: sg1_btc
variant: ensemble_agreement_top3
seeds: [null, null, null]                       # top-3 L1 seeds, populated post-L1 by reconcile step
aggregation_rule: ens_agreement                  # canonical rule (S493 two-point evidence)

# Fold count expected from the multiseed WF config.
# Updated 2026-04-23 (S494 cont.) to match the new
# `configs/sg1_btc_velotrade_rehpo_wf_multiseed.yaml` splitter output: 8 folds
# (start 2025-01-06, end 2026-04-06, train=6/val=1/test=1/step=1). Old w1/w2/w3
# single-seed WF configs are frozen as reference history; this file now tracks
# the splitter-driven schedule that matches SG-1 XAUUSD Stage 3.
wf_folds: 8                                      # splitter-driven (was 3 pre-refactor)

# ---------------------------------------------------------------------------
# Gates
# ---------------------------------------------------------------------------

gates:
  g1_solo_baseline:
    description: >-
      Existing WF Stage-3 gate applied per seed: at least 2/3 seeds must have
      per-fold test PF >= pf_floor, in at least min_folds_pass of the total
      folds. If solo seeds fail the base WF discipline, the ensemble is moot.
    pf_floor: 1.1
    seeds_pass_min: 2                            # >=2/3 seeds pass per fold
    min_folds_pass: 7                            # >=7/8 folds (splitter-driven)

  g2_no_regression:
    description: >-
      Per fold, the ensemble must NOT materially regress vs the best solo on
      that fold. Defined as ens_PF >= ens_ratio_min * best_solo_PF in at least
      min_folds_pass folds.
    ens_ratio_min: 0.90
    min_folds_pass: 7                            # >=7/8 folds

  g3_uplift:
    description: >-
      Across folds, the ensemble must earn its live-complexity overhead.
      Defined as median(ens_PF) / median(best_solo_PF) >= uplift_ratio_min.
      A lift below ~10% is not worth the additional live-engine branching
      and aggregation latency (matches S493 Stage 2.5 PROMOTE threshold).
      v2.3 NOTE: this is the WF-stage point-estimate gate (across folds).
      Stage 2.5 (single L1 window) uses block-bootstrap when the
      ensemble_bootstrap_* keys below are also mirrored into the L1
      multiseed config's `gates:` block (currently legacy-uplift only).
    uplift_ratio_min: 1.10
    metric: median                               # across-folds aggregation

  # === Protocol v2.5 PRIMARY (S526): block-bootstrap probability gate. ===
  # Mirrors sg1_xauusd_ensemble.gates.yaml for cross-workstream parity. Cast
  # for Velotrade Step 1 (10% trailing cap, no daily-loss gate) so
  # PROMOTE_DD_ONLY here means "trailing-DD tightens enough to widen the 10%
  # buffer", not the FTMO daily/trailing pair. See
  # decision_protocol_v25_bootstrap_primary.md for the gate-ordering flip.
  ensemble_bootstrap_p_pf_promote: 0.90        # P(ens_PF > solo_PF) >= 0.90 for PROMOTE
  ensemble_bootstrap_p_mdd_promote: 0.90       # P(ens_MDD better) >= 0.90 for PROMOTE on DD channel
                                                #   (PF-pass + MDD-fail → PROMOTE on PF dominance;
                                                #    PF-fail + MDD-pass → PROMOTE_DD_ONLY for
                                                #    Velotrade trailing-DD buffer.)
  ensemble_bootstrap_p_pf_ambiguous: 0.75      # v2.5 ambiguous floor on P(PF). Below → SOLO;
                                                #   [floor, promote) + MDD-fail → AMBIGUOUS_BOOT.
  ensemble_bootstrap_resamples: 10000           # B in stationary block bootstrap
  ensemble_bootstrap_block_len: null            # null → auto = sqrt(n_bars), capped at 0.1*n

  # === Protocol v2.5 SECONDARY (audit/sanity only). ===
  ensemble_uplift_min: 1.10                     # legacy point-estimate (audit-only in v2.5)
  ensemble_ambiguous_min: 1.05                  # legacy ambiguous floor (audit-only in v2.5)

  # === Protocol v2.6 Stage 2.5-R Sensitivity Audit (S553, Phase α calibration) ===
  # See .agent/artifacts/protocol_v27_a_sensitivity_audit_architecture.md for design.
  # Phase α (S553+): keys present but sensitivity_audit_required=false → calibration phase.
  # Phase β (post-backfill): operator bumps protocol_version to '2.6' AND flips required=true.
  edge_stability_pf_ratio_floor: 0.70             # PRIMARY: pf_inner_min / pf_center >= floor
  sensitivity_deadband_grid: [0.20, 0.25, 0.30]   # 3-cell; center must match env.deadband_threshold
  sensitivity_max_leverage_mults: [0.5, 1.0, 1.5] # 3-cell; center = 1.0 (= deployed max_leverage)
  # sensitivity_deployable_max_leverage_cap: omitted → code defaults to deployed
  #   env.max_leverage (ADR-8), so the 1.5× cell is correctly non-deployable for
  #   workstreams deployed below 1.0. Set explicitly ONLY to widen coverage (e.g. IB GC/MGC).
  sensitivity_audit_required_min_deployable_neighbors: 4
  sensitivity_audit_required: false               # Phase α; flip true in Phase β after threshold locked

  # v2.3 diversity-aware top-K selection (Phase 0). Pearson |action correlation|
  # used as redundancy proxy. Pool-size > K is a precondition for the selector
  # to materially differ from naive top-K-by-PF; with pool == K it's audit-only.
  ensemble_top_k: 3
  ensemble_diversity_lambda: 1.0                # score = PF − λ * max_corr_with_already_selected

  g4_velotrade_compliance:
    description: >-
      Applied to the ENSEMBLE trajectory per fold (not the solo trajectories).
      Velotrade 2-Step Step 1: 10% profit target, 10% max trailing drawdown,
      no daily loss gate. Engine runs with buffered trailing (8%) so gate
      buffer is computed against the real Velotrade 10% cap.
    trailing_dd_buffer_pp_min: 0.5               # 10% cap - worst_trailing_mdd%
    daily_dd_buffer_pp_min: null                 # N/A: no daily loss gate in Velotrade 2-Step
    compliance_must_pass: false                  # no active_days / single_day_share in Velotrade
    min_folds_pass: 7                            # >=7/8 folds

  g5_dd_stability:
    description: >-
      Guards against ensemble edge being a one-fold artifact. CV of ensemble
      PF across folds must be at or below cv_max.
      Statistical strength OK at N=8 folds (splitter-driven, S494 refactor).
    cv_pf_max: 0.35

  # Protocol v2.2 §8.2 live action-distribution drift thresholds.
  # v2.6 (S551-cont-4): asymmetric blast-radius — deadband-wider,
  # saturation-tighter. Deadband drift up = policy went quiet (safe failure,
  # capital preserved); saturation drift up = policy went max-out (dangerous,
  # slippage + DD limits at risk). 5pp headroom over the 2026-05-26 historic
  # event signature (dead_delta=0.305) plus the feature_variance_veto
  # backstop. SCOPED TO sg1-btc until per-workstream audit (Step 4-FOLLOWUP)
  # calibrates the other 4 prop-firm gate YAMLs against their own baselines.
  # See decision_drift_two_failure_modes_s551_cont_3.
  #
  # BTC runs 24/7 3-min bars: window_bars=1000 ≈ 2.1 days continuous; revisit
  # if the SG-1 BTC live monitor proves too jittery.
  drift:
    window_bars: 1000
    min_bars_before_check: 500
    deadband_frac_warn: 0.15
    deadband_frac_crit: 0.35                    # v2.6 (was 0.30) — ADR-3 deadband headroom
    saturation_frac_warn: 0.10                  # v2.6 (was 0.15) — ADR-3 earlier saturation WARN
    saturation_frac_crit: 0.25                  # v2.6 (was 0.30) — ADR-3 tighter saturation CRIT
    action_kl_warn: 0.5                         # unused on V7 scalar, declared for schema
    action_kl_crit: 1.0                         # unused on V7 scalar, declared for schema
    regime_conditioning: true
    vol_estimator_bars: 20

    # v2.6 (S551-cont-4): feature-variance veto. ADR-1 (Mode B mitigation):
    # bars where engineered features are pathologically flat are excluded
    # from the deadband histogram. ADR-4: 'base' = finest scale (3min for
    # SG-1 BTC) which updates every bar — coarser scales' flatness is too
    # easily triggered by downsampling cadence. ADR-5: if rolling
    # flat_veto_frac > 0.50, escalate to WARN with operator hand-off to
    # scripts/recal_drift_baseline.py (Mode A possibility — needs a fresh
    # baseline rather than Mode B veto).
    feature_variance_veto:
      enabled: true
      scale: base
      max_veto_frac: 0.50

  # Protocol v2.2 §8.3 tiered safe-mode. CRIT must graceful-flatten (S491
  # bleed-window lesson), not "halt while holding".
  safe_mode:
    crit_triggers_flatten: true
    crit_repeat_window_hours: 24
    crit_repeat_count_before_lockout: 2

  # Protocol v2.3 §4.5 Stage 2.5-R retrain triggers. Each is a separate
  # auto-fire condition; any one trips a Stage 2.5-R rerun (re-pick top-K +
  # re-bootstrap + new ensemble_v{N+1}.tar.gz bundle). Bar-windows scale to
  # SG-1 BTC 5-min cadence (24/7): 2000 bars ≈ 7 days continuous, 5000 bars
  # ≈ 17 days. Live-PF window is in trading days for parity with the prop-
  # firm Velotrade rulebook; for 24/7 BTC the live monitor must convert to
  # calendar days at evaluation time.
  retrain:
    ensemble_recheck_days: 90                   # quarterly cadence
    live_pf_ratio: 0.8                          # live PF < 0.8 * paper PF
    live_pf_window_days: 5                      # for 5 consecutive trading days
    min_trades_window: 20                       # AND >=20 trades in window
    # Agreement-decay (silent capital starvation, ens_agreement only)
    agreement_decay_delta: 0.20                 # live flat-rate drift > +0.20 vs baseline
    agreement_decay_window_bars: 2000           # sustained for 2000 bars (~7 days at 5-min)
    # Action KL drift (sustained WARN before CRIT)
    action_kl_warn_window_bars: 5000
    # Cost drift
    cost_drift_ratio: 1.20                      # realized cost > 1.20x backtest assumption
    cost_drift_window_trades: 100               # over rolling 100 trades

  # Protocol v2.3 §8.2 agreement-decay live monitor (ensemble-deployed only).
  # No-op for ens_mean / ens_median / ens_pf_weighted (only consensus rules
  # have the silent-flat failure mode). Tracker compares live flat_bar_frac
  # against ensemble_eval_distribution.deadband_frac from ensemble_report.json.
  drift_agreement:
    enabled_for_rules: ["ens_agreement", "ens_majority"]
    flat_delta_warn: 0.20                       # |live_flat - baseline_flat| > 0.20 → WARN
    flat_delta_crit: 0.40                       # > 0.40 → CRIT (routes through §8.3 flatten)
    window_bars: 2000

# ---------------------------------------------------------------------------
# Decision matrix
# ---------------------------------------------------------------------------

decision:
  all_pass_action: approve_ensemble_paper_deploy
  any_fail_action: reject_ensemble_use_best_solo
  solo_selection_metric: wf_median_pf
  solo_tiebreaker: wf_mean_trailing_dd_buffer_pp

