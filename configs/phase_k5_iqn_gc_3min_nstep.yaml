# Phase K5: Gold CME IQN — N-Step + Gamma HPO + Q-Clip
# =====================================================
# Ablation: Value function improvements over K1 baseline.
# Changes from K1: n_step=3, gamma HPO [0.93, 0.999], target_q_clip=500
# Tests hypotheses: H26 (n-step), H27 (gamma HPO), H28 (Q-clip)
# Compare against K1 baseline to isolate value function effect.
#
# Gate: Test PF > 1.10 with >= 200 trades

data:
  file_path: "data/processed/gc_2025_3min_front.parquet"
  ticker: "GC"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-10-31 23:59:59"
  val_start_date:   "2025-11-01 00:00:00"
  val_end_date:     "2025-11-30 23:59:59"
  test_start_date:  "2025-12-01 00:00:00"
  test_end_date:    "2025-12-31 23:59:59"
  norm_cutoff_date: "2025-11-01 00:00:00"

features:
  n_levels: 1
  asset_class: "cme_futures"
  vol_norm_window: 40            # 40 x 3-min = 120 min

env:
  symbol: "GC"
  initial_balance: 100000.0
  margin_requirement: 0.05
  taker_fee: 0.000035            # 0.35 bps (CME Gold taker)
  maker_fee: 0.000010            # Not used in swing MDP
  num_envs: 24
  window_size: 15                # 15 x 3-min = 45 min lookback
  max_drawdown_pct: 0.30
  mdp_version: "v6"             # Swing MDP (SwingScalperEnv)
  episode_length: 1000           # ~50 hours of 3-min bars
  random_start: true

  reward:
    scaling: 1.0
    volatility_horizon: 20
    sharpe_weight: 0.0           # Pure PnL reward

  action:
    discrete_dims: 2             # {Long, Short}
    cooldown_bars: 3             # 3-bar (9 min) minimum hold after switch
    max_position: 5.0
    fixed_trade_qty: 0.2

network:
  micro_config:
    input_size: 18
    private_input_size: 4        # [direction, bars_since_switch, unrealized_pnl, atr]
    hidden_size: 256
    encoder_type: "flat"

  macro_config:
    input_size: 15
    hidden_sizes: [256, 128]

agents:
  iqn:
    type: iqn
    num_quantiles: 32
    embedding_dim: 64
    noisy_sigma0: 0.5
    quantile_huber_kappa: 1.0
    learning_rate: 0.0003
    gamma: 0.99                  # HPO will override this: [0.93, 0.999]
    tau: 0.005
    batch_size: 256
    buffer_size: 500000
    learning_starts: 5000
    use_per: false
    torch_compile: false
    gradient_clip: 10.0
    auxiliary_weight: 0.1
    update_interval: 8
    checkpoint_interval: 200000
    n_step: 3                    # NEW: Match cooldown_bars for direct credit assignment
    target_q_clip: 500.0         # NEW: 10x tighter than BDQ-era 5000

replay:
  stratified_sampling: false     # No Hold action to stratify against

training:
  total_timesteps: 5000000
  training_epochs: 1
  log_interval: 20480
  torch_compile: false
  use_amp: true
  use_shm: false
  verbose_logging: true

hpo:
  enabled: true
  n_trials: 5
  steps_per_trial: 500000

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["Gold", "GC", "IQN", "3min", "SwingMDP", "NoisyNet",
         "BinaryAction", "DenseReward", "CME", "FrontMonth",
         "k5", "nstep3", "gammaHPO", "qclip500"]
