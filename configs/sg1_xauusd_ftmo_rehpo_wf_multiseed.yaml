# SG-1 XAUUSD FTMO re-HPO — Stage 3 Walk-Forward, ENSEMBLE CONFIRMATION VARIANT
#
# Reconciled 2026-04-22 (S489 cont.) against OANDA-redo reality.
# The actual WF runs (parents wnsbv3ec / fz0mfvn0 / 0890x0s9) used seeds
# [42, 2025, 3141] chosen by the auto-chain poller from the L1 OANDA batch
# (not the in-sample top-3 [42, 789, 456] that lived in this file originally).
# The 24 fold checkpoints (3 seeds × 8 folds, 245.7 MB) already sit at
#   checkpoints/WF_seed{42,2025,3141}_fold_{00..07}_*/checkpoint_final.pth
# pulled via C:/tmp/pull_wf_checkpoints.py.
#
# Upstream:
#   - Stage 2 L1 multiseed OANDA PASS (N=10, median PF 1.367, CV 3.47%).
#   - Stage 3 WF PASS for all three seeds: 8/8 folds per seed at PF>=1.1,
#     median fold PFs 1.566 / 1.584 / 1.619, worst fold MDD -1.62%,
#     inter-seed CV(median PF) ~1.7%.
#
# Gate (pre-committed, lives in configs/sg1_xauusd_ensemble.gates.yaml):
#   G1 Solo baseline  : >=2/3 seeds PF>=1.1 per fold in >=7/8 folds
#   G2 No regression  : per-fold ens_PF >= 0.9 * best_solo_PF in >=7/8 folds
#   G3 Uplift         : median ens_PF / median best_solo_PF >= 1.10
#   G4 FTMO           : ensemble trajectory per-fold: dd buffers >=0.5pp + PASS
#   G5 DD stability   : CV(ens_PF) across folds <= 0.35
#   ALL PASS -> approve paper aggregation; ANY FAIL -> solo-best remains
#   (current solo-best fallback: seed 3141, median PF 1.619).
#
# Eval (no training; this config only drives splitter + ensemble block):
#   python scripts/sg1_xauusd_ensemble_eval.py \
#       --wf_config configs/sg1_xauusd_ftmo_rehpo_wf_multiseed.yaml \
#       --gates_file configs/sg1_xauusd_ensemble.gates.yaml \
#       --device cpu

data:
  # OANDA XAU_USD M1 mid — same file the WF runs were trained against, so the
  # splitter here reproduces the exact 8-fold windowing those checkpoints saw.
  file_path: "data/oanda/xauusd_m1_m.parquet"
  ticker: "XAUUSD"
  handler_type: "multiscale"
  # 8-fold coverage (Aug 2025 → Mar 2026 test windows):
  #   fold 0: train Jan–Jun 2025  val Jul 2025  test Aug 2025
  #   fold 1: train Feb–Jul 2025  val Aug 2025  test Sep 2025
  #   fold 2: train Mar–Aug 2025  val Sep 2025  test Oct 2025
  #   fold 3: train Apr–Sep 2025  val Oct 2025  test Nov 2025
  #   fold 4: train May–Oct 2025  val Nov 2025  test Dec 2025
  #   fold 5: train Jun–Nov 2025  val Dec 2025  test Jan 2026
  #   fold 6: train Jul–Dec 2025  val Jan 2026  test Feb 2026
  #   fold 7: train Aug 2025–Jan 2026  val Feb 2026  test Mar 2026
  start_date: "2025-01-06"
  end_date: "2026-04-15"

splitter:
  train_months: 6
  val_months: 1
  test_months: 1
  step_months: 1
  buffer_days: 0

features:
  scales: [3, 15, 60]
  window_size: 30
  features_per_scale: 8
  asset_class: "cfd_gold"

signal_gate:
  enabled: true
  gate_mode: "composite"
  atr_threshold: 0.35
  parkinson_threshold: 0.0107
  volume_threshold: 0.75
  max_hold_bars: 20
  gate_always_on_first: true
  normalize_accumulated_reward: true

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.000235                 # steady-state (S464)
  deadband_threshold: 0.35            # trial 56 + ensemble agreement classifier basis
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 1500
  random_start: true
  max_drawdown_pct: 0.10
  scales: [3, 15, 60]
  gap_detection: true
  gap_atr_mult: 3.0
  reward:
    mode: "dsr"
    dsr_eta: 0.009270901804613313     # trial 56
    dsr_scale: 1.0
  risk:
    enabled: true
    max_trailing_drawdown_pct: 0.08
    max_daily_loss_pct: 0.04
    eod_hour_utc: 21
    drawdown_penalty_start: 0.03
    drawdown_penalty_scale: 5.0
    augment_obs: "off"
    static_peak: true

network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

agents:
  sac:
    # Trial 56 HPs — identical to L1 multiseed + Stage-3 WF base config
    lr_actor: 0.0004328235879674501
    lr_critic: 0.000255518632525778
    lr_alpha: 0.0000027165537430202373
    gamma: 0.9887304528260698
    tau: 0.00586388344589006
    initial_alpha: 0.4297169729200557
    gradient_clip: 3.0464559724708105
    batch_size: 512
    buffer_size: 500000
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    checkpoint_interval: 250000

training:
  total_timesteps: 500000             # apples-to-apples with L1 + _wf.yaml
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: true
  num_envs: 20
  # seed: set per-run via CLI (--seed N); plan sweeps top-3 [42, 789, 456]

hpo:
  enabled: false

# Ensemble metadata — consumed by scripts/sg1_xauusd_ensemble_eval.py --wf_config
ensemble:
  seeds: [42, 2025, 3141]              # actual WF seeds (auto-chain pick from OANDA L1)
  # Checkpoint path pattern — glob resolves one match per (seed, fold):
  checkpoint_pattern: "checkpoints/WF_seed{seed}_fold_{fold:02d}_*/checkpoint_final.pth"
  # Aggregation rules evaluated per fold. Solos are built dynamically from
  # `seeds` above by the eval script, so solo_<seed> names track this list.
  rules: ["solo_42", "solo_2025", "solo_3141",
          "ens_mean", "ens_median", "ens_agreement", "ens_pf_weighted"]
  # Test PFs from the OANDA L1 seed_report (weights for ens_pf_weighted).
  seed_pfs:
    42:   1.4142
    2025: 1.4614
    3141: 1.4178
  # Pointer to pre-committed gate YAML:
  gates_file: "configs/sg1_xauusd_ensemble.gates.yaml"

gates:                                # Protocol v2 §4 Stage 3 (training-level)
  hpo_pf_floor: 1.2
  hpo_min_trials_completed: 30
  entropy_floor: 0.01
  q_div_max: 100.0
  action_sat_max: 0.9
  l1_seeds: 10
  l1_pf_cv_max: 0.30
  l1_pf_floor: 1.2
  l1_pf_cv_ambiguous: [0.22, 0.38]
  ensemble_uplift_min: 1.10           # S493 Stage 2.5: PROMOTE threshold (pre-committed)
  wf_windows: 4                       # validator requires >=4; config emits 6
  wf_pf_floor: 1.1
  ftmo_active_days_min: 4
  ftmo_max_single_day_share: 0.5
  ftmo_daily_dd_buffer_pp: 0.5
  ftmo_trailing_dd_buffer_pp: 0.5
  oos_pf_floor: 1.1

wandb:
  project: "FinRL-Pro-DS"
  consolidate: true                   # one parent run per seed; folds as win<i>/*
  tags: ["sg-1", "XAUUSD", "SAC", "3min", "signal-gated", "FTMO", "prop-firm",
         "rehpo-trial56", "walk_forward", "wf-stage3", "ensemble",
         "ensemble-confirm", "steady-state", "oanda-spot",
         "upstream:sg1_xauusd_ftmo_rehpo_wf_oanda"]
