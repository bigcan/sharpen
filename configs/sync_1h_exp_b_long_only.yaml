# Sync-1H Experiment B — Long-Only Mode
# Hypothesis: long-only removes funding drag + reduces DD in trending crypto (same 10 assets as Exp A for clean A/B)
# Base: synapse_crypto_1h_v2.yaml (v2.1.0, 12-month train window)
# Success criteria: OOS return > -8.80% (beat v3)

strategy:
  id: "sync-1H-exp-b"
  name: "sync_1h_exp_b_long_only"
  version: "2.1.0"
  base: "synapse_v9.5"
  instrument: "perpetual_futures"

universe:
  assets: ["BTC", "ETH", "SOL", "BNB", "XRP", "ADA", "AVAX", "DOGE", "DOT", "LINK"]
  quote: "USDT"
  data_exchange: "binance"
  execution_broker: "bybit"
  n_assets: 10

data:
  source: "ccxt"
  market_type: "futures"
  frequency: "1h"
  start_date: "2022-01-01"
  end_date: null  # rolling
  fields: ["open", "high", "low", "close", "volume"]
  extra_fields: ["funding_rate", "open_interest", "liquidations"]
  cache_dir: "./data/crypto_cache"

features:
  tech_window: 168
  norm_window: 720
  norm_clip: [-5, 5]
  log_return_clip: [-0.5, 0.5]
  tech_dim: 6
  enable_hmm: true
  hmm_stride: 5
  enable_crypto_features: true

environment:
  type: "perpetual_futures"
  initial_capital: 100000
  long_short_enabled: true
  long_only: true
  max_leverage: 1.0
  margin_mode: "cross"
  funding_alignment: "utc"
  maker_fee_pct: 0.0002
  taker_fee_pct: 0.0005
  slippage_model: "volume_dependent"
  slippage_base_bps: 3
  slippage_impact_bps: 15
  max_position_pct: 0.15
  max_gross_exposure: 1.0
  max_net_short_exposure: 0.0
  turnover_penalty: 0.01
  reward_type: "simple"
  sortino_window: 168
  reward_scaling: 1.0
  reward_clip_range: [-5.0, 5.0]
  min_trade_pct: 0.005
  circuit_breaker_threshold: 0.1
  action_ema_alpha: 0.3
  random_start: true
  random_start_pct: 0.1
  risk_manager:
    enabled_backtest: false
    enabled_paper: true
    enabled_live: true

agents:
  lean_trinity: ["sac", "a2c"]
  total_timesteps: 2000000
  n_envs: 24
  use_fp16: true
  use_torch_compile: true
  network_arch: [256, 256]

  sac:
    learning_rate: 1.0e-4
    buffer_size: 500000
    batch_size: 512
    gamma: 0.98
    tau: 0.005

  a2c:
    learning_rate: 3.0e-4
    n_steps: 24
    gamma: 0.98

hpo:
  enabled: true
  agents: ["sac"]
  n_trials: 50
  hpo_timesteps: 500000
  objective: "sortino"

arbitrator:
  method: "softmax"
  lookback_bars: 504
  temperature: 1.5
  min_weight: 0.15
  reweight_every: 24
  performance_metric: "sortino"
  emergency_lookback: 72
  emergency_sortino_floor: 0.3
  emergency_spread: 2.0

walk_forward:
  train_bars: 8760
  val_bars: 720
  test_bars: 1440
  step_bars: 720
  embargo_bars: 720
  min_windows: 1
  n_hpo_trials: 50
  hpo_timesteps: 500000

risk:
  max_drawdown_pct: 0.20
  circuit_breaker_cooldown_bars: 48
  max_gross_exposure: 1.0
  max_position_pct: 0.15
  max_net_short_exposure: 0.0
  daily_turnover_limit: 1.50
  daily_cost_budget_bps: 20
  flash_crash_threshold: 0.15
  flash_crash_min_assets: 5
  funding_rate_alert: 0.001
  max_cluster_exposure: 0.30
  min_effective_bets: 4
  min_margin_reserve_pct: 0.05
  correlation_window: 168
  correlation_cluster_threshold: 0.7

execution:
  broker: "bybit"
  data_source: "ccxt"
  order_type: "limit"
  limit_offset_pct: 0.0005
  market_fallback_timeout: 60
  min_trade_pct: 0.005
  reconciliation_interval: 300
  paper_trade: true
  bybit_testnet: true
  slippage_model_live: "book_depth"

model_staleness:
  enabled: true
  monitor_window_bars: 720
  retrain_trigger_sharpe: 0.5
  retrain_cooldown_bars: 2160

wandb:
  project: "FinRL-Pro-DS"
  tags: ["sync-1h-exp-b", "long-only"]

deployment:
  training_target: "gpuhub"
  collector_target: "vps"
  execution_target: "vps"
  docker_image: "synapse_crypto_1h:latest"
