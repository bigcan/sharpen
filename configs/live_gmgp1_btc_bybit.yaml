# Live Trading Config — GMGP1 SAC on BTC/USDT via Bybit (Velotrade contender)
# L1 multi-seed GATE PASS: seed-123 PF=2.19/Sharpe=3.97/DD=-1.88%, CV=1%
# HPs: T34 best from GMGP1-BTC HPO (run 8v4mueuf, PF=2.558)
# Checkpoint: L1 seed-123 (run 1jazzser)
#
# ---------------------------------------------------------------------------
# PROP-FIRM DECOUPLING (S495 Step 5, 2026-04-24).
# This file is the BASE config. Phase-varying DD/target/gates live in
# configs/deploy/velotrade/<phase>.yaml overlays (allowlist-enforced).
#
# Deploy invocations (resolved = this file + overlay):
#   python scripts/deploy_bare_metal.py --script scripts/run_live.py \
#     --config configs/live_gmgp1_btc_bybit.yaml --overlay velotrade/step1
#   python scripts/deploy_bare_metal.py --script scripts/run_live.py \
#     --config configs/live_gmgp1_btc_bybit.yaml --overlay velotrade/step2
#   python scripts/deploy_bare_metal.py --script scripts/run_live.py \
#     --config configs/live_gmgp1_btc_bybit.yaml --overlay velotrade/funded
#
# After Step 5 migration this BASE file alone is NOT paper-deployable
# (validator FAILs: `risk.static_peak` missing); pair with an overlay.
# ---------------------------------------------------------------------------
#
# Usage (legacy direct-invoke, superseded by --overlay above):
#   python scripts/run_live.py --config configs/live_gmgp1_btc_bybit.yaml

# --- Exchange ---
# 2026-05-02: Migrated Binance demo → Bybit testnet (replacing, not parallel).
# Soak clock for S495 Step 6 (≥30-live-day calendar gate before V7 deletion)
# RESETS at this cutover. Bybit testnet uses ccxt set_sandbox_mode(True) →
# api-testnet.bybit.com. Auth via BYBIT_TESTNET_API_KEY/SECRET env vars (see
# ExchangePerpBroker resolution at finrl_pro_ds/crypto/execution/exchange_perp_broker.py:114-122).
exchange:
  name: "bybit"                     # Bybit MAINNET DEMO TRADING (S527-cont; testnet abandoned — broken indexPrice + thin book)
  testnet: false                    # was true (S526 testnet) → false (S527-cont mainnet-demo cutover)
  demo: true                        # ccxt enable_demo_trading(True) → api-demo.bybit.com (real orderbook + simulated fills)
  asset: "BTC"
  leverage: 1
  order_type: "limit"
  limit_offset_pct: 0.0005         # Cross spread for immediate fill
  market_fallback_timeout: 60.0     # Seconds before limit → market fallback
  data_exchange: "bybit"            # OHLCV from Bybit testnet (matches execution venue)

# --- Agent ---
agent:
  checkpoint_path: "checkpoints/gmgp1-btc-l1-multiseed_20260407_070227/checkpoint_final.pth"
  device: "cpu"                     # CPU inference (Docker image is CPU-only PyTorch)
  torch_compile: false              # Must be false for live inference

# --- SAC Hyperparameters (T34 best — must match training checkpoint) ---
agents:
  sac:
    lr_actor: 0.00050182              # T34 best
    lr_critic: 0.000027779            # T34 best
    lr_alpha: 0.0000035704            # T34 best
    gamma: 0.97127                    # T34 best
    tau: 0.0038951                    # T34 best
    batch_size: 512
    buffer_size: 100
    initial_alpha: 0.49701            # T34 best
    gradient_clip: 3.0198             # T34 best

# --- Network (must match training checkpoint exactly) ---
network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

# --- Features (must match training config) ---
features:
  scales: [15, 60, 240]            # Timescales in minutes
  window_size: 30
  features_per_scale: 8
  norm_span: 120
  bootstrap_bars: 100000           # 240-min scale needs 360+ bars for EMA(120) convergence

# --- Bar Clock ---
bar_clock:
  base_interval_minutes: 15        # Trade every 15 minutes
  execution_delay_seconds: 5.0     # Wait after bar close for candle finalization
  max_late_seconds: 30.0           # Skip bar if more than 30s late

# --- Trading ---
trading:
  initial_balance: 50000.0         # Bybit MAINNET DEMO USDT (S527-cont mainnet-demo cutover; auto-funded ~50k coin USDT equity, totalWalletBalance ~100k; testnet path abandoned — broken indexPrice + thin book)
  deadband_threshold: 0.25         # Ignore position changes < 25%
  taker_fee: 0.00055               # Bybit futures taker fee

# --- Data source (validator Stage-0; ccxt live-fetch at runtime) ---
data:
  source: ccxt                     # Skip manifest gating — live fetch
  data_exchange: bybit             # api-testnet.bybit.com for OHLCV (matches exec venue)
  frequency: 15m
  ticker: "BTC/USDT"

# --- Hard Constraints (validator parity; mirrors trading.taker_fee) ---
env:
  taker_fee: 0.00055

# --- Risk Management (universal live safety; phase-varying keys come from overlay) ---
# Overlay owns: static_peak, eod_trailing_drawdown, eod_hour_utc,
# flatten_on_kill_file. See configs/deploy/velotrade/{step1,step2,funded}.yaml.
risk:
  enabled: true
  max_drawdown_pct: 0.08           # 8% hard stop (prop-firm safe, 2% buffer under 10% gate)
  circuit_breaker_cooldown_bars: 12 # 3 hours at 15-min bars
  max_position_pct: 1.0            # Single asset = 100% allowed
  funding_rate_alert: 0.001        # Alert if |rate| > 0.1% per 8h
  min_margin_reserve_pct: 0.10     # Keep 10% margin reserve
  daily_turnover_limit: 10.0       # S495 hotfix: CryptoRiskManager resets every 24 check() calls, not 24h; default 4.0 chokes 15-min sub-32%-decision-rate strategies. See project_live_turnover_cap_calibration_s495.md.
  # S535 canary Tier-1 (2026-05-06). Piecewise-linear taper across [0.8, 1.0]
  # of the daily turnover budget. Replaces hard-wall scaling that produced
  # gmgp1-btc's 10.91x cap-pinning (S519) and sg1-btc's 13h flat-line on
  # 2026-05-05. Default 1.0 disables taper (legacy preserved bit-identically).
  # See crypto_risk_manager.py:334-370 + commit 3b7d49b1.
  soft_throttle_start: 0.8

# --- WandB Monitoring ---
wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  tags: ["live", "paper", "gmgp1-btc", "BTC", "SAC", "15min", "bybit", "bybit-testnet", "velotrade", "l1-seed123", "venue-cutover-20260502"]
  run_id: "live-btc-bybit-testnet-paper-20260502"

# --- Safety ---
safety:
  require_explicit_mainnet: true    # Must pass --mainnet for live
  max_daily_loss_pct: 0.05          # 5% daily loss → hard stop
  kill_file: "/tmp/finrl_live_kill" # Touch this file to stop trading
  flatten_on_kill_file: true        # v2.2 §8.3 CRIT graceful flatten
  emergency_flatten_on_error: true  # Flatten all on unrecoverable error
  # E1 Step 0b: live-replay fixture capture for the signed-lots refactor.
  # Captures raw CCXT fetch_positions + fetch_balance JSONL for the next
  # capture_max_bars trading steps, then auto-closes. Default-off elsewhere;
  # enabled here for the 2026-04-27 00:00 UTC un-halt redeploy. Disable
  # (set false or remove) once the Tier-3 fixture is collected.
  capture_ccxt_raw_responses: true
  capture_max_bars: 96              # 96 × 15-min = 24h
  capture_dir: "/app/state"

# --- Protocol v2.2 §8.2 Live Action-Drift ---
# Baseline = Stage 2.5 ensemble-confirm backfill. Live checkpoint is L1
# multiseed seed-123 (gmgp1-btc-l1-multiseed_20260407_070227); Stage 2.5
# seed_report.json contains eval distributions for seeds 123, 456, 1337.
# Regenerate via scripts/backfill_eval_distribution_v22.py if checkpoint
# changes.
drift:
  enabled: true
  baseline_path: "/app/baselines/gmgp1_btc_stage_2_5/seed_report.json"
  baseline_seed: "123"
  window_bars: 1000
  min_bars_before_check: 500
  vol_estimator_bars: 20

# --- Protocol v2 Gates (paper-deploy requirement; mirrors §drift/§safe_mode) ---
gates:
  drift:
    window_bars: 1000
    min_bars_before_check: 500
    deadband_frac_warn: 0.15
    deadband_frac_crit: 0.30
    saturation_frac_warn: 0.15
    saturation_frac_crit: 0.30
    action_kl_warn: 0.5
    action_kl_crit: 1.0
    regime_conditioning: true
    vol_estimator_bars: 20
  safe_mode:
    crit_triggers_flatten: true
    crit_repeat_window_hours: 24
    crit_repeat_count_before_lockout: 2

# --- Retrain Policy (hybrid trigger + 12mo cap) ---
# Used by scripts/check_retrain_triggers.py — runs rolling OOS backtest, checks
# staleness, emits HOLD or trigger reason. Live DD checks are delegated to the
# live-monitor skill (broker is the source of truth).
retrain_policy:
  enabled: true
  last_trained_date: "2026-04-07"        # gmgp1-btc-l1-multiseed_20260407_070227
  staleness_cap_days: 365                # hard floor: force retrain after 12 months
  validation_pf_baseline: 2.19           # seed-123 Dec 2025 OOS PF
  oos_pf_floor_ratio: 0.70               # trigger if rolling-OOS PF < 0.70 × baseline (1.53)
  dd_trigger_ratio: 0.50                 # trigger if live DD > 0.50 × risk.max_drawdown_pct (4%)
  gate_window_days: 90                   # rolling OOS window length
  gate_lag_days: 1                       # end window at today − lag (avoid partial-day data)
  feature_drift_p_threshold: 0.01        # KS-test p-value floor (reported, secondary)
  feature_drift_ks_stat_threshold: 0.20  # PRIMARY trigger: max CDF gap ≥ 0.20 = practical regime shift
  backtest_config_ref: "configs/gmgp1_btc_l1_backtest_q1_2026.yaml"
  data_file_path: "data/bitfinex/btc_usdt_perp_2025_2026q1_1min.parquet"

# --- PRISM Regime Overlay (L2 position sizing) ---
prism:
  enabled: false                        # Set true to activate regime overlay
  base_url: "http://prism-api:8001"     # Docker DNS (inside finrl-net)
  api_key: ""                           # Empty = no auth (internal network)
  ticker: "BTC-USD"                     # PRISM ticker (yfinance format)
  timeframe: "daily"
  timeout: 5                            # API call timeout in seconds
  cache_ttl: 60                         # Seconds to cache regime result
  crisis_flatten: true                  # Flatten to 0 on BEARISH+HIGH_VOL
  multipliers:
    LOW_VOL: 1.3
    NORMAL_VOL: 1.0
    HIGH_VOL: 0.3

