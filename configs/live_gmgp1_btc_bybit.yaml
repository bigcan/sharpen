# Live Trading Config — GMGP1 SAC on BTC/USDT via Bybit (Velotrade contender)
# L1 multi-seed GATE PASS: seed-123 PF=2.19/Sharpe=3.97/DD=-1.88%, CV=1%
# HPs: T34 best from GMGP1-BTC HPO (run 8v4mueuf, PF=2.558)
# Checkpoint: L1 seed-123 (run 1jazzser)
#
# Usage:
#   python scripts/run_live.py --config configs/live_gmgp1_btc_bybit.yaml
#   python scripts/run_live.py --config configs/live_gmgp1_btc_bybit.yaml --mainnet
#   python scripts/run_live.py --config configs/live_gmgp1_btc_bybit.yaml --dry-run

# --- Exchange ---
exchange:
  name: "binance"                   # Binance demo trading (testnet deprecated for futures)
  testnet: false                    # Testnet deprecated — use demo instead
  demo: true                       # Uses demo-fapi.binance.com (paper trading)
  asset: "BTC"
  leverage: 1
  order_type: "limit"
  limit_offset_pct: 0.0005         # Cross spread for immediate fill
  market_fallback_timeout: 60.0     # Seconds before limit → market fallback
  data_exchange: "binance"          # Exchange for data fetching (higher limits)

# --- Agent ---
agent:
  checkpoint_path: "checkpoints/gmgp1-btc-l1-multiseed_20260407_070227/checkpoint_final.pth"
  device: "cpu"                     # CPU inference (Docker image is CPU-only PyTorch)
  torch_compile: false              # Must be false for live inference

# --- SAC Hyperparameters (T34 best — must match training checkpoint) ---
agents:
  sac:
    lr_actor: 0.00050182              # T34 best
    lr_critic: 0.000027779            # T34 best
    lr_alpha: 0.0000035704            # T34 best
    gamma: 0.97127                    # T34 best
    tau: 0.0038951                    # T34 best
    batch_size: 512
    buffer_size: 100
    initial_alpha: 0.49701            # T34 best
    gradient_clip: 3.0198             # T34 best

# --- Network (must match training checkpoint exactly) ---
network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

# --- Features (must match training config) ---
features:
  scales: [15, 60, 240]            # Timescales in minutes
  window_size: 30
  features_per_scale: 8
  norm_span: 120
  bootstrap_bars: 100000           # 240-min scale needs 360+ bars for EMA(120) convergence

# --- Bar Clock ---
bar_clock:
  base_interval_minutes: 15        # Trade every 15 minutes
  execution_delay_seconds: 5.0     # Wait after bar close for candle finalization
  max_late_seconds: 30.0           # Skip bar if more than 30s late

# --- Trading ---
trading:
  initial_balance: 10000.0         # Portfolio value for position sizing
  deadband_threshold: 0.25         # Ignore position changes < 25%
  taker_fee: 0.00055               # Bybit futures taker fee

# --- Risk Management (ENABLED for live) ---
risk:
  enabled: true
  max_drawdown_pct: 0.10           # 10% max drawdown (tighter than training 30%)
  circuit_breaker_cooldown_bars: 12 # 3 hours at 15-min bars
  max_position_pct: 1.0            # Single asset = 100% allowed
  funding_rate_alert: 0.001        # Alert if |rate| > 0.1% per 8h
  min_margin_reserve_pct: 0.10     # Keep 10% margin reserve

# --- WandB Monitoring ---
wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  tags: ["live", "paper", "gmgp1-btc", "BTC", "SAC", "15min", "bybit", "velotrade", "l1-seed123"]

# --- Safety ---
safety:
  require_explicit_mainnet: true    # Must pass --mainnet for live
  max_daily_loss_pct: 0.05          # 5% daily loss → hard stop
  kill_file: "/tmp/finrl_live_kill" # Touch this file to stop trading
  emergency_flatten_on_error: true  # Flatten all on unrecoverable error

# --- PRISM Regime Overlay (L2 position sizing) ---
prism:
  enabled: false                        # Set true to activate regime overlay
  base_url: "http://prism-api:8001"     # Docker DNS (inside finrl-net)
  api_key: ""                           # Empty = no auth (internal network)
  ticker: "BTC-USD"                     # PRISM ticker (yfinance format)
  timeframe: "daily"
  timeout: 5                            # API call timeout in seconds
  cache_ttl: 60                         # Seconds to cache regime result
  crisis_flatten: true                  # Flatten to 0 on BEARISH+HIGH_VOL
  multipliers:
    LOW_VOL: 1.3
    NORMAL_VOL: 1.0
    HIGH_VOL: 0.3
