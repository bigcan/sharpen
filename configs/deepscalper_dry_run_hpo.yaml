# DeepScalper Dry Run HPO Config

data:
  file_path: "data/btc_lob_jan2023.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2023-01-10 00:00:00"
  train_end_date: "2023-01-18 23:59:59"
  val_start_date: "2023-01-19 00:00:00"
  val_end_date: "2023-01-19 23:59:59"
  test_start_date: "2023-01-20 00:00:00"
  test_end_date: "2023-01-20 23:59:59"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  transaction_fee: 0.001
  num_envs: 4  # Small number for dry run
  window_size: 50
  max_drawdown_pct: 0.20
  reward:
    profit_weight: 1.0
    hindsight_weight: 0.1
    hindsight_horizon: 180
    volatility_horizon: 100
  action:
    direction_bins: 3 
    price_bins: 5     
    volume_bins: 5    
    max_position: 5.0

network:
  micro_config:
    input_size: 20
    private_input_size: 2
    hidden_size: 256
    rnn_type: "LSTM"
  macro_config:
    input_size: 11
    hidden_sizes: [256, 128]

agents:
  bdq:
    learning_rate: 0.0001
    gamma: 0.995
    auxiliary_weight: 1.0
    update_interval: 2 
    batch_size: 256
    buffer_size: 10000 # Small buffer
    target_update_freq: 100
    checkpoint_interval: 1000
    learning_starts: 100
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.99 
    exploration_fraction: 0.2

training:
  total_timesteps: 1000
  log_interval: 100
  torch_compile: true
  use_amp: true
  use_shm: false # Disable SHM for dry run to avoid issues

hpo:
  enabled: true
  n_trials: 1
  steps_per_trial: 100

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "offline" # Offline for dry run
  tags: ["DryRun", "FixVerification"]
