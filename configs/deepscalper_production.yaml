# DeepScalper Production Configuration
# Hardware: RTX 5090 + Core i9 (24 Envs)
# Strategy: Single BDQ with Hybrid Loss
# Status: Production (Phase 1: 1M Steps)

data:
  file_path: "data/btc_lob_jan2023.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2023-01-10 00:00:00"
  train_end_date: "2023-01-18 23:59:59"
  val_start_date: "2023-01-19 00:00:00"
  val_end_date: "2023-01-19 23:59:59"
  test_start_date: "2023-01-20 00:00:00"
  test_end_date: "2023-01-20 23:59:59"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  transaction_fee: 0.00005 
  num_envs: 24            # RTX 5090 + 25 CPU Cores (Spawn Safe)
  window_size: 50
  max_drawdown_pct: 0.20  # Tightened for Production (was 0.40 in Pilot)
  
  reward:
    profit_weight: 1.0
    hindsight_weight: 0.1     # Validated via HPO
    hindsight_horizon: 180    # Validated via HPO
    volatility_horizon: 100
    
  action:
    direction_bins: 3 
    price_bins: 5     
    volume_bins: 5    
    max_position: 5.0 

network:
  # Blackwell/Production Architecture
  micro_config:
    input_size: 20
    private_input_size: 2
    hidden_size: 256
    rnn_type: "LSTM"
  macro_config:
    input_size: 11
    hidden_sizes: [1024, 1024, 512] 

agents:
  bdq:
    learning_rate: 0.0001
    gamma: 0.995
    auxiliary_weight: 1.0
    update_interval: 2.0 
    batch_size: 256
    buffer_size: 2000000 
    target_update_freq: 7500
    checkpoint_interval: 100000 
    learning_starts: 5000
    exploration_fraction: 0.2
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.9998895 # Target ~1M steps for full decay
    
training:
  total_timesteps: 1000000  # 1M Steps (Phase 1)
  log_interval: 1000
  torch_compile: true
  use_amp: true
  use_shm: true

hpo:
  enabled: false

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["Production", "Phase1", "RTX5090", "SingleBDQ"]
