# configs/deepscalper_production.yaml

# 1. Environment & Data
env:
  symbol: "BTCUSDT"
  tick_size: 0.1
  lot_size: 0.001
  window_size: 50
  
  # Fees (Binance VIP 0)
  maker_fee: 0.0002
  taker_fee: 0.0005 
  
  initial_balance: 10000.0
  max_position: 5.0 # Allow larger position for production agent (was 1.0 in audit)

data:
  file_path: "/data/btc_lob_jan2023.parquet" # Remote Path
  ticker: "BTCUSDT"
  timeframe: "1m"

# 1.1 Reward Configuration
reward:
  type: "pnl"          
  scaling: 1e-4        
  hindsight_weight: 0.1  
  hindsight_horizon: 180 
  risk_penalty: 0.05     

# 2. Network Architecture (Verified)
network:
  micro_config:
    input_size: 20
    hidden_size: 128
  macro_config:
    input_size: 11
    hidden_sizes: [128]
  fusion_dim: 256 # Critical: Must be 256 to match standard heads

# 3. Agent-Specific Configurations
agents:
  dqn:
    learning_rate: 0.0001
    gamma: 0.99
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.99995 # Slower decay for long training
    batch_size: 128
    target_update_freq: 2000
    buffer_size: 200000
  
  ppo:
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    entropy_coef: 0.01
    clip_range: 0.2
    n_epochs: 10
    batch_size: 128
    
  a2c:
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    entropy_coef: 0.01
    
  gating:
    learning_rate: 0.001
    update_mode: "reinforce"

# 4. Global Training Settings
training:
  total_timesteps: 2000000 # 2 Million Steps
  device: "cuda"
  update_interval: 256
  log_interval: 100
  checkpoint_interval: 100000
  seed: 42

wandb:
  project: "FinRL-Pro-DS"
  tags: ["production", "full-scale", "v1.0"]
  mode: "online"
