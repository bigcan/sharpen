# Phase B8: BDQ + Disc3 + MLP + 5-Min Full-Year
# ============================================================
# Hypothesis: Disc(3) action space fixes the cold-start failure mode.
#
# Root cause from strategy_improvement_analysis.md (2026-02-21):
#   3 of 6 actions (MakerBuy, MakerSell, Cancel) are provably dead at 5-min
#   (oracle maker PF < 1.0). Agent wastes ~50% exploration budget on actions
#   that can NEVER be profitable. Disc(3) = {TakerBuy, Hold, TakerSell}.
#
# Ablation design:
#   B7: MLP + Disc6 (baseline — running)
#   B8: MLP + Disc3 (action space fix ONLY — this config)
#   B9: TCN + Disc3 (action space + encoder combined)
#
#   B7 vs B8 → measures pure effect of eliminating dead actions
#   B8 vs B9 → measures TCN encoder improvement on top of Disc3
#
# Expected effect: Effective exploration density doubles. Q-function no
# longer wastes capacity learning 3 actions are always worse than Hold.
# Cold-start period shortened significantly.
#
# Identical to B7 except: discrete_dims: 3

data:
  file_path: "data/processed/btc_2025_full_year_5min.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-10-31 23:59:59"
  val_start_date:   "2025-11-01 00:00:00"
  val_end_date:     "2025-11-30 23:59:59"
  test_start_date:  "2025-12-01 00:00:00"
  test_end_date:    "2025-12-31 23:59:59"
  norm_cutoff_date: "2025-11-01 00:00:00"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]
  vol_norm_window: 24      # 2h EMA context at 5-min (24×5min = 120min)

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  margin_requirement: 0.05    # 20x leverage (BTC futures)
  maker_fee: 0.0002
  taker_fee: 0.0005
  num_envs: 24
  window_size: 15
  max_drawdown_pct: 0.30
  private_state_augment_prob: 0.0

  reward:
    scaling: 1.0
    volatility_horizon: 20    # 20×5min = 100min
    sharpe_weight: 0.0
    dsr_scale: 100.0
    sharpe_horizon: 20
    hold_bonus_bps: 0.0

  action:
    discrete_dims: 3           # KEY CHANGE: {TakerBuy, Hold, TakerSell} only
    max_position: 5.0
    fixed_trade_qty: 0.2

  augmentation:
    enabled: false

network:
  micro_config:
    input_size: 30
    private_input_size: 5
    hidden_size: 256
    encoder_type: "mlp"        # MLP — same as B7 (isolate action space effect)
    window_size: 15

  macro_config:
    input_size: 15
    hidden_sizes: [256, 128]

agents:
  bdq:
    learning_rate: 0.0002
    gamma: 0.95                  # LOCKED — T1.2 signal horizon alignment
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay: 0.99999
    buffer_size: 500000
    batch_size: 512
    target_update_freq: 100
    tau: 0.005
    auxiliary_weight: 1.0
    use_per: true
    per_alpha: 0.6
    per_beta_start: 0.4
    per_beta_frames: 100000
    exploration_mode: "epsilon_greedy"
    update_interval: 1.0
    checkpoint_interval: 500000
    learning_starts: 10000

training:
  total_timesteps: 5000000
  training_epochs: 1
  log_interval: 20480
  torch_compile: true
  use_amp: true
  use_shm: false
  verbose_logging: true

hpo:
  enabled: true
  n_trials: 15
  steps_per_trial: 500000

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["BDQ", "Stage2", "PhaseB8", "5min", "FullYear", "Discrete3", "HPO", "MLP-V5",
         "NAV-reward", "candle-fill", "EpsilonGreedy", "83K-bars", "ActionAblation"]
