# DeepScalper Phase 6 Smoke Test Config
env:
  symbol: "BTCUSDT"
  tick_size: 0.1
  lot_size: 0.001
  window_size: 50
  maker_fee: 0.0002
  taker_fee: 0.0004
  max_position: 1.0

data:
  file_path: "data/btc_lob_demo.parquet"
  ticker: "BTCUSDT"

features:
  # Feature Eng Params
  rsi_window: 14

network:
  micro_config: 
    input_size: 20
    hidden_size: 64
  macro_config: 
    input_size: 11
    hidden_sizes: [64]

training:
  batch_size: 32
  total_timesteps: 1000
  learning_rate: 0.0001
  gamma: 0.99
  target_update_freq: 100
