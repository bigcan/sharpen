# ============================================================================
# TAILWIND-v1 CHALLENGE mode — TSMOM engine + BAB crash-hedge, sized for a
# prop-firm evaluation (FTMO / Velotrade 2-step). Sibling of configs/tailwind_v1.yaml.
# ============================================================================
# This is the CHALLENGE profile that the prop-firm P(pass) Monte-Carlo simulator
# resolved (docs/research/tailwind_v1_challenge_simulator_2026-07-02.md,
# results/tailwind_v1/challenge_sim.json). It is the SAME book as the own-capital
# tailwind_v1.yaml — both sleeves retained — LEVERED 1.5× and re-purposed from the
# Sharpe objective to the P(pass) objective.
#
# WHY THIS SHAPE (and why it INVERTS the original Fable review priors):
#   * Objective = P(hit the profit target BEFORE breaching max-DD OR the daily-loss
#     limit), NOT long-run Sharpe. Path-dependent, finite-horizon, asymmetric.
#   * FTMO and Velotrade BOTH have NO TIME LIMIT (✅ verified 2026-07-02,
#     configs/prop_firm_rules.yaml). With no deadline there is no time pressure, so
#     SURVIVAL dominates and P(pass) is MONOTONE-DECREASING in vol. The optimum is the
#     vol FLOOR, not a hot ceiling.
#   * KEEP BAB. max-DD is the binding constraint; the within-class BAB hedge cuts DD,
#     so it RAISES P(pass) at every vol (mom+BAB 0.746 vs mom-only 0.690, FTMO step1).
#     Dropping it (the review's original prior) only helps under a fixed short deadline.
#   * DON'T bank-and-derisk. Banking only helps when running hot; at low vol it just
#     adds timeouts.
#
# VOL CHOICE — 1.0× / 10% effective vol (RE-SIZED 2026-08-17; this file was 1.5× / 15%).
#   The original 1.5× choice traded P(pass) for SPEED: 0.711 vs 0.746, accepting a fatter
#   daily-breach rate to collapse a ~10% slow-drift timeout tail, on the reasoning that a
#   hidden inactivity rule might exist. **The forward-path render then REJECTED it** — that
#   trade is not available at an acceptable termination rate:
#     vol×   eff.vol  P(pass)  daily-breach  DD-breach  timeout   render
#     1.0    10%      0.746    0.034         0.120      0.099     CLEAR   <-- THIS FILE
#     1.5    15%      0.711    0.090         0.191      0.008     FLAGS (3 legs failed)
#     2.0    20%      0.633    0.165         0.201      0.000     —
#     3.0+   30%+     <0.55    0.267+        ...        daily-limit BINDS (do NOT run hot)
#   At 15% the render measured max DD −24.4%, 12 days past the 4% internal halt, and a
#   NEEDLESS-TERMINATION rate of 12.1% — one in eight otherwise-WINNING challenges thrown away
#   by our own kill. At 10%: DD −16.7%, daily-breach 0.0018, needless 5.0%. So 1.0× is not a
#   concession — it is both the P(pass) maximiser AND the only cell that survives the render.
#   The ~10% timeout tail is the accepted cost, and both firms have NO deadline (verified
#   2026-07-02), which is the load-bearing assumption that makes it acceptable.
#   Two-phase funded ≈ 0.65 per attempt at 1.0× (vs ≈0.60 at 1.5×).
#
# HOW THE SIZING IS REALISED — see the env: block below for the measured lever mapping.
#   Short version: `max_gross_exposure` is the ONLY lever that binds on real data
#   (executor vol ≈ 0.0334 × max_gross); `target_vol_asset` and `lev_cap` SATURATE against
#   real ETF vols and are effectively free. The previous "all three levers scaled 1.5×"
#   description was right by accident — it worked only because max_gross was one of the three.
#
# ⚠️ NOT A GREEN LIGHT TO ATTEMPT. This wires the vehicle; it does NOT authorise a live
# challenge. A real attempt spends the challenge fee + trades a funded account = capital,
# so it requires: (1) a Tier-2 deep-lifecycle audit of THIS book (the 2026-07-01 audit
# noted tailwind has no Stage-4 OOS artifact, P8-10), (2) a forward-path render to confirm
# the realised 15% effective vol + the risk kills in the .gates file, (3) operator
# go-ahead. deploy_gating stays false.
# ============================================================================

strategy:
  id: "tailwind-v1-challenge"
  name: "tailwind_tsmom_bab_challenge"
  version: "0.1.0"
  instrument: "multi_asset_allocator"
  mode: challenge                          # {own_capital (tailwind_v1.yaml), challenge (this file)}
  tier: research
  deploy_gating: false                     # NOT deploy-gating; an attempt requires Tier-2 + operator go-ahead

# ---------- UNIVERSE (identical to own-capital tailwind_v1.yaml; 5 equity / 3 rates /
# 5 commodity / 5 fx). Both sleeves trade this union. ----------
universe:
  assets: ["SPY", "QQQ", "IWM", "EFA", "EEM",       # equity
           "TLT", "IEF", "LQD",                      # rates
           "GLD", "SLV", "DBC", "USO", "DBA",        # commodity
           "UUP", "FXE", "FXY", "FXB", "FXA"]        # fx
  asset_class:
    SPY: equity
    QQQ: equity
    IWM: equity
    EFA: equity
    EEM: equity
    TLT: rates
    IEF: rates
    LQD: rates
    GLD: commodity
    SLV: commodity
    DBC: commodity
    USO: commodity
    DBA: commodity
    UUP: fx
    FXE: fx
    FXY: fx
    FXB: fx
    FXA: fx
  n_assets: 18

# ---------- SLEEVES (identical to own-capital; BAB RETAINED per the simulator) --------
sleeves:
  momentum:                                          # the return ENGINE (validated TSMOM core)
    assets: ["SPY", "QQQ", "IWM", "EFA", "EEM",
             "TLT", "IEF", "LQD",
             "GLD", "SLV", "DBC", "USO", "DBA",
             "UUP", "FXE", "FXY", "FXB", "FXA"]
    signal: tsmom
  defensive:                                         # the crash HEDGE (within-class BAB) — KEPT
    assets: ["SPY", "QQQ", "IWM", "EFA", "EEM",
             "TLT", "IEF", "LQD",
             "GLD", "SLV", "DBC", "USO", "DBA",
             "UUP", "FXE", "FXY", "FXB", "FXA"]
    signal: defensive
    beta_window: 252                                 # standard BAB trailing-beta horizon (LOCKED)
    min_periods: 126                                 # ~6m warmup floor before a beta is formed

# ---------- RISK-PARITY META-LAYER (IDENTICAL to own-capital — convex inverse-vol,
# target_portfolio_vol null. Kept null on purpose: the 1.5× lever is applied at the
# per-asset vol target below so the combine's composition is byte-unchanged.) ---------
risk_parity:
  trailing_window: 252
  min_periods: 63
  monthly_meta: true
  target_portfolio_vol: null                         # null = convex inverse-vol (leverage is applied per-asset)

# ---------- SLEEVE COMBINER (STATIC inverse-vol, identical to own-capital) ----------
sleeve_combiner:
  mode: inverse_vol        # {inverse_vol (default), dynamic}
  tilt_strength: 0.0       # 0.0 ⇒ exact inverse-vol
  perf_window: 126
  perf_min_periods: 63
  perf_metric: sharpe
  tilt_clip: 1.5

# ---------- DATA (identical) ----------
data:
  source: "yfinance_etf"
  frequency: "1d"
  start_date: "2006-01-01"
  end_date: null
  fields: ["open", "high", "low", "close", "volume"]
  cache_dir: "results/tailwind_v1"

# ---------- FEATURES (identical; LOCKED to the validated momentum core) ----
features:
  lookbacks: [63, 126, 252]
  skip: 5
  vol_window: 63
  include_baseline_weight: true

# ---------- ENV — RE-SIZED 2026-08-17 to the render-cleared 10% band ------------------
# WAS: target_vol_asset 0.15 / lev_cap 3.0 / max_gross 4.5, described as "the three vol levers
# scaled 1.5x". TWO things were wrong with that and both are now measured, not argued:
#
#   1. THE SIZING WAS REJECTED. The 2026-07-31 forward-path render FAILED that configuration on
#      three legs (needless-termination 12.1% > 5%, daily-breach 0.129 > 0.10, max gross
#      6.00 > 4.70) and measured <=10% effective vol as the clearing band.
#      docs/research/tailwind_v1_forward_path_render_2026-07-31.md
#
#   2. THE STATED MECHANISM WAS RIGHT BY ACCIDENT. "All three levers 1.5x => 1.5x vol" roughly
#      held (9.83% -> 14.13%) but ONLY because max_gross_exposure is one of the three. Measured
#      on the REAL 18-ETF bundle through TwoSleeveExecutor (5,176 steps, both sleeves live),
#      the other two SATURATE and contribute almost nothing:
#          target_vol_asset  0.05 -> 9.08%,  0.075 -> 9.66%,  0.10 -> 9.83%   (doubling = +8%)
#          lev_cap           1.0  -> 24.55%, 2.0   -> 26.47%, 3.0   -> 26.57% (cap off)
#          max_gross         1.0  -> 3.44%,  3.0   -> 9.83%,  4.5   -> 14.13% (LINEAR)
#      Real ETF vols span ~5-25%, so target_vol/sigma saturates against lev_cap on most names.
#      => executor realised vol ~= 0.0334 x max_gross_exposure; 10% needs max_gross ~= 2.99.
#      docs/research/tailwind_sizing_reconciliation_2026-08-01.md
#
# So the levers below are the MEASURED 9.83% row (target_vol 0.10, lev_cap 2.0, gross 3.0) —
# not an interpolation, and not a lever combination nobody has run. That row is numerically the
# own-capital tailwind_v1.yaml sizing: at 10% effective vol the challenge book and the
# own-capital book carry the SAME risk, and what still separates the two configs is the
# OBJECTIVE (P(pass) vs DSR, see the .gates file) and the prop_firm binding below — not leverage.
#
# ⚠️ The RESEARCH BASIS remains pinned at 6.92% whatever these say — portfolio_frontier.risk_parity
# discards scale by design (that is what makes its Sharpe/DSR leverage-invariant). That gap is NOT
# closable, only KNOWN; the mapping above is what lets the executor be set deliberately.
env:
  type: "multi_asset_allocator"
  initial_capital: 100000.0
  taker_fee: 0.0002                      # 2 bps (unchanged)
  slippage_base_bps: 1.0                 # (unchanged)
  slippage_impact_bps: 5.0               # (unchanged)
  target_vol_asset: 0.10                 # saturates on real ETF vols — effectively free
  lev_cap: 2.0                           # saturates — effectively free
  max_gross_exposure: 3.0                # THE BINDING LEVER: 0.0334 x 3.0 => 9.83% executor vol
  allow_short: true
  reward_type: "dsr"                     # reward shaping unchanged; the CHALLENGE objective is P(pass), enforced in .gates
  dsr_eta: 0.01
  turnover_penalty: 0.001
  min_trade_pct: 0.005
  circuit_breaker_threshold: 0.1
  random_start: false

# ---------- EXECUTION (rung-1 paper-sim; identical to own-capital) ------------------------------
execution:
  shadow: linear_core_tailwind           # momentum + defensive fund-of-funds (NOT rl)
  rung: paper_sim                        # {paper_sim, paper_ib}
  venue: none                            # rung-1; "ib" for rung-2
  rebalance_cadence: monthly             # MUST match gates.paper_soak.rebalance_cadence
  fill_reference: close

# ---------- RISK (v2 §8.3 paper-deploy contract) ------------------------------------------
# NUMERIC thresholds are NOT authored here — they live in the .gates file under
# `paper_soak.risk` (max_drawdown_kill_pct / daily_loss_halt_pct / max_gross_exposure),
# grounded in the ✅-verified FTMO/Velotrade hard limits. This block declares only the
# structural contract the live engine + watchdog read. Duplicating the numbers here would
# create a THIRD sizing mechanism alongside the research basis and the executor path — the
# exact defect the 2026-07-31 sizing reconciliation was opened to close.
risk:
  enabled: true
  # Both FTMO and Velotrade 2-step grade max-loss STATICALLY from the initial balance
  # (challenge_pass_gate.firm_hard_limits.dd_mode: static). Trailing peak applies only to a
  # funded account, which would declare `challenge.phase: funded` — this file is step-1/2.
  static_peak: true

# ---------- SAFETY (v2.2 §8.3 kill path) --------------------------------------------------
# The engine reads `safety.kill_file`; the watchdog reads the same path inside the container
# via exec_run. flatten_on_kill_file=true is mandatory for a prop-firm book: the §8.3 CRIT
# path must close positions, not "halt without close" (the S491 bleed-window case). On a
# challenge account an un-flattened book keeps accruing toward the daily-loss limit after
# the kill, which can fail the challenge from a state the operator believes is stopped.
safety:
  kill_file: "/tmp/tailwind_challenge_kill"
  flatten_on_kill_file: true
  emergency_flatten_on_error: true

# ---------- ACTION DRIFT (v2.2 §8.2) ------------------------------------------------------
# ⚠️ DECLARED, NOT YET CONSUMED ON THIS PATH. `ActionDriftTracker` is instantiated only in
# finrl_pro_ds/crypto/live/live_engine.py:140 (the RL live engine). The TAILWIND executor
# (finrl_pro_ds/paper/two_sleeve.py, driven by scripts/run_cross_asset_paper_validation.py)
# has NO tracker call site, so these keys satisfy the protocol contract but nothing enforces
# them at runtime yet. Wiring the consumer is a pre-attempt item for the Tier-2 audit — do
# not read a green validate_config as "drift monitoring is live".
#
# Window derivation (daily bars, monthly rebalance — NOT the 15-min RL defaults of 1000/500,
# which would be ~4y/2y here and could never arm inside a 90-day soak):
#   window_bars           252 = risk_parity.trailing_window (the horizon the book sizes off)
#   min_bars_before_check  63 = risk_parity.min_periods = sleeve_combiner.perf_min_periods
#                               (~3 months, matching paper_soak.min_soak_calendar_days: 90)
drift:
  enabled: true
  baseline_path: "results/tailwind_v1/drift_baseline.json"
  window_bars: 252
  min_bars_before_check: 63

# ---------- GATES (challenge-specific: P(pass) + firm-limit survival, NOT the own-capital
# DSR>=0.95 bar). ----------
# The decision/survival gates live in the .gates file below. The v2.2 §8.2/§8.3 drift +
# safe_mode THRESHOLDS are declared INLINE here because `check_drift_safemode_gates`
# (scripts/validate_config.py:884) reads `cfg["gates"]` directly and does NOT resolve
# `ensemble.gates_file` — unlike `check_gates_block`, which does. Same inline placement as
# configs/live_gmgp1_btc_bybit.yaml. `check_gates_block` merges both sources ("inline + file").
gates:
  drift:
    window_bars: 252                    # mirrors drift.window_bars above
    min_bars_before_check: 63           # mirrors drift.min_bars_before_check above
    deadband_frac_warn: 0.15            # project-wide v2.2 defaults; the validator enforces
    deadband_frac_crit: 0.30            # presence + warn<crit ordering, not the values
    saturation_frac_warn: 0.15
    saturation_frac_crit: 0.30
    action_kl_warn: 0.5
    action_kl_crit: 1.0
    # v2.6 amendment (decision_drift_two_failure_modes_s551_cont_3). Declared explicitly
    # rather than inherited so the two drift failure modes stay distinguishable.
    feature_variance_veto:
      enabled: true
      scale: base
      max_veto_frac: 0.50
  safe_mode:
    crit_triggers_flatten: true         # §8.3: CRIT flattens (consistent with safety above)
    crit_repeat_window_hours: 24
    crit_repeat_count_before_lockout: 2

ensemble:
  # RE-POINTED 2026-08-17 to the v2 (10% vol) gates. The v1 file
  # `configs/tailwind_v1_challenge.gates.yaml` is the byte-stable record of what was wired at
  # 1.5x AND what the forward-path render REJECTED — it is kept for provenance and must not be
  # pointed at again. Between 2026-07-31 and 2026-08-17 v2 existed but nothing referenced it, so
  # this config was certified by a render that had rejected its own sizing.
  gates_file: configs/tailwind_v1_challenge_v2.gates.yaml

# ---------- PROP-FIRM BINDING (the challenge is graded against these verified rule sets) ----
prop_firm:
  rules_file: configs/prop_firm_rules.yaml     # ✅ verified 2026-07-02 (FTMO + Velotrade 2-step, static DD, no deadline)
  simulator_report: docs/research/tailwind_v1_challenge_simulator_2026-07-02.md
  # ⚠️ THIS FIELD IS IN THE NATIVE-VOL FRAME. The render's A2 consistency check reads it as
  # `book_native_ann_vol × vol_multiplier` and requires the result to land within 0.005 of
  # `challenge_pass_gate.sizing.effective_vol_ann`. Native vol is 6.92%, so 10% needs 1.445.
  # Set to 1.45, matching the gates file.
  #
  # REGRESSION FIXED 2026-08-18 (Tier-2 P10-01). On 2026-08-17 this was changed 1.5 -> 1.0 to
  # match the SIMULATOR's frame, where the grid is swept on an already-normalised 10% base so
  # "1.0x" also means 10% vol. Both statements are true of different denominators — and the
  # comment here rationalised exactly that, which is precisely what A2 exists to forbid. The
  # render was last run BEFORE that edit, so `RENDER_CLEAR` was asserted in this file's header,
  # in MEMORY.md and in PR #8 while the wired config actually rendered RENDER_FLAGS on A2.
  # Do not re-introduce the simulator frame here; cite it in prose if needed, never in the key.
  vol_multiplier: 1.45                         # 0.0692 × 1.45 = 0.1003 ⇒ |Δ| 0.0003 < 0.005
  bank_and_derisk: false                       # simulator: do NOT bank at low vol
  # Mirrored from challenge_pass_gate.p_pass_expected in the .gates file — that file is the
  # source of truth. Re-derived 2026-08-17 by re-running run_challenge_simulator.py; model
  # outputs (results/tailwind_v1/challenge_sim.json), NOT guarantees.
  expected_p_pass:
    ftmo_step1: 0.746                          # 1.0x is the simulator's ARGMAX, not a compromise
    ftmo_step2: 0.870
    velotrade_step1: 0.746                     # == FTMO after the static-DD correction
    velotrade_step2: 0.870
    two_phase_per_attempt: 0.65                # 0.746 x 0.870 = 0.649

wandb:
  project: "FinRL-Pro-DS"
  consolidate: true
  tags: ["tailwind", "tsmom", "bab", "defensive", "two-sleeve", "allocator",
         "challenge", "prop-firm", "paper", "s553"]
