# Phase B7: BDQ + 5-Min + Full-Year Data
# ============================================================
# Hypothesis H2c: BDQ on 5-min bars with 83K training bars (2.7x B1 budget).
#
# Key design decisions:
#   - 5-min resolution: Oracle gate PF 1.24 (PASS). 1-min ceiling is 1.08 (FAIL).
#   - Full year: Jan-Oct train (83K bars), Nov val, Dec test.
#     30K bars (B1) was insufficient → 83K matches 1-min 4-month bar count.
#   - BDQ over PPO: Off-policy replay + epsilon-greedy avoids PPO exploration
#     death spiral (B1 had 0 trades in 18/20 HPO trials).
#   - HPO 500K steps/trial (not 200K — B1's budget was fatally short for 5-min).
#
# 5-min adaptations (from phase_b_5min_ppo.yaml):
#   - vol_norm_window: 24 (2h EMA at 5-min = 24×5min = 120min)
#   - volatility_horizon: 20 (20×5min = 100min, same real-time as 100×1min)
#   - sharpe_horizon: 20 (same logic)
#
# Oracle gate reference:
#   A6 taker PF: H1=1.241, H2=1.240 (regime-stable across full year)
#   Signal is taker-only — maker fill delay kills 5-min signal.

data:
  file_path: "data/processed/btc_2025_full_year_5min.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-10-31 23:59:59"
  val_start_date:   "2025-11-01 00:00:00"
  val_end_date:     "2025-11-30 23:59:59"
  test_start_date:  "2025-12-01 00:00:00"
  test_end_date:    "2025-12-31 23:59:59"
  norm_cutoff_date: "2025-11-01 00:00:00"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]
  vol_norm_window: 24      # 2h EMA context at 5-min (24×5min = 120min)

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  margin_requirement: 0.05    # 20x leverage (BTC futures)
  maker_fee: 0.0002
  taker_fee: 0.0005
  num_envs: 24
  window_size: 15
  max_drawdown_pct: 0.30
  private_state_augment_prob: 0.0

  reward:
    scaling: 1.0
    volatility_horizon: 20    # 20×5min = 100min (same real-time as 100×1min)
    sharpe_weight: 0.0
    dsr_scale: 100.0
    sharpe_horizon: 20
    hold_bonus_bps: 0.0

  action:
    discrete_dims: 6
    max_position: 5.0
    fixed_trade_qty: 0.2

  augmentation:
    enabled: false

network:
  micro_config:
    input_size: 30
    private_input_size: 5
    hidden_size: 256
    encoder_type: "mlp"
    window_size: 15

  macro_config:
    input_size: 15
    hidden_sizes: [256, 128]

agents:
  bdq:
    learning_rate: 0.0002
    gamma: 0.95                  # LOCKED — T1.2 signal horizon alignment
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay: 0.99999       # Overridden by HPO/trainer per step count
    buffer_size: 500000
    batch_size: 512
    target_update_freq: 100
    tau: 0.005
    auxiliary_weight: 1.0
    use_per: true
    per_alpha: 0.6
    per_beta_start: 0.4
    per_beta_frames: 100000
    exploration_mode: "epsilon_greedy"
    update_interval: 1.0
    checkpoint_interval: 500000
    learning_starts: 10000

training:
  total_timesteps: 5000000
  training_epochs: 1
  log_interval: 20480
  torch_compile: true
  use_amp: true
  use_shm: false
  verbose_logging: true

hpo:
  enabled: true
  n_trials: 15
  steps_per_trial: 500000       # 500K — NOT 200K (B1 PPO death spiral root cause)

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["BDQ", "Stage2", "PhaseB7", "5min", "FullYear", "Discrete6", "HPO", "MLP-V5", "NAV-reward", "candle-fill", "EpsilonGreedy", "83K-bars"]
