# Phase R.2.2: IQN Gold 5-min — Rehabilitation Re-Run
# ====================================================
# K3 Gold 5-min (PF=0.945) ran WITHOUT n_step=3 or multi_horizon.
# Session 97 proved n_step=3 is essential for IQN stability.
# This re-run adds n_step=3 + multi_horizon to the 5-min config.
#
# Key differences from K3:
#   - n_step: 3 (was missing — essential per Session 97)
#   - multi_horizon: true (dual gamma heads)
#   - target_q_clip: 500 (was missing)
#   - taker_fee: 0.0002 (2bps CME, was 0.35bps — Session 118 correction)
#   - 10 HPO trials (was 5)
#   - All known bugs fixed (37 across 7 audit rounds)
#
# Hypothesis: H34 — IQN Gold 5-min with n_step=3 achieves PF > 1.05
# Gate: Test PF > 1.10 with >= 200 trades
# Kill: PF < 0.98 after 2M steps

data:
  file_path: "data/processed/gc_2025_full_year_5min_front.parquet"
  ticker: "GC"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-10-31 23:59:59"
  val_start_date:   "2025-11-01 00:00:00"
  val_end_date:     "2025-11-30 23:59:59"
  test_start_date:  "2025-12-01 00:00:00"
  test_end_date:    "2025-12-31 23:59:59"
  norm_cutoff_date: "2025-11-01 00:00:00"

features:
  n_levels: 1
  asset_class: "cme_futures"
  vol_norm_window: 24            # 24 x 5-min = 120 min

env:
  symbol: "GC"
  initial_balance: 100000.0
  margin_requirement: 0.05
  taker_fee: 0.0002              # 2 bps (CME Gold all-in, Session 118)
  maker_fee: 0.000010            # Not used in swing MDP
  num_envs: 20                    # TC-OPT: RTX 4090 IPC limit (24 for RTX 5090)
  window_size: 15                # 15 x 5-min = 75 min lookback
  max_drawdown_pct: 0.30
  mdp_version: "v6"             # Swing MDP (SwingScalperEnv)
  episode_length: 600            # 600 x 5-min = 50 hours (same physical duration)
  random_start: true

  reward:
    scaling: 1.0
    volatility_horizon: 20
    sharpe_weight: 0.0           # Pure PnL reward

  action:
    discrete_dims: 2             # {Long, Short}
    cooldown_bars: 2             # 2-bar (10 min) — scaled from 3-min's 3-bar (9 min)
    max_position: 5.0
    fixed_trade_qty: 0.2

network:
  micro_config:
    input_size: 18
    private_input_size: 4        # [direction, bars_since_switch, unrealized_pnl, atr]
    hidden_size: 256
    encoder_type: "flat"

  macro_config:
    input_size: 15
    hidden_sizes: [256, 128]

agents:
  iqn:
    type: iqn
    num_quantiles: 32
    embedding_dim: 64
    noisy_sigma0: 0.5
    quantile_huber_kappa: 1.0
    learning_rate: 0.0003
    gamma: 0.99                  # Used as gamma_long when multi_horizon=true
    tau: 0.005
    batch_size: 512               # TC-OPT: better GPU saturation (was 256)
    buffer_size: 500000
    learning_starts: 5000
    use_per: false
    torch_compile: false            # IQN NoisyLinear incompatible with torch.compile (recompilation storms)
    gradient_clip: 10.0
    auxiliary_weight: 0.1
    update_interval: 8
    checkpoint_interval: 200000
    n_step: 3                    # KEY FIX: Was missing in K3 — essential per Session 97
    target_q_clip: 500.0         # KEY FIX: Was missing in K3
    multi_horizon: true          # KEY FIX: Dual value heads for short/long planning
    gamma_short: 0.95            # 20-bar momentum horizon (~100 min at 5-min)
    gamma_long: 0.99             # 100-bar strategic horizon (~8.3 hours at 5-min)
    horizon_alpha: 0.5           # Equal blend for action selection

replay:
  stratified_sampling: false

training:
  total_timesteps: 5000000
  training_epochs: 1
  log_interval: 20480
  torch_compile: false             # IQN NoisyLinear incompatible with torch.compile
  use_amp: true
  amp_dtype: "bfloat16"           # TC-OPT: more stable than fp16, native on Ada/Blackwell

hpo:
  enabled: true
  n_trials: 10
  steps_per_trial: 500000

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["Gold", "GC", "IQN", "5min", "SwingMDP", "NoisyNet",
         "BinaryAction", "DenseReward", "CME", "FrontMonth",
         "r2", "rehabilitation", "PhaseR", "nstep3", "multiHorizon",
         "dualGamma", "qclip500", "2bps"]
