# Phase R.2.3: IQN BTC 3-min — Rehabilitation Re-Run
# ====================================================
# K2 BTC 3-min (PF=0.767) ran with broken HPO pruner + no n_step.
# Two compounding bugs. This re-run adds all Session 67-97 improvements.
#
# Key differences from K2:
#   - n_step: 3 (was missing — essential per Session 97)
#   - multi_horizon: true (dual gamma heads)
#   - target_q_clip: 500 (was missing)
#   - 10 HPO trials with NopPruner (K2 had broken pruner killing good trials)
#   - All known bugs fixed (37 across 7 audit rounds)
#
# Hypothesis: H35 — IQN BTC 3-min with n_step=3 achieves PF > 1.05
# Oracle ceiling: PF 3.53 at 6.5bps (BTC 3-min, Session 109)
# Gate: Test PF > 1.10 with >= 200 trades
# Kill: PF < 0.98 after 2M steps

data:
  file_path: "data/processed/btc_bitfinex_2025_3min.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-10-31 23:59:59"
  val_start_date:   "2025-11-01 00:00:00"
  val_end_date:     "2025-11-30 23:59:59"
  test_start_date:  "2025-12-01 00:00:00"
  test_end_date:    "2025-12-31 23:59:59"
  norm_cutoff_date: "2025-11-01 00:00:00"

features:
  n_levels: 1
  asset_class: "crypto"
  vol_norm_window: 40            # 40 x 3-min = 120 min

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  margin_requirement: 0.05
  taker_fee: 0.0005              # 5 bps (Binance VIP-0 taker)
  maker_fee: 0.0002              # Not used in swing MDP
  num_envs: 20                    # TC-OPT: RTX 4090 IPC limit (24 for RTX 5090)
  window_size: 15                # 15 x 3-min = 45 min lookback
  max_drawdown_pct: 0.30
  mdp_version: "v6"             # Swing MDP (SwingScalperEnv)
  episode_length: 1000           # ~50 hours of 3-min bars
  random_start: true

  reward:
    scaling: 1.0
    volatility_horizon: 20
    sharpe_weight: 0.0           # Pure PnL reward

  action:
    discrete_dims: 2             # {Long, Short}
    cooldown_bars: 3             # 3-bar (9 min) minimum hold after switch
    max_position: 5.0
    fixed_trade_qty: 0.2

network:
  micro_config:
    input_size: 18
    private_input_size: 4        # [direction, bars_since_switch, unrealized_pnl, atr]
    hidden_size: 256
    encoder_type: "flat"

  macro_config:
    input_size: 15
    hidden_sizes: [256, 128]

agents:
  iqn:
    type: iqn
    num_quantiles: 32
    embedding_dim: 64
    noisy_sigma0: 0.5
    quantile_huber_kappa: 1.0
    learning_rate: 0.0003
    gamma: 0.99                  # Used as gamma_long when multi_horizon=true
    tau: 0.005
    batch_size: 512               # TC-OPT: better GPU saturation (was 256)
    buffer_size: 500000
    learning_starts: 5000
    use_per: false
    torch_compile: false            # IQN + NoisyLinear incompatible with torch.compile
    gradient_clip: 10.0
    auxiliary_weight: 0.1
    update_interval: 8
    checkpoint_interval: 200000
    n_step: 3                    # KEY FIX: Was missing in K2 — essential per Session 97
    target_q_clip: 500.0         # KEY FIX: Was missing in K2
    multi_horizon: true          # KEY FIX: Dual value heads for short/long planning
    gamma_short: 0.95            # 20-bar momentum horizon (~60 min at 3-min)
    gamma_long: 0.99             # 100-bar strategic horizon (~5 hours at 3-min)
    horizon_alpha: 0.5           # Equal blend for action selection

replay:
  stratified_sampling: false

training:
  total_timesteps: 5000000
  training_epochs: 1
  log_interval: 20480
  torch_compile: false             # IQN + NoisyLinear incompatible with torch.compile
  use_amp: true
  amp_dtype: "bfloat16"           # TC-OPT: more stable than fp16, native on Ada/Blackwell

hpo:
  enabled: true
  n_trials: 10
  steps_per_trial: 500000

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["BTC", "Bitfinex", "IQN", "3min", "SwingMDP", "NoisyNet",
         "BinaryAction", "DenseReward", "Crypto",
         "r3", "rehabilitation", "PhaseR", "nstep3", "multiHorizon",
         "dualGamma", "qclip500", "5bps"]
