# Phase C1: BDQ 5-Min Full-Year — Seed 42 (Multi-seed validation)
# ============================================================
# Hypothesis: B7's best HPs are stable across initializations.
# Phase C = 3 independent runs with identical HPs to measure variance.
# Gating condition: B7 passed oracle gate (Sharpe > 0, trades > 200).
#
# B7 best trial (#8): HPO PF = 0.8063
# HPs directly embedded — HPO disabled.
#
# Seed labeling convention: runs diverge from different OS entropy.
# Deploy C1 first on whichever GPU slot frees after B7 completes.

data:
  file_path: "data/processed/btc_2025_full_year_5min.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-10-31 23:59:59"
  val_start_date:   "2025-11-01 00:00:00"
  val_end_date:     "2025-11-30 23:59:59"
  test_start_date:  "2025-12-01 00:00:00"
  test_end_date:    "2025-12-31 23:59:59"
  norm_cutoff_date: "2025-11-01 00:00:00"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]
  vol_norm_window: 24      # 2h EMA context at 5-min (24×5min = 120min)

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  margin_requirement: 0.05    # 20x leverage (BTC futures)
  maker_fee: 0.0002
  taker_fee: 0.0005
  num_envs: 24
  window_size: 15
  max_drawdown_pct: 0.30
  private_state_augment_prob: 0.0

  reward:
    scaling: 1.0
    volatility_horizon: 20
    sharpe_weight: 0.0
    dsr_scale: 100.0
    sharpe_horizon: 20
    hold_bonus_bps: 0.0

  action:
    discrete_dims: 6
    max_position: 5.0
    fixed_trade_qty: 0.2

  augmentation:
    enabled: false

network:
  micro_config:
    input_size: 30
    private_input_size: 5
    hidden_size: 256
    encoder_type: "mlp"
    window_size: 15

  macro_config:
    input_size: 15
    hidden_sizes: [256, 128]

agents:
  bdq:
    # B7 Trial #8 best hyperparameters (HPO PF=0.8063)
    learning_rate: 7.851504189403355e-05
    gamma: 0.95                          # LOCKED — T1.2 signal horizon alignment
    epsilon_start: 1.0
    epsilon_end: 0.034421412859650634
    epsilon_decay: 0.99999
    buffer_size: 500000
    batch_size: 1024
    target_update_freq: 100
    tau: 0.006741204610702764
    auxiliary_weight: 0.5510508262967152
    use_per: true
    per_alpha: 0.6
    per_beta_start: 0.4
    per_beta_frames: 100000
    exploration_mode: "epsilon_greedy"
    update_interval: 1.0
    checkpoint_interval: 500000
    learning_starts: 10000

training:
  total_timesteps: 5000000
  training_epochs: 1
  log_interval: 20480
  torch_compile: true
  use_amp: true
  use_shm: false
  verbose_logging: true

hpo:
  enabled: false    # HPO disabled — using B7 best HPs directly

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["BDQ", "Stage2", "PhaseC", "5min", "FullYear", "Discrete6", "NoHPO", "MLP-V5",
         "NAV-reward", "candle-fill", "EpsilonGreedy", "83K-bars", "Seed42", "B7-bestHPs"]
