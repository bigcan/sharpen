# Phase H2: Bitfinex BTC/USDT Perpetual — Leverage-Aware Sizing
# =============================================================
# Builds on Phase H (zero-fee Bitfinex) with position sizing as an action.
# The agent learns WHEN and HOW MUCH to trade via BDQ branching:
#   Branch 0 (size):      4 levels — 0.25x, 0.5x, 1x, 2x of base qty
#   Branch 1 (direction): 3 levels — TakerBuy, Hold, TakerSell
#
# Key insight: at 52.8% AUC, fixed-size trading is net negative due to
# 1 bps median spread. But Kelly-optimal variable sizing (bet big when
# spread is tight + signal is strong) can flip breakeven.
#
# Changes from Phase H (phase_h_bitfinex_btc_dev.yaml):
#   - margin_requirement: 0.01 (100x leverage headroom, was 0.05)
#   - Action: MultiDiscrete([4, 3]) — size × direction (was Discrete(3))
#   - private_input_size: 6 (+spread_bps for spread-conditioned sizing)
#   - include_spread: true (feeds live BBO spread into private state)
#
# IMPORTANT: This config uses SYNTHESIZED bid/ask from OHLCV.
# For real LOB features, need Tardis.dev or self-collected WebSocket data.
#
# Splits: Jan-Oct train, Nov val, Dec test (same as all 2025 configs)
# norm_cutoff_date: 2025-11-01 (LEAK-1 compliant)

data:
  file_path: "data/processed/btc_bitfinex_2025_full_year_5min.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-10-31 23:59:59"
  val_start_date:   "2025-11-01 00:00:00"
  val_end_date:     "2025-11-30 23:59:59"
  test_start_date:  "2025-12-01 00:00:00"
  test_end_date:    "2025-12-31 23:59:59"
  norm_cutoff_date: "2025-11-01 00:00:00"  # LEAK-1: EMA-Z reset at train/val boundary

features:
  n_levels: 1                 # OHLCV-derived L1 only (no real LOB from Bitfinex)
  asset_class: "crypto"       # funding_sin/cos (crypto 24/7 market)
  include_spread: true        # H2: Feed BBO spread into private state
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]
  vol_norm_window: 24

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  margin_requirement: 0.01    # 100x leverage headroom (was 0.05)
  maker_fee: 0.0              # Bitfinex zero-fee model (since Dec 17, 2025)
  taker_fee: 0.0              # Bitfinex zero-fee model
  num_envs: 4                 # Fast local dev
  window_size: 15
  max_drawdown_pct: 0.30

  reward:
    scaling: 1.0
    volatility_horizon: 20
    sharpe_weight: 0.0
    # No hindsight (BUG-03 compliant)

  action:
    # H2: Direction × Size branching for leverage-aware sizing
    direction_dims: 3          # TakerBuy=0, Hold=1, TakerSell=2
    size_dims: 4               # 4 position size levels
    size_multipliers: [0.25, 0.5, 1.0, 2.0]  # Relative to fixed_trade_qty
    max_position: 5.0
    fixed_trade_qty: 0.2       # Base trade qty (1x = 0.2 * 5.0 = 1.0 BTC)

network:
  micro_config:
    input_size: 18             # Level-1 features (same dim as Gold L1)
    private_input_size: 6      # H2: pos, bal, time, order_dir, order_dist, spread_bps
    hidden_size: 256
    encoder_type: "flat"       # Flat MLP (no LSTM without real LOB temporal data)

  macro_config:
    input_size: 15
    hidden_sizes: [256, 128]

agents:
  bdq:
    learning_rate: 0.0001
    gamma: 0.95
    auxiliary_weight: 1.0
    update_interval: 2.0
    batch_size: 1024
    buffer_size: 2000000
    target_update_freq: 7500
    checkpoint_interval: 100000
    learning_starts: 5000
    exploration_fraction: 0.2
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.999908
    use_per: true
    per_alpha: 0.6
    per_beta_start: 0.4
    per_beta_frames: 100000

training:
  total_timesteps: 50000      # Fast dev (50K)
  log_interval: 10000
  torch_compile: true
  use_amp: true
  use_shm: false

hpo:
  enabled: true
  n_trials: 5
  steps_per_trial: 10000

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["BTC", "Bitfinex", "PhaseH2", "Dev", "ZeroFee", "Leverage", "MultiDiscrete"]
