# Phase G: Gold (GC) Asset Pivot — Dev Config
# =============================================
# Gold CME futures with Level-1-only LOB data.
# 14x cheaper fees than BTC Binance (0.35 bps taker vs 5 bps).
# Session 17 proof: RF AUC=0.6147 val / 0.5542 test, +11.15% from LOB.
#
# Key differences from BTC configs:
#   - n_levels: 1 (Level-1 LOB only → 18 micro dims)
#   - asset_class: cme_futures (dow_sin/cos instead of funding_sin/cos)
#   - maker_fee: 0.1 bps, taker_fee: 0.35 bps (CME Gold)
#   - discrete_dims: 3 (Taker-only: Buy/Hold/Sell)
#   - encoder_type: flat (no LSTM needed for Level-1)
#
# Splits: Jan-Oct train, Nov val, Dec test
# norm_cutoff_date: 2025-11-01 (LEAK-1 compliant)

data:
  file_path: "data/processed/gc_2025_full_year_5min.parquet"
  ticker: "GC"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-10-31 23:59:59"
  val_start_date:   "2025-11-01 00:00:00"
  val_end_date:     "2025-11-30 23:59:59"
  test_start_date:  "2025-12-01 00:00:00"
  test_end_date:    "2025-12-31 23:59:59"
  norm_cutoff_date: "2025-11-01 00:00:00"  # LEAK-1: EMA-Z reset at train/val boundary

features:
  n_levels: 1                 # Level-1 LOB only (Gold CME)
  asset_class: "cme_futures"  # dow_sin/cos instead of funding_sin/cos
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]
  vol_norm_window: 24         # 2h EMA context at 5-min

env:
  symbol: "GC"
  initial_balance: 100000.0
  margin_requirement: 0.05    # 20x leverage (CME Gold futures)
  maker_fee: 0.000010         # 0.1 bps (CME Gold)
  taker_fee: 0.000035         # 0.35 bps (CME Gold) — 14x cheaper than BTC
  num_envs: 4                 # Fast local dev
  window_size: 15
  max_drawdown_pct: 0.30

  reward:
    scaling: 1.0
    volatility_horizon: 20    # 20×5min = 100min
    sharpe_weight: 0.0
    # No hindsight (BUG-03 compliant)
    # hindsight_weight defaults to 0.0

  action:
    discrete_dims: 3           # Taker-only: {TakerBuy, Hold, TakerSell}
    max_position: 5.0          # 5 contracts (~$1.75M notional)
    fixed_trade_qty: 0.2       # 1 contract per trade (0.2 × 5.0)

network:
  micro_config:
    input_size: 18             # Level-1 only: 18 micro features
    private_input_size: 5      # Tier 2: pos, bal, time, order_dir, order_dist
    hidden_size: 256
    encoder_type: "flat"       # Flat MLP (no LSTM needed for Level-1)

  macro_config:
    input_size: 15             # Same count: dow replaces funding
    hidden_sizes: [256, 128]

agents:
  bdq:
    learning_rate: 0.0001
    gamma: 0.95
    auxiliary_weight: 1.0
    update_interval: 2.0
    batch_size: 1024
    buffer_size: 2000000
    target_update_freq: 7500
    checkpoint_interval: 100000
    learning_starts: 5000
    exploration_fraction: 0.2
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.999908
    use_per: true
    per_alpha: 0.6
    per_beta_start: 0.4
    per_beta_frames: 100000

training:
  total_timesteps: 50000      # Fast dev (50K)
  log_interval: 10000
  torch_compile: true
  use_amp: true
  use_shm: false

hpo:
  enabled: true
  n_trials: 5
  steps_per_trial: 10000

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["Gold", "GC", "PhaseG", "Dev", "Level1", "CME", "Discrete3"]
