# Phase B13: BDQ + Disc3 + TCN + DQfD + Inventory Penalty + 5-Min Full-Year
# ======================================================================
# Hypothesis: Explicit inventory penalty reduces "always in market" behavior.
#
# Root cause being addressed: B5 showed 99% market exposure (position held
# almost every step). Without penalty for holding, agent learns "stay in market"
# because the expected NAV delta of holding a position > 0 due to BTC uptrend.
# This produces churning and prevents selective entry/exit.
#
# Fix: Add inventory_penalty_bps = 0.5 — agent pays 0.5 bps per step while
# holding any position. At 5-min bars, holding 1 hour = 12 steps × 0.5 = 6 bps.
# This is calibrated to be meaningful vs oracle alpha (~24 bps/trade) but not
# so large that all positions are immediately closed.
#
# Ablation design vs B11:
#   B11: DQfD + TCN + Disc3 + FeeCurr   (graduated fee difficulty)
#   B13: DQfD + TCN + Disc3 + InvPen    (inventory penalty, static fees)
#
#   B11 vs B13 -> different cold-start remedies: fee ramp vs position cost
#
# Ref: Research Compendium Part III §2 — inventory penalties for market making
# Ref: strategy_improvement_analysis.md — B5 99% market exposure observation

data:
  file_path: "data/processed/btc_2025_full_year_5min.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-10-31 23:59:59"
  val_start_date:   "2025-11-01 00:00:00"
  val_end_date:     "2025-11-30 23:59:59"
  test_start_date:  "2025-12-01 00:00:00"
  test_end_date:    "2025-12-31 23:59:59"
  norm_cutoff_date: "2025-11-01 00:00:00"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]
  vol_norm_window: 24      # 2h EMA context at 5-min (24×5min = 120min)

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  margin_requirement: 0.05    # 20x leverage (BTC futures) - CRITICAL: do not change
  maker_fee: 0.0002           # 2bps (static)
  taker_fee: 0.0005           # 5bps (static — real Binance VIP-0)
  num_envs: 24
  window_size: 15
  max_drawdown_pct: 0.30
  private_state_augment_prob: 0.0

  reward:
    scaling: 1.0
    volatility_horizon: 20    # 20×5min = 100min
    sharpe_weight: 0.0
    dsr_scale: 100.0
    sharpe_horizon: 20
    hold_bonus_bps: 0.0
    inventory_penalty_bps: 0.5  # NEW: 0.5 bps/step penalty for holding position

  action:
    discrete_dims: 3           # {TakerBuy, Hold, TakerSell} only
    max_position: 5.0
    fixed_trade_qty: 0.2

  augmentation:
    enabled: false

network:
  micro_config:
    input_size: 40             # 30 base + 10 fev3 (defaults 0.0 if not in parquet)
    private_input_size: 5
    hidden_size: 256
    encoder_type: "tcn"        # TCN — same as B9/B10/B11
    window_size: 15
    tcn_channels: [64, 64, 128]  # RF = 1+(2*1)+(2*2)+(2*4) = 15 = window_size
    kernel_size: 3
    dropout: 0.1

  macro_config:
    input_size: 15
    hidden_sizes: [256, 128]

agents:
  bdq:
    # B10 Trial 0 best hyperparameters (frozen — ablation of inventory penalty only)
    learning_rate: 0.000446    # lr=4.46e-4
    gamma: 0.95                # LOCKED — T1.2 signal horizon alignment
    epsilon_start: 1.0
    epsilon_end: 0.024         # eps_end=0.024 from B10 best trial
    epsilon_decay: 0.99999
    buffer_size: 500000
    batch_size: 256            # batch=256 from B10 best trial
    target_update_freq: 100
    tau: 0.00114               # tau=1.14e-3 from B10 best trial
    auxiliary_weight: 0.755    # aux_weight=0.755 from B10 best trial
    use_per: true
    per_alpha: 0.6
    per_beta_start: 0.4
    per_beta_frames: 100000
    exploration_mode: "epsilon_greedy"
    update_interval: 1.0
    checkpoint_interval: 500000
    learning_starts: 10000
    demo_seed_steps: 20000     # DQfD warm-start: 20K×24 envs = 480K demo transitions

training:
  total_timesteps: 5000000
  training_epochs: 1
  log_interval: 20480
  torch_compile: false          # Disabled — segfaults on RTX 5090 + CUDA 13.0 driver
  use_amp: true
  use_shm: false
  use_sync: true               # Force SyncVectorEnv — required for env.call("set_fees")
  verbose_logging: true

hpo:
  enabled: false               # No HPO — B10 HPs frozen, testing inventory penalty effect only

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["BDQ", "Stage2", "PhaseB13", "5min", "FullYear", "Discrete3", "NoHPO", "TCN",
         "NAV-reward", "candle-fill", "EpsilonGreedy", "83K-bars", "DQfD", "ColdStartFix",
         "InventoryPenalty", "RewardShaping"]
