# DeepScalper Configuration
# Centralized config for the DeepScalper replication

env:
  symbol: "BTCUSDT"
  tick_size: 0.1
  lot_size: 0.001
  window_size: 100 # Micro-structure window
  latency_simulation: true # Enable T+1 latency
  maker_fee: 0.0002
  taker_fee: 0.0004

model:
  micro_hidden_size: 128
  macro_hidden_size: 64
  fusion_hidden_size: 256
  learning_rate: 0.0003

data:
  source: "timescaledb" # or "csv" for testing
  timeframe: "1m"
