# GMGP1 Training-Volume Study — base config.
#
# Research question: given fixed HPs and data, does total_timesteps move OOS PF,
# or has training plateaued? Sweeps total_timesteps in {500K, 1M, 2M, 3M, 5M}
# at N=5 seeds each (25 runs total). Test bed: GMGP1 SAC Gold 15-min.
#
# HPs frozen from v5 HPO study `6xluh826` (T29 best, copied from
# configs/gmgp1_l1_multiseed.yaml).
#
# CONFOUND CONTROL: fee curriculum disabled per S464 steady-state-fees mandate
# (decision_steady_state_fees_pattern.md). The canonical 3M-step config ramps
# 0% -> 2bps over 0-1.5M steps, which conflates "more steps" with "more fee
# exposure". Steady-state from step 0 isolates the IV.
#
# This file is the BASE; scripts/run_volume_study.py generates 5 derived
# variants (one per total_timesteps) at launch time.

data:
  file_path: "data/cme/gc_2025_lob1_1min_stitched.parquet"
  ticker: "GC"
  handler_type: "multiscale"
  train_start_date: "2025-01-06"
  train_end_date: "2025-10-31"
  val_start_date: "2025-11-01"
  val_end_date: "2025-11-30"
  test_start_date: "2025-12-01"
  test_end_date: "2025-12-31"

features:
  scales: [15, 60, 240]
  window_size: 30
  features_per_scale: 8
  asset_class: "cme_futures"

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.0002                # steady-state 2bps (CME Gold all-in) from step 0
  deadband_threshold: 0.35
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 500
  random_start: true
  max_drawdown_pct: 0.30
  scales: [15, 60, 240]
  gap_detection: true                # CME GC has overnight + weekend gaps
  gap_atr_mult: 3.0                  # project_xauusd_rehpo_prelaunch_checklist.md
  reward:
    mode: "dsr"
    dsr_eta: 0.003159755401614352
    dsr_scale: 1.0
  # NO fee_schedule — banned by validate_config.check_no_fee_curriculum.

network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

agents:
  sac:
    lr_actor: 0.0005462612695421805
    lr_critic: 0.000866154995794675
    lr_alpha: 0.0009625164717779418
    gamma: 0.9535315530021778
    tau: 0.00212659146992685
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.15930606967484204
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 10.0
    checkpoint_interval: 250000     # intermediate eval points across all budgets

training:
  total_timesteps: 500000           # OVERRIDDEN per-budget by run_volume_study.py
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: true
  num_envs: 20

hpo:
  enabled: false                    # Stage 2 only — HPs locked from 6xluh826 T29

# Validator-required gates (Protocol v2 §4 stage 2 + universal).
# H1-H4 hypothesis gates are in configs/gmgp1_volume_study.gates.yaml,
# read by scripts/analyze_volume_study.py.
gates:
  l1_seeds: 5
  l1_pf_floor: 1.0                  # research-tier floor; promote-to-paper not in scope
  l1_pf_cv_max: 0.30

wandb:
  project: "FinRL-Pro-DS"
  tags:
    - "gmgp1-v5"
    - "volume-study"
    - "ablation"
    - "steady-state-fees"
    - "research"
