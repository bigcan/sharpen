# PPO Dev/Test Configuration for A/B Testing
# Mirrors deepscalper_dev.yaml (BDQ) but uses PPO agent
# Purpose: Feature Pipeline v2 A/B comparison (BDQ vs PPO)

data:
  file_path: "data/btc_lob_jan2023.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2023-01-10 00:00:00"
  train_end_date: "2023-01-18 23:59:59"
  val_start_date: "2023-01-19 00:00:00"
  val_end_date: "2023-01-19 23:59:59"
  test_start_date: "2023-01-20 00:00:00"
  test_end_date: "2023-01-20 23:59:59"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  # Production-aligned fee structure (Binance VIP0)
  maker_fee: 0.0002   # 2 bps
  taker_fee: 0.0005   # 5 bps
  num_envs: 4              # Reduced for dev
  window_size: 15  # Expert D1: reduced from 50 to prevent stale noise
  max_drawdown_pct: 0.30

  reward:
    scaling: 1.0
    volatility_horizon: 100
    sharpe_weight: 0.0
    sharpe_horizon: 100

  action:
    price_bins: 5
    signed_qty_proportions: [-0.5, -0.2, -0.1, -0.05, 0.0, 0.05, 0.1, 0.2, 0.5]
    max_position: 5.0

network:
  micro_config:
    input_size: 30  # v2: evidence-ranked LOB features
    private_input_size: 3  # Position + Balance + RemainingTime
    hidden_size: 256
    rnn_type: "LSTM"

  macro_config:
    input_size: 15  # v2: macro features with vol/CVD/RSI/session
    hidden_sizes: [256, 128]

agents:
  ppo:
    learning_rate: 0.0003
    gamma: 0.95  # T1.2: Align with LOB signal decay (~20 min horizon)
    gae_lambda: 0.95
    clip_eps: 0.2
    vf_coef: 0.5
    ent_coef: 0.001  # T1.3: Reduced from 0.01 to not drown trading signal
    max_grad_norm: 0.5
    n_epochs: 4
    rollout_steps: 2048
    batch_size: 256
    lr_schedule: "linear"
    checkpoint_interval: 100000

training:
  total_timesteps: 50000     # Fast dev iterations (matches BDQ dev)
  training_epochs: 1
  log_interval: 10240
  torch_compile: true
  use_amp: true
  use_shm: false

hpo:
  enabled: false  # HPO not yet implemented for PPO

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["PPO", "Dev", "v2_pipeline_audit_smoke"]
