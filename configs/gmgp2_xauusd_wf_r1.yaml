# GMGP2-XAUUSD Walk-Forward — Window R1: Fixed-HP Retraining
# Train: Jan-Jun, Val: Jul-Aug, Test: Sep-Oct
# Shorter training period (6 months) — tests HP robustness with less data
# HPs: UPDATE with best trial from GMGP2-XAUUSD HPO (gmgp2_xauusd_sac_15min.yaml)
# v6 architecture: summary-stats obs, hard risk constraints
# Fee: 1.5bps (CFD), DD: 10% (FTMO)

data:
  file_path: "data/cme/gc_2025_lob1_1min_stitched.parquet"  # CME proxy
  ticker: "XAUUSD"
  handler_type: "multiscale"
  train_start_date: "2025-01-06"
  train_end_date: "2025-06-30"
  val_start_date: "2025-07-01"
  val_end_date: "2025-08-31"
  test_start_date: "2025-09-01"
  test_end_date: "2025-10-31"

features:
  scales: [15, 60, 240]
  window_size: 30
  features_per_scale: 8
  asset_class: "cfd_gold"
  obs_mode: "summary_stats"
  summary_feature_indices: [0, 1, 2, 6, 7]

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.0
  deadband_threshold: 0.25        # UPDATE from HPO best trial
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 500
  random_start: true
  max_drawdown_pct: 0.10          # FTMO 10% max DD
  scales: [15, 60, 240]
  stop_loss_bps: 50               # UPDATE from HPO best trial
  stop_loss_hpo: false
  max_holding_bars: 20            # UPDATE from HPO best trial
  max_holding_hpo: false
  obs_mode: "summary_stats"
  summary_feature_indices: [0, 1, 2, 6, 7]
  reward:
    mode: "dsr"
    dsr_eta: 0.001                # UPDATE from HPO best trial
    dsr_scale: 1.0
  fee_schedule:
    - {step: 0, taker_fee: 0.0}
    - {step: 500000, taker_fee: 0.0, ramp_to: 0.00015, ramp_end_step: 1500000}
    - {step: 1500000, taker_fee: 0.00015}  # 1.5bps CFD

network:
  obs_mode: "summary_stats"
  summary_input_dim: 50
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

# UPDATE all SAC HPs below with best trial from GMGP2-XAUUSD HPO
agents:
  sac:
    lr_actor: 0.0003              # UPDATE from HPO best trial
    lr_critic: 0.0003             # UPDATE from HPO best trial
    lr_alpha: 0.0003              # UPDATE from HPO best trial
    gamma: 0.99                   # UPDATE from HPO best trial
    tau: 0.005                    # UPDATE from HPO best trial
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.2            # UPDATE from HPO best trial
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 5.0            # UPDATE from HPO best trial
    checkpoint_interval: 250000

training:
  total_timesteps: 5000000
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: true
  num_envs: 20

hpo:
  enabled: false

wandb:
  project: "FinRL-Pro-DS"
  tags: ["gmgp2-xauusd", "Gold", "SAC", "15min", "CFD", "FTMO",
         "summary-stats", "hard-constraints", "walkforward", "wf-retrain", "wf-r1", "fixed-hp"]
