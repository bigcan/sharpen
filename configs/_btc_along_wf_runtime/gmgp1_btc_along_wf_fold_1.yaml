data:
  file_path: data/btc_usdt_1min_bybit.parquet
  ticker: BTC
  handler_type: multiscale
  train_start_date: '2024-02-01'
  train_end_date: '2025-12-01'
  val_start_date: '2025-12-01'
  val_end_date: '2026-01-01'
  test_start_date: '2026-01-01'
  test_end_date: '2026-02-01'
features:
  scales:
  - 15
  - 60
  - 240
  window_size: 30
  features_per_scale: 8
  asset_class: crypto
env:
  mdp_version: v7
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.0005
  deadband_threshold: 0.35
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 500
  random_start: true
  max_drawdown_pct: 0.3
  scales:
  - 15
  - 60
  - 240
  reward:
    mode: dsr
    dsr_eta: 0.003159755401614352
    dsr_scale: 1.0
network:
  scale_encoder:
    input_size: 8
    channels:
    - 32
    - 64
    - 64
    - 64
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30
agents:
  sac:
    lr_actor: 0.0005462612695421805
    lr_critic: 0.000866154995794675
    lr_alpha: 0.0009625164717779418
    gamma: 0.9535315530021778
    tau: 0.00212659146992685
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.15930606967484204
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 10.0
    checkpoint_interval: 250000
training:
  total_timesteps: 2000000
  log_interval: 1000
  use_amp: true
  amp_dtype: bfloat16
  torch_compile: true
  num_envs: 20
hpo:
  enabled: false
gates:
  hpo_pf_floor: 1.2
  hpo_min_trials_completed: 30
  entropy_floor: 0.01
  q_div_max: 100.0
  action_sat_max: 0.9
  l1_seeds: 5
  l1_pf_cv_max: 0.3
  l1_pf_floor: 1.2
  l1_pf_cv_ambiguous:
  - 0.22
  - 0.38
  ensemble_uplift_min: 1.1
  ensemble_ambiguous_min: 1.05
  ensemble_rule_selection: val_argmax_pf
  wf_windows: 4
  wf_pf_floor: 1.1
  velotrade_trailing_dd_buffer_pp: 0.5
  oos_pf_floor: 1.1
ensemble:
  gates_file: configs/gmgp1_btc_velotrade_ensemble.gates.yaml
  checkpoint_pattern: checkpoints/gmgp1-btc-along-wf-fold{fold}-seed{seed}_*/checkpoint_final.pth
  seeds:
  - 123
  - 456
  - 789
  - 1024
  - 2026
  seed_pfs:
    123: 2.4422
    456: 2.4225
    789: 2.4695
    1024: 2.367
    2026: 2.5084
wandb:
