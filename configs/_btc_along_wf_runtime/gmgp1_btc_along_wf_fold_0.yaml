  train_end_date: '2025-11-01'
  val_start_date: '2025-11-01'
  val_end_date: '2025-12-01'
  test_start_date: '2025-12-01'
  test_end_date: '2026-01-01'
features:
  scales:
  - 15
  - 60
  - 240
  window_size: 30
  features_per_scale: 8
  asset_class: crypto
env:
