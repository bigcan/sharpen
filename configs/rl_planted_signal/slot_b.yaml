# Planted-signal SAC capability ladder (full-codebase audit 2026-09-23, section 3.7).
# Diagnostic on SYNTHETIC data, not a protocol-v2 strategy run: no manifest, no gates, no capital.
# Launch: python scripts/deploy_bare_metal.py --script scripts/research/rl_planted_signal/launch_fleet.py
#   --config configs/rl_planted_signal/slot_b.yaml --instance gpuhub-1 --gpu 1
# Every arm = production gmgp1_sac_gc_15min geometry/hyperparameters (harness.base_config), taker_fee 0,
# 3M timesteps; only the listed overrides differ.
out_root: results/rl_planted_signal/slot_b
n_base_bars: 200000
data_seed: 11
datasets: {ic015: 0.15, ic005: 0.05, ic002: 0.02, ic000: 0.0}
threads_per_arm: 8
stagger_seconds: 60
arms:
  - {name: P05_s2, data: ic005, overrides: {seed: 2}}
  - {name: P02_s1, data: ic002, overrides: {seed: 1}}
  - {name: X05_pnl, data: ic005, overrides: {seed: 1, reward_mode: pnl}}
