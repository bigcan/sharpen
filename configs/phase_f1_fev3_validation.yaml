# Phase F1: fev3 Validation Config — Oracle + RF evaluation
# =====================================================================
# Used by scripts/validate_fev3.py to run oracle profiling and RF
# comparison against v2 baseline (H1 val AUC = 0.5942).
#
# Points to the fev3 parquet file (40 micro + 15 macro features).
# No RL training — purely diagnostic.

data:
  file_path: "data/processed/btc_2025_full_year_5min_fev3.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-10-31 23:59:59"
  val_start_date:   "2025-11-01 00:00:00"
  val_end_date:     "2025-11-30 23:59:59"
  test_start_date:  "2025-12-01 00:00:00"
  test_end_date:    "2025-12-31 23:59:59"
  norm_cutoff_date: "2025-11-01 00:00:00"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]
  vol_norm_window: 24      # 2-hour EMA context at 5-min resolution

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  margin_requirement: 0.05
  maker_fee: 0.0002
  taker_fee: 0.0005
  num_envs: 1
  window_size: 15
  max_drawdown_pct: 0.30

  reward:
    scaling: 1.0
    volatility_horizon: 20
    sharpe_weight: 0.0
    hold_bonus_bps: 0.0

  action:
    discrete_dims: 6
    max_position: 5.0
    fixed_trade_qty: 0.2
