# GMGP1-v7 Walk-Forward Window R1 — FQ-1 Feature Pruning A/B Test (XAUUSD)
# Train: Jan-Jun, Val: Jul-Aug, Test: Sep-Oct
# v7 architecture: window-mode obs with FQ-1 pruned features (8→5)
# Dropped: open_z(3), high_z(4), low_z(5) — redundant with close_z (90%+ corr)
# Kept: log_return(0), atr_norm(1), parkinson_vol(2), close_z(6), volume_z(7)
# HPs: T24 best from GMGP2-XAUUSD HPO (run v45etaie, PF=2.785)
# Fee: 1.5bps (CFD), DD: 10% (FTMO)

data:
  file_path: "data/cme/gc_2025_lob1_1min_stitched.parquet"  # CME proxy
  ticker: "XAUUSD"
  handler_type: "multiscale"
  train_start_date: "2025-01-06"
  train_end_date: "2025-06-30"
  val_start_date: "2025-07-01"
  val_end_date: "2025-08-31"
  test_start_date: "2025-09-01"
  test_end_date: "2025-10-31"

features:
  scales: [15, 60, 240]
  window_size: 30
  features_per_scale: 5            # FQ-1: 8→5 (drop open_z, high_z, low_z)
  feature_indices: [0, 1, 2, 6, 7] # log_return, atr_norm, parkinson_vol, close_z, volume_z
  asset_class: "cfd_gold"

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 5            # Must match features.features_per_scale
  taker_fee: 0.0
  deadband_threshold: 0.25         # T24 best
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 500
  random_start: true
  max_drawdown_pct: 0.10           # FTMO 10% max DD
  scales: [15, 60, 240]
  stop_loss_bps: 125               # T24 best
  stop_loss_hpo: false
  max_holding_bars: 15             # T24 best
  max_holding_hpo: false
  reward:
    mode: "dsr"
    dsr_eta: 0.001354              # T24 best
    dsr_scale: 1.0
  fee_schedule:
    - {step: 0, taker_fee: 0.0}
    - {step: 500000, taker_fee: 0.0, ramp_to: 0.00015, ramp_end_step: 1500000}
    - {step: 1500000, taker_fee: 0.00015}  # 1.5bps CFD

network:
  scale_encoder:
    input_size: 5                  # FQ-1: 8→5 features per scale
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

# SAC HPs from T24 best trial (GMGP2-XAUUSD HPO, run v45etaie)
agents:
  sac:
    lr_actor: 0.000728             # T24 best
    lr_critic: 0.000130            # T24 best
    lr_alpha: 0.0000165            # T24 best
    gamma: 0.9638                  # T24 best
    tau: 0.00820                   # T24 best
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.0536          # T24 best
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 7.967           # T24 best
    checkpoint_interval: 250000

training:
  total_timesteps: 5000000
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: true
  num_envs: 20

hpo:
  enabled: false

wandb:
  project: "FinRL-Pro-DS"
  tags: ["gmgp1-v7", "XAUUSD", "SAC", "15min", "CFD", "FTMO",
         "walkforward", "wf-r1", "fixed-hp", "fq1-pruning", "5-features", "ab-test"]
