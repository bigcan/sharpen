workstream: sg1_btc_velotrade_extended
data:
  file_path: data/btc_usdt_1min_bybit.parquet
  ticker: BTCUSDT
  handler_type: multiscale
  train_start_date: '2024-01-01'
  train_end_date: '2025-07-01'
  val_start_date: '2025-07-01'
  val_end_date: '2025-08-01'
  test_start_date: '2025-08-01'
  test_end_date: '2025-09-01'
features:
