# Live Trading Config — SG-1 BTC SAC via DXtrade (Velotrade)
# 3-min bars, signal-gated, prop-firm trained (10% EOD trailing DD)
# Checkpoint: PLACEHOLDER — update with L1 multi-seed best
#
# ---------------------------------------------------------------------------
# PROP-FIRM DECOUPLING (S495 Step 5, 2026-04-24).
# This file is the BASE config. Phase-varying DD/target/gates live in
# configs/deploy/velotrade/<phase>.yaml overlays (allowlist-enforced).
#
# Deploy invocations (resolved = this file + overlay):
#   python scripts/deploy_bare_metal.py --script scripts/run_live_dxtrade.py \
#     --config configs/live_sg1_btc_dxtrade.yaml --overlay velotrade/step1
#   python scripts/deploy_bare_metal.py --script scripts/run_live_dxtrade.py \
#     --config configs/live_sg1_btc_dxtrade.yaml --overlay velotrade/step2
#   python scripts/deploy_bare_metal.py --script scripts/run_live_dxtrade.py \
#     --config configs/live_sg1_btc_dxtrade.yaml --overlay velotrade/funded
#
# After Step 5 migration this BASE file alone is NOT paper-deployable
# (validator FAILs: `risk.static_peak` missing); pair with an overlay.
# ---------------------------------------------------------------------------
#
# NOTE: DXtrade broker is currently a stub. Full API pending from Velotrade.
# Paper testing uses Bybit data feed + log-only execution.

# --- Exchange ---
exchange:
  name: "dxtrade"
  testnet: true
  asset: "BTC"
  leverage: 1                          # 1:1 (user policy — Velotrade 6x is cap not floor)
  order_type: "market"
  data_exchange: "binance"           # OHLCV data from Binance (DXtrade = execution only)

# --- Agent ---
agent:
  # PLACEHOLDER — update with L1 multi-seed best checkpoint
  checkpoint_path: "checkpoints/sg1_btc_velotrade_best/checkpoint_final.pth"
  device: "cpu"
  torch_compile: false

# --- SAC Hyperparameters (PLACEHOLDER — update with HPO best trial) ---
agents:
  sac:
    lr_actor: 0.0003
    lr_critic: 0.0003
    lr_alpha: 0.0003
    gamma: 0.99
    tau: 0.005
    batch_size: 512
    buffer_size: 100
    initial_alpha: 0.2

# --- Network (must match training checkpoint exactly) ---
network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

# --- Features (SG-1 3-min multi-scale — must match training) ---
features:
  scales: [3, 15, 60]
  window_size: 30
  features_per_scale: 8
  asset_class: "crypto"
  norm_span: 120
  bootstrap_bars: 30000

# --- Signal Gate (must match training) ---
signal_gate:
  enabled: true
  gate_mode: "composite"
  atr_threshold: 0.5
  parkinson_threshold: 0.03
  volume_threshold: 0.5
  max_hold_bars: 20
  gate_always_on_first: true

# --- Bar Clock (3-min bars for SG-1, 24/7 market) ---
bar_clock:
  base_interval_minutes: 3
  execution_delay_seconds: 5.0
  max_late_seconds: 30.0

# --- Trading ---
trading:
  initial_balance: 100000.0          # Velotrade challenge account
  deadband_threshold: 0.25
  taker_fee: 0.0005                  # 5bps crypto taker

# --- Data source (validator Stage-0; ccxt live-fetch at runtime) ---
data:
  source: ccxt
  data_exchange: binance             # Bybit data feed via Binance fallback (see header)
  frequency: 3m
  ticker: "BTC/USDT"

# --- Hard Constraints (validator parity; mirrors trading.taker_fee) ---
env:
  taker_fee: 0.0005

# --- Risk Management (universal live safety; phase-varying keys come from overlay) ---
# Overlay owns: static_peak, eod_trailing_drawdown, eod_hour_utc,
# flatten_on_kill_file. See configs/deploy/velotrade/{step1,step2,funded}.yaml.
risk:
  enabled: true
  max_drawdown_pct: 0.08             # 8% trigger (2% buffer below 10% limit)
  circuit_breaker_cooldown_bars: 0   # Stay flat once breached
  max_position_pct: 1.0
  max_net_short_exposure: -1.0
  max_gross_exposure: 1.0            # 1:1 leverage (user policy)
  funding_rate_alert: 999.0
  min_margin_reserve_pct: 0.15
  # S495-cont (2026-04-23) preemptive override (mirrors sg1-xauusd fix). See
  # crypto_risk_manager.py:267 — accumulator resets every 24 `check()` calls,
  # not 24 calendar hours. SG-1 3-min bars with signal_gate + deadband reduce
  # check() to ~9/day → "daily" window spans ~2-3 calendar days. Default 4.0
  # trips after 3-4 roundtrips. 10.0 gives ~3-5 roundtrips per reset window.
  # Structural fix (bar-interval-aware reset) queued.
  daily_turnover_limit: 10.0

# --- WandB Monitoring ---
wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  tags: ["live", "sg-1", "BTC", "SAC", "3min", "dxtrade", "paper",
         "velotrade", "2-step", "signal-gated", "prop-firm"]

# --- Safety ---
safety:
  require_explicit_mainnet: true
  max_daily_loss_pct: 0.0            # 0 = disabled (Velotrade 2-step has no daily rule). Engine treats ≤0 as disabled (audit FIND-01, 2026-04-22).
  kill_file: "/tmp/finrl_live_sg1_btc_kill"
  flatten_on_kill_file: true         # v2.2 §8.3 CRIT graceful flatten
  emergency_flatten_on_error: true

# --- Protocol v2.2 §8.2 Live Action-Drift ---
# PLACEHOLDER — baseline artifact does not exist until L1 multiseed
# completes. Path reflects the expected post-L1 location; deploy will
# error at startup with "baseline not found" until the report is baked
# into the live-engine image. This is the correct safety posture for a
# placeholder-checkpoint config.
drift:
  enabled: true
  baseline_path: "/app/baselines/sg1_btc_l1/seed_report.json"
  baseline_seed: "PLACEHOLDER"       # Update to winning seed post-L1
  window_bars: 1000
  min_bars_before_check: 500
  vol_estimator_bars: 20

# --- Protocol v2 Gates (paper-deploy requirement; mirrors §drift/§safe_mode) ---
gates:
  drift:
    window_bars: 1000
    min_bars_before_check: 500
    deadband_frac_warn: 0.15
    deadband_frac_crit: 0.30
    saturation_frac_warn: 0.15
    saturation_frac_crit: 0.30
    action_kl_warn: 0.5
    action_kl_crit: 1.0
    regime_conditioning: true
    vol_estimator_bars: 20
  safe_mode:
    crit_triggers_flatten: true
    crit_repeat_window_hours: 24
    crit_repeat_count_before_lockout: 2

# --- PRISM Regime Overlay (optional) ---
prism:
  enabled: false
  base_url: "http://prism-api:8001"
  api_key: ""
  ticker: "BTC-USD"
  timeframe: "daily"
  timeout: 5
  cache_ttl: 60
  crisis_flatten: true
  multipliers:
    LOW_VOL: 1.3
    NORMAL_VOL: 1.0
    HIGH_VOL: 0.3

# --- Monitoring ---
monitoring:
  metrics_port: 9108
