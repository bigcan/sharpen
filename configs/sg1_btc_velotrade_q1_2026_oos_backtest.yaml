# SG-1 BTC Velotrade recent-OOS Backtest — DEPLOYED policy, cost-corrected (S553-cont audit P8)
# Checkpoint: sg1-btc-decay01-wf-fold7-seed456_20260521_230637 (the DEPLOYED
#   DECAY-01 SOLO seed-456, train cutoff 2026-02-01 — bundle solo_v1.tar.gz in
#   configs/live_sg1_btc_bybit.yaml). REPLACES the retired seed-42 l1-multiseed
#   checkpoint: the deployed live policy had never passed a Stage-4 recent-OOS
#   gate (audit P8-01).
# Base HPs: trial #44 (sg1_btc_velotrade_rehpo_20260420), identical to the
#   DECAY-01 L1/WF stack — env params below match the deployed config.
# Data: Bybit BTCUSDT 1m parquet covers 2024-01-01 → 2026-04-30.
# Test window: 2026-02-03 → 2026-04-30 (STRICTLY after the seed-456 train cutoff
#   2026-02-01 so the window is genuinely out-of-sample for the deployed ckpt;
#   the old 2026-01-01 start overlapped seed-456 training — audit P8-01).
# Cost: taker_fee 0.00055 (5.5 bps Bybit retail) + slippage_base_bps 5.0 (live
#   marketable-limit cross) per the S552 sim->live gap RCA — the old config ran
#   the falsified cheap model (5.0 bps fee, 0 slippage; audit P8-02).

data:
  file_path: "data/btc_usdt_1min_bybit.parquet"
  ticker: "BTCUSDT"
  handler_type: "multiscale"
  # LEAK-1 split markers carried through for EMA-Z reset boundaries.
  train_start_date: "2024-01-01"
  train_end_date: "2025-06-30"
  val_start_date: "2025-07-01"
  val_end_date: "2025-09-30"
  test_start_date: "2026-02-03"   # strictly after seed-456 train cutoff 2026-02-01 (audit P8-01)
  test_end_date: "2026-04-30"

features:
  scales: [3, 15, 60]
  window_size: 30
  features_per_scale: 8
  asset_class: "crypto"

signal_gate:
  enabled: true
  gate_mode: "composite"
  atr_threshold: 0.15
  parkinson_threshold: 0.0009
  volume_threshold: 0.60
  max_hold_bars: 20
  gate_always_on_first: true
  normalize_accumulated_reward: true

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.00055               # S552 cost-correction: Bybit retail taker 5.5 bps (was 0.0005)
  slippage_base_bps: 5.0           # S552 cost-correction: live marketable-limit cross (was unset=0)
  deadband_threshold: 0.25
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 3000
  random_start: false
  max_drawdown_pct: 0.10
  scales: [3, 15, 60]
  gap_detection: false
  reward:
    mode: "dsr"
    dsr_eta: 0.0008427308583293202
    dsr_scale: 1.0
    hindsight_weight: 0.0
  risk:
    enabled: true
    max_trailing_drawdown_pct: 0.10
    max_daily_loss_pct: 0.0
    eod_hour_utc: 0
    drawdown_penalty_start: 0.05
    drawdown_penalty_scale: 5.0
    augment_obs: "off"
    static_peak: true

network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

agents:
  sac:
    lr_actor: 0.00015739192475706186
    lr_critic: 0.00007322355805160213
    lr_alpha: 0.0000026314031405474944
    gamma: 0.9593670398875173
    tau: 0.0002134448307797731
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.4088157097959411
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 1.516294914428727
    checkpoint_interval: 250000

training:
  total_timesteps: 0
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: false
  num_envs: 1

hpo:
  enabled: false

wandb:
  project: "FinRL-Pro-DS"
  tags: ["sg-1", "BTC", "SAC", "3min", "signal-gated", "velotrade",
         "backtest", "recent-oos", "regime-drift", "decay01-seed456-deployed",
         "bybit-perp", "steady-state-fee", "cost-corrected"]
