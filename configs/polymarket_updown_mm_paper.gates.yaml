# Pre-registered gates for the pm-updown-mm-v0 FORWARD PAPER TEST (shadow quoting vs live L2).
#
# Frame (diagnose -> forward-validate; NO historical backtest exists or is permitted):
#   Stage A (DONE 2026-07-02): on-chain print diagnostic of 2026-04-04..2026-05-04 identified a
#   replicated winning maker mechanism (fair-value tracking, death-zone withdrawal, aligned
#   residual) and a symmetric losing mechanism, on TRUE settlement P&L reconciled to $0.00
#   against the first pass. See docs/research/polymarket_updown_mm_diagnostic_2026-07-02.md.
#   Stage B (THIS contract): the v0 design below is evaluated ONCE on forward live data:
#   7-day burn-in (bounded parameter calibration) -> 21-day evaluation with parameters FROZEN.
#   Fill simulation is deliberately conservative (see sim:) because historical book depth does
#   not exist and our real queue position is unknowable in advance. Rebates are excluded from
#   the primary economics gate (report-only) — pass must not depend on them.
#
# Honesty notes frozen with this file:
#   - The Stage-A anchor (+135.7 bps winner-cluster, +12.0 bps population) is pre-rebate,
#     latency-privileged, measured in a slightly different fee regime, and possibly generated by
#     fewer independent operators than wallet count. It is a MECHANISM anchor, not an expected
#     value. Gates below are set at roughly 1/4 of the cluster anchor.
#   - Expected outcome per project doctrine: this may well FAIL. A clean fail closes the book
#     (subject to max_design_iterations below). A pass earns a Tier-2 audit, NOT capital.
#   - Capital additionally blocked on operator-side venue/jurisdiction resolution (Taiwan
#     geoblock on Polymarket International; Polymarket-US access question) — independent of
#     any result here.
# NEVER hardcode these thresholds in code/scripts.

prereg:
  registered_utc: "2026-07-02"
  design_id: pm-updown-mm-v0
  stage_a_evidence: results/polymarket_updown_mm   # diagnostic outputs, frozen
  data_prerequisite: >-
    >=28 consecutive days of forward L2 (CLOB market channel) + RTDS (chainlink+binance)
    collection via scripts/data/collect_polymarket_updown_l2.py before evaluation ends.
  burn_in_days: 7           # parameter calibration allowed ONLY here, within calibration_bounds
  eval_days: 21             # parameters frozen at burn-in end; single evaluation
  single_shot_eval: true    # no peeking-then-tuning inside the eval window
  max_design_iterations: 2  # one bounded v1 revision permitted ONLY if mechanism gates pass
                            # while economics gates fail; otherwise book closes on first fail

design_frozen:              # structure — NOT tunable at any stage
  universe: [btc, eth]      # 87% + 7.7% of maker notional; other assets are dust
  quote_side: bids_both_tokens_only   # maker SELL side measured -73.6 bps; winners ~100% BUY
  fair_value: phi_logret_over_sigma_sqrt_tau   # p = Phi(ln(S_t/S_open)/(sigma_t*sqrt(tau)))
  reference_feed: rtds_chainlink      # the resolution source itself (wss://ws-live-data.polymarket.com)
  tie_rule_up: true                   # market resolves Up on equality
  deathzone_no_interior_quotes_below_tau_s: 30
  deathzone_extreme_only_pbounds: [0.05, 0.95]  # inside 30s quote only if p_hat outside these
  deathzone_extreme_min_ticks_behind: 3
  no_quotes_below_tau_s: 5
  reprice_trigger_ticks: 1            # |delta p_hat| >= 1 tick -> cancel/replace
  flatten_by_crossing_spread: false   # never pay taker fee to flatten; hold to settlement
  tick_interior: 0.01
  min_order_shares: 5                 # venue minimum

calibration_bounds:         # the ONLY knobs burn-in may set; frozen thereafter
  kappa_spread_vol_mult: [0.5, 4.0]         # half-spread = max(1 tick, kappa*sigma_b*sqrt(tau_rem) + lambda*skew)
  lambda_inventory_skew: [0.0, 2.0]
  sigma_ewma_halflife_s: [120, 1800]
  quote_size_usd: [5, 25]
  per_market_net_exposure_cap_usd: [20, 50]

sim:                        # frozen fill-simulation conventions (conservative by construction)
  fill_rule_primary: strict_price_through   # fill ONLY on prints strictly worse than our quote
  queue_ahead_source: l2_depth_at_placement # at-price fills only after queue ahead exhausted...
  queue_ahead_decrement: trades_only        # ...and queue ahead never shrinks via cancels
  quote_update_latency_ms: 1000             # decision -> quote effective (pessimistic vs ~250ms target)
  internal_decision_latency_budget_ms: 250  # logged; report-only
  fees: live_schedule_at_eval_time          # taker C*feeRate*p*(1-p); maker 0
  rebates_in_primary_gate: false            # 20% pool share is report-only upside
  fill_rule_upper_bound: at_or_through      # optimistic model, report-only + fragility gate
  participation_cap_frac_of_market_maker_notional: 0.05   # sim fills capped at 5% of per-market
                                                          # observed maker notional (capacity honesty)

gate:                       # ALL must pass, conservative fill model, eval window only
  min_eval_days: 21
  min_markets_quoted: 2000
  min_sim_maker_notional_usd: 25000
  net_bps_floor: 30                       # ex-rebate, net of live taker-fee schedule (maker pays 0)
  block_bootstrap_p_max: 0.05             # p(mean daily P&L <= 0), circular block, block=3 days
  n_boot: 10000
  pos_day_frac_min: 0.60
  deathzone_notional_share_max: 0.10      # tau<30s fills as share of sim notional
  deathzone_bps_floor: -30                # net bps on tau<30s fills
  residual_alignment_min: 0.55            # mechanism check vs winner-cluster 0.73-0.87
  upper_bound_model_must_be_positive: true
  conservative_over_upper_pnl_ratio_min: 0.25   # if only optimistic fills profit -> fragile -> FAIL

kill:                       # early NO-GO, checked daily during eval
  cum_net_usd_floor: -400
  bps_floor_after_min_days: {min_days: 10, bps: -25}

reconciliation:             # tripwire = engine bug -> HALT, not a verdict
  resolution_match_min_frac: 0.99   # our stream-derived outcome vs CLOB tokens[].winner
  settlement_pnl_convention: matches_stage_a   # s*1{win} - usd, validated to $0.00 on 10 wallets

report_only:                # measured and recorded, never gated in v0
  rebate_estimate_usd: true
  latency_p95_ms: true
  chainlink_binance_basis_events: true
  per_asset_split: true
  capacity_extrapolation_participation: [0.01, 0.03, 0.05]

verdict:
  require_all: [eval_span_ok, markets_quoted_ok, sim_notional_ok, net_bps_above_floor,
                beats_block_bootstrap, pos_days_above_floor, deathzone_share_ok,
                deathzone_bps_ok, residual_aligned, upper_bound_positive,
                fill_model_ratio_ok]
  on_pass: tier2_deep_lifecycle_audit_then_operator_capital_decision
  on_mechanism_pass_economics_fail: one_bounded_v1_revision_then_final   # multiplicity ledger: N=2
  on_fail: NO_GO_close_book
