data:
  file_path: data/cme/gc_2025_lob1_1min_stitched.parquet
  ticker: XAUUSD
  handler_type: multiscale
  train_start_date: '2025-01-06'
  train_end_date: '2025-08-31'
  val_start_date: '2025-09-01'
  val_end_date: '2025-10-31'
  test_start_date: '2025-11-01'
  test_end_date: '2025-12-31'
features:
  scales:
  - 15
  - 60
  - 240
  window_size: 30
  features_per_scale: 8
  asset_class: cfd_gold
env:
  mdp_version: v7
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.000235
  deadband_threshold: 0.35
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 500
  random_start: true
  max_drawdown_pct: 0.1
  scales:
  - 15
  - 60
  - 240
  gap_detection: true
  gap_atr_mult: 3.0
  reward:
    mode: dsr
    dsr_eta: 0.009270901804613313
    dsr_scale: 1.0
  prop_firm:
    enabled: true
    profit_target_pct: 0.1
    max_trailing_drawdown_pct: 0.08
    max_daily_loss_pct: 0.04
    eod_hour_utc: 21
    drawdown_penalty_start: 0.04
    drawdown_penalty_scale: 5.0
    success_bonus: 10.0
    augment_obs: false
network:
  scale_encoder:
    input_size: 8
    channels:
    - 32
    - 64
    - 64
    - 64
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30
agents:
  sac:
    lr_actor: 0.0004328235879674501
    lr_critic: 0.000255518632525778
    lr_alpha: 2.7165537430202373e-06
    gamma: 0.9887304528260698
    tau: 0.00586388344589006
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.4297169729200557
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 3.0464559724708105
    checkpoint_interval: 250000
training:
  total_timesteps: 500000
  log_interval: 1000
  use_amp: true
  amp_dtype: bfloat16
  torch_compile: true
  num_envs: 20
hpo:
  enabled: true
  objective: profit_factor
  trials: 30
  steps_per_trial: 500000
  narrow_mode: true
  enqueue_baseline: true
gates:
  hpo_pf_floor: 1.2
  hpo_min_trials_completed: 20
  entropy_floor: 0.01
  q_div_max: 100.0
  action_sat_max: 0.9
  l1_seeds: 3
  l1_pf_cv_max: 0.3
  l1_pf_floor: 1.5
  wf_windows: 4
  wf_pf_floor: 1.1
  ftmo_active_days_min: 4
  ftmo_max_single_day_share: 0.5
  ftmo_daily_dd_buffer_pp: 0.5
  ftmo_trailing_dd_buffer_pp: 0.5
  oos_pf_floor: 1.1
wandb:
  project: FinRL-Pro-DS
  tags:
  - gmgp1-xauusd
  - Gold
  - SAC
  - 15min
  - CFD
  - FTMO
  - ftmo-wrapped
  - propfirm
  - hpo
  - narrow
  - xauusd
  - steady-state
  - re-hpo
