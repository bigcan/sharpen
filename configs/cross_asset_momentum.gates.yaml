# ============================================================================
# CROSS-ASSET MOMENTUM ALLOCATOR - decision gates overlay (xsec-mom-v1)
# ============================================================================
# Merged over the inline `gates:` of configs/cross_asset_momentum.yaml at
# validation/eval time (validate_config._load_ensemble_gates_overlay). These are
# the allocator's DECISION gates - the RL-beats-linear-core test and the
# diversification/cost-gap acceptance criteria from the architecture
# (.agent/artifacts/multi_asset_allocator_architecture.md). All thresholds live
# here (never hardcoded in code/scripts).
gates:
  # The decisive gate: the RL allocator must beat the FROZEN linear core OOS by
  # >= min_uplift on the same WF windows, else we ship the linear rule.
  rl_beats_linear:
    metric: "oos_net_sharpe"
    min_uplift_vs_baseline: 0.10         # RL net Sharpe must exceed linear core by >= 0.10
    else: "ship_linear_core"

  # The Component-1 deploy decision (ADR-C1-4): the DYNAMIC sleeve combiner must beat the
  # FROZEN static inverse-vol combiner OOS (same WF/CPCV paths) by >= min_uplift net Sharpe,
  # else ship the static inverse-vol book. λ/perf_window are selected ONLY on these OOS paths
  # (C1.4). At N=2 sleeves this gate is EXPECTED to often say ship_static_rp (the cross-
  # sectional tilt is near-degenerate) — that is the honest, correct outcome, not a failure.
  combiner_beats_static:
    metric: "oos_net_sharpe"
    baseline: "static_inverse_vol"       # frozen inverse-vol combiner on the same OOS paths
    min_uplift_vs_baseline: 0.10         # dynamic must exceed static by >= 0.10 net Sharpe OOS
    else: "ship_static_rp"

  # The sleeve must stay uncorrelated to the existing live book (the north-star).
  g_diversification:
    max_corr_to_existing_sleeves: 0.30

  # Guard against a frictionless artifact: net Sharpe must not collapse vs costless.
  g_cost_gap:
    max_frictionless_minus_net_sharpe: 0.15

  # Allocator primary WF metric is net portfolio Sharpe (NOT single-instrument PF;
  # the linear core is ~0.60, so a floor of 0.40 is a survival sanity, not the
  # deploy bar - the deploy decision is rl_beats_linear above).
  wf_net_sharpe_floor: 0.40

  # Fixed-lot stress sub-report (X3; Protocol v2 Stage 3) sanity bounds.
  stress_dd_buffer_pp: 1.0               # headroom of worst fixed-lot DD from the cap (pp)
  stress_leverage_max: 6.0              # matches env.max_gross_exposure ceiling

# ============================================================================
# MULTIPLICITY / DEFLATED-SHARPE - pre-capital overfitting haircut (N1; P11-01/02/09)
# ============================================================================
# Consumed by scripts/research/audit_two_sleeve_book.py (the pre-capital Tier-2
# adversarial audit), NOT validate_config or the paper soak. The deployable
# momentum+rates-carry book's honest 0.601 is the BEST of a multi-config search, and
# PSR@benchmark=0 is not a multiplicity control (it tests one track vs a fixed bound,
# never seeing n_trials). The Deflated-Sharpe (Bailey & Lopez de Prado 2014) deflates
# the benchmark to the EXPECTED MAX Sharpe of n_trials draws, so a best-of-N winner must
# clear a higher bar. Pre-registered here as a COMMITMENT DEVICE (frozen n_trials count)
# so the haircut can't be softened after the number is known. All thresholds live here.
overfitting:
  # Honest pre-registered trial count. 18 momentum books were graded
  # (3-lookback TSMOM score x {pooled, 4 per-class, 3 XSMOM-class, XSMOM-pooled}
  # x {monthly, weekly} = 18; results/xsec_momentum/results.json) and the rates sleeve is
  # the LONE survivor of a 3-class carry selection (rates/equity-div/FX) whose pooled
  # verdict was NO_GO. Honest N = 18 + 3 = 21. The bracket reports DSR sensitivity to
  # un-enumerated search depth (18 = momentum-only, 28 = conservative incl. the combine).
  dsr_n_trials: 21
  dsr_n_trials_bracket: [18, 21, 28]
  min_dsr: 0.95                          # P(true SR>0 | multiplicity, skew, kurt) must clear 95%
  block_bootstrap_block_days: 21         # ~1-month blocks preserve momentum/carry autocorrelation

# ============================================================================
# PAPER-SOAK GATES - PRE-REGISTERED 2026-06-12, BEFORE THE FIRST PAPER BAR.
# ============================================================================
# Separate from the `gates:` overlay above (those are validate_config/eval-time
# DECISION gates). These gate the live-paper -> capital promotion and are
# consumed by the paper executor + live-monitor (item 4 build), NOT by
# validate_config. Declared now as a COMMITMENT DEVICE: the leak-era lesson is
# that verdicts read post-hoc get rationalized, so the criteria are frozen while
# the outcome is unknown. Do not loosen after the soak starts without a dated
# decision memo (mirrors the gmgp1_xauusd "do not edit after launch" rule).
#
# CRITICAL CALIBRATION - the frozen linear core rebalances MONTHLY
# (results/xsec_momentum baseline; net SR ~0.60 in-sample, honest band 0.4-0.6
# per Fable verdict 2026-06-11). A live Sharpe estimate over a short soak is
# statistically meaningless (resolving SR to +/-0.2 needs ~5 yr of monthly
# returns). THEREFORE the PRIMARY soak gate is sim<->live EXECUTION PARITY (does
# the executor reproduce the frozen core's positions/returns) - measurable in a
# short soak - and the rolling-Sharpe floor is a LONG-HORIZON backstop, never
# the promotion trigger.
paper_soak:
  status: pre_registered                 # wired into executor/monitor at item 4 (do not treat as live yet)
  consumed_by: [paper_executor, live_monitor]   # NOT validate_config
  baseline_ref: results/xsec_momentum/summary.md   # the frozen linear core this soak shadows

  # --- promotion horizon ---
  min_soak_calendar_days: 90             # >= 1 quarter (matches quarterly retrain cadence)
  min_rebalances_observed: 3             # >= 3 clean monthly rebalance cycles executed
  rebalance_cadence: monthly             # MUST match the frozen core; weekly/daily = a DIFFERENT strategy

  # --- PRIMARY gate: sim<->live execution parity (the real soak test) ---
  parity:
    max_daily_return_te_bps: 15          # |live - sim| daily portfolio-return tracking error
    max_weight_l1_drift: 0.05            # sum|w_live - w_sim| across assets at each rebalance
    max_missed_rebalances: 0             # every scheduled monthly rebalance must execute
    max_cost_drift_ratio: 1.50           # realized one-way cost <= 1.5x the 2bps+slippage model
    # Two-sided cost band (P8-06): the lower bound catches an UNDER-/non-trading forward path
    # (rung-2 broker rejects/partials leave realized cost ~0 while weights stay in tolerance —
    # "the executor isn't trading the book"). 0 in rung-1 sim (cost_drift==1.0 by construction);
    # binds once real IB fills arrive at rung-2. Wired step-4 (S553-cont-57); see provenance.
    min_cost_drift_ratio: 0.50           # realized one-way cost >= 0.5x the model

  # --- ALWAYS-ON risk kill-switches (broken-executor / regime-break, not normal variance) ---
  # RECALIBRATED 2026-06-23 (P8-07) to the TWO-SLEEVE fund-of-funds render the executor now
  # produces — see paper_soak_provenance.recalibration_2026_06_23 + the cont-58 Tier-2 audit
  # (docs/research/cross_asset_momentum_deep_lifecycle_audit_2026-06-21.md, P8-07). The prior
  # 50/12 kills were calibrated (2026-06-14) to the RETIRED single-sleeve daily-rescale render
  # (42.8% DD / -9.77% day); the executor now runs the momentum + rates-carry fund-of-funds at
  # ~20.28% historical max DD / -5.14% worst day, so 50/12 sat at ~2.5x the real tail and a
  # 30-40% break (a genuine "edge gone / executor broken") passed silently. Kills now sit just
  # ABOVE the 2-sleeve render's extremes: a normal worst-case does not trip, a genuine break does.
  # `calibrated_for_sleeves` pins the composition these were derived against — the soak gate
  # FAILs if the executor runs a DIFFERENT sleeve set (e.g. the +VRP combined PortfolioExecutor
  # book, which needs its own calibration), so a mis-scoped kill cannot be silently trusted.
  risk:
    max_drawdown_kill_pct: 25.0          # > 2-sleeve render max DD 20.28% (+~23% headroom); trips a 30%+ break
    max_gross_exposure: 3.3              # env caps gross at 3.0 (env.max_gross_exposure) + ~10% margin; realized ~3.00
    daily_loss_halt_pct: 7.0             # > 2-sleeve render worst day -5.14% (+~36% headroom); trips an 8%+ day
    calibrated_for_sleeves: [momentum, rates_carry]   # composition the kills were derived against (P8-07 cross-check)

  # --- diversification / regime drift (the north-star: an UNCORRELATED sleeve) ---
  drift:
    # RECALIBRATED 2026-06-21 (P11-03): window 60d -> 252d. A trailing-60d corr fired on
    # 51% of the strategy's own clean 2006-2026 history (pure short-window noise, p95|corr|=0.80);
    # it cannot distinguish regime DRIFT from coincidence. 252d is stable (rolling p50~0.00) yet
    # responsive to a multi-year regime shift, which is what this monitor is for. The 0.08 in the
    # old comment was the monthly-frozen core; the daily-rescale render the executor actually
    # shadows is -0.19 full-sample. See paper_soak_provenance.recalibration_2026_06_21.
    max_corr_to_spy: 0.40                # 252d trailing daily-return corr to SPY -> trip REVIEW (severity=review)
    corr_window_days: 252
    max_single_class_pnl_share: 0.60     # no asset class supplies > 60% of cumulative P&L
    sleeve_attribution_required: true    # per-class (equity/rates/commodity/fx) P&L logged each rebalance
    # MS-ADR-7 (S553-cont-68): realized-returns closure of the WF manifest's DEFERRED
    # g_diversification. |corr(return-stream sleeve, allocator book)| AND |corr(sleeve, SPY)|
    # over corr_window_days must stay under this. Inert for the 2-sleeve allocator path (no
    # return-stream sleeve); binds for the combined VRP book (PortfolioExecutor). REVIEW.
    max_corr_between_sleeves: 0.30

  # --- BACKSTOP: long-horizon performance floor (NOT a short-soak trigger) ---
  # Calibrated to the HONEST band (net SR 0.4-0.6), NOT the in-sample 0.60
  # headline (curation flattered it ~0.2). The floor sits BELOW the band's lower
  # edge so it fires only on genuine edge loss, not normal live underperformance.
  performance:
    rolling_sharpe_floor: 0.30           # trailing live net SR below this -> review (not auto-kill)
    rolling_sharpe_window_months: 12     # trailing window for the SR estimate
    min_months_for_sharpe: 12            # gate = UNKNOWN_INSUFFICIENT_DATA until this many monthly returns
    honest_band: [0.40, 0.60]            # reference expectation (net SR, ~10% vol) - NOT a gate value
    # PSR / MinTRL confidence control (Bailey & Lopez de Prado 2012; P11-05, wired step-4
    # S553-cont-57). A monthly core makes a short-soak POINT Sharpe meaningless, so the
    # principled backstop is PSR(SR>benchmark) = the probability the edge is real, with MinTRL
    # = the track length needed to confirm it. The code uses the PER-PERIOD Sharpe in the SE
    # (periods_per_year=1, MATH-S08 — annualizing saturates the CDF); psr_benchmark is a
    # per-period bound. REVIEW severity (never auto-kill); a below-floor PSR surfaces a
    # low-confidence edge.
    psr_benchmark: 0.0                   # PSR tests per-period SR > 0 (the edge is positive)
    min_psr: 0.95                        # < 95% confidence SR>0 over the trailing window -> review
    mintrl_confidence: 0.95              # MinTRL reports months-to-confirm at this confidence

  # --- RETURN-STREAM SLEEVE TAIL (VRP short-vol monitor; MS-ADR-7, S553-cont-68) ---
  # Surfaced + checked for each return-stream sleeve in the COMBINED multi-sleeve book
  # (review severity). Mirrors configs/options_vol_harvest.gates.yaml `tail` so the soak
  # re-checks the short-vol kills on realized combined returns. Inert for the 2-sleeve
  # allocator path (no return-stream sleeve).
  sleeve_tail:
    cvar95_floor_pct: -8.0               # daily CVaR95 must stay >= this (short-vol left tail)
    max_net_vega_per_100k: 50000         # net vega per $100k cap
    max_worst_window_dd_pct: 25.0        # worst per-sleeve drawdown cap

paper_soak_provenance:
  drafted_on: '2026-06-12'
  drafted_by_session: S553-cont-44
  rationale: >-
    Item 2 of the pre-paper TSMOM hardening list. Primary gate is execution
    parity because the monthly core makes short-soak Sharpe unmeasurable;
    Sharpe floor calibrated to the Fable honest band (0.4-0.6), not in-sample.
  wiring_pending: >-
    paper executor + live-monitor (item 4). Until wired, this block is a frozen
    pre-registration, not an enforced gate. A validate_config presence-check may
    be added when the allocator live config is built.
  recalibration_2026_06_14:
    session: S553-cont-47
    audit_ref: docs/research/cross_asset_momentum_paper_rung1_deep_lifecycle_audit_2026-06-14.md
    decision: >-
      Operator Option A (recalibrate the risk kills to the env-path daily-rescale render;
      keep the 2026-06-13 daily-vol-rescale decision; Option B portfolio-vol overlay
      declined). The strategy the executor actually shadows is the daily-rescale render of
      the frozen core: net SR ~0.441 (inside the Fable honest band [0.40,0.60]), ~19.6% vol,
      42.8% historical max DD, -9.77% worst day - NOT the monthly-frozen GO headline (SR
      0.601). The pre-registered 20% DD / 4% daily-loss kills were calibrated to a
      ~10%-vol/22%-DD book, so the strategy FAILed its own risk gates on its own history.
    changes:
      max_drawdown_kill_pct: {from: 20.0, to: 50.0}
      daily_loss_halt_pct: {from: 4.0, to: 12.0}
      max_gross_exposure: {from: 6.0, to: 3.3}
    note: >-
      This is a LOOSENING under the "do not loosen without a dated memo" rule: the kills are
      raised above the historical extremes so they fire only on a genuine break, the
      documented consequence of accepting the high-DD daily-rescale sleeve (Option A). Two
      related calibration items are TRACKED for a follow-up, NOT changed here: the drift
      corr-to-SPY gate (60d rolling vs the 0.08 full-sample reference, P11-03 - RESOLVED
      2026-06-21, see recalibration_2026_06_21) and wiring the existing PSR/MinTRL control
      into the performance backstop (P11-05).
  recalibration_2026_06_21:
    session: S553-cont-57
    resolves: P11-03 (deferred by recalibration_2026_06_14)
    runner: scripts/run_cross_asset_paper_validation.py
    evidence: C:/tmp/corr_spy_calibration_probe.py (full forward-path render, 5146 daily steps)
    decision: >-
      Operator-approved metric fix (NOT a loosening): switch the drift corr-to-SPY window from
      60d to 252d; threshold unchanged at 0.40. The 60d single-window metric was mis-specified -
      it fired on 51% of the strategy's own clean 2006-2026 history (rolling-60d p50=0.11,
      p90=0.63, p95=0.71, max=0.94), so it measured short-window noise, not regime drift. A
      252d trailing window is well-behaved (rolling p50~0.00, p90=0.51) and still responsive to
      a multi-year regime shift, which is this monitor's stated purpose.
    changes:
      corr_window_days: {from: 60, to: 252}
      max_corr_to_spy: {from: 0.40, to: 0.40}   # threshold UNCHANGED - this is a metric fix
    measured:
      full_sample_corr: -0.19          # structural / life-of-strategy (the real "uncorrelated" basis)
      trailing_252d_corr: 0.53         # current value under the new metric -> REVIEW
      trailing_504d_corr: 0.59
    note: >-
      NOT a loosening: the threshold is unchanged and the new metric STILL trips (252d=0.53 >
      0.40 -> REVIEW). This is deliberate and correct. The sleeve is structurally uncorrelated
      over its life (-0.19) but has genuinely drifted to ~0.5 SPY-correlation over the last ~2
      years (equity-momentum + rates legs both risk-on). That is a REAL finding, not noise;
      severity=review surfaces it as a documented known-issue to watch into paper WITHOUT
      blocking. Per the "do not tune away a real signal" intent of the dated-memo rule, the
      verdict is left at REVIEW rather than recalibrated to PASS. Capital promotion remains
      BLOCKED pending the rung-1 step-4 Tier-2 gate regardless.
  step4_hardening_2026_06_21:
    session: S553-cont-57
    resolves: P8-06 (two-sided cost band) + P11-05 (PSR/MinTRL backstop)
    audit_ref: docs/research/cross_asset_momentum_paper_rung1_deep_lifecycle_audit_2026-06-14.md
    decision: >-
      Step-4 forward-path hardening (the rung-1 Tier-2 gate items that block paper-CAPITAL).
      ADDITIONS / TIGHTENINGS only — NOT a loosening, but logged under the dated-memo rule:
      (1) parity.min_cost_drift_ratio=0.50 closes the one-sided cost gate (P8-06): a rung-2
      under-/non-trading book (realized cost ~0, weights in tolerance) now FAILs parity instead
      of passing trivially; inert in rung-1 sim where cost_drift==1.0 by construction.
      (2) performance.{psr_benchmark,min_psr,mintrl_confidence} wire the in-repo
      crypto/eval/statistics.probabilistic_sharpe_ratio + the new min_track_record_length into
      the performance backstop (P11-05) at periods_per_year=252 — a skew/kurtosis-adjusted
      confidence statement replacing the bare rolling-Sharpe floor. REVIEW severity (never
      auto-kills); the rolling_sharpe_floor is retained alongside.
    changes:
      min_cost_drift_ratio: {from: null, to: 0.50}
      psr_benchmark: {from: null, to: 0.0}
      min_psr: {from: null, to: 0.95}
      mintrl_confidence: {from: null, to: 0.95}
    note: >-
      Math-gated (PSR + MinTRL formulas) and Audit-gated on commit. Capital promotion remains
      BLOCKED pending the operator-triggered Tier-2 deep-lifecycle re-audit at the stakes gate;
      this memo records the gate-definition change, not a promotion.
  recalibration_2026_06_23:
    session: S553-cont-58
    resolves: P8-07 (stale risk kills calibrated to the retired single-sleeve render)
    audit_ref: docs/research/cross_asset_momentum_deep_lifecycle_audit_2026-06-21.md
    decision: >-
      Re-derive the always-on DD / daily-loss kills against the TWO-SLEEVE fund-of-funds render
      the executor now produces (momentum + rates-carry, the path live_cross_asset_paper.yaml
      drives), NOT the retired single-sleeve daily-rescale render the 2026-06-14 memo assumed.
      The render evolved (single-sleeve daily-rescale -> 2-sleeve FoF) but the kills did not, so
      50/12 sat at ~2.5x the actual 2-sleeve tail and a 30-40% DD (a genuine break for THIS book)
      passed silently. This is a TIGHTENING (not a loosening): the kills move DOWN toward the
      real tail. Numbers from the forward-path render (run_cross_asset_paper_validation,
      5148 daily steps): max DD 20.28%, worst day -5.14%, realized gross ~3.00.
    changes:
      max_drawdown_kill_pct: {from: 50.0, to: 25.0}    # > render 20.28% + ~23% headroom
      daily_loss_halt_pct: {from: 12.0, to: 7.0}       # > render 5.14% + ~36% headroom
      calibrated_for_sleeves: {from: null, to: [momentum, rates_carry]}
    measured:
      two_sleeve_render_max_dd_pct: 20.28
      two_sleeve_render_worst_day_pct: -5.14
      two_sleeve_render_max_gross: 3.00
    cross_check: >-
      `risk.calibrated_for_sleeves` is now enforced by soak_metrics.evaluate_paper_soak_gates:
      the risk group FAILs if the executor's actual sleeve composition differs from the one the
      kills were derived against. The +VRP combined PortfolioExecutor book
      (live_multi_sleeve_paper.yaml, which also reads this gates file) therefore trips the
      cross-check until it gets its OWN risk calibration — TRACKED (cont-68+), out of this
      memo's 2-sleeve scope, NOT silently trusted.
    note: >-
      Audit-gated on commit. Kills sit ABOVE every historical extreme of the 2-sleeve render so
      they signal "edge gone or executor broken", not a normal drawdown. Capital promotion
      remains BLOCKED pending the operator Tier-2 stakes gate; this records the gate change.
