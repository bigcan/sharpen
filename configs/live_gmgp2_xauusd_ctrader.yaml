# Live Trading Config — GMGP2-XAUUSD SAC on Gold CFD via cTrader (IC Markets / FTMO)
# Seed 456 checkpoint (test PF 2.12, Sharpe 3.30, MDD -1.33%)
# HPs from T24 best trial (GMGP2-XAUUSD HPO, run v45etaie)
#
# Usage:
#   python scripts/run_live_ctrader.py --config configs/live_gmgp2_xauusd_ctrader.yaml
#   python scripts/run_live_ctrader.py --config configs/live_gmgp2_xauusd_ctrader.yaml --mainnet
#   python scripts/run_live_ctrader.py --config configs/live_gmgp2_xauusd_ctrader.yaml --dry-run
#
# cTrader credentials via env vars:
#   CTRADER_CLIENT_ID, CTRADER_CLIENT_SECRET, CTRADER_ACCESS_TOKEN, CTRADER_ACCOUNT_ID

# --- cTrader Connection ---
exchange:
  name: "ctrader"
  testnet: true                        # true=IC Markets demo, false=FTMO live
  asset: "XAUUSD"

# --- Contract Specification ---
contract:
  symbol: "XAUUSD"
  lot_size: 100                        # 1 standard lot = 100 oz
  min_lot: 0.01                        # 0.01 lots = 1 oz minimum
  tick_size: 0.01                      # CFD tick ($0.01 vs CME $0.10)
  leverage: 1                          # 1:1 (user policy — FTMO 1:30 is cap not floor)
  order_type: "MKT"                    # Market orders (CFD spreads tight enough)
  market_fallback_timeout: 10.0

# --- Agent ---
agent:
  checkpoint_path: "checkpoints/gmgp2-xauusd-l1-multiseed_20260403_083331/checkpoint_final.pth"
  device: "cpu"
  torch_compile: false                 # Must be false for live inference

# --- SAC Hyperparameters (T24 best trial — must match training checkpoint) ---
agents:
  sac:
    lr_actor: 0.000728
    lr_critic: 0.000130
    lr_alpha: 0.0000165
    gamma: 0.9638
    tau: 0.00820
    batch_size: 512
    buffer_size: 100
    initial_alpha: 0.0536
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 7.967

# --- Network (must match training checkpoint exactly) ---
network:
  obs_mode: "summary_stats"
  summary_input_dim: 50
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

# --- Features (must match training config) ---
features:
  scales: [15, 60, 240]
  window_size: 30
  features_per_scale: 8
  asset_class: "cfd_gold"
  obs_mode: "summary_stats"
  summary_feature_indices: [0, 1, 2, 6, 7]
  norm_span: 120
  bootstrap_bars: 30000

# --- Bar Clock (CFD 24h market) ---
bar_clock:
  base_interval_minutes: 15
  execution_delay_seconds: 5.0
  max_late_seconds: 30.0

# --- Trading ---
trading:
  initial_balance: 200000.0            # IC Markets demo (FTMO: change to 100000)
  deadband_threshold: 0.25
  taker_fee: 0.00015                   # 1.5bps effective spread
  weekend_flatten:
    enabled: true
    minutes_before_close: 30           # Flatten 30 min before Friday close

# --- Hard Constraints (match training) ---
env:
  stop_loss_bps: 125
  max_holding_bars: 15
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  max_drawdown_pct: 0.10

# --- Risk Management (FTMO-safe limits) ---
risk:
  enabled: true
  max_drawdown_pct: 0.08               # 8% hard stop (2% below FTMO 10% limit)
  circuit_breaker_cooldown_bars: 12
  max_position_pct: 1.0
  funding_rate_alert: 999.0
  min_margin_reserve_pct: 0.10

# --- WandB Monitoring ---
wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  tags: ["live", "paper", "gmgp2-xauusd", "cTrader", "XAUUSD", "Gold", "SAC", "15min",
         "CFD", "FTMO", "summary-stats", "hard-constraints", "seed-456"]

# --- Safety ---
safety:
  require_explicit_mainnet: true
  max_daily_loss_pct: 0.04             # 4% daily loss (1% below FTMO 5% limit)
  kill_file: "/tmp/finrl_live_gmgp2_xauusd_kill"  # FIX CRIT-02: was shared with GMGP1
  emergency_flatten_on_error: true

# --- PRISM Regime Overlay (L2 position sizing) ---
prism:
  enabled: false
  base_url: "http://prism-api:8001"
  api_key: ""
  ticker: "XAUUSD=X"
  timeframe: "daily"
  timeout: 5
  cache_ttl: 60
  crisis_flatten: true
  multipliers:
    LOW_VOL: 1.3
    NORMAL_VOL: 1.0
    HIGH_VOL: 0.3
