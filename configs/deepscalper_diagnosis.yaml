# DeepScalper Diagnosis Config (Frozen Agent Check)
# Based on Production Config, but forcing Batch Size 64 to mimic successful HPO trial.
# Disabling HPO to directly test the parameter.

data:
  file_path: "data/btc_lob_jan2023.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2023-01-10 00:00:00"
  train_end_date: "2023-01-18 23:59:59"
  val_start_date: "2023-01-19 00:00:00"
  val_end_date: "2023-01-19 23:59:59"
  test_start_date: "2023-01-20 00:00:00"
  test_end_date: "2023-01-20 23:59:59"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  transaction_fee: 0.001 
  num_envs: 12            
  window_size: 50
  max_drawdown_pct: 0.20
  
  reward:
    profit_weight: 1.0
    hindsight_weight: 0.1     
    hindsight_horizon: 180    
    volatility_horizon: 100
    
  action:
    direction_bins: 3 
    price_bins: 5     
    volume_bins: 5    
    max_position: 5.0 

network:
  micro_config:
    input_size: 27
    private_input_size: 2
    hidden_size: 256
    rnn_type: "LSTM"
    
  macro_config:
    input_size: 11
    hidden_sizes: [256, 128] 

agents:
  bdq:
    learning_rate: 0.0001
    gamma: 0.995 
    auxiliary_weight: 1.0 
    
    # HYPOTHESIS TEST: Batch Size 64 (vs 256 in production failure)
    batch_size: 64
    
    update_interval: 2.0 
    buffer_size: 2000000 
    target_update_freq: 7500
    checkpoint_interval: 5000 # More frequent checkpoints for short run
    learning_starts: 1000     # Start learning sooner
    exploration_fraction: 0.2
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.9995   # Faster decay for short run importance

training:
  total_timesteps: 50000    # Short run (just enough to see trades)
  log_interval: 100
  
  torch_compile: true
  use_amp: true
  use_shm: true
  
hpo:
  enabled: false # Direct training test

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["Diagnosis", "FrozenAgent", "Batch64"]
