
# DeepScalper Stabilization Config — BDQ Agent
# Purpose: Verify fixes for "Negative Equity" and "Random Backtest" bugs.
# Focus: Stable training without instant drawdown stops.

data:
  file_path: "data/processed/btc_2025_jan_jun.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-02-28 23:59:59"
  val_start_date:   "2025-03-01 00:00:00"
  val_end_date:     "2025-03-15 23:59:59"
  test_start_date:  "2025-03-16 00:00:00"
  test_end_date:    "2025-03-31 23:59:59"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  margin_requirement: 1.0    # Spot (no leverage)
  maker_fee: 0.0002          # 2 bps (Binance VIP1)
  taker_fee: 0.0004          # 4 bps (Binance VIP1)
  num_envs: 8                # Parallel environment (Safer limit)
  window_size: 15
  max_drawdown_pct: 1.0      # Disabled for training (check only at 100% loss)
  private_state_augment_prob: 0.5 # Reduced from 1.0 to allow 50% natural starts

  reward:
    scaling: 1.0
    hindsight_weight: 0.1
    hindsight_horizon: 180
    volatility_horizon: 100
    sharpe_weight: 0.0
    hold_bonus_bps: 0.0

  action:
    price_bins: 5
    signed_qty_proportions: [-0.5, -0.2, -0.1, -0.05, 0.0, 0.05, 0.1, 0.2, 0.5]
    max_position: 1.0

  augmentation:
    enabled: true
    volatility_scale_range: [0.7, 1.5]
    spread_scale_range: [0.9, 1.2]
    volume_noise_std: 0.1
    macro_noise_std: 0.05
    ofi_scale_range: [0.9, 1.1]

network:
  micro_config:
    input_size: 30
    private_input_size: 3
    hidden_size: 256
    rnn_type: "LSTM"

  macro_config:
    input_size: 15
    hidden_sizes: [256, 128]

agents:
  bdq:
    learning_rate: 0.0001
    gamma: 0.99
    auxiliary_weight: 0.1
    update_interval: 0.25
    batch_size: 1024
    buffer_size: 2000000
    target_update_freq: 7500
    tau: 0.005
    checkpoint_interval: 50000
    learning_starts: 5000
    exploration_fraction: 0.5
    epsilon_start: 1.0
    epsilon_end: 0.005
    epsilon_decay: 0.999908
    exploration_mode: "epsilon_greedy"
    target_q_clip: 5000.0
    use_per: true
    per_alpha: 0.6
    per_beta_start: 0.4
    per_beta_frames: 100000

training:
  total_timesteps: 200000      # 200K steps
  training_epochs: 3
  log_interval: 50000
  torch_compile: true
  use_amp: true
  use_shm: false
  use_sync: false            # Keep Async but without SHM for stability
  verbose_logging: true

hpo:
  enabled: true
  n_trials: 10
  steps_per_trial: 50000

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["stabilize", "BDQ", "2025-Q1", "v2-pipeline-fixed", "post-fix"]
