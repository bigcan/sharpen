# GMGP1-BTC Q1 2026 OOS Backtest — regime-drift quantification
# Checkpoint: gmgp1-btc-l1-multiseed_20260407_070227 (seed 123, Dec 2025 OOS PF=2.19)
# Test window: 2026-01-01 → 2026-04-12 (entirely unseen — trained through 2025-10-31)
# Base: configs/gmgp1_btc_l1_multiseed.yaml (copied verbatim except data block)

data:
  file_path: "data/bitfinex/btc_usdt_perp_2025_2026q1_1min.parquet"
  ticker: "BTC"
  handler_type: "multiscale"
  train_start_date: "2025-01-06"
  train_end_date: "2025-10-31"
  val_start_date: "2025-11-01"
  val_end_date: "2025-11-30"
  test_start_date: "2026-01-01"
  test_end_date: "2026-04-12"

features:
  scales: [15, 60, 240]
  window_size: 30
  features_per_scale: 8
  asset_class: "crypto"

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.0005
  deadband_threshold: 0.25
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 500
  random_start: false
  max_drawdown_pct: 0.10
  scales: [15, 60, 240]
  reward:
    mode: "dsr"
    dsr_eta: 0.0095288
    dsr_scale: 1.0
    hindsight_weight: 0.0           # BUG-03
  fee_schedule:
    - {step: 0, taker_fee: 0.0005}  # flat 5bps for backtest

network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

agents:
  sac:
    lr_actor: 0.00050182
    lr_critic: 0.000027779
    lr_alpha: 0.0000035704
    gamma: 0.97127
    tau: 0.0038951
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.49701
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 3.0198
    checkpoint_interval: 250000

training:
  total_timesteps: 0
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: false
  num_envs: 1

hpo:
  enabled: false

wandb:
  project: "FinRL-Pro-DS"
  tags: ["gmgp1-btc", "BTC", "SAC", "15min", "backtest", "q1-2026-oos",
         "regime-drift", "l1-seed123"]
