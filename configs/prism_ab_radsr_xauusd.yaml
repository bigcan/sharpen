# PRISM A/B Path 2 — Regime-Adaptive DSR
# Baseline: gmgp2_xauusd_sac_15min.yaml (WandB 1fprvttn, HPO PF=2.886, test PF=2.208)
# Treatment: DSR eta adapts to GAHMM vol regime — slower in HIGH_VOL (avoid noise chasing),
#            faster in LOW_VOL (react to cleaner signals)
# Hypothesis: Vol-regime-aware reward smoothing produces better risk-adjusted returns
# Gate: Sharpe delta > 0 vs baseline + per-regime PF breakdown (all 3 vol regimes positive)
# Zero inference-time changes — only reward computation differs

data:
  file_path: "data/cme/gc_2025_lob1_1min_stitched.parquet"
  ticker: "XAUUSD"
  handler_type: "multiscale"
  train_start_date: "2025-01-06"
  train_end_date: "2025-08-31"
  val_start_date: "2025-09-01"
  val_end_date: "2025-10-31"
  test_start_date: "2025-11-01"
  test_end_date: "2025-12-31"

features:
  scales: [15, 60, 240]
  window_size: 30
  features_per_scale: 8
  asset_class: "cfd_gold"
  obs_mode: "summary_stats"
  summary_feature_indices: [0, 1, 2, 6, 7]
  # PRISM regime codes: loaded for regime-adaptive DSR (NOT injected into obs)
  prism_features_path: "results/prism_research/prism_features_gc_2025.parquet"

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.0
  deadband_threshold: 0.25
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 500
  random_start: true
  max_drawdown_pct: 0.10
  scales: [15, 60, 240]
  stop_loss_bps: 50
  stop_loss_hpo: true
  max_holding_bars: 20
  max_holding_hpo: true
  obs_mode: "summary_stats"
  summary_feature_indices: [0, 1, 2, 6, 7]
  # prism_enabled: false — obs space unchanged from baseline (50 dims)
  reward:
    mode: "dsr"
    dsr_eta: 0.001
    dsr_scale: 1.0
    # Path 2: Regime-adaptive DSR
    regime_adaptive_dsr: true
    regime_eta_multipliers:
      LOW_VOL: 2.0      # Low-vol → 2x learning rate (cleaner signal, react faster)
      NORMAL_VOL: 1.0   # Baseline — no change
      HIGH_VOL: 0.3     # High-vol → 0.3x learning rate (noisy, avoid chasing)
    regime_blend: 0.5    # 50% blend between base and regime-adaptive eta
  fee_schedule:
    - {step: 0, taker_fee: 0.0}
    - {step: 500000, taker_fee: 0.0, ramp_to: 0.00015, ramp_end_step: 1500000}
    - {step: 1500000, taker_fee: 0.00015}

network:
  obs_mode: "summary_stats"
  summary_input_dim: 50
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

agents:
  sac:
    lr_actor: 0.0003
    lr_critic: 0.0003
    lr_alpha: 0.0003
    gamma: 0.99
    tau: 0.005
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.2
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 5.0
    checkpoint_interval: 250000

training:
  total_timesteps: 5000000
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: true
  num_envs: 20

hpo:
  n_trials: 50
  steps_per_trial: 750000

wandb:
  project: "FinRL-Pro-DS"
  tags: ["prism-ab", "prism-path2", "regime-adaptive-dsr", "radsr",
         "gmgp2-xauusd", "Gold", "SAC", "15min", "CFD", "FTMO", "xauusd",
         "proxy-cme", "summary-stats", "hard-constraints",
         "alphaseek-informed", "DSR", "FeeCurriculum", "swing"]
