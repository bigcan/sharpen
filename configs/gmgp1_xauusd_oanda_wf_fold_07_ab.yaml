# GMGP1-XAUUSD WF fold-07 prop-firm-decoupling A/B config (OANDA)
# INTENTIONAL: legacy V7 control arm — DO NOT MIGRATE to env.risk:.
# This file MUST keep env.prop_firm: so arm A exercises PropFirmWrapperV7;
# arm B is mutated in-memory to env.risk: by _to_env_risk_config in
# scripts/prop_firm_ab_compare.py. Validator WARN on env.prop_firm is
# expected; future FAIL-escalation must skip this file via comment-marker
# or path-exclude.
#
# Purpose: Q1 ensemble A/B (scripts/prop_firm_ab_compare.py --arm ensemble)
# on the WF fold-07 deploy candidate ensemble [42, 3141, 2025] against the
# same OOS window the Stage 2.5 verdict consumed.
#
# Derived from gmgp1_xauusd_oanda_wf_fold_07_backtest.yaml; deltas:
#   - test_start/test_end pinned to the verdict's fold-7 test window
#     (2026-03-06 -> 2026-04-06) so A- and B-arm inference matches the
#     ensemble_report already on disk.
#   - Adds env.prop_firm: block (trial-10 FTMO rails) — see header.
#   - random_start: false (deterministic backtest for A/B parity).

data:
  file_path: "data/oanda/xauusd_m15_m.parquet"
  ticker: "XAUUSD"
  handler_type: "multiscale"
  # Train/val split carried through for LEAK-1 EMA-Z reset boundaries only.
  train_start_date: "2025-08-06"
  train_end_date: "2026-02-06"
  val_start_date: "2026-02-06"
  val_end_date: "2026-03-06"
  test_start_date: "2026-03-06"
  test_end_date: "2026-04-06"

features:
  scales: [15, 60, 240]
  window_size: 30
  features_per_scale: 8
  asset_class: "cfd_gold"

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8
  taker_fee: 0.000235
  deadband_threshold: 0.35
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 500
  random_start: false
  max_drawdown_pct: 0.10
  scales: [15, 60, 240]
  gap_detection: true
  gap_atr_mult: 3.0
  reward:
    mode: "dsr"
    dsr_eta: 0.008072070485679669
    dsr_scale: 1.0
    hindsight_weight: 0.0
  prop_firm:
    enabled: true
    profit_target_pct: 0.10
    max_trailing_drawdown_pct: 0.08
    max_daily_loss_pct: 0.04
    eod_hour_utc: 21
    drawdown_penalty_start: 0.04
    drawdown_penalty_scale: 5.0
    success_bonus: 10.0
    augment_obs: false
    static_peak: true

network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

agents:
  sac:
    lr_actor: 0.00048211947849186834
    lr_critic: 0.00023536913918894482
    lr_alpha: 0.0000023011482963674244
    gamma: 0.9734375919828845
    tau: 0.0056901039341825865
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.4568170758305432
    learning_starts: 5000
    update_interval: 4
    actor_update_freq: 2
    gradient_clip: 2.738336834748153
    checkpoint_interval: 250000

training:
  total_timesteps: 0
  log_interval: 1000
  use_amp: false
  torch_compile: false
  num_envs: 1

hpo:
  enabled: false

wandb:
  project: "FinRL-Pro-DS"
  tags: ["gmgp1-xauusd", "XAUUSD", "SAC", "15min", "CFD", "ab-q1-ensemble",
         "wf-stage3", "fold-07", "prop-firm-decoupling", "oanda-xau-spot"]
