# DeepScalper Unified Master Configuration
# Optimized for NVIDIA RTX 5090 - DeepScalper V1 Standard Profile

data:
  file_path: "data/btc_lob_jan2023.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2023-01-09"
  train_end_date: "2023-01-18"
  val_start_date: "2023-01-19"
  val_end_date: "2023-01-20"
  test_start_date: "2023-01-21"
  test_end_date: "2023-01-22"

features:
  micro_features: ["micro"] # Column prefixes
  macro_features: ["macro"]
  private_features: ["position", "balance"]

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  transaction_fee: 0.0001
  num_envs: 16            # GPUHub stable limit (16 with AsyncVectorEnv)
  window_size: 50
  
  reward:
    profit_weight: 1.0
    volatility_penalty_weight: 0.1
    volatility_horizon: 100
    risk_aversion: 0.5
    
  action:
    direction_bins: 3 # Buy, Hold, Sell
    price_bins: 5     # Limit Order Aggressiveness
    volume_bins: 5    # Order Size Fractions

network:
  # Standard V1 MLP Architecture
  micro_config:
    input_size: 20
    private_input_size: 2
    hidden_size: 128      # Standard V1
    
  macro_config:
    input_size: 11
    hidden_sizes: [512, 256] # Standard V1


agents:
  dqn:
    learning_rate: 0.0001
    gamma: 0.99
    dqn_batch_size: 64
    dqn_buffer_size: 100000
    dqn_target_update_freq: 1000
    
  ppo:
    learning_rate: 0.0001
    gamma: 0.99
    entropy_coef: 0.01
    clip_epsilon: 0.2
    
  a2c:
    learning_rate: 0.0001
    gamma: 0.99
    
  gating:
    learning_rate: 0.0001

training:
  total_timesteps: 2000000
  batch_size: 8192      # Optimized (Blackwell)
  update_interval: 8192 # Matched to Batch Size
  learning_rate: 0.0001
  dqn_update_interval: 1.0 
  log_interval: 1000
  checkpoint_interval: 10000
  torch_compile: true   # Enabled for Speed
  use_amp: true         # Enabled for Mixed Precision
  use_shm: false        # Keep Disabled (ABI Conflict Risk)

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["Unified", "RTX5090", "DeepScalperV1"]
