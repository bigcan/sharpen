# Live Trading Config — SG-1 BTC SAC via Bybit Mainnet Demo (DECAY-01 solo cutover)
# 3-min bars, signal-gated, prop-firm trained (10% EOD trailing DD).
#
# Filename: renamed S551-cont-9 (2026-05-28) from `live_sg1_btc_binance.yaml` to
# match the actual venue. Historical lineage: Binance demo (S498) → Bybit testnet
# (2026-05-02) → Bybit mainnet demo (2026-05-04, S527-cont). The
# `live_sg1_btc_binance.yaml` name persisted as a stub on the working tree to
# avoid disrupting `docker-compose.yaml` STRATEGY_CONFIG + runbook scripts. Now
# updated atomically with the rename. Legacy filename pointer in memory at
# reference_live_config_filename_legacy_s551.md.
#
# Triggered by SG1BTC-DECAY-01 retrain (n=88 perfect-fill re-audit fired the
# decay gate, project_sg1_btc_n50_audit_20260511); Stage 3 WF 8-fold ensemble
# eval verdict = `reject_ensemble_use_best_solo` (G1/G4/G5 PASS, G2 1/8 FAIL,
# G3 uplift 0.866x < 1.10). Solo bundle on seed 456 fold_07 checkpoint owns
# the freshest training cutoff (2026-02-01) and tops fold_07 pf_bar (2.524
# vs solo_42 2.484 / solo_2025 2.363, plus all 4 ensemble rules).
#
# Sister config: configs/live_sg1_btc_dxtrade.yaml (Velotrade DXtrade execution,
# activated once Bybit mainnet-demo soak validates this strategy/checkpoint pair).
#
# ---------------------------------------------------------------------------
# PROP-FIRM DECOUPLING (S498-cont Step 5, 2026-04-25).
# Phase-varying DD/target/gates live in configs/deploy/velotrade/<phase>.yaml
# overlays. Even on paper Bybit mainnet-demo we use the Velotrade overlay so
# the challenge state machine + drift gates exercise the same code paths the
# live DXtrade deploy will hit.
#
# Deploy invocations (resolved = this file + overlay):
#   python scripts/deploy_bare_metal.py --script scripts/run_live.py \
#     --config configs/live_sg1_btc_bybit.yaml --overlay velotrade/step1
#
# After Step 5 migration this BASE file alone is NOT paper-deployable
# (validator FAILs: `risk.static_peak` missing); pair with an overlay.
# ---------------------------------------------------------------------------
#
# Auth: BYBIT_TESTNET_API_KEY/SECRET env vars (compose maps
# SG1_BTC_BYBIT_TESTNET_* to the runner-expected names so SG-1 + GMGP1 testnet
# accounts stay isolated). Read by ExchangePerpBroker testnet branch.

# --- Exchange ---
exchange:
  name: "bybit"
  testnet: false
  demo: true                           # ccxt enable_demo_trading(True) -> api-demo.bybit.com
  asset: "BTC"
  leverage: 1                          # 1:1 (user policy — Velotrade 6x is cap not floor)
  order_type: "limit"
  limit_offset_pct: 0.0005
  market_fallback_timeout: 60.0
  data_exchange: "bybit"

# --- Agent (v2.3 atomic-swap bundle: SG1BTC-DECAY-01 SOLO seed 456) ---
# Loaded from bundle baked into image at /app/bundles/sg1_btc_velotrade_decay01/.
# - DECAY-01 L1 N=10 (S541): test-PF CV 0.82% (10x tighter than S535 extended).
# - Stage 2.5-R bootstrap PRIMARY (S542): P(ens > solo) = 0.650 < 0.75 floor
#   -> SOLO_BEST_FALLBACK on seed 456 (val_argmax_pf 2.529, test PF 2.456).
# - Stage 3 WF 8-fold (S548): G1/G4/G5 PASS; G2 1/8 FAIL; G3 uplift 0.866x
#   (median ens_pf 2.040 vs median best-solo PF 2.357); G5 cv_pf 0.053.
#   Decision: reject_ensemble_use_best_solo.
# - Bundle SHA256: 7e8bdda31e536da1167e164bf9fbb8a864863e84df1f97be467ab817fa202a48
# - Manifest chosen_rule: ens_mean (degenerate for N=1; aggregator returns the
#   single seed's action unchanged).
# Predecessor: bundles/sg1_btc_velotrade_extended/ensemble_v2.tar.gz
#   (ensemble_v2 / ens_mean override; LIVE since 2026-05-08, halted on
#   2026-05-11 n=88 re-audit firing SG1BTC-DECAY-01 retrain trigger).
agent:
  checkpoint_path: ""
  device: "cpu"
  torch_compile: false
  ensemble:
    bundle_path: "/app/bundles/sg1_btc_velotrade_decay01/solo_v1.tar.gz"
    aggregation_rule: "ens_mean"       # degenerate for N=1; matches manifest.chosen_rule
    require_normalizers: false         # bundle has normalizer_sha256: MISSING; norm_warmup pkl supplied below

# --- SAC Hyperparameters (live-engine ctor stubs; runtime weights come from bundle) ---
agents:
  sac:
    lr_actor: 0.0003
    lr_critic: 0.0003
    lr_alpha: 0.0003
    gamma: 0.99
    tau: 0.005
    batch_size: 512
    buffer_size: 100
    initial_alpha: 0.2

# --- Network (must match training checkpoint exactly) ---
network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

# --- Features (SG-1 3-min multi-scale — must match training) ---
features:
  scales: [3, 15, 60]
  window_size: 30
  features_per_scale: 8
  asset_class: "crypto"
  norm_span: 120
  bootstrap_bars: 30000
  # S509 train-serve EMA-Z parity. DECAY-01 fold_07 training data ends
  # 2026-02-01, 1mo later than the L1 seed42 pkl previously bind-mounted
  # here. Regenerated via:
  #   python scripts/extract_norm_warmup_buffer.py \
  #     --config configs/sg1_btc_velotrade_decay01_wf_multiseed.yaml \
  #     --seeds 456 --train_end_date 2026-02-01 \
  #     --ckpt_path_glob "checkpoints/sg1-btc-decay01-wf-fold7-seed{seed}_*/checkpoint_final.pth"
  # Image build must COPY this checkpoint dir into /app/checkpoints/ so the
  # pkl is reachable at the path below.
  norm_warmup_path: "/app/checkpoints/sg1-btc-decay01-wf-fold7-seed456_20260521_230637/norm_warmup_3-15-60.pkl"

# --- Signal Gate (must match training) ---
signal_gate:
  enabled: true
  gate_mode: "composite"
  atr_threshold: 0.15
  parkinson_threshold: 0.0009
  volume_threshold: 0.60
  max_hold_bars: 20
  gate_always_on_first: true
  normalize_accumulated_reward: true

# --- Bar Clock (3-min bars for SG-1, 24/7 market) ---
bar_clock:
  base_interval_minutes: 3
  execution_delay_seconds: 5.0
  max_late_seconds: 30.0

# --- Trading ---
trading:
  initial_balance: 50000.0
  deadband_threshold: 0.25
  taker_fee: 0.0005

# --- Data source (validator Stage-0; ccxt live-fetch at runtime) ---
data:
  source: ccxt
  data_exchange: bybit
  frequency: 3m
  ticker: "BTC/USDT"

# --- Hard Constraints (validator parity; mirrors trading.taker_fee) ---
env:
  taker_fee: 0.0005

# --- Risk Management (universal live safety; phase-varying keys come from overlay) ---
risk:
  enabled: true
  max_drawdown_pct: 0.08
  circuit_breaker_cooldown_bars: 0
  max_position_pct: 1.0
  max_net_short_exposure: -1.0
  max_gross_exposure: 1.0
  funding_rate_alert: 999.0
  min_margin_reserve_pct: 0.15
  daily_turnover_limit: 10.0
  soft_throttle_start: 0.8
  # SG1BTC-DECAY-01 cooldown (decision_sg1_btc_skip_first_3_trades_s538).
  # Skip the first 3 trades after each container restart — first-3-trade
  # live PnL is -$45 vs perfect-fill +$12 over 5 legs (4x execution skew
  # on weakly-conviction signals where alpha < 5bp limit-cross). Count-based,
  # no-look-ahead band-aid. Counter resets on fresh container start.
  # Implementation: live_engine.py:474-491 + skip block at post-deadband/post-risk
  # junction (shipped S542). Counter decrements only on would-be TRADES.
  post_restart_cooldown_bars: 3

# --- WandB Monitoring ---
wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  tags: ["live", "sg-1", "BTC", "SAC", "3min", "bybit-demo", "paper",
         "velotrade-overlay", "signal-gated", "prop-firm", "solo",
         "decay01", "seed-456"]
  run_id: "live-sg1-btc-bybit-demo-paper-solo-decay01-seed456"

# --- Safety ---
safety:
  require_explicit_mainnet: true
  max_daily_loss_pct: 0.0
  # S535-cont-6 (AUD-3): persistent /app/state volume so v2.2 §8.3 lockout
  # survives restart. kill_file_override defaults to ${kill_file}.override
  # so it inherits /app/state too — no separate line needed.
  kill_file: "/app/state/finrl_live_sg1_btc_kill"
  # v2.3 swap-handshake state on persistent state volume.
  last_bundle_file: "/app/state/finrl_live_sg1_btc_last_bundle"
  swap_approved_file: "/app/state/finrl_live_sg1_btc_swap_approved"
  flatten_on_kill_file: true
  emergency_flatten_on_error: true
  # E1 Step 0b live-replay fixture capture (signed-lots refactor support).
  # 480 bars * 3min = 24h; auto-closes. Remove after Tier-3 fixture collected.
  capture_ccxt_raw_responses: true
  capture_max_bars: 480
  capture_dir: "/app/state"

# --- Protocol v2.2 §8.2 Live Action-Drift ---
# Baseline = DECAY-01 solo_456 distribution aggregated across all 8 WF OOS
# test windows (57036 bars, 2025-09-01 -> 2026-04-01) for regime breadth.
# Mean shift from +0.04 (FU-2 ens_mean) -> -0.16 (DECAY-01 solo_456) reflects
# seed 456's fresher-data short bias; deadband_frac 0.1634, sat 0.0080.
# Baked into live-engine image via `COPY baselines /app/baselines`.
drift:
  enabled: true
  baseline_path: "/app/baselines/sg1_btc_decay01_fold_07_solo_456/ensemble_report.json"
  window_bars: 1000
  min_bars_before_check: 500
  vol_estimator_bars: 20

# --- Protocol v2 Gates (paper-deploy requirement; mirrors §drift/§safe_mode) ---
# v2.6 (S551-cont-9, 2026-05-28): asymmetric thresholds + feature_variance_veto
# applied here too. S551-cont-4 updated the canonical
# `configs/sg1_btc_velotrade_ensemble.gates.yaml` but the live engine reads
# config["gates"]["drift"] from THIS file at runtime — the canonical gates
# yaml is for Stage-3 WF verdict gating, not live engine init. Missing the
# parity update here caused the 2026-05-28 05:27 UTC drift_crit (dead_delta
# 0.343 > 0.30; would have been within 0.35 v2.6 ceiling).
gates:
  drift:
    window_bars: 1000
    min_bars_before_check: 500
    deadband_frac_warn: 0.15
    deadband_frac_crit: 0.35                # v2.6 (was 0.30) — ADR-3 deadband headroom
    saturation_frac_warn: 0.10              # v2.6 (was 0.15) — ADR-3 earlier saturation WARN
    saturation_frac_crit: 0.25              # v2.6 (was 0.30) — ADR-3 tighter saturation CRIT
    action_kl_warn: 0.5
    action_kl_crit: 1.0
    agreement_flat_delta_warn: 0.20         # inert for solo (no agreement signal)
    agreement_flat_delta_crit: 0.40
    agreement_flat_window_bars: 2000
    regime_conditioning: true
    vol_estimator_bars: 20
    # v2.6 feature-variance veto. ADR-1 Mode B mitigation: bars where the
    # finest engineered feature scale (3-min for SG-1 BTC) is pathologically
    # flat are excluded from the drift histogram. ADR-5 escalation: if
    # rolling flat_veto_frac > 0.50, OK → WARN with operator hand-off to
    # scripts/recal_drift_baseline.py.
    feature_variance_veto:
      enabled: true
      scale: base
      max_veto_frac: 0.50
  safe_mode:
    crit_triggers_flatten: true
    crit_repeat_window_hours: 24
    crit_repeat_count_before_lockout: 2

# --- PRISM Regime Overlay (optional, falsified S413+) ---
prism:
  enabled: false
  base_url: "http://prism-api:8001"
  api_key: ""
  ticker: "BTC-USD"
  timeframe: "daily"
  timeout: 5
  cache_ttl: 60
  crisis_flatten: true
  multipliers:
    LOW_VOL: 1.3
    NORMAL_VOL: 1.0
    HIGH_VOL: 0.3

# --- Monitoring ---
monitoring:
  metrics_port: 9109                   # Aligned with docker-compose sg1-btc service

