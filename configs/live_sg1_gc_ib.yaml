# Live Trading Config — SG1 SAC on Gold Futures via Interactive Brokers
#
# Usage:
#   python scripts/run_live_ib.py --config configs/live_sg1_gc_ib.yaml
#   python scripts/run_live_ib.py --config configs/live_sg1_gc_ib.yaml --mainnet
#   python scripts/run_live_ib.py --config configs/live_sg1_gc_ib.yaml --dry-run

# --- IB Connection ---
exchange:
  name: "ib"
  testnet: true                        # true=paper(4002), false=live(4001)
  asset: "GC"
  host: "127.0.0.1"
  paper_port: 4002
  live_port: 4001
  client_id: 2                          # Must differ from gmgp1-gold (client_id=1)

# --- Contract Specification ---
contract:
  symbol: "GC"                         # "GC" for full (100 oz), "MGC" for micro (10 oz)
  exchange: "COMEX"
  currency: "USD"
  multiplier: 100
  tick_size: 0.10
  commission_per_side: 2.50
  roll_days_before_expiry: 5
  order_type: "LMT"
  limit_offset_ticks: 2
  market_fallback_timeout: 30.0

# --- Agent ---
agent:
  # UPDATE: point to best SG1 checkpoint after validation
  checkpoint_path: "checkpoints/sg1_best/checkpoint_final.pth"
  device: "cpu"
  torch_compile: false                 # Must be false for live inference

# --- SAC Hyperparameters (must match training checkpoint) ---
agents:
  sac:
    lr_actor: 3.0e-4
    lr_critic: 3.0e-4
    lr_alpha: 3.0e-4
    gamma: 0.99
    tau: 0.005
    batch_size: 256
    buffer_size: 1000000
    initial_alpha: 0.2

# --- Network (must match training checkpoint exactly) ---
network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

# --- Features (must match training config) ---
features:
  scales: [15, 60, 240]
  window_size: 30
  features_per_scale: 8
  norm_span: 120
  bootstrap_bars: 30000

# --- Bar Clock (CME-aware) ---
bar_clock:
  base_interval_minutes: 15
  execution_delay_seconds: 10.0
  max_late_seconds: 60.0

# --- Trading ---
trading:
  initial_balance: 1000000.0
  deadband_threshold: 0.25
  taker_fee: 0.0000017

# --- Risk Management ---
risk:
  enabled: true
  max_drawdown_pct: 0.10
  circuit_breaker_cooldown_bars: 12
  max_position_pct: 1.0
  funding_rate_alert: 999.0
  min_margin_reserve_pct: 0.20

# --- WandB Monitoring ---
wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  tags: ["live", "sg1", "Gold", "SAC", "15min", "IB", "paper", "GC", "COMEX"]

# --- Safety ---
safety:
  require_explicit_mainnet: true
  max_daily_loss_pct: 0.05
  kill_file: "/tmp/finrl_live_sg1_gc_kill"
  emergency_flatten_on_error: true

# --- PRISM Regime Overlay (L2 position sizing) ---
prism:
  enabled: false                        # Set true to activate regime overlay
  base_url: "http://prism-api:8001"     # Docker DNS (inside finrl-net)
  api_key: ""                           # Empty = no auth (internal network)
  ticker: "GC=F"                        # PRISM ticker (yfinance format)
  timeframe: "daily"
  timeout: 5                            # API call timeout in seconds
  cache_ttl: 60                         # Seconds to cache regime result
  crisis_flatten: true                  # Flatten to 0 on BEARISH+HIGH_VOL
  multipliers:
    LOW_VOL: 1.3
    NORMAL_VOL: 1.0
    HIGH_VOL: 0.3
