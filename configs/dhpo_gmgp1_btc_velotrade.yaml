# Distributed HPO overlay — GMGP1 BTC Velotrade re-HPO
# Extends configs/distributed_hpo.yaml with workstream-specific data files.
# Pattern: mirrors configs/dhpo_sg1_xauusd_ftmo.yaml (S481, 3 replicas/GPU co-location).
#
# PREREQUISITES BEFORE LAUNCH:
#   1. Fleet slots free — SG-1 + GMGP1-XAUUSD re-HPOs completed (or Vast.ai fallback).
#   2. `python scripts/monitor_fleet.py` — re-verify gpuhub-1:0 + gpuhub-2:0 free.
#   3. `python scripts/validate_config.py --config configs/gmgp1_btc_velotrade_hpo.yaml --stage hpo` → PASS.
#   4. BTC broad search (50 trials) — no seed dependency on SG-1/GMGP1-XAUUSD.
#
# Launch (6 workers = 3 replicas × 2 GPUs):
#   set -a; source .env; set +a
#   python scripts/distributed_hpo_coordinator.py \
#     --config configs/gmgp1_btc_velotrade_hpo.yaml \
#     --platform gpuhub \
#     --n_workers 6 --n_trials 50 \
#     --db_url "$DISTRIBUTED_HPO_DB_URL" \
#     --study_name gmgp1_btc_velotrade_rehpo_20260419 \
#     --distributed_config configs/dhpo_gmgp1_btc_velotrade.yaml \
#     --resume

distributed_hpo:
  platform: "gpuhub"
  n_workers: 6
  n_trials: 50                       # broad search — 10 random + 40 TPE

  storage:
    backend: "postgresql"
    url: "${DISTRIBUTED_HPO_DB_URL}"
    heartbeat_interval: 60
    grace_period: 600
    max_retry: 1

  # Safe slots layout — mirrors dhpo_sg1 (3 replicas/GPU; SAC HPO ~25% GPU util per worker;
  # 3x co-location ≈ 75% util, ~2-2.5x aggregate throughput). Re-check monitor_fleet.py
  # before launch in case fleet state shifted.
  gpuhub:
    instances:
      - "gpuhub-1:0"
      - "gpuhub-1:0"
      - "gpuhub-1:0"
      - "gpuhub-2:0"
      - "gpuhub-2:0"
      - "gpuhub-2:0"

  worker:
    target_trials: null
    trial_timeout: 7200
    graceful_shutdown_timeout: 60
    pip_extras: ""

  data:
    upload_method: "sftp"
    data_files:
      - "bitfinex/btc_usdt_perp_2025_1min.parquet"
      - "bitfinex/btc_usdt_perp_2025_1min.manifest.json"
    cache_by_size: true

  wandb:
    entity: "bigcan-chiwin-technology"
    project: "FinRL-Pro-DS"
    group_prefix: "dhpo"
    tags: ["distributed_hpo", "gmgp1-btc", "BTC", "velotrade", "re-hpo",
           "steady-state", "15min", "velotrade-wrapped"]

  fault_tolerance:
    max_worker_retries: 2
    worker_replace_on_death: false   # GPUHub fixed fleet — manual replace if worker dies
    monitor_poll_interval: 300

  cost:
    # max_total_spend omitted — GPUHub slots are prepaid; no $ cap needed
    auto_teardown: false             # never auto-destroy GPUHub instances

# Expected wall-clock (per optimization audit):
#   50 trials × 500K steps = 25M steps / ~600 SPS aggregate (6-worker 4090 fleet)
#   ≈ 11-14h wall-clock (vs ~53h serial on one 4090).
