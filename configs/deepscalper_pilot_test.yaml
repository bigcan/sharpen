# DeepScalper Pilot Test Configuration (Single BDQ)
# Goal: Verify logic, connections, and initial learning.
# Duration: ~15 mins

data:
  file_path: "data/btc_lob_jan2023.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2023-01-10 00:00:00"
  train_end_date: "2023-01-18 23:59:59"
  val_start_date: "2023-01-19 00:00:00"
  val_end_date: "2023-01-19 23:59:59"
  test_start_date: "2023-01-20 00:00:00"
  test_end_date: "2023-01-20 23:59:59"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  transaction_fee: 0.00005 
  num_envs: 24            # Scaled for RTX 5090 Blackwell Capacity
  window_size: 50
  max_drawdown_pct: 0.40  # Relaxed for training (40%); tighten to 0.20 in production
  
  reward:
    profit_weight: 1.0
    hindsight_weight: 0.1
    hindsight_horizon: 180
    volatility_horizon: 100
    
  action:
    direction_bins: 3 
    price_bins: 5     
    volume_bins: 5    
    max_position: 5.0

network:
  micro_config:
    input_size: 20
    private_input_size: 2
    hidden_size: 128
    rnn_type: "LSTM"
  macro_config:
    input_size: 11
    hidden_sizes: [256, 128] 

agents:
  bdq:
    learning_rate: 0.0001
    gamma: 0.99
    auxiliary_weight: 1.0
    update_interval: 2.0 
    batch_size: 128
    buffer_size: 50000   
    target_update_freq: 1000
    checkpoint_interval: 10000 
    learning_starts: 1000
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay: 0.999    # Faster decay for pilot to see some exploitation

training:
  total_timesteps: 100000   # 100k steps (Pilot Scale)
  log_interval: 500
  
  torch_compile: true
  use_amp: true         
  use_shm: true

hpo:
  enabled: true
  n_trials: 3              # Quick verification (3 trials)
  steps_per_trial: 10000   # 10k steps/trial for fast feedback
  
wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["Pilot", "SingleBDQ", "HPO"]
