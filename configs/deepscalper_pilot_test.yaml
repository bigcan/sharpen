data:
  file_path: "data/btc_lob_jan2023.parquet" # Optimized for speed/memory
  start_date: "2023-01-01"
  end_date: "2023-01-31"   # 1 month for full context
  split: [0.8, 0.1, 0.1]
  tech_indicator_list: [] # We use custom feature engineer

env:
  num_envs: 2                # Reduced for stability
  window_size: 20            # Reduced context for speed
  initial_balance: 100000
  transaction_fee: 0.0001
  reward:
    profit_weight: 1.0
    volatility_penalty_weight: 0.1
    transaction_cost_penalty: 0.0 # Disabled: Fees are already in PnL (Realistic VIP 0)

network:
  hidden_size: 64
  micro_config:
    input_size: 20
    private_input_size: 2
    hidden_size: 64
  macro_config:
    input_size: 11
    hidden_sizes: [64]

training:
  total_timesteps: 100000    # ~20 mins on RTX 5090
  batch_size: 1024           # Small batch
  update_interval: 1024      # Frequent PPO updates
  log_interval: 100
  checkpoint_interval: 10000
  
  # Target Ratio: ~4
  # Calculation: (1024 * 4) / 8 = 512
  dqn_update_interval: 512.0 
  
  learning_rate: 0.0001
  gamma: 0.99
  
  torch_compile: false       # Skip compilation overhead for short run
  use_amp: true
  use_shm: false

agents:
  dqn:
    dqn_batch_size: 1024
    dqn_buffer_size: 50000   # Small buffer
    target_update_freq: 200
  ppo:
    entropy_coef: 0.01
  a2c:
    entropy_coef: 0.01

phases:
  phase1_specialists: 30000
  phase2_gating: 30000
  phase3_joint: 40000 # Enabled for Phase 3 Verification
