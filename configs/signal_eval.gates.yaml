# Pre-registered gates for the signal-eval harness (docs/research/signal_eval_system_design.md).
# NEVER hardcode these in code or scripts — the harness reads them via Gates.from_yaml().
universe:
  id: sp500_pit
  min_names_per_day: 50          # days with fewer active names are excluded from IC
  min_adv_usd: 5.0e6             # liquidity floor per name-day
coverage:
  min_days: 1260                 # ~5y of daily bars required
  max_nan_frac: 0.40
  max_ohlc_violations: 0         # DATA-CLEAN: any OHLC violation halts (PF-XCHECK)
gross_power:
  horizons: [1, 5, 10, 21, 63]   # forward trading-day horizons evaluated
  primary_horizon: 5             # rank key uses 5d IC by default
  promising_ic_ir: 0.05          # per-period IC-IR floor for PROMISING
  promising_ic_tstat: 3.0
deflation:
  promising_dsr: 0.90            # P(true IC-IR>0 after deflation) floor (n_trials=batch size)
  fdr_q_max: 0.10                # Benjamini-Hochberg q ceiling across the batch
  use_effective_n: false         # C2.1 — deflate DSR vs effective (clustered) N, not raw batch
  effective_n_min_overlap: 23    # C2.1 — min common IC-days to correlate a trial pair (else r=0)
  hlz_t_min: 3.0                 # C2.3 — Harvey-Liu-Zhu t-stat hurdle (alongside BHY-FDR)
  require_hlz: false             # C2.3 — fold hlz_pass into PROMISING (default off: reported only)
cpcv:                            # Tier 3.5 (C2.2) — combinatorial purged CV, OOS Sharpe dist
  enabled: true
  n_groups: 6                    # contiguous timeline groups
  k_test: 2                      # held-out groups per path -> C(6,2)=15 OOS paths
  embargo_days: 5                # days dropped after each train->test boundary (purge+embargo)
robustness:                      # Tier 3 (P5) — reported, refines verdict
  min_subperiod_ic_ir: 0.0       # no negative subperiod
  recent_oos_years: 2
capturability:                   # Tier 2 (P5) — SECONDARY (rank key = gross power)
  cost_models: {frictionless: 0.0, standard: 0.0010, harsh: 0.0025}  # one-way equity fraction
  cost_wall_caution: 0.30        # frictionless−net sharpe gap flag
neutralization:
  winsor_pct: [0.01, 0.99]
  controls: [sector, size]       # size = log-ADV proxy in v1
promotion:
  survivorship_free_required: true   # LEAK-EQ-1 GO-gate (yfinance/biased = UPPER BOUND)
  tier2_audit_required: true         # CLAUDE.md: no capital without a Tier-2 deep audit
generation:                          # Component 3 — cost-aware automated generation (advisory)
  enabled: false                     # opt-in; absent/false ⇒ generation never runs (back-compat)
  panel: cross_asset                 # the FERTILE substrate (ADR-C3-1), NOT the equity X-section
  base_sleeves: [tsmom, rates_carry] # the C1 book a candidate must improve
  hold_horizon: 21                   # low-turnover rebalance (trading days)
  pop_size: 200
  n_generations: 40
  rng_seed: 7                        # determinism (ADR-C3-6)
  elite_frac: 0.30
  cost_bps: 0.0010                   # one-way turnover cost baked into the candidate return
  ls_min_names: 6                    # min active names for a rank-L/S book (18-asset panel)
  max_ast_nodes: 24                  # complexity / dimensional bound (ADR-C3-4/5)
  turnover_soft_cap: 12.0            # ann turnover where the penalty starts
  lambda_turnover: 0.05
  lambda_complexity: 0.10
  min_combination_uplift: 0.10       # PROMISING needs ΔSR_oos ≥ this vs the base book
  hlz_t_min: 3.0
  promising_dsr: 0.90
  holdout_frac: 0.25                 # embargoed held-out tail for FINAL validation (ADR-C3-3)
  holdout_embargo_days: 21
  cpcv_n_groups: 6
  cpcv_k_test: 2
  cpcv_embargo_days: 21
