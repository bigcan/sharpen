# Phase K4: BTC Bitfinex IQN — Swing MDP at 5-min (Resolution Ablation)
# ====================================================================
# Tests H16: Is 3-min optimal, or does 5-min perform better?
# Same swing MDP as K2, but at 5-min resolution.
# DP oracle ceiling at 5-min (6.5bps): PF 4.85.
# 103K training bars at 5-min.
#
# Gate: Test PF > 1.10 with >= 200 trades

data:
  file_path: "data/processed/btc_bitfinex_2025_full_year_5min.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-10-31 23:59:59"
  val_start_date:   "2025-11-01 00:00:00"
  val_end_date:     "2025-11-30 23:59:59"
  test_start_date:  "2025-12-01 00:00:00"
  test_end_date:    "2025-12-31 23:59:59"
  norm_cutoff_date: "2025-11-01 00:00:00"

features:
  n_levels: 1
  asset_class: "crypto"
  vol_norm_window: 24            # 24 x 5-min = 120 min (same physical window as K2's 40 x 3)

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  margin_requirement: 0.05
  taker_fee: 0.0005              # 5 bps (Binance VIP-0 taker)
  maker_fee: 0.0002              # Not used in swing MDP
  num_envs: 24
  window_size: 15                # 15 x 5-min = 75 min lookback
  max_drawdown_pct: 0.30
  mdp_version: "v6"             # Swing MDP (SwingScalperEnv)
  episode_length: 600            # 600 x 5-min = 50 hours (same physical duration as K2's 1000 x 3)
  random_start: true

  reward:
    scaling: 1.0
    volatility_horizon: 20
    sharpe_weight: 0.0           # Pure PnL reward

  action:
    discrete_dims: 2             # {Long, Short}
    cooldown_bars: 2             # 2-bar (10 min) minimum hold — scaled from K2's 3-bar (9 min)
    max_position: 5.0
    fixed_trade_qty: 0.2

network:
  micro_config:
    input_size: 18
    private_input_size: 4        # [direction, bars_since_switch, unrealized_pnl, atr]
    hidden_size: 256
    encoder_type: "flat"

  macro_config:
    input_size: 15
    hidden_sizes: [256, 128]

agents:
  iqn:
    type: iqn
    num_quantiles: 32
    embedding_dim: 64
    noisy_sigma0: 0.5
    quantile_huber_kappa: 1.0
    learning_rate: 0.0003
    gamma: 0.99
    tau: 0.005
    batch_size: 256
    buffer_size: 500000
    learning_starts: 5000
    use_per: false
    torch_compile: false
    gradient_clip: 10.0
    auxiliary_weight: 0.1
    update_interval: 8
    checkpoint_interval: 200000

replay:
  stratified_sampling: false     # No Hold action to stratify against

training:
  total_timesteps: 5000000
  training_epochs: 1
  log_interval: 20480
  torch_compile: false
  use_amp: true
  use_shm: false
  verbose_logging: true

hpo:
  enabled: true
  n_trials: 5
  steps_per_trial: 500000       # FIX HPO: Increased from 200K — IQN needs more runway to show signal

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["BTC", "Bitfinex", "IQN", "5min", "SwingMDP", "NoisyNet",
         "BinaryAction", "DenseReward", "Crypto", "k4", "ablation-resolution"]
