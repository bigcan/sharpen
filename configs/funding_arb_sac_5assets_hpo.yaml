# Funding Rate Arbitrage — SAC HPO on Top-5 Funding Assets
# Scale-up: 50 trials HPO + 2M full training + 5 walk-forward windows.
# Builds on SAC v2 (S198): PV-return reward + action_repeat=8.

strategy:
  id: "funding-arb-sac5-hpo"
  name: "funding_arb_sac_5assets_hpo"
  version: "3.0.0"

universe:
  # Top-5 by mean funding rate: FIL, OP, ARB, ETC, LINK (all >0.00012)
  assets: ["FIL", "OP", "ARB", "ETC", "LINK"]
  quote: "USDT"
  data_exchange: "binance"
  n_assets: 5

data:
  source: "ccxt"
  market_type: "futures"
  frequency: "1h"
  start_date: "2022-01-01"
  end_date: null  # rolling
  cache_dir: "./data/crypto_cache"

features:
  tech_dim: 15            # 15 funding-arb features per asset
  norm_window: 720        # 1 month in hours
  zscore_window: 720
  correlation_window: 168  # 1 week

environment:
  type: "funding_arb"
  initial_capital: 100000
  # --- Cost model ---
  spot_taker_fee_pct: 0.0001     # 1 bp Binance spot
  perp_taker_fee_pct: 0.0005     # 5 bp Binance futures
  perp_margin_rate: 0.05          # 5% margin for perp leg (20x leverage)
  slippage_base_bps: 2.0
  slippage_impact_bps: 10.0
  spot_borrow_rate_hourly: 8.33e-6  # ~0.02%/day ÷ 24h (Binance spot margin interest)
  # --- Constraints ---
  max_gross_exposure: 0.80        # Max 80% of capital deployed
  deadband_threshold: 0.01        # Ignore changes < 1%
  action_repeat: 8                # Agent decides once per funding settlement (8h)
  # --- Reward ---
  lambda_basis: 0.0               # Disabled: basis MtM overwhelms funding
  lambda_delta: 100.0             # Quadratic delta penalty (HPO-tunable)
  lambda_turnover: 0.1            # Churn penalty (per-asset normalized)
  reward_scaling: 10000.0         # Scale funding to O(1) per bar
  reward_clip_range: [-5.0, 5.0]
  circuit_breaker_threshold: 0.05  # Terminate at 5% portfolio loss

agents:
  primary: "sac"
  total_timesteps: 2000000
  n_envs: 4                       # DummyVecEnv x4 for SB3 SAC
  sac:
    learning_rate: 3.0e-4
    buffer_size: 100000
    batch_size: 256
    tau: 0.005
    gamma: 0.99
    network_arch: [256, 256]

hpo:
  enabled: true
  n_trials: 50
  hpo_timesteps: 500000
  objective: "total_return"       # Not Sortino — 90 effective val steps too few

walk_forward:
  train_bars: 8760        # 1 year
  val_bars: 720           # 1 month
  test_bars: 1440         # 2 months
  step_bars: 720          # 1 month step
  embargo_bars: 0

wandb:
  project: "FinRL-Pro-DS"
  entity: null
  tags: ["funding-arb", "sac", "hpo", "scale-up"]
