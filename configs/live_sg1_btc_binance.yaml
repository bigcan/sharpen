# Live Trading Config — SG-1 BTC SAC via Bybit Testnet (paper validation phase)
# 3-min bars, signal-gated, prop-firm trained (10% EOD trailing DD).
#
# NOTE: Filename retains "_binance" for backward compatibility with
# docker-compose.yaml STRATEGY_CONFIG ref + tests/check_retrain_triggers/runbook
# scripts. Contents are now Bybit testnet — see exchange block below.
# Venue cutover: 2026-05-02 (Binance demo → Bybit testnet, replacing).
#
# Sister config: configs/live_sg1_btc_dxtrade.yaml (Velotrade DXtrade execution,
# activated once Bybit testnet paper validates this strategy/checkpoint pair).
#
# ---------------------------------------------------------------------------
# PROP-FIRM DECOUPLING (S498-cont Step 5, 2026-04-25).
# Phase-varying DD/target/gates live in configs/deploy/velotrade/<phase>.yaml
# overlays. Even on paper Bybit testnet we use the Velotrade overlay so the
# challenge state machine + drift gates exercise the same code paths the live
# DXtrade deploy will hit.
#
# Deploy invocations (resolved = this file + overlay):
#   python scripts/deploy_bare_metal.py --script scripts/run_live.py \
#     --config configs/live_sg1_btc_binance.yaml --overlay velotrade/step1
#
# After Step 5 migration this BASE file alone is NOT paper-deployable
# (validator FAILs: `risk.static_peak` missing); pair with an overlay.
# ---------------------------------------------------------------------------
#
# Auth: BYBIT_TESTNET_API_KEY/SECRET env vars (compose maps
# SG1_BTC_BYBIT_TESTNET_* to the runner-expected names so SG-1 + GMGP1 testnet
# accounts stay isolated). Read by ExchangePerpBroker testnet branch.

# --- Exchange ---
# 2026-05-02: Migrated Binance demo → Bybit testnet (replacing, not parallel).
# Soak clock for S495 Step 6 RESETS at this cutover.
exchange:
  name: "bybit"                        # Bybit MAINNET DEMO TRADING (S527-cont; testnet abandoned — broken indexPrice + thin book)
  testnet: false                       # was true (S526 testnet) → false (S527-cont mainnet-demo cutover)
  demo: true                           # ccxt enable_demo_trading(True) → api-demo.bybit.com (real orderbook + simulated fills)
  asset: "BTC"
  leverage: 1                          # 1:1 (user policy — Velotrade 6x is cap not floor)
  order_type: "limit"                  # Mirror gmgp1-btc — limit orders + market fallback
  limit_offset_pct: 0.0005             # Cross spread for immediate fill
  market_fallback_timeout: 60.0
  data_exchange: "bybit"               # OHLCV from Bybit testnet (matches exec venue)

# --- Agent (v2.3 atomic-swap bundle: ens_agreement, FU-3 PROMOTE) ---
# Loaded from bundle baked into image at /app/bundles/sg1_btc_velotrade_extended/.
# - L1 N=10: test PF median 2.75, CV 2.12% (S535-cont FU-1 reconcile)
# - Stage 2.5-R bootstrap PRIMARY: P(ens > solo) = 0.983 → PROMOTE (FU-2)
# - Stage 3 WF 8-fold: bootstrap P(PF) = 1.0000 (n=57k), legacy G3 1.018
#   below 1.10 but PF dominance promotes → PROMOTE (FU-3)
# - Bundle SHA256: 0c50fe6267f5ca2cf889d8073549c16c11e9cd358d18b2a03135e43a4528981b
# - Manifest chosen_rule: ens_agreement (changed from FU-2 v1 ens_mean —
#   operator awareness required; drift_agreement baseline at
#   baselines/sg1_btc_extended_fold_07/ensemble_report.json was recal'd in
#   commit 24b67ec2 ahead of this swap).
# Predecessor: seed 42 solo (S498-cont AMBIGUOUS_RERUN fallback) — paper
# soak from 2026-04-25 to swap-date. Now 8th-best test PF in N=10 cohort.
# `checkpoint_path` retained as dead value; build_agent() detects
# `agent.ensemble.bundle_path` and skips the solo path.
agent:
  checkpoint_path: ""
  device: "cpu"
  torch_compile: false
  ensemble:
    bundle_path: "/app/bundles/sg1_btc_velotrade_extended/ensemble_v2.tar.gz"
    # aggregation_rule declared explicitly so validate_config can fire its
    # v2.3 agreement-decay key check (it can't open the tarball at validate
    # time). Mismatch with bundle.chosen_rule logs a WARN at runtime.
    aggregation_rule: "ens_agreement"
    # FU-3 bake produced normalizer_sha256: MISSING for all 3 seeds (same as
    # FU-2 v1) — live engine supplies its own `norm_warmup` pkl per
    # project_live_obs_normalization_mismatch_s509. Without this override
    # extract_and_verify_bundle's default require_normalizers=True raises
    # BundleIntegrityError on first boot.
    require_normalizers: false
    # deadband, seeds, seed_pfs come from the bundle's manifest. Override
    # deadband / aggregation_rule here only to demote without rebuilding.

# --- SAC Hyperparameters (PLACEHOLDER — update with HPO best trial) ---
agents:
  sac:
    lr_actor: 0.0003
    lr_critic: 0.0003
    lr_alpha: 0.0003
    gamma: 0.99
    tau: 0.005
    batch_size: 512
    buffer_size: 100
    initial_alpha: 0.2

# --- Network (must match training checkpoint exactly) ---
network:
  scale_encoder:
    input_size: 8
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

# --- Features (SG-1 3-min multi-scale — must match training) ---
features:
  scales: [3, 15, 60]
  window_size: 30
  features_per_scale: 8
  asset_class: "crypto"
  norm_span: 120
  bootstrap_bars: 30000
  # S509 train-serve EMA-Z parity (S535-cont-5 swap audit follow-up AUD-7).
  # v2 bundle has normalizer_sha256: MISSING per FU-3 bake; without an
  # explicit override the resolver searches alongside the extracted seed
  # checkpoints (which lack the pkl) then falls back to legacy rolling
  # EMA-Z. The L1 solo seed-42 dir is bind-mounted here for backward-compat
  # and its pkl is parity-correct for the v2 ensemble: norm_warmup is a
  # deterministic function of (training data, scales, norm_span) — all 4
  # L1 seeds [42, 456, 3141, 123] share these, only SAC RNG differs.
  norm_warmup_path: "/app/checkpoints/sg1-btc-velotrade-l1-multiseed-seed42_20260423_234030/norm_warmup_3-15-60.pkl"

# --- Signal Gate (must match training) ---
# Thresholds from configs/sg1_btc_velotrade_l1_multiseed.yaml (S479 BTC Bybit
# 3-min calibration; ~75% composite pass rate). Old placeholders (0.5/0.03/0.5)
# never triggered because BTC parkinson dist is ~10× smaller than XAU.
signal_gate:
  enabled: true
  gate_mode: "composite"
  atr_threshold: 0.15
  parkinson_threshold: 0.0009
  volume_threshold: 0.60
  max_hold_bars: 20
  gate_always_on_first: true
  normalize_accumulated_reward: true

# --- Bar Clock (3-min bars for SG-1, 24/7 market) ---
bar_clock:
  base_interval_minutes: 3
  execution_delay_seconds: 5.0
  max_late_seconds: 30.0

# --- Trading ---
trading:
  initial_balance: 50000.0           # Bybit MAINNET DEMO USDT (S527-cont; auto-funded 50k coin USDT equity, totalWalletBalance ~100k; testnet path abandoned — broken indexPrice + thin book)
  deadband_threshold: 0.25
  taker_fee: 0.0005                  # 5bps crypto taker

# --- Data source (validator Stage-0; ccxt live-fetch at runtime) ---
data:
  source: ccxt
  data_exchange: bybit               # api-testnet.bybit.com (matches exec venue)
  frequency: 3m
  ticker: "BTC/USDT"

# --- Hard Constraints (validator parity; mirrors trading.taker_fee) ---
env:
  taker_fee: 0.0005

# --- Risk Management (universal live safety; phase-varying keys come from overlay) ---
# Overlay owns: static_peak, eod_trailing_drawdown, eod_hour_utc,
# flatten_on_kill_file. See configs/deploy/velotrade/{step1,step2,funded}.yaml.
risk:
  enabled: true
  max_drawdown_pct: 0.08             # 8% trigger (2% buffer below 10% limit)
  circuit_breaker_cooldown_bars: 0   # Stay flat once breached
  max_position_pct: 1.0
  max_net_short_exposure: -1.0
  max_gross_exposure: 1.0            # 1:1 leverage (user policy)
  funding_rate_alert: 999.0
  min_margin_reserve_pct: 0.15
  # S495-cont (2026-04-23) preemptive override (mirrors sg1-xauusd fix). See
  # crypto_risk_manager.py:267 — accumulator resets every 24 `check()` calls,
  # not 24 calendar hours. SG-1 3-min bars with signal_gate + deadband reduce
  # check() to ~9/day → "daily" window spans ~2-3 calendar days. Default 4.0
  # trips after 3-4 roundtrips. 10.0 gives ~3-5 roundtrips per reset window.
  # Structural fix (bar-interval-aware reset) queued.
  daily_turnover_limit: 10.0
  # S535 canary (2026-05-06). Piecewise-linear taper across [0.8, 1.0] of the
  # daily turnover budget — replaces hard-wall scaling that produced the
  # 13h flat-line at the cap on 2026-05-05. Default 1.0 disables taper
  # (legacy preserved bit-identically). 0.8 = brake from 80% budget instead
  # of cliff-edging to 100%. See crypto_risk_manager.py:334-370 + commit 3b7d49b1.
  soft_throttle_start: 0.8

# --- WandB Monitoring ---
# Distinct run_id from seed42-solo predecessor so swap is auditable in WandB.
wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  tags: ["live", "sg-1", "BTC", "SAC", "3min", "bybit-demo", "paper",
         "velotrade-overlay", "signal-gated", "prop-firm", "ensemble",
         "ens-agreement", "v2-swap"]
  run_id: "live-sg1-btc-bybit-demo-paper-ensemble-v2"

# --- Safety ---
safety:
  require_explicit_mainnet: true
  max_daily_loss_pct: 0.0            # 0 = disabled (Velotrade 2-step has no daily rule). Engine treats ≤0 as disabled (audit FIND-01, 2026-04-22).
  # S535-cont-6 (AUD-3 fix): moved from /tmp to persistent volume so v2.2 §8.3
  # repeat-CRIT lockout survives container restart. /tmp inside container fs is
  # tmpfs-equivalent and wiped per restart — kill_file there auto-cleared on
  # bounce, defeating the lockout. Mirrors sister sg1_xauusd_ctrader.yaml.
  # `kill_file_override` defaults to `${kill_file}.override` per
  # live_engine.py:309 so it inherits /app/state too — no separate line needed.
  kill_file: "/app/state/finrl_live_sg1_btc_kill"
  # v2.3 swap-handshake state files on the persistent state volume (/app/state
  # is mounted via sg1-btc-state in docker-compose). Default `${kill_file}.*`
  # would land on /tmp which is wiped per container — every restart would be
  # treated as a fresh bundle and re-trigger the operator approval handshake.
  last_bundle_file: "/app/state/finrl_live_sg1_btc_last_bundle"
  swap_approved_file: "/app/state/finrl_live_sg1_btc_swap_approved"
  flatten_on_kill_file: true         # v2.2 §8.3 CRIT graceful flatten
  emergency_flatten_on_error: true
  # E1 Step 0b: live-replay fixture capture for the signed-lots refactor.
  # Captures raw CCXT fetch_positions + fetch_balance JSONL for the next
  # capture_max_bars trading steps, then auto-closes. Default-off elsewhere;
  # enabled here for the 2026-04-27 00:00 UTC un-halt redeploy. Disable
  # (set false or remove) once the Tier-3 fixture is collected.
  capture_ccxt_raw_responses: true
  capture_max_bars: 480              # 480 × 3-min = 24h
  capture_dir: "/app/state"

# --- Protocol v2.2 §8.2 Live Action-Drift ---
# Baseline = FU-3 ensemble_report.json (ens_agreement, fold_07 OOS 2026-03-01..04-01)
# at baselines/sg1_btc_extended_fold_07/ensemble_report.json. Pre-swap recal
# 2026-05-07 ahead of v1 (ens_mean) -> v2 (ens_agreement) ensemble swap; see
# project_sg1_btc_fu3_wf_promote. Baked into live-engine image via
# Dockerfile.live-engine `COPY baselines /app/baselines`. Regenerate via
# scripts/sg1_xauusd_ensemble_eval.py --wf_config <ext_wf> --rules ens_agreement
# then scripts/bake_sg1_btc_v2_drift_baseline.py if checkpoint/rule changes.
drift:
  enabled: true
  baseline_path: "/app/baselines/sg1_btc_extended_fold_07/ensemble_report.json"
  window_bars: 1000
  min_bars_before_check: 500
  vol_estimator_bars: 20

# --- Protocol v2 Gates (paper-deploy requirement; mirrors §drift/§safe_mode) ---
gates:
  drift:
    window_bars: 1000
    min_bars_before_check: 500
    deadband_frac_warn: 0.15
    deadband_frac_crit: 0.30
    saturation_frac_warn: 0.15
    saturation_frac_crit: 0.30
    action_kl_warn: 0.5
    action_kl_crit: 1.0
    agreement_flat_delta_warn: 0.20         # v2.3 ensemble agreement-decay
    agreement_flat_delta_crit: 0.40
    agreement_flat_window_bars: 2000
    regime_conditioning: true
    vol_estimator_bars: 20
  safe_mode:
    crit_triggers_flatten: true
    crit_repeat_window_hours: 24
    crit_repeat_count_before_lockout: 2

# --- PRISM Regime Overlay (optional) ---
prism:
  enabled: false
  base_url: "http://prism-api:8001"
  api_key: ""
  ticker: "BTC-USD"
  timeframe: "daily"
  timeout: 5
  cache_ttl: 60
  crisis_flatten: true
  multipliers:
    LOW_VOL: 1.3
    NORMAL_VOL: 1.0
    HIGH_VOL: 0.3

# --- Monitoring ---
monitoring:
  metrics_port: 9109                   # Aligned with docker-compose sg1-btc service
