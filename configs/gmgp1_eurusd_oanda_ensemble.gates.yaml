# GMGP1-EURUSD-OANDA ensemble confirmation gates — PRE-COMMITTED.
#
# Drafted S551-cont-2 2026-05-26 alongside the Stage 1 HPO config
# `configs/gmgp1_eurusd_oanda_hpo.yaml`. Mirrors GMGP1-XAUUSD ensemble.gates.yaml
# (S493-cont) — same five-gate structure + Protocol v2.5 PRIMARY block-bootstrap
# + v2.3 retrain triggers + v2.2 drift/safe_mode.
#
# This file is the ONLY source of truth for ensemble gate numbers (per project
# rule "never hardcode gate thresholds in code or scripts").
#
# Pre-commit date: 2026-05-26 BEFORE HPO launch. Do not edit after launch
# without a decision memo explaining why.
#
# Pre-populated `seeds:` is a PLACEHOLDER — overwrite with the L1-extended
# val_argmax_pf top-3 once Stage 2 L1 multiseed lands. The eval script
# (`scripts/gmgp1_eurusd_ensemble_eval.py`, to be cloned from
# scripts/gmgp1_xauusd_ensemble_eval.py at Stage 2.5-R time) reads seeds from
# the WF config's `ensemble.seeds`, NOT from this file's `seeds:` row, so the
# placeholder here is documentation-only until Stage 2.5-R bake.

workstream: gmgp1_eurusd
variant: ensemble_top3_oanda_ftmo
seeds: [0, 0, 0]                                 # PLACEHOLDER — overwrite from L1 val_argmax_pf top-3 before Stage 2.5-R bake
aggregation_rule: ens_pf_weighted                # candidate rule (final pick at Stage 2.5-R eval)

# Fold count expected from the multiseed WF config.
# 8 folds covering test windows once L1 splitter is materialized.
wf_folds: 8

# ---------------------------------------------------------------------------
# Gates
# ---------------------------------------------------------------------------

gates:
  g1_solo_baseline:
    description: >-
      Existing WF Stage-3 gate applied per seed: at least 2/3 seeds must have
      per-fold test PF >= pf_floor, in at least min_folds_pass of the total
      folds. If solo seeds fail the base WF discipline, the ensemble is moot.
    pf_floor: 1.1
    seeds_pass_min: 2                         # >=2/3 seeds pass per fold
    min_folds_pass: 7                         # in >=7/8 folds

  g2_no_regression:
    description: >-
      Per fold, the ensemble must NOT materially regress vs the best solo on
      that fold. Defined as ens_PF >= ens_ratio_min * best_solo_PF in at least
      min_folds_pass folds.
    ens_ratio_min: 0.90
    min_folds_pass: 7                         # >=7/8 folds

  g3_uplift:
    description: >-
      Across folds, the ensemble must earn its live-complexity overhead.
      Defined as median(ens_PF) / median(best_solo_PF) >= uplift_ratio_min.
      v2.5 NOTE: this gate is AUDIT-ONLY (legacy point-estimate). The PRIMARY
      ensemble gate is `ensemble_bootstrap_p_pf_promote` below.
    uplift_ratio_min: 1.10
    metric: median                            # across-folds aggregation

  # === Protocol v2.5 PRIMARY (S526): block-bootstrap probability gate. ===
  # Mirrors gmgp1_xauusd_ensemble.gates.yaml so the live-engine drift_agreement
  # monitor, Stage 2.5-R callers, and run_stage_2_5_val_selection see identical
  # thresholds across the GMGP1 FX/Gold workstream pair. See
  # decision_protocol_v25_bootstrap_primary.md for the gate-ordering flip.
  ensemble_bootstrap_p_pf_promote: 0.90       # P(ens_PF > solo_PF) >= 0.90 for PROMOTE
  ensemble_bootstrap_p_mdd_promote: 0.90      # P(ens_MDD better) >= 0.90 for PROMOTE on DD channel
  ensemble_bootstrap_p_pf_ambiguous: 0.75     # v2.5 ambiguous floor on P(PF)
  ensemble_bootstrap_resamples: 10000          # B in stationary block bootstrap
  ensemble_bootstrap_block_len: null           # null -> auto = sqrt(n_bars), capped at 0.1*n

  # === Protocol v2.5 SECONDARY (audit/sanity only). ===
  ensemble_uplift_min: 1.10                    # legacy point-estimate (audit-only in v2.5)
  ensemble_ambiguous_min: 1.05                 # legacy ambiguous floor (audit-only in v2.5)

  # v2.3 diversity-aware top-K selection (Phase 0). Pearson |action correlation|
  # used as redundancy proxy. With pool == K it's audit-only.
  ensemble_top_k: 3
  ensemble_diversity_lambda: 1.0               # score = PF − λ * max_corr_with_already_selected
  ensemble_rule_selection: val_argmax_pf       # S495: pick aggregation rule on val split

  g4_ftmo_compliance:
    description: >-
      Applied to the ENSEMBLE trajectory per fold (not the solo trajectories).
      All three FTMO sub-gates must PASS in every fold (strict: 8/8).
    daily_dd_buffer_pp_min: 0.5               # 4% sim cap - worst_intraday_dd%
    trailing_dd_buffer_pp_min: 0.5            # 8% sim cap - trailing_mdd%
    compliance_must_pass: true                # active_days/single_day_share
    min_folds_pass: 8                         # all folds

  g5_dd_stability:
    description: >-
      Guards against ensemble edge being a one-fold artifact. CV of ensemble
      PF across folds must be at or below cv_max.
    cv_pf_max: 0.35

  # Protocol v2.2 §8.2 live action-distribution drift thresholds.
  # Declared on the workstream gate YAML so validate_config.py enforces presence.
  drift:
    window_bars: 1000
    min_bars_before_check: 500
    deadband_frac_warn: 0.15
    deadband_frac_crit: 0.30
    saturation_frac_warn: 0.15
    saturation_frac_crit: 0.30
    action_kl_warn: 0.5                       # unused on V7 scalar, declared for schema
    action_kl_crit: 1.0
    regime_conditioning: true
    vol_estimator_bars: 20

  # Protocol v2.2 §8.3 tiered safe-mode. CRIT must graceful-flatten
  # (S491 bleed-window lesson), not "halt while holding".
  safe_mode:
    crit_triggers_flatten: true
    crit_repeat_window_hours: 24
    crit_repeat_count_before_lockout: 2

  # Protocol v2.3 §4.5 Stage 2.5-R retrain triggers. Each is a separate
  # auto-fire condition; any one trips a Stage 2.5-R rerun.
  retrain:
    ensemble_recheck_days: 90                  # quarterly cadence
    live_pf_ratio: 0.8                         # live PF < 0.8 * paper PF
    live_pf_window_days: 5                     # for 5 consecutive trading days
    min_trades_window: 20                      # AND >=20 trades in window
    # Agreement-decay (silent capital starvation, ens_agreement only)
    agreement_decay_delta: 0.20
    agreement_decay_window_bars: 2000
    # Action KL drift (sustained WARN before CRIT)
    action_kl_warn_window_bars: 5000
    # Cost drift
    cost_drift_ratio: 1.20                     # realized cost > 1.20x backtest assumption
    cost_drift_window_trades: 100

  # Protocol v2.3 §8.2 agreement-decay live monitor (ensemble-deployed only).
  # No-op for ens_mean / ens_median / ens_pf_weighted.
  drift_agreement:
    enabled_for_rules: ["ens_agreement", "ens_majority"]
    flat_delta_warn: 0.20
    flat_delta_crit: 0.40
    window_bars: 2000

# ---------------------------------------------------------------------------
# Decision matrix
# ---------------------------------------------------------------------------

decision:
  all_pass_action: approve_ensemble_paper_deploy
  any_fail_action: reject_ensemble_use_best_solo
  solo_selection_metric: wf_median_pf
  solo_tiebreaker: wf_mean_trailing_dd_buffer_pp

# ---------------------------------------------------------------------------
# Provenance
# ---------------------------------------------------------------------------

provenance:
  drafted_on: '2026-05-26'
  drafted_by_session: S551-cont-2
  upstream_memory: project_gmgp1_eurusd_oanda_queued.md
  template_source: configs/gmgp1_xauusd_ensemble.gates.yaml
  target_firm: FTMO
  broker: OANDA practice (api-fxpractice.oanda.com)
  fee_assumption: 5e-5 per side (Q2 empirical audit pending)
  cell: 22mo calendar window x 1.5M total_timesteps (32x multiplicity)
