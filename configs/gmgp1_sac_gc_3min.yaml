# GMGP1: SAC + Multi-Scale OHLCV + Continuous Action — Gold 3-min
# Redesign from rl_grandmaster: continuous position control, DSR reward, fee curriculum
# GPU: RTX 4090 (24GB, Ada Lovelace) — BF16, batch 512, buffer 500K, num_envs 20

data:
  file_path: "data/cme/gc_2025_lob1_1min_stitched.parquet"
  ticker: "GC"
  handler_type: "multiscale"
  train_start_date: "2025-01-06"
  train_end_date: "2025-08-31"
  val_start_date: "2025-09-01"
  val_end_date: "2025-10-31"
  test_start_date: "2025-11-01"
  test_end_date: "2025-12-31"

features:
  scales: [3, 15, 60]
  window_size: 30
  features_per_scale: 7
  asset_class: "cme_futures"

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 7
  taker_fee: 0.0  # Start zero (fee curriculum)
  deadband_threshold: 0.25
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 2000
  random_start: true
  max_drawdown_pct: 0.30
  scales: [3, 15, 60]
  reward:
    mode: "dsr"
    dsr_eta: 0.001
    dsr_scale: 1.0
  fee_schedule:
    - {step: 0, taker_fee: 0.0}
    - {step: 1000000, taker_fee: 0.0, ramp_to: 0.0002, ramp_end_step: 3000000}
    - {step: 3000000, taker_fee: 0.0002}  # 2bps — CME Gold all-in fee (Session 118 decision)

network:
  scale_encoder:
    input_size: 7
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

agents:
  sac:
    lr_actor: 0.0003
    lr_critic: 0.0003
    lr_alpha: 0.0003
    gamma: 0.99
    tau: 0.005
    batch_size: 512               # 4090: better TC tile efficiency (256x128 tiles)
    buffer_size: 500000           # 4090: 24GB VRAM constraint (vs 1M on 32GB 5090)
    initial_alpha: 0.2
    learning_starts: 10000
    update_interval: 4
    gradient_clip: 10.0
    checkpoint_interval: 500000

training:
  total_timesteps: 5000000
  log_interval: 1000
  use_amp: true                   # Enable mixed precision
  amp_dtype: "bfloat16"           # 4090 Ada: native BF16, no GradScaler overhead
  torch_compile: true
  num_envs: 20                    # 4090: IPC limit (vs 24 on 5090)

wandb:
  project: "FinRL-Pro-DS"
  tags: ["Gold", "SAC", "3min", "MultiScale", "OHLCV", "DSR", "FeeCurriculum", "gmgp1", "4090"]
