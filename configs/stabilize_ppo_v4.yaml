# DeepScalper Stabilization Config — PPO Agent V4
# Purpose: Apply expert DRL audit fixes to V3 config.
# Changes from V3:
#   1. REWARD: hold_bonus_bps=0, sharpe_weight=0.1 (anti reward-hacking)
#   2. GAMMA: 0.999→0.99 (100-min scalper horizon, was 16.6 hours)
#   3. BUDGET: 15M timesteps (~10 epochs over 4-month data, was 1.4 epochs)
#   4. ARCHITECTURE: hidden_size=128, n_epochs=4, target_kl=0.015
#   5. ACTION: Full [-1.0..1.0] range for emergency exits
#   6. HPO: 1.5M steps_per_trial (full data coverage per trial)
#   7. COMPILE: torch_compile=false (LSTM graph stability)
#   8. ENVS: num_envs=20 (max safe on GPUHub — >20 = BrokenPipeError)

data:
  file_path: "data/processed/btc_2025_jan_jun.parquet"
  ticker: "BTCUSDT"
  train_start_date: "2025-01-01 00:00:00"
  train_end_date:   "2025-04-30 23:59:59"
  val_start_date:   "2025-05-01 00:00:00"
  val_end_date:     "2025-05-31 23:59:59"
  test_start_date:  "2025-06-01 00:00:00"
  test_end_date:    "2025-06-30 23:59:59"

features:
  micro_features: ["micro"]
  macro_features: ["macro"]
  private_features: ["position", "balance"]

env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  margin_requirement: 1.0         # Spot (no leverage) — keep V3
  maker_fee: 0.0002               # Futures VIP-0 — keep V3
  taker_fee: 0.0004               # Futures VIP-0 — keep V3
  num_envs: 20                    # V4: Max safe on GPUHub (>20 = BrokenPipeError)
  window_size: 15                 # KEPT: Windowed LSTM needs this (expert's 1 incompatible)
  max_drawdown_pct: 0.20          # Kill zombie episodes at -20% equity
  private_state_augment_prob: 0.0 # Disabled for on-policy PPO

  reward:
    scaling: 0.001                # Squash reward magnitude ($1000 → 1.0)
    hindsight_weight: 0.1
    hindsight_horizon: 60         # 1-min LOB reality
    volatility_horizon: 100
    sharpe_weight: 0.1            # V4: Reduced from 0.5 — prevent step-wise gradient chaos
    hold_bonus_bps: 0.0           # V4: DISABLED — prevent infinite reward-farming exploit

  action:
    price_bins: 5
    # V4: Added -1.0 and 1.0 for full position entry/exit in one step
    signed_qty_proportions: [-1.0, -0.5, -0.2, -0.1, -0.05, 0.0, 0.05, 0.1, 0.2, 0.5, 1.0]
    max_position: 1.0

  augmentation:
    enabled: false                # Protect micro-structure signal

network:
  micro_config:
    input_size: 30
    private_input_size: 3
    hidden_size: 128              # V4: Reduced from 256 to mitigate overfitting
    rnn_type: "LSTM"

  macro_config:
    input_size: 15
    hidden_sizes: [256, 128]

agents:
  ppo:
    learning_rate: 0.0003          # PPO standard — HPO will search [1e-4, 1e-3]
    gamma: 0.99                    # V4: 100-min horizon for scalping (was 0.999 = 16.6 hrs)
    gae_lambda: 0.95               # GAE: smooths variance of advantage estimates
    clip_eps: 0.2                  # Prevents network explosions
    vf_coef: 0.5                   # Value function loss multiplier
    ent_coef: 0.01                 # HPO will search [0.001, 0.05]
    max_grad_norm: 0.5             # Secondary shield against gradient explosions
    n_epochs: 4                    # V4: Reduced from 10 (10 epochs overfits LSTMs rapidly)
    rollout_steps: 2048            # 20 envs × 2048 = 40,960 transitions per rollout
    batch_size: 512                # Minibatch size for PPO update
    lr_schedule: "linear"          # Linear decay to 0 over training
    checkpoint_interval: 500000    # Save every 500K steps (adjusted for 15M budget)
    target_kl: 0.015               # V4: Tighter trust region (was 0.03)
    clip_value_loss: true

training:
  total_timesteps: 15000000        # V4: ~10 epochs over 4-month data (was 2M = 1.4 epochs)
  training_epochs: 1               # PPO uses rollout epochs internally
  log_interval: 40960              # Log every rollout (20 envs × 2048)
  torch_compile: false             # V4: Disabled to prevent LSTM graph crashes
  use_amp: true
  use_shm: false
  use_sync: false
  verbose_logging: true

hpo:
  enabled: true
  n_trials: 15
  steps_per_trial: 1500000         # V4: Full 4-month coverage per HPO trial (was 500K)

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["stabilize", "PPO", "V4", "2025-H1", "expert-audit", "15M-budget"]
