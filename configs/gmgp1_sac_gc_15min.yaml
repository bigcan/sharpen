# GMGP1-v3: SAC + Multi-Scale OHLCV + Continuous Action — Gold 15-min
# Production budget: 50 HPO trials, 8 HP dimensions, 3M full training
# OPT-10: update_interval NOT scaled by num_envs (SPS ~80 vs ~8)
# GPU: RTX 4090 (48GB) — BF16, batch 512, buffer 500K, num_envs 20

data:
  file_path: "data/cme/gc_2025_lob1_1min_stitched.parquet"
  ticker: "GC"
  handler_type: "multiscale"
  train_start_date: "2025-01-06"
  train_end_date: "2025-08-31"
  val_start_date: "2025-09-01"
  val_end_date: "2025-10-31"
  test_start_date: "2025-11-01"
  test_end_date: "2025-12-31"

features:
  scales: [15, 60, 240]          # 15-min decision, 1h trend, 4h regime
  window_size: 30
  features_per_scale: 8           # TC-OPT: 8 aligns Conv1d input for Tensor Cores
  asset_class: "cme_futures"

env:
  mdp_version: "v7"
  initial_balance: 100000.0
  window_size: 30
  features_per_scale: 8           # TC-OPT: must match features.features_per_scale
  taker_fee: 0.0                 # Start zero (fee curriculum)
  deadband_threshold: 0.25
  atr_cap_percentile: 90
  atr_cap_max_position: 0.5
  episode_length: 500            # 500 x 15min = 125 hours ~ 5 days
  random_start: true
  max_drawdown_pct: 0.30
  scales: [15, 60, 240]
  reward:
    mode: "dsr"
    dsr_eta: 0.001
    dsr_scale: 1.0
  fee_schedule:
    - {step: 0, taker_fee: 0.0}
    - {step: 500000, taker_fee: 0.0, ramp_to: 0.0002, ramp_end_step: 1500000}
    - {step: 1500000, taker_fee: 0.0002}  # 2bps — CME Gold all-in fee

network:
  scale_encoder:
    input_size: 8                  # TC-OPT: 8 aligns Conv1d for Tensor Cores (was 7)
    channels: [32, 64, 64, 64]
    kernel_size: 3
    output_dim: 64
  private_dim: 5
  fusion_dim: 256
  window_size: 30

agents:
  sac:
    lr_actor: 0.0003
    lr_critic: 0.0003
    lr_alpha: 0.0003
    gamma: 0.99
    tau: 0.005
    batch_size: 512
    buffer_size: 500000
    initial_alpha: 0.2
    learning_starts: 5000        # Reduced: fewer bars than 3-min
    update_interval: 4              # 4 gradient steps per env.step (NOT scaled by num_envs — OPT-10)
    actor_update_freq: 2            # O-B: update actor every 2 critic steps (TD3-style delayed actor)
    gradient_clip: 10.0
    checkpoint_interval: 250000

training:
  total_timesteps: 3000000       # Extended: 1.5M steps at full 2bps fee (was only 500K)
  log_interval: 1000
  use_amp: true
  amp_dtype: "bfloat16"
  torch_compile: true             # Full-model compile: networks accept stacked (B,N,W,F) tensors, no List[Tensor] dynamo hang.
  num_envs: 20

hpo:
  n_trials: 50                   # Production: 10 startup (random) + 40 Bayesian. 8 HP dims.
  steps_per_trial: 500000        # 500K steps: SAC needs long exploration past deadband + learning_starts

wandb:
  project: "FinRL-Pro-DS"
  tags: ["gmgp1-v3", "Gold", "SAC", "15min", "MultiScale", "OHLCV", "DSR", "FeeCurriculum", "swing", "gmgp1", "4090", "opt-10", "production"]
