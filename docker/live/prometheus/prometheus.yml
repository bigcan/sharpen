# Prometheus scrape config for FinRL trading strategies.
#
# Each strategy container exposes Prometheus metrics on its METRICS_PORT.
# IB strategies share ibgateway's network namespace, so they are scraped
# via ibgateway:<port>. Crypto strategies are on finrl-net, scraped by
# container name.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # --- IB Strategies (share ibgateway network) ---
  - job_name: "ib-strategies"
    static_configs:
      - targets: ["ibgateway:9101"]
        labels:
          strategy: "gmgp1-gold"
          broker: "ib"
      - targets: ["ibgateway:9102"]
        labels:
          strategy: "sg1-gold"
          broker: "ib"

  # --- Crypto Strategies (own network namespace) ---
  - job_name: "crypto-strategies"
    static_configs:
      - targets: ["gmgp1-btc:9103"]
        labels:
          strategy: "gmgp1-btc"
          broker: "crypto"
      - targets: ["funding-arb:9104"]
        labels:
          strategy: "funding-arb"
          broker: "crypto"
      - targets: ["sync-1h:9105"]
        labels:
          strategy: "sync-1h"
          broker: "crypto"
      - targets: ["gmgp1-xauusd:9106"]
        labels:
          strategy: "gmgp1-xauusd"
          broker: "ctrader"

  # --- PRISM API ---
  - job_name: "prism"
    static_configs:
      - targets: ["prism-api:8001"]
        labels:
          service: "prism-api"
    metrics_path: /health
    scrape_interval: 30s

  # --- Prometheus self-monitoring ---
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
