[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-markets"
version = "1.0.0"
description = "Python SDK for PRISM — Probabilistic Regime-Informed System for Markets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Keng Lee"},
]
keywords = ["finance", "regime-detection", "hmm", "forecasting", "finrl", "trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "responses>=0.23",
]
examples = [
    "yfinance>=0.2.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/bigcan/PRISM"
Documentation = "https://github.com/bigcan/PRISM/tree/main/docs"
Repository = "https://github.com/bigcan/PRISM"
Issues = "https://github.com/bigcan/PRISM/issues"

[tool.setuptools.packages.find]
include = ["prism_client*"]
