# FinRL Multi-Strategy Orchestrator
#
# Manages IB Gateway + Portainer + N trading strategy containers.
# Single image (finrl-live-engine) serves all strategies via env vars.
#
# Preferred: use the management script (auto-detects compose version):
#   ./scripts/manage_strategies.sh build
#   ./scripts/manage_strategies.sh up all
#   ./scripts/manage_strategies.sh up ib
#   ./scripts/manage_strategies.sh up gmgp1-gold
#   ./scripts/manage_strategies.sh logs gmgp1-gold -f
#   ./scripts/manage_strategies.sh ps
#
# Or directly (use docker-compose or docker compose depending on install):
#   docker-compose -f docker/live/docker-compose.yaml \
#                  -f docker/live/docker-compose.desktop.yaml \
#                  --profile all up -d
#
# Adding a new strategy:
#   1. Copy an IB or crypto service block above the "Add new strategies" comment
#   2. Change: container_name, STRATEGY_NAME, STRATEGY_RUNNER, STRATEGY_CONFIG
#   3. Point checkpoint volume to the correct local directory
#   4. Create matching live config YAML in configs/

# ============================================================
#  Strategy templates (YAML anchors)
# ============================================================

x-common-env: &common-env
  WANDB_API_KEY: ${WANDB_API_KEY:?Set WANDB_API_KEY in .env}
  PYTHONPATH: /app
  TZ: UTC

x-healthcheck: &strategy-healthcheck
  test: ["CMD-SHELL", "pgrep -f 'run_live|_runner' || exit 1"]
  interval: 5m
  timeout: 10s
  start_period: 5m
  retries: 3

x-ib-strategy: &ib-strategy
  image: finrl-live-engine:latest
  depends_on:
    ibgateway:
      condition: service_healthy
  network_mode: "service:ibgateway"
  restart: unless-stopped
  healthcheck: *strategy-healthcheck

x-crypto-strategy: &crypto-strategy
  image: finrl-live-engine:latest
  networks: [finrl-net]
  restart: unless-stopped
  healthcheck: *strategy-healthcheck

# ============================================================
#  Infrastructure
# ============================================================

services:
  # --- IB Gateway (headless via IBC + Xvfb) ---
  ibgateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ibgateway
    environment:
      TWS_USERID: ${TWS_USERID:?Set TWS_USERID in .env}
      TWS_PASSWORD: ${TWS_PASSWORD:?Set TWS_PASSWORD in .env}
      TRADING_MODE: ${TRADING_MODE:-paper}
      TWS_ACCEPT_INCOMING: "true"
      READ_ONLY_API: "no"
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD:?Set VNC_PASSWORD in .env}
      TWOFA_TIMEOUT_ACTION: restart
      EXISTING_SESSION_DETECTED_ACTION: primaryoverride
    volumes:
      - ibgateway-data:/home/ibgateway/ibc
      - ibgateway-jts:/home/ibgateway/Jts
    networks: [finrl-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/4002'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  # --- Portainer CE (web UI for remote management) ---
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks: [finrl-net]
    restart: unless-stopped

  # --- Build-only service (builds the shared image) ---
  engine-base:
    build:
      context: ../..
      dockerfile: docker/live/Dockerfile.live-engine
    image: finrl-live-engine:latest
    profiles: [build]
    entrypoint: ["echo", "Image built successfully"]

  # ============================================================
  #  IB Strategies (Gold / Futures via Interactive Brokers)
  # ============================================================

  gmgp1-gold:
    <<: *ib-strategy
    container_name: gmgp1-gold
    profiles: [ib, all]
    environment:
      <<: *common-env
      BROKER_TYPE: ib
      IB_HOST: localhost
      IB_PORT: "4002"
      STRATEGY_NAME: gmgp1-gold
      STRATEGY_RUNNER: scripts/run_live_ib.py
      STRATEGY_CONFIG: /app/configs/live_gmgp1_gc_ib.yaml
    volumes:
      - ${CHECKPOINT_DIR:?Set CHECKPOINT_DIR}/gmgp1_v5_l1_seed456:/app/checkpoints/gmgp1_v5_l1_seed456:ro
      - ${CONFIG_DIR:?Set CONFIG_DIR}/live_gmgp1_gc_ib.yaml:/app/configs/live_gmgp1_gc_ib.yaml:ro
      - gmgp1-gold-logs:/app/logs

  sg1-gold:
    <<: *ib-strategy
    container_name: sg1-gold
    profiles: [ib, all]
    environment:
      <<: *common-env
      BROKER_TYPE: ib
      IB_HOST: localhost
      IB_PORT: "4002"
      STRATEGY_NAME: sg1-gold
      STRATEGY_RUNNER: scripts/run_live_ib.py
      STRATEGY_CONFIG: /app/configs/live_sg1_gc_ib.yaml
    volumes:
      - ${CHECKPOINT_DIR:?Set CHECKPOINT_DIR}/sg1_best:/app/checkpoints/sg1_best:ro
      - ${CONFIG_DIR:?Set CONFIG_DIR}/live_sg1_gc_ib.yaml:/app/configs/live_sg1_gc_ib.yaml:ro
      - sg1-gold-logs:/app/logs

  # ============================================================
  #  Crypto Strategies (Bybit / CCXT)
  # ============================================================

  gmgp1-btc:
    <<: *crypto-strategy
    container_name: gmgp1-btc
    profiles: [crypto, all]
    environment:
      <<: *common-env
      BROKER_TYPE: crypto
      STRATEGY_NAME: gmgp1-btc
      STRATEGY_RUNNER: scripts/run_live.py
      STRATEGY_CONFIG: /app/configs/live_gmgp1_btc_bybit.yaml
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
    volumes:
      - ${CHECKPOINT_DIR:?Set CHECKPOINT_DIR}/gmgp1_btc_best:/app/checkpoints/gmgp1_btc_best:ro
      - ${CONFIG_DIR:?Set CONFIG_DIR}/live_gmgp1_btc_bybit.yaml:/app/configs/live_gmgp1_btc_bybit.yaml:ro
      - gmgp1-btc-logs:/app/logs

  funding-arb:
    <<: *crypto-strategy
    container_name: funding-arb
    profiles: [crypto, all]
    environment:
      <<: *common-env
      BROKER_TYPE: crypto
      STRATEGY_NAME: funding-arb
      STRATEGY_RUNNER: scripts/run_live.py
      STRATEGY_CONFIG: /app/configs/live_funding_arb.yaml
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
    volumes:
      - ${CHECKPOINT_DIR:?Set CHECKPOINT_DIR}/funding_arb_best:/app/checkpoints/funding_arb_best:ro
      - ${CONFIG_DIR:?Set CONFIG_DIR}/live_funding_arb.yaml:/app/configs/live_funding_arb.yaml:ro
      - funding-arb-logs:/app/logs

  sync-1h:
    <<: *crypto-strategy
    container_name: sync-1h
    profiles: [crypto, all]
    environment:
      <<: *common-env
      BROKER_TYPE: crypto
      STRATEGY_NAME: sync-1h
      STRATEGY_RUNNER: scripts/run_live.py
      STRATEGY_CONFIG: /app/configs/live_sync_1h.yaml
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
    volumes:
      - ${CHECKPOINT_DIR:?Set CHECKPOINT_DIR}/sync_1h_best:/app/checkpoints/sync_1h_best:ro
      - ${CONFIG_DIR:?Set CONFIG_DIR}/live_sync_1h.yaml:/app/configs/live_sync_1h.yaml:ro
      - sync-1h-logs:/app/logs

  gmgp1-xauusd:
    <<: *crypto-strategy
    container_name: gmgp1-xauusd
    profiles: [ctrader, all]
    environment:
      <<: *common-env
      BROKER_TYPE: ctrader
      STRATEGY_NAME: gmgp1-xauusd
      STRATEGY_RUNNER: scripts/run_live_ctrader.py
      STRATEGY_CONFIG: /app/configs/live_gmgp1_xauusd_ctrader.yaml
      CTRADER_CLIENT_ID: ${CTRADER_CLIENT_ID:-}
      CTRADER_CLIENT_SECRET: ${CTRADER_CLIENT_SECRET:-}
      CTRADER_ACCESS_TOKEN: ${CTRADER_ACCESS_TOKEN:-}
      CTRADER_ACCOUNT_ID: ${CTRADER_ACCOUNT_ID:-}
    volumes:
      - ${CHECKPOINT_DIR:?Set CHECKPOINT_DIR}/gmgp1_xauusd_best:/app/checkpoints/gmgp1_xauusd_best:ro
      - ${CONFIG_DIR:?Set CONFIG_DIR}/live_gmgp1_xauusd_ctrader.yaml:/app/configs/live_gmgp1_xauusd_ctrader.yaml:ro
      - gmgp1-xauusd-logs:/app/logs

  # ============================================================
  #  Add new strategies here. Copy a template above and change:
  #    container_name, STRATEGY_NAME, STRATEGY_RUNNER,
  #    STRATEGY_CONFIG, checkpoint volume mount, log volume.
  #
  #  IB strategies: use <<: *ib-strategy, profiles: [ib, all]
  #  Crypto strategies: use <<: *crypto-strategy, profiles: [crypto, all]
  #  Each strategy gets its own log volume (add to volumes: below).
  # ============================================================

networks:
  finrl-net:
    driver: bridge

volumes:
  ibgateway-data:
  ibgateway-jts:
  portainer-data:
  gmgp1-gold-logs:
  sg1-gold-logs:
  gmgp1-btc-logs:
  funding-arb-logs:
  sync-1h-logs:
  gmgp1-xauusd-logs:
