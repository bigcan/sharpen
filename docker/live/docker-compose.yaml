# FinRL Multi-Strategy Orchestrator
#
# Manages IB Gateway + Portainer + N trading strategy containers.
# Single image (finrl-live-engine) serves all strategies via env vars.
#
# Preferred: use the management script (auto-detects compose version):
#   ./scripts/manage_strategies.sh build
#   ./scripts/manage_strategies.sh up all
#   ./scripts/manage_strategies.sh up ib
#   ./scripts/manage_strategies.sh up gmgp1-gold
#   ./scripts/manage_strategies.sh logs gmgp1-gold -f
#   ./scripts/manage_strategies.sh ps
#
# Or directly (use docker-compose or docker compose depending on install):
#   docker-compose -f docker/live/docker-compose.yaml \
#                  -f docker/live/docker-compose.desktop.yaml \
#                  --profile all up -d
#
# Adding a new strategy:
#   1. Copy an IB or crypto service block above the "Add new strategies" comment
#   2. Change: container_name, STRATEGY_NAME, STRATEGY_RUNNER, STRATEGY_CONFIG
#   3. Point checkpoint volume to the correct local directory
#   4. Create matching live config YAML in configs/

# ============================================================
#  Strategy templates (YAML anchors)
# ============================================================

x-common-env: &common-env
  WANDB_API_KEY: ${WANDB_API_KEY:?Set WANDB_API_KEY in .env}
  PYTHONPATH: /app
  TZ: UTC
  MAX_STALE_SECONDS: ${MAX_STALE_SECONDS:-600}

x-healthcheck: &strategy-healthcheck
  test: ["CMD-SHELL", "/app/healthcheck.sh"]
  interval: 5m
  timeout: 10s
  start_period: 5m
  retries: 3

x-ib-strategy: &ib-strategy
  image: finrl-live-engine:latest
  depends_on:
    ibgateway:
      condition: service_healthy
  network_mode: "service:ibgateway"
  restart: unless-stopped
  healthcheck: *strategy-healthcheck
  deploy:
    resources:
      limits:
        memory: 1536M
        cpus: "2.0"
x-crypto-strategy: &crypto-strategy
  image: finrl-live-engine:latest
  networks: [finrl-net]
  restart: unless-stopped
  healthcheck: *strategy-healthcheck
  deploy:
    resources:
      limits:
        memory: 1536M
        cpus: "2.0"
# ============================================================
#  Infrastructure
# ============================================================

services:
  # --- IB Gateway (headless via IBC + Xvfb) ---
  # Custom image bakes IBC config template patches (OverrideTwsApiPort=4002,
  # CommandServerPort=7462) so a fresh Jts volume still opens the TWS API
  # without a manual VNC-in click. See docker/live/Dockerfile.ibgateway.
  ibgateway:
    build:
      context: .
      dockerfile: Dockerfile.ibgateway
    image: finrl-ibgateway:latest
    container_name: ibgateway
    environment:
      TWS_USERID: ${TWS_USERID:?Set TWS_USERID in .env}
      TWS_PASSWORD: ${TWS_PASSWORD:?Set TWS_PASSWORD in .env}
      TRADING_MODE: ${TRADING_MODE:-paper}
      TWS_ACCEPT_INCOMING: "true"
      READ_ONLY_API: "no"
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD:?Set VNC_PASSWORD in .env}
      TWOFA_TIMEOUT_ACTION: restart
      EXISTING_SESSION_DETECTED_ACTION: primaryoverride
    volumes:
      - ibgateway-jts:/home/ibgateway/Jts
    networks: [finrl-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/4002'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  # --- Portainer CE (web UI for remote management) ---
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks: [finrl-net]
    restart: unless-stopped

  # --- Build-only service (builds the shared image) ---
  engine-base:
    build:
      context: ../..
      dockerfile: docker/live/Dockerfile.live-engine
    image: finrl-live-engine:latest
    profiles: [build]
    entrypoint: ["echo", "Image built successfully"]

  # ============================================================
  #  IB Strategies (Gold / Futures via Interactive Brokers)
  # ============================================================

  gmgp1-gold:
    <<: *ib-strategy
    container_name: gmgp1-gold
    profiles: [ib, all]
    labels:
      finrl.monitor: "true"
      finrl.strategy: "gmgp1-gold"
      finrl.broker: "ib"
    environment:
      <<: *common-env
      BROKER_TYPE: ib
      IB_HOST: localhost
      IB_PORT: "4002"
      STRATEGY_NAME: gmgp1-gold
      STRATEGY_RUNNER: scripts/run_live_ib.py
      STRATEGY_CONFIG: /app/configs/live_gmgp1_gc_ib.yaml
      METRICS_PORT: "9101"
      MAX_STALE_SECONDS: "4500"  # 75min: covers 60-min CME maintenance + 15-min bar
    volumes:
      - ${CHECKPOINT_DIR:?Set CHECKPOINT_DIR}/gmgp1_v5_l1_seed456:/app/checkpoints/gmgp1_v5_l1_seed456:ro
      - gmgp1-gold-logs:/app/logs
      - gmgp1-gold-state:/app/state
    # Override ib-strategy anchor default (1536M) to absorb reconnect-cascade spikes
    # after IB Error 201 / HMDS 322 storms. Steady-state RAM ~326 MiB; bump ceiling
    # to 2 GiB to prevent OOM exit=137 (observed 2026-04-20 06:22 UTC).
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  sg1-gold:
    <<: *ib-strategy
    container_name: sg1-gold
    profiles: [sg1, all]
    labels:
      finrl.monitor: "true"
      finrl.strategy: "sg1-gold"
      finrl.broker: "ib"
    environment:
      <<: *common-env
      BROKER_TYPE: ib
      IB_HOST: localhost
      IB_PORT: "4002"
      STRATEGY_NAME: sg1-gold
      STRATEGY_RUNNER: scripts/run_live_ib.py
      STRATEGY_CONFIG: /app/configs/live_sg1_gc_ib.yaml
      METRICS_PORT: "9102"
      MAX_STALE_SECONDS: "4500"  # 75min: covers 60-min CME maintenance + 3-min bar
    volumes:
      - ${CHECKPOINT_DIR:?Set CHECKPOINT_DIR}/sg1_best:/app/checkpoints/sg1_best:ro
      - sg1-gold-logs:/app/logs
      - sg1-gold-state:/app/state

  # ============================================================
  #  Crypto Strategies (Bybit / CCXT)
  # ============================================================

  gmgp1-btc:
    <<: *crypto-strategy
    container_name: gmgp1-btc
    profiles: [crypto, all]
    labels:
      finrl.monitor: "true"
      finrl.strategy: "gmgp1-btc"
      finrl.broker: "crypto"
    environment:
      <<: *common-env
      BROKER_TYPE: crypto
      STRATEGY_NAME: gmgp1-btc
      STRATEGY_RUNNER: scripts/run_live.py
      STRATEGY_CONFIG: /app/configs/live_gmgp1_btc_bybit.yaml
      METRICS_PORT: "9103"
      BINANCE_DEMO_API_KEY: ${BINANCE_DEMO_API_KEY:-}
      BINANCE_DEMO_API_SECRET: ${BINANCE_DEMO_API_SECRET:-}
    volumes:
      - ${CHECKPOINT_DIR:?Set CHECKPOINT_DIR}/gmgp1-btc-l1-multiseed_20260407_070227:/app/checkpoints/gmgp1-btc-l1-multiseed_20260407_070227:ro
      - gmgp1-btc-logs:/app/logs
      - gmgp1-btc-state:/app/state

  funding-arb:
    <<: *crypto-strategy
    container_name: funding-arb
    profiles: [crypto, all]
    labels:
      finrl.monitor: "true"
      finrl.strategy: "funding-arb"
      finrl.broker: "crypto"
    environment:
      <<: *common-env
      BROKER_TYPE: crypto
      STRATEGY_NAME: funding-arb
      STRATEGY_RUNNER: scripts/run_live.py
      STRATEGY_CONFIG: /app/configs/live_funding_arb.yaml
      METRICS_PORT: "9104"
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
    volumes:
      - ${CHECKPOINT_DIR:?Set CHECKPOINT_DIR}/funding_arb_best:/app/checkpoints/funding_arb_best:ro
      - funding-arb-logs:/app/logs
      - funding-arb-state:/app/state

  sync-1h:
    <<: *crypto-strategy
    container_name: sync-1h
    profiles: [crypto, all]
    labels:
      finrl.monitor: "true"
      finrl.strategy: "sync-1h"
      finrl.broker: "crypto"
    environment:
      <<: *common-env
      BROKER_TYPE: crypto
      STRATEGY_NAME: sync-1h
      STRATEGY_RUNNER: scripts/run_live.py
      STRATEGY_CONFIG: /app/configs/live_sync_1h.yaml
      METRICS_PORT: "9105"
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
    volumes:
      - ${CHECKPOINT_DIR:?Set CHECKPOINT_DIR}/sync_1h_best:/app/checkpoints/sync_1h_best:ro
      - sync-1h-logs:/app/logs
      - sync-1h-state:/app/state

  # --- Velotrade Prop Firm (DXtrade) ---
  velotrade-btc:
    <<: *crypto-strategy
    container_name: velotrade-btc
    profiles: [velotrade, all]
    labels:
      finrl.monitor: "true"
      finrl.strategy: "velotrade-btc"
      finrl.broker: "dxtrade"
    environment:
      <<: *common-env
      BROKER_TYPE: dxtrade
      STRATEGY_NAME: velotrade-btc
      STRATEGY_RUNNER: scripts/run_live_dxtrade.py
      STRATEGY_CONFIG: /app/configs/live_velotrade_btc.yaml
      METRICS_PORT: "9107"
      DXTRADE_SERVER: ${DXTRADE_SERVER:-}
      DXTRADE_USERNAME: ${DXTRADE_USERNAME:-}
      DXTRADE_PASSWORD: ${DXTRADE_PASSWORD:-}
      DXTRADE_ACCOUNT_ID: ${DXTRADE_ACCOUNT_ID:-}
    volumes:
      - ${CHECKPOINT_DIR:?Set CHECKPOINT_DIR}/velotrade_btc_best:/app/checkpoints/velotrade_btc_best:ro
      - velotrade-btc-logs:/app/logs
      - velotrade-btc-state:/app/state

  gmgp1-xauusd:
    <<: *crypto-strategy
    container_name: gmgp1-xauusd
    profiles: [ctrader, all]
    labels:
      finrl.monitor: "true"
      finrl.strategy: "gmgp1-xauusd"
      finrl.broker: "ctrader"
    environment:
      <<: *common-env
      BROKER_TYPE: ctrader
      STRATEGY_NAME: gmgp1-xauusd
      STRATEGY_RUNNER: scripts/run_live_ctrader.py
      STRATEGY_CONFIG: /app/configs/live_gmgp1_xauusd_ctrader.yaml
      METRICS_PORT: "9106"
      CTRADER_CLIENT_ID: ${CTRADER_CLIENT_ID:-}
      CTRADER_CLIENT_SECRET: ${CTRADER_CLIENT_SECRET:-}
      CTRADER_ACCESS_TOKEN: ${CTRADER_ACCESS_TOKEN:-}
      CTRADER_ACCOUNT_ID: ${CTRADER_ACCOUNT_ID:-}
    volumes:
      - ${CHECKPOINT_DIR:?Set CHECKPOINT_DIR}/gmgp1-xauusd-l1-multiseed_20260408_163103:/app/checkpoints/gmgp1-xauusd-l1-multiseed_20260408_163103:ro
      - gmgp1-xauusd-logs:/app/logs
      - gmgp1-xauusd-state:/app/state

  # ============================================================
  #  Data Collectors (no trading, no checkpoints)
  # ============================================================

  hl-lob-recorder:
    image: finrl-live-engine:latest
    container_name: hl-lob-recorder
    profiles: [hl-recorder, all]
    networks: [finrl-net]
    restart: unless-stopped
    # Override the strategy entrypoint (which requires STRATEGY_RUNNER / _CONFIG)
    # — this service is a pure data collector, not a trading strategy.
    entrypoint: []
    working_dir: /app
    # Named volume mount point is created root-owned; image's finrl user cannot
    # mkdir inside. Collector has no broker credentials / trading surface, so
    # running as root is acceptable here.
    user: "0:0"
    command: >
      python scripts/record_hyperliquid_lob.py
      --coin ${HL_COIN:-BTC}
      --duration-hours ${HL_DURATION_HOURS:-168}
      --interval ${HL_SNAPSHOT_INTERVAL:-1.0}
      --flush-interval ${HL_FLUSH_INTERVAL:-300}
      --depth ${HL_DEPTH:-10}
    environment:
      <<: *common-env
    volumes:
      - hyperliquid-data:/app/data/hyperliquid
    # Healthcheck: a parquet part file must have been written in the last 15 min
    # (flush_interval default = 5 min). If the WS stalled silently, this flags it.
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import glob,os,time,sys;
          fs=glob.glob('/app/data/hyperliquid/**/*.parquet', recursive=True);
          sys.exit(0 if any(time.time()-os.path.getmtime(f)<900 for f in fs) else 1)"
      interval: 5m
      timeout: 10s
      start_period: 10m
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ============================================================
  #  Add new strategies here. Copy a template above and change:
  #    container_name, STRATEGY_NAME, STRATEGY_RUNNER,
  #    STRATEGY_CONFIG, checkpoint volume mount, log volume.
  #
  #  IB strategies: use <<: *ib-strategy, profiles: [ib, all]
  #  Crypto strategies: use <<: *crypto-strategy, profiles: [crypto, all]
  #  Each strategy gets its own log volume (add to volumes: below).
  # ============================================================

  # ============================================================
  #  Monitoring (Prometheus + Grafana)
  # ============================================================

  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    image: finrl-prometheus:latest
    container_name: prometheus
    profiles: [monitoring, all]
    volumes:
      - prometheus-data:/prometheus
    networks: [finrl-net]
    restart: unless-stopped

  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    image: finrl-grafana:latest
    container_name: grafana
    profiles: [monitoring, all]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-finrl}
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [finrl-net]
    restart: unless-stopped

  watchdog:
    build:
      context: ../..
      dockerfile: docker/live/Dockerfile.watchdog
    image: finrl-watchdog:latest
    container_name: watchdog
    profiles: [monitoring, all]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WANDB_API_KEY: ${WANDB_API_KEY:?Set WANDB_API_KEY in .env}
      SWEEP_INTERVAL: "300"
      WANDB_CHECK_INTERVAL: "1800"
      ALERT_COOLDOWN: "300"
      IGNORE_WANDB_RUNS: ${IGNORE_WANDB_RUNS:-}
      IGNORE_CONTAINERS: ${IGNORE_CONTAINERS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [finrl-net]
    restart: unless-stopped

networks:
  finrl-net:
    driver: bridge

volumes:
  ibgateway-jts:
  portainer-data:
  prometheus-data:
  grafana-data:
  gmgp1-gold-logs:
  sg1-gold-logs:
  gmgp1-btc-logs:
  funding-arb-logs:
  sync-1h-logs:
  gmgp1-xauusd-logs:
  velotrade-btc-logs:
  gmgp1-gold-state:
  sg1-gold-state:
  gmgp1-btc-state:
  funding-arb-state:
  sync-1h-state:
  gmgp1-xauusd-state:
  velotrade-btc-state:
  hyperliquid-data:
