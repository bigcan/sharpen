# Desktop overlay — Win11 desktop machine as Docker host
#
# All ports bound to localhost. Access remotely via SSH tunnel:
#   ssh -L 9443:localhost:9443 -L 5900:localhost:5900 user@desktop
#
# Usage (from project root):
#   docker-compose -f docker/live/docker-compose.yaml \
#                  -f docker/live/docker-compose.desktop.yaml \
#                  --profile ib --profile crypto up -d

services:
  ibgateway:
    ports:
      - "127.0.0.1:5900:5900"    # VNC — SSH tunnel only (security)
      - "127.0.0.1:4002:4002"    # IB API — localhost only (security)

  portainer:
    ports:
      - "0.0.0.0:9443:9443"      # Portainer HTTPS — Tailscale accessible
