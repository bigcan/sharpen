experiment_id: futures_daily_demo
fingerprint_manifest: finrl_pro_ds/configs/fingerprints.yaml
risk_profile_file: finrl_pro_ds/configs/risk_profiles.yaml
risk_profile_id: default
sandbox_enabled: true

training:
  config_path: finrl_pro_ds/configs/config.yaml
  dataset_hash: dvc://datasets/futures_daily_2018_2025
  seed: 21
  use_pro_env: false
  module_versions:
    finrl_pro_ds.training.trainer: "FinRL-Pro-Research-1"
    agent: A2C
  metrics:
    sharpe_ratio: 1.08
    max_drawdown: 0.19
    volatility: 0.28
    capital_at_risk: 0.09
    leverage: 1.4
  artifact_uris: []
  baseline_reference: benchmarks:sp500_rolling_1y

features:
  enable_custom: false
  use_turbulence: false
  families:
    trend: true
    momentum: true
    vol: true
    volume: false
  stockstats_overrides: []
  advanced:
    fracdiff:
      enable: false
      cols: [close]
      d: 0.5
      window: 256
      min_weight: 1.0e-5
    wavelet:
      enable: false
      cols: [close]
      wavelet: db4
      level: 3
      window: 256
  cache:
    enabled: true
    dir: finrl_pro_ds/data/processed

