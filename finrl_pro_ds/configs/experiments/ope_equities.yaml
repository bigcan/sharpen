experiment_id: ope_equities_demo
fingerprint_manifest: finrl_pro_ds/configs/fingerprints.yaml
risk_profile_file: finrl_pro_ds/configs/risk_profiles.yaml
risk_profile_id: default
sandbox_enabled: true

training:
  config_path: finrl_pro_ds/configs/config.yaml
  dataset_hash: dvc://datasets/sp500_daily_2016_2025
  seed: 11
  use_pro_env: false
  module_versions:
    finrl_pro_ds.training.trainer: "FinRL-Pro-Research-1"
    agent: PPO
  metrics:
    sharpe_ratio: 1.12
    max_drawdown: 0.17
    volatility: 0.24
    capital_at_risk: 0.08
    leverage: 1.2
  artifact_uris: []
  baseline_reference: benchmarks:sp500_rolling_1y

features:
  enable_custom: false
  use_turbulence: false
  families:
    trend: true
    momentum: true
    vol: true
    volume: false
  stockstats_overrides: []
  advanced:
    fracdiff:
      enable: false
      cols: [close]
      d: 0.5
      window: 256
      min_weight: 1.0e-5
    wavelet:
      enable: false
      cols: [close]
      wavelet: db4
      level: 3
      window: 256
  cache:
    enabled: true
    dir: finrl_pro_ds/data/processed


