experiment_id: phase9_sonnet_protocol
features:
  advanced:
    fracdiff:
      d: 0.4
      enable: true
    wavelet:
      enable: false
  cache:
    dir: finrl_pro_ds/data/processed
    enabled: true
  enable_custom: false
  families:
    momentum: true
    trend: true
    vol: true
    volume: true
  use_turbulence: true
fingerprint_manifest: finrl_pro_ds/configs/fingerprints.yaml
risk_profile_file: finrl_pro_ds/configs/risk_profiles.yaml
risk_profile_id: conservative
sandbox_enabled: true

data:
  dataset_hash: file://data/btc_usdt_phase9_2005_2025.parquet
  start_date: '2005-01-01'
  end_date: '2025-01-01'
  tickers:
    - WMT
    - KO
    - PEP
    - MCD
    - NKE
    - COST
    - CL
    - CSCO
    - INTC
    - ORCL
    - IBM
    - VZ
    - T
    - ADBE
    - TXN
    - BA
    - CAT
    - DIS
    - PFE
    - HON

hpo:
  rolling_window:
    train_years: 3
    val_years: 1
    test_years: 1
    step_years: 1
  trials: 30
  objective: modified_calmar  # Custom objective key
  ensemble_size: 3

training:
  action_smoothing: 0.1
  agent:
    name: PPOAgent
    params:
      device: "cuda"
      batch_size: 128        # Smaller batch for faster iterations in HPO
      clip_range: 0.2
      ent_coef: 0.01
      gae_lambda: 0.95
      gamma: 0.99
      learning_rate: 0.00025
      n_steps: 2048
      n_epochs: 10
  baseline_reference: benchmarks:btc_usdt_buy_hold
  config_path: finrl_pro_ds/configs/config.yaml
  
  environment:
    buy_cost_pct: 0.001       # 10 bps
    sell_cost_pct: 0.001      # 10 bps
    initial_capital: 1000000.0
    max_stock: 100            # Risk constraint
    min_stock_rate: 0.0
    turbulence_thresh: 150.0
    reward_scaling: 1e-4
    
  turnover_penalty: 0.001      # Reduced from 0.01 to allow more active trading
  
  metrics:
    calmar_ratio: 0.5
    sharpe_ratio: 1.0
    
  real_training: true
  seed: 42
  total_timesteps: 100000      # Increased for better convergence
