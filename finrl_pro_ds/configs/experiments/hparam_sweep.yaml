experiment_id: hparam_sweep_demo
fingerprint_manifest: finrl_pro_ds/configs/fingerprints.yaml
risk_profile_file: finrl_pro_ds/configs/risk_profiles.yaml
risk_profile_id: default
sandbox_enabled: true

training:
  config_path: finrl_pro_ds/configs/config.yaml
  dataset_hash: dvc://datasets/btc_usdt_daily_2016_2025
  seed: 2025
  use_pro_env: false
  module_versions:
    finrl_pro_ds.training.trainer: "FinRL-Pro-Research-1"
    agent: PPO
  metrics:
    sharpe_ratio: 1.10
    max_drawdown: 0.18
    volatility: 0.26
    capital_at_risk: 0.09
    leverage: 1.3
  artifact_uris: []
  baseline_reference: benchmarks:btc_usdt_rolling_1y

features:
  enable_custom: false
  use_turbulence: false
  families:
    trend: true
    momentum: true
    vol: true
    volume: false
  stockstats_overrides: []
  advanced:
    fracdiff:
      enable: false
      cols: [close]
      d: 0.5
      window: 256
      min_weight: 1.0e-5
    wavelet:
      enable: false
      cols: [close]
      wavelet: db4
      level: 3
      window: 256
  cache:
    enabled: true
    dir: finrl_pro_ds/data/processed

# Optional sweep metadata for external orchestrators (ignored by run_experiment):
sweep:
  trials: 15
  search_space:
    learning_rate: [1.0e-4, 5.0e-4, 1.0e-3]
    gamma: [0.95, 0.99]
    entropy_coef: [0.0, 0.01]


