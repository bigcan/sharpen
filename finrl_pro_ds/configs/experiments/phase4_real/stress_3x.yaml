experiment_id: phase4_stress_3x
fingerprint_manifest: finrl_pro_ds/configs/fingerprints.yaml
risk_profile_file: finrl_pro_ds/configs/risk_profiles.yaml
risk_profile_id: default
sandbox_enabled: true

training:
  real_training: true
  config_path: finrl_pro_ds/configs/config.yaml
  dataset_hash: file://data/btc_usdt_daily_2016_2025.parquet
  seed: 42
  use_pro_env: true
  total_timesteps: 2600

  environment:
    buy_cost_pct: 3.0e-4  # 3 bps
    sell_cost_pct: 3.0e-4 # 3 bps
    initial_capital: 1000000.0

  module_versions:
    finrl_pro_ds.training.trainer: "FinRL-Pro-Research-1"
    agent: PPO
    action.space: CONTINUOUS_[-1,+1]
    reward.type: logR
    features.set: fracdiff_0.5
    agent.clip_range: 0.30
    costs.bps: 6

  metrics:
    sharpe_ratio: 1.05
    max_drawdown: 0.18
    volatility: 0.22
    capital_at_risk: 0.08
    leverage: 1.2

  baseline_reference: benchmarks:btc_usdt_rolling_1y

features:
  enable_custom: true
  use_turbulence: false
  families:
    trend: true
    momentum: true
    vol: true
    volume: true
  advanced:
    fracdiff:
      enable: true
      cols: [close]
      d: 0.5
      window: 256
      min_weight: 1.0e-5
    wavelet:
      enable: false
  cache:
    enabled: true
    dir: finrl_pro_ds/data/processed
