# Bull Specialist (High Beta, Trend)
# Trained on 2016-2018 (Strong Bull)
data:
  dataset_hash: "file://data/btc_usdt_full_2010_2025.parquet"
  start_date: "2016-01-04"
  end_date: "2018-01-04"
  tickers: 
    - AAPL
    - MSFT
    - AMZN
    - GOOGL
    - META
    - TSLA
    - NVDA
    - JPM
    - V
    - JNJ
    - WMT
    - PG
    - XOM
    - UNH
    - MA
    - HD
    - CVX
    - MRK
    - ABBV
    - KO

training:
  config_path: finrl_pro_ds/configs/experiments/phase6_specialists/bull.yaml
  dataset_hash: "file://data/btc_usdt_full_2010_2025.parquet"
  start_date: "2016-01-04"
  end_date: "2018-01-04"
  real_training: true
  total_timesteps: 50000 # Short training for demo
  seed: 42
  agent:
    name: "PPOAgent"
    params:
      lr: 2.0e-4 # Tuned for Bull (from HPO W1)
      gamma: 0.96
      clip_ratio: 0.3
      entropy_coef: 0.025
  baseline_reference: benchmarks:btc_usdt_buy_hold
  register_model: true
  model_name: "specialist_bull"

features:
  families:
    momentum: ["rsi_30", "dx_30"]
    trend: ["macd", "close_30_sma", "close_60_sma"]
    volatility: ["boll_ub", "boll_lb"]
  use_turbulence: true

environment:
  initial_capital: 1000000
  buy_cost_pct: 0.001
  sell_cost_pct: 0.001
  reward_scaling: 0.0001220703125

risk_profile_file: finrl_pro_ds/configs/risk_profiles.yaml
risk_profile_id: yolo
