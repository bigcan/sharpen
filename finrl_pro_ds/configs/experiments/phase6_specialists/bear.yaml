# Bear Specialist (Mean Reversion, Capital Preservation)
# Trained on 2022-2023 (Bear)
data:
  dataset_hash: "file://data/sp500_full_2010_2025.parquet"
  start_date: "2022-01-04"
  end_date: "2023-01-04"
  tickers: 
    - AAPL
    - MSFT
    - AMZN
    - GOOGL
    - META
    - TSLA
    - NVDA
    - JPM
    - V
    - JNJ
    - WMT
    - PG
    - XOM
    - UNH
    - MA
    - HD
    - CVX
    - MRK
    - ABBV
    - KO

training:
  config_path: finrl_pro_ds/configs/experiments/phase6_specialists/bear.yaml
  dataset_hash: "file://data/sp500_full_2010_2025.parquet"
  start_date: "2022-01-04"
  end_date: "2023-01-04"
  real_training: true
  total_timesteps: 50000
  seed: 42
  agent:
    name: "PPOAgent"
    params:
      lr: 7.3e-5 # Tuned for Bear (from HPO W10)
      gamma: 0.97
      clip_ratio: 0.25
      entropy_coef: 0.035
  baseline_reference: benchmarks:sp500_buy_hold
  register_model: true
  model_name: "specialist_bear"

features:
  families:
    momentum: ["rsi_30", "dx_30"]
    trend: ["macd", "close_30_sma", "close_60_sma"]
    volatility: ["boll_ub", "boll_lb"]
  use_turbulence: true

environment:
  initial_capital: 1000000
  buy_cost_pct: 0.001
  sell_cost_pct: 0.001
  reward_scaling: 0.0001220703125

risk_profile_file: finrl_pro_ds/configs/risk_profiles.yaml
risk_profile_id: yolo
