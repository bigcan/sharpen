experiment_id: phase4_turnover_penalty_5_0
fingerprint_manifest: finrl_pro_ds/configs/fingerprints.yaml
risk_profile_file: finrl_pro_ds/configs/risk_profiles.yaml
risk_profile_id: default
sandbox_enabled: true

training:
  config_path: finrl_pro_ds/configs/config.yaml
  dataset_hash: dvc://datasets/sp500_daily_2016_2025
  seed: 42
  use_pro_env: false
  turnover_penalty: 5.0  # INCREASED: 10x stronger penalty
  module_versions:
    finrl_pro_ds.training.trainer: "FinRL-Pro-Research-1"
    agent: PPO
    action.space: CONTINUOUS_[-1,+1]
    reward.type: logR_turnover_penalty_5_0
    features.set: raw_log_returns
    agent.gae_lambda: 0.98
  metrics:
    sharpe_ratio: 1.05
    max_drawdown: 0.18
    volatility: 0.22
    capital_at_risk: 0.08
    leverage: 1.2
  artifact_uris: []
  baseline_reference: benchmarks:sp500_rolling_1y

features:
  enable_custom: true
  use_turbulence: false
  families:
    trend: true
    momentum: true
    vol: true
    volume: true
  stockstats_overrides: []
  advanced:
    fracdiff:
      enable: false
      cols: [close]
      d: 0.5
      window: 256
      min_weight: 1.0e-5
    wavelet:
      enable: false
      cols: [close]
      wavelet: db4
      level: 3
      window: 256
  cache:
    enabled: true
    dir: finrl_pro_ds/data/processed

sweep:
  seeds: [41, 42, 43]
