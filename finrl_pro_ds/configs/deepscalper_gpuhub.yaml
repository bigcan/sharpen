symbol: "BTCUSDT"
data:
  file_path: "/data/btc_lob_jan2023.parquet"  # GPUHub Linux path
  ticker: "BTCUSDT"
features:
  feature_list: ["micro", "macro"]
env:
  symbol: "BTCUSDT"
  initial_balance: 100000.0
  num_envs: 24  # Utilize 25 vCPU
  reward:
    volatility_horizon: 100
network:
  micro_config:
    input_size: 20
    hidden_size: 64
  macro_config:
    input_size: 11
    hidden_sizes: [64]
  ensemble_config:
    input_size: 11
    hidden_size: 64

agents:
  dqn:
    learning_rate: 0.0001
    gamma: 0.99
    auxiliary_weight: 0.1
  ppo:
    learning_rate: 0.0001
  a2c:
    learning_rate: 0.0001
  gating:
    learning_rate: 0.0001

training:
  batch_size: 4096
  total_timesteps: 1000000  # 1M steps for real backtest
  learning_rate: 0.0001
  log_interval: 1000  # Optimized
  torch_compile: true  # Blackwell Tensor Cores

wandb:
  project: "FinRL-Pro-DS"
  entity: "bigcan-chiwin-technology"
  mode: "online"
  tags: ["SHM_Fix", "V9", "RTX5090"]
