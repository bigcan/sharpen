symbol: "BTCUSDT"
data:
  file_path: "c:/FinRL/FinRL-Pro_DS/data/dummy_lob.parquet"
  ticker: "BTCUSDT"
features:
  feature_list: ["micro", "macro"]
env:
  symbol: "BTCUSDT"
  initial_balance: 10000.0
  reward:
    volatility_horizon: 100
network:
  micro_config:
    input_size: 20
    hidden_size: 64
  macro_config:
    input_size: 11
    hidden_sizes: [64]
  ensemble_config:
    input_size: 11
    hidden_size: 64

agents:
  dqn:
    learning_rate: 0.0001
    gamma: 0.99
    auxiliary_weight: 0.1 # Section 4.4
  ppo:
    learning_rate: 0.0001
  a2c:
    learning_rate: 0.0001
  gating:
    learning_rate: 0.0001

training:
  batch_size: 32
  total_timesteps: 100
  learning_rate: 0.0001
