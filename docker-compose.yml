version: '3.8'

services:
  # 1. Database: TimescaleDB (Market Data + MLflow Metadata)
  db:
    image: timescale/timescaledb:latest-pg14
    container_name: finrl_pro_ds_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=finrl_pro_ds
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - finrl_pro_ds_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: finrl_pro_ds_mlflow
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      # Connect to the 'db' service defined above
      - MLFLOW_BACKEND_STORE_URI=postgresql://postgres:password@db:5432/finrl_pro_ds
      - MLFLOW_ARTIFACT_ROOT=/mlflow/artifacts
    command: >
      mlflow server 
      --backend-store-uri postgresql://postgres:password@db:5432/finrl_pro_ds
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - finrl_pro_ds_mlflow_data:/mlflow/artifacts
    restart: always

volumes:
  finrl_pro_ds_db_data:
  finrl_pro_ds_mlflow_data:
