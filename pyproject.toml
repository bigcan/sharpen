[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finrl-pro-ds"
version = "0.1.0"
description = "FinRL-Pro_DS scaffold extending FinRL Podracer with modular components."
authors = [{ name = "FinRL Contributors" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0",
    "requests==2.32.3",
    "yfinance>=0.2.40",
    "pyarrow>=14.0.1",
    "alpaca-py>=0.23.0",
    "PyWavelets>=1.5.0",
    "statsmodels>=0.14.0",
    "gymnasium>=1.0",
    # "stable-baselines3>=2.3.0",
    # "shimmy>=0.2.1",
    "hmmlearn>=0.3.0",
    "scikit-learn>=1.3.0",
    # "vectorbt>=0.25.0",
    "wandb>=0.16.0",
    "python-binance>=1.0.19",
    "ta>=0.11.0",
    "python-dotenv>=1.0.0",
    "kaggle>=1.5.16",
    "protobuf==3.20.1",
    "rich>=14.0.0"
]
readme = "README.md"

[project.optional-dependencies]
crypto = [
    "ccxt>=4.0.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "stable-baselines3>=2.3.0",
    "matplotlib>=3.7",
]
ib = [
    "ib-insync>=0.9.86",
]
ctrader = [
    "ctrader-open-api==0.9.2",
    "twisted==24.3.0",
    "service-identity>=24.0",
    "pyOpenSSL==24.1.0",
    "inputimeout==1.0.4",
]
distributed = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.8",
    "black>=23.12",
    "mypy>=1.7",
    "lancedb>=0.29.0",
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/AI4Finance-Foundation/FinRL"

[tool.setuptools.packages.find]
where = ["."]
include = ["finrl_pro_ds*"]

[tool.pytest.ini_options]
# `-m "not integration"` keeps bare `pytest` off the network: the integration
# tests talk to live exchange testnets. Run them explicitly with `-m integration`.
#
# `not slow` is what makes a bare `pytest` terminate at all. The "run-size hang" filed
# 2026-08-01 (S553-cont-149) as a suspected thread/handle/memory limit was these 25
# tests: several shell out via `subprocess.run` to a full synthetic genetic search and
# run it TWICE (tests/crucible/test_reproducibility.py, test_reproduce_p5.py — each
# exceeds 400 s ALONE, so it is not a run-size effect). That also explains why
# `--timeout --timeout-method=thread` never fired: the thread method raises in the main
# thread, which is blocked inside `subprocess.run` and cannot take the exception until
# the child returns. The `slow` marker already existed and every one of these files
# documents itself as "skipped under -m 'not slow'" — it simply was not deselected here.
# Cost of the exclusion is 25 of 3178 tests (0.8%). Run them with `-m slow`.
addopts = "-q -m 'not integration and not slow'"
# pytest-asyncio is a hard requirement — without it the `asyncio`-marked
# coroutine tests are collected but never executed (silently, via a warning).
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
markers = [
    "slow: marks tests that load heavy models / external providers (deselect with '-m \"not slow\"')",
    "integration: marks tests that hit live/integration surfaces (e.g. exchange brokers; deselect with '-m \"not integration\"')",
    "asyncio: marks async coroutine tests (requires pytest-asyncio to actually execute; absent => skipped)",
]
