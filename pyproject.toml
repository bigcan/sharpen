[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finrl-pro"
version = "0.1.0"
description = "FinRL Pro scaffold extending FinRL Podracer with modular components."
authors = [{ name = "FinRL Contributors" }]
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/AI4Finance-Foundation/FinRL"

[tool.setuptools.packages.find]
where = ["."]
include = ["finrl_pro*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
