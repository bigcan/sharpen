[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finrl-pro"
version = "0.1.0"
description = "FinRL Pro scaffold extending FinRL Podracer with modular components."
authors = [{ name = "FinRL Contributors" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "pandas>=2.1.0",
    "mlflow>=2.9.0",
    "dvc[s3]>=3.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "psycopg[binary]>=3.2.0",
    "yfinance>=0.2.40",
    "pyarrow>=14.0.0",
    "alpaca-py>=0.23.0",
    "PyWavelets>=1.5.0",
    "statsmodels>=0.14.0",
    "gymnasium>=0.29.1",
    "stable-baselines3>=2.3.0"
]
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.8",
    "black>=23.12",
    "mypy>=1.7",
]

[project.urls]
Homepage = "https://github.com/AI4Finance-Foundation/FinRL"

[tool.setuptools.packages.find]
where = ["."]
include = ["finrl_pro*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
