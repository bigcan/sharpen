[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finrl-pro-ds"
version = "0.1.0"
description = "FinRL-Pro_DS scaffold extending FinRL Podracer with modular components."
authors = [{ name = "FinRL Contributors" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "yfinance>=0.2.40",
    "pyarrow>=14.0.1",
    "alpaca-py>=0.23.0",
    "PyWavelets>=1.5.0",
    "statsmodels>=0.14.0",
    "gymnasium>=0.29.1",
    # "stable-baselines3>=2.3.0",
    # "shimmy>=0.2.1",
    "hmmlearn>=0.3.0",
    "scikit-learn>=1.3.0",
    # "vectorbt>=0.25.0",
    "wandb>=0.16.0",
    "python-binance>=1.0.19",
    "ta>=0.11.0",
    "python-dotenv>=1.0.0",
    "kaggle>=1.5.16"
]
readme = "README.md"

[project.optional-dependencies]
crypto = [
    "ccxt>=4.0.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "stable-baselines3>=2.3.0",
    "matplotlib>=3.7",
]
ib = [
    "ib-insync>=0.9.86",
]
ctrader = [
    "ctrader-open-api>=0.9.0",
    "twisted>=24.0",
    "service-identity>=24.0",
]
distributed = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.8",
    "black>=23.12",
    "mypy>=1.7",
    "lancedb>=0.29.0",
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/AI4Finance-Foundation/FinRL"

[tool.setuptools.packages.find]
where = ["."]
include = ["finrl_pro_ds*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
